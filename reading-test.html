<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading Comprehension Test Interface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#003560',
            accent: '#0EA5E9',
            bordersoft: '#D1DCE8',
            mutedtxt: '#7A8FA6',
            submit: '#0D9488',
            bgsoft: '#F4F7FB'
          },
          fontFamily: {
            heading: ['Outfit', 'sans-serif'],
            body: ['Plus Jakarta Sans', 'sans-serif'],
            timer: ['JetBrains Mono', 'monospace'],
            passage: ['Arial', 'sans-serif']
          },
          boxShadow: {
            cyanGlow: '0 0 0 3px rgba(14, 165, 233, 0.22)'
          }
        }
      }
    };
  </script>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #f4f7fb;
      color: #003560;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
    }

    #root {
      height: 100%;
    }

    .hide-scrollbar::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .hide-scrollbar::-webkit-scrollbar-thumb {
      background: #c8d4e3;
      border-radius: 999px;
    }

    .hide-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .passage-line-label {
      font-family: 'Arial', sans-serif;
      font-style: italic;
      font-size: 14px;
      line-height: 1;
      color: #000;
      transform: translateY(-50%);
      position: absolute;
      left: 0;
      width: 56px;
      text-align: right;
      padding-right: 10px;
      pointer-events: none;
      white-space: nowrap;
    }

    @media (max-width: 1024px) {
      html,
      body {
        overflow: auto;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState, useContext, useLayoutEffect, createContext } = React;

    const PART_COUNT = 5;
    const QUESTIONS_PER_PART = 10;
    const LINE_MARKER_STEP = 5;

    function buildPart(partNumber) {
      const partId = `part-${partNumber}`;
      const questions = Array.from({ length: QUESTIONS_PER_PART }, (_, index) => {
        const questionNumber = index + 1;
        return {
          id: `${partId}-q${questionNumber}`,
          number: questionNumber,
          prompt: 'What is the main topic of the passage?',
          options: [
            'The geographical location of the Mid-Atlantic Ridge',
            'Where to find recent academic research materials.',
            'The chemical elements found in volcanic ash',
            'The history of volcanic eruptions in Hawaii'
          ]
        };
      });

      return {
        id: partId,
        index: partNumber,
        title: `PART ${partNumber}`,
        questionRange: 'Questions 1 - 10',
        sectionLabels: {
          a: 'Part A - Structure',
          b: 'Part B - Written Expression'
        },
        passage: `A volcano is a rupture in the crust of a planetary-mass object, such as Earth, that allows hot lava, volcanic ash, and gases to escape from a magma chamber below the surface. Earth's volcanoes occur because its crust is broken into rigid tectonic plates that float on a hotter, softer layer in its mantle. Therefore, on Earth, volcanoes are generally found where tectonic plates are diverging or converging. For example, a mid-oceanic ridge, like the Mid-Atlantic Ridge, has examples of volcanoes caused by divergent tectonic plates pulling apart. Conversely, the Pacific Ring of Fire has volcanoes caused by convergent tectonic plates coming together.\n\nVolcanoes can also form where there is stretching and thinning of the crust's interior plates, such as in the East African Rift. Volcanism away from plate boundaries has also been explained as mantle plumes. These so-called hotspots, for example, Hawaii, are postulated to arise from upwelling magma from the core-mantle boundary, thousands of kilometers deep in the Earth.\n\nThe explosiveness of a volcanic eruption depends largely on the composition of the magma. Magma with high silica content is highly viscous, meaning it resists flow. This thick magma traps expanding gases, leading to explosive eruptions. In contrast, magma with low silica content has low viscosity. It flows more easily and allows gases to escape, resulting in effusive, gentler eruptions where lava streams continuously out of the vent.`
      };
    }

    const PARTS = Array.from({ length: PART_COUNT }, (_, i) => buildPart(i + 1));
    const TestContext = createContext(null);

    function useTestState() {
      const [activePartId, setActivePartId] = useState(PARTS[0].id);
      const [answers, setAnswers] = useState({});
      const [isDrawerOpen, setIsDrawerOpen] = useState(true);
      const [secondsLeft, setSecondsLeft] = useState(35 * 60);

      useEffect(() => {
        const timer = setInterval(() => {
          setSecondsLeft((prev) => (prev > 0 ? prev - 1 : 0));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const activePart = useMemo(
        () => PARTS.find((part) => part.id === activePartId) || PARTS[0],
        [activePartId]
      );

      const answeredCountByPart = useMemo(() => {
        const map = {};
        for (const part of PARTS) {
          map[part.id] = part.questions.reduce(
            (count, question) => (answers[question.id] !== undefined ? count + 1 : count),
            0
          );
        }
        return map;
      }, [answers]);

      const selectedOption = (questionId) => (answers[questionId] === undefined ? null : answers[questionId]);

      const selectAnswer = (questionId, optionIndex) => {
        setAnswers((prev) => ({ ...prev, [questionId]: optionIndex }));
      };

      const value = {
        parts: PARTS,
        activePart,
        activePartId,
        setActivePartId,
        answers,
        selectedOption,
        selectAnswer,
        answeredCountByPart,
        isDrawerOpen,
        setIsDrawerOpen,
        secondsLeft
      };

      return value;
    }

    function TestProvider({ children }) {
      const value = useTestState();
      return <TestContext.Provider value={value}>{children}</TestContext.Provider>;
    }

    function useTest() {
      const context = useContext(TestContext);
      if (!context) throw new Error('useTest must be used inside TestProvider');
      return context;
    }

    function formatTimer(secondsLeft) {
      const minutes = Math.floor(secondsLeft / 60);
      const seconds = secondsLeft % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function getQuestionDomId(questionId) {
      return `question-card-${questionId}`;
    }

    function Header() {
      const {
        parts,
        activePartId,
        setActivePartId,
        answeredCountByPart,
        selectedOption,
        secondsLeft,
        setIsDrawerOpen,
        isDrawerOpen
      } = useTest();

      const [isFullscreen, setIsFullscreen] = useState(Boolean(document.fullscreenElement));

      useEffect(() => {
        const syncFullscreen = () => setIsFullscreen(Boolean(document.fullscreenElement));
        document.addEventListener('fullscreenchange', syncFullscreen);
        return () => document.removeEventListener('fullscreenchange', syncFullscreen);
      }, []);

      const toggleFullscreen = async () => {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else {
            await document.documentElement.requestFullscreen();
          }
        } catch {
          // Ignore fullscreen errors.
        }
      };

      const scrollToQuestion = (questionId) => {
        const element = document.getElementById(getQuestionDomId(questionId));
        if (!element) return;
        element.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      return (
        <header className="border-b border-bordersoft bg-white px-4 py-3 shadow-sm">
          <div className="mx-auto flex w-full max-w-[1700px] flex-wrap items-center gap-4 xl:flex-nowrap">
            <div className="flex min-w-[280px] flex-1 items-center gap-3">
              <img src="asst/icon/QuickCheckLogo.png" alt="Quick Check" className="h-10 w-auto object-contain" />
              <div className="min-w-0">
                <h1 className="truncate font-heading text-xl font-semibold leading-tight text-navy">
                  Reading Comprehension
                </h1>
                <p className="truncate text-sm text-mutedtxt">Package 01 Jan</p>
              </div>
            </div>

            <div className="flex items-center gap-2 rounded-full border border-bordersoft bg-[#F0F7FF] px-4 py-2 shadow-inner">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 6V12L16 14" stroke="#003560" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" />
                <circle cx="12" cy="12" r="9" stroke="#0EA5E9" strokeWidth="1.5" />
              </svg>
              <span className="font-timer text-[30px] tracking-wider text-[#0965A6]">{formatTimer(secondsLeft)}</span>
            </div>

            <div className="order-3 w-full rounded-xl border border-bordersoft bg-[#FAFCFF] px-3 py-2 xl:order-none xl:w-auto xl:flex-[2.2]">
              <div className="flex items-center gap-2 overflow-x-auto hide-scrollbar">
                {parts.map((part) => {
                  const isActive = part.id === activePartId;
                  const answered = answeredCountByPart[part.id] || 0;
                  return (
                    <div
                      key={part.id}
                      className={`shrink-0 rounded-lg border transition ${
                        isActive
                          ? 'border-navy bg-white px-2 py-2'
                          : 'cursor-pointer border-bordersoft bg-white px-4 py-2 hover:border-accent'
                      }`}
                      onClick={() => {
                        if (!isActive) setActivePartId(part.id);
                      }}
                    >
                      {isActive ? (
                        <div className="flex items-center gap-2">
                          <span className="font-heading text-xs font-bold tracking-wide text-navy">PART {part.index}</span>
                          <div className="flex items-center gap-1">
                            {part.questions.map((question) => {
                              const answeredCircle = selectedOption(question.id) !== null;
                              return (
                                <button
                                  key={question.id}
                                  type="button"
                                  onClick={(event) => {
                                    event.stopPropagation();
                                    scrollToQuestion(question.id);
                                  }}
                                  className={`grid h-6 w-6 place-items-center rounded-full text-[11px] font-semibold transition ${
                                    answeredCircle
                                      ? 'border border-navy bg-navy text-white shadow-cyanGlow'
                                      : 'border border-bordersoft bg-[#E6EDF5] text-[#7A8FA6]'
                                  }`}
                                  aria-label={`Question ${question.number}`}
                                >
                                  {question.number}
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      ) : (
                        <div className="flex min-w-[82px] flex-col items-center">
                          <span className="font-heading text-[11px] font-bold tracking-wide text-navy">
                            PART {part.index}
                          </span>
                          <span className="text-[11px] text-mutedtxt">{answered}/10</span>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="ml-auto flex items-center gap-2">
              <button
                type="button"
                onClick={toggleFullscreen}
                className="grid h-10 w-10 place-items-center rounded-md border border-bordersoft bg-white text-navy transition hover:border-accent"
                aria-label="Toggle fullscreen"
                title={isFullscreen ? 'Exit Fullscreen' : 'Enter Fullscreen'}
              >
                {isFullscreen ? (
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M8 3H3V8M16 3H21V8M8 21H3V16M16 21H21V16" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
                  </svg>
                ) : (
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M9 3H3V9M15 3H21V9M9 21H3V15M15 21H21V15" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
                  </svg>
                )}
              </button>

              <button
                type="button"
                onClick={() => setIsDrawerOpen((prev) => !prev)}
                className="grid h-10 w-10 place-items-center rounded-md border border-bordersoft bg-white text-navy transition hover:border-accent"
                aria-label="Toggle navigator drawer"
                title="Toggle question drawer"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M4 7H20M4 12H20M4 17H20" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
                </svg>
              </button>

              <button
                type="button"
                className="inline-flex h-10 items-center gap-2 rounded-md bg-submit px-5 font-body text-sm font-semibold text-white shadow-sm transition hover:bg-[#0b8076]"
              >
                Submit
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M3 21L21 12L3 3V10L15 12L3 14V21Z" fill="currentColor" />
                </svg>
              </button>
            </div>
          </div>

          <div className="mx-auto mt-2 w-full max-w-[1700px]">
            <div className="flex flex-wrap items-center gap-3 text-xs text-mutedtxt">
              {parts.map((part) => {
                const answered = answeredCountByPart[part.id] || 0;
                return (
                  <button
                    key={`${part.id}-counter`}
                    type="button"
                    onClick={() => setActivePartId(part.id)}
                    className={`rounded-full border px-3 py-1 transition ${
                      part.id === activePartId
                        ? 'border-accent bg-[rgba(14,165,233,0.1)] text-navy'
                        : 'border-bordersoft bg-white hover:border-accent'
                    }`}
                  >
                    PART {part.index}: {answered}/10
                  </button>
                );
              })}
            </div>
          </div>
        </header>
      );
    }

    function PassagePanel() {
      const { activePart } = useTest();
      const textRef = useRef(null);
      const [lineMarkers, setLineMarkers] = useState([]);

      useLayoutEffect(() => {
        const target = textRef.current;
        if (!target) return;

        const computeMarkers = () => {
          const style = window.getComputedStyle(target);
          const lineHeight = parseFloat(style.lineHeight) || 48;
          const totalLines = Math.max(1, Math.round(target.scrollHeight / lineHeight));

          const markers = [{ label: 'Line', top: lineHeight * 0.6 }];
          for (let line = LINE_MARKER_STEP; line <= totalLines; line += LINE_MARKER_STEP) {
            markers.push({ label: `(${line})`, top: (line - 0.5) * lineHeight });
          }

          setLineMarkers(markers);
        };

        computeMarkers();

        const observer = new ResizeObserver(computeMarkers);
        observer.observe(target);
        window.addEventListener('resize', computeMarkers);

        return () => {
          observer.disconnect();
          window.removeEventListener('resize', computeMarkers);
        };
      }, [activePart.id, activePart.passage]);

      return (
        <section className="rounded-xl border border-bordersoft bg-white p-4 shadow-sm lg:p-6">
          <div className="mb-4 border-b border-bordersoft pb-3">
            <h2 className="font-heading text-[30px] font-semibold leading-none text-black">PART {activePart.index}</h2>
            <p className="mt-1 font-body text-[16px] text-mutedtxt">{activePart.questionRange}</p>
          </div>

          <div className="relative pl-14">
            <div className="pointer-events-none absolute inset-y-0 left-0 w-14">
              {lineMarkers.map((marker, index) => (
                <span key={`${marker.label}-${index}`} className="passage-line-label" style={{ top: `${marker.top}px` }}>
                  {marker.label}
                </span>
              ))}
            </div>

            <div className="rounded-md border border-black bg-white p-4 md:p-5">
              <div
                ref={textRef}
                className="font-passage text-[16px] leading-[1.55] text-[#222] whitespace-pre-wrap"
              >
                {activePart.passage}
              </div>
            </div>
          </div>
        </section>
      );
    }

    function QuestionOption({ questionId, optionLabel, optionText, optionIndex }) {
      const { selectedOption, selectAnswer } = useTest();
      const isSelected = selectedOption(questionId) === optionIndex;

      return (
        <button
          type="button"
          onClick={() => selectAnswer(questionId, optionIndex)}
          className={`w-full rounded-[10px] border px-3 py-3 text-left transition ${
            isSelected
              ? 'border-navy bg-[rgba(14,165,233,0.15)]'
              : 'border-bordersoft bg-white hover:border-accent hover:bg-[#F9FCFF]'
          }`}
        >
          <span className="flex items-center gap-4">
            <span
              className={`grid h-9 w-9 shrink-0 place-items-center rounded-full border text-base font-semibold ${
                isSelected
                  ? 'border-navy bg-navy text-white'
                  : 'border-bordersoft bg-white text-[#4C647E]'
              }`}
            >
              {optionLabel}
            </span>
            <span className="font-body text-[16px] text-[#1E2A35]">{optionText}</span>
          </span>
        </button>
      );
    }

    function QuestionCard({ question }) {
      const { selectedOption } = useTest();
      const answered = selectedOption(question.id) !== null;

      return (
        <article
          id={getQuestionDomId(question.id)}
          className="rounded-xl border border-bordersoft bg-white p-4 shadow-[0_1px_2px_rgba(15,23,42,0.05)]"
        >
          <div className="mb-3 flex items-center gap-3">
            <span
              className={`grid h-10 w-10 shrink-0 place-items-center rounded-lg border text-base font-semibold ${
                answered
                  ? 'border-navy bg-navy text-white'
                  : 'border-bordersoft bg-transparent text-[#6F87A1]'
              }`}
            >
              {question.number}
            </span>
            <h3 className="font-body text-[19px] font-medium text-[#1B2A3D]">{question.prompt}</h3>
          </div>

          <div className="space-y-2 pl-0 md:pl-2">
            {question.options.map((optionText, index) => (
              <QuestionOption
                key={`${question.id}-option-${index}`}
                questionId={question.id}
                optionLabel={String.fromCharCode(65 + index)}
                optionText={optionText}
                optionIndex={index}
              />
            ))}
          </div>
        </article>
      );
    }

    function QuestionsPanel() {
      const { activePart } = useTest();

      return (
        <section className="rounded-xl border border-bordersoft bg-white p-4 shadow-sm lg:p-6">
          <div className="mb-4 flex items-center justify-between border-b border-bordersoft pb-3">
            <h2 className="font-heading text-lg font-semibold tracking-wide text-navy">
              PART {activePart.index}
            </h2>
            <span className="font-body text-sm text-mutedtxt">Questions 1 - 10</span>
          </div>

          <div className="hide-scrollbar max-h-[calc(100dvh-260px)] space-y-4 overflow-y-auto pr-1 lg:max-h-[calc(100dvh-220px)]">
            {activePart.questions.map((question) => (
              <QuestionCard key={question.id} question={question} />
            ))}
          </div>
        </section>
      );
    }

    function DrawerNavigator() {
      const { activePart, selectedOption, isDrawerOpen, setIsDrawerOpen, answers } = useTest();

      const groupedQuestions = useMemo(() => {
        return {
          a: activePart.questions.slice(0, 5),
          b: activePart.questions.slice(5)
        };
      }, [activePart]);

      const scrollToQuestion = (questionId) => {
        const element = document.getElementById(getQuestionDomId(questionId));
        if (element) {
          element.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      };

      const focusNextQuestion = () => {
        const nextUnanswered = activePart.questions.find((question) => answers[question.id] === undefined);
        if (nextUnanswered) {
          scrollToQuestion(nextUnanswered.id);
          return;
        }
        scrollToQuestion(activePart.questions[activePart.questions.length - 1].id);
      };

      return (
        <>
          {isDrawerOpen && (
            <button
              type="button"
              aria-label="Close drawer backdrop"
              onClick={() => setIsDrawerOpen(false)}
              className="fixed inset-0 z-30 bg-[#001833]/20 lg:hidden"
            />
          )}

          <aside
            className={`fixed right-0 top-0 z-40 h-full w-[330px] border-l border-bordersoft bg-white shadow-2xl transition-transform duration-300 ${
              isDrawerOpen ? 'translate-x-0' : 'translate-x-full'
            }`}
          >
            <div className="flex h-full flex-col">
              <div className="flex items-center justify-between border-b border-bordersoft px-4 py-4">
                <h3 className="font-heading text-lg font-semibold text-navy">Question Navigator</h3>
                <button
                  type="button"
                  onClick={() => setIsDrawerOpen(false)}
                  className="grid h-8 w-8 place-items-center rounded-md border border-bordersoft text-navy hover:border-accent"
                  aria-label="Close drawer"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
                  </svg>
                </button>
              </div>

              <div className="hide-scrollbar flex-1 space-y-5 overflow-y-auto px-4 py-4">
                <div className="rounded-lg border border-bordersoft bg-[#F9FBFF] p-3">
                  <p className="mb-2 font-body text-xs font-semibold uppercase tracking-wide text-mutedtxt">
                    Legend
                  </p>
                  <div className="space-y-2 text-sm">
                    <div className="flex items-center gap-2">
                      <span className="h-3 w-3 rounded-full bg-navy" />
                      <span className="text-[#30465C]">Answered</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="h-3 w-3 rounded-full border border-bordersoft bg-white" />
                      <span className="text-[#30465C]">Unanswered</span>
                    </div>
                  </div>
                </div>

                <NavigatorGroup
                  title={activePart.sectionLabels.a}
                  questions={groupedQuestions.a}
                  selectedOption={selectedOption}
                  onPick={scrollToQuestion}
                />
                <NavigatorGroup
                  title={activePart.sectionLabels.b}
                  questions={groupedQuestions.b}
                  selectedOption={selectedOption}
                  onPick={scrollToQuestion}
                />
              </div>

              <div className="border-t border-bordersoft p-4">
                <button
                  type="button"
                  onClick={focusNextQuestion}
                  className="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-navy px-4 py-3 text-sm font-semibold text-white transition hover:bg-[#002844]"
                >
                  Next Question
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M5 12H19M13 6L19 12L13 18" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
                  </svg>
                </button>
              </div>
            </div>
          </aside>
        </>
      );
    }

    function NavigatorGroup({ title, questions, selectedOption, onPick }) {
      return (
        <section className="rounded-lg border border-bordersoft bg-white p-3">
          <h4 className="mb-3 font-body text-xs font-semibold uppercase tracking-wide text-mutedtxt">{title}</h4>
          <div className="grid grid-cols-5 gap-2">
            {questions.map((question) => {
              const answered = selectedOption(question.id) !== null;
              return (
                <button
                  key={question.id}
                  type="button"
                  onClick={() => onPick(question.id)}
                  className={`grid h-9 w-9 place-items-center rounded-md border text-sm font-semibold transition ${
                    answered
                      ? 'border-navy bg-navy text-white shadow-cyanGlow'
                      : 'border-bordersoft bg-white text-[#6E86A0] hover:border-accent'
                  }`}
                >
                  {question.number}
                </button>
              );
            })}
          </div>
        </section>
      );
    }

    function MainLayout() {
      const { isDrawerOpen } = useTest();

      return (
