<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL Structure Material | QuickCheck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --navy: #003560; --blue: #005faa; --sky: #0ea5e9; --line: #d1dce8; --ink: #111827; --muted: #63738a; --yellow: #ffde00; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #f6f9fd; color: var(--ink); font-family: "Outfit", sans-serif; }
        .lesson-shell { width: min(1180px, calc(100% - 32px)); margin: 20px auto 48px; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 16px 36px rgba(0, 53, 96, .08); }
        .lesson-tabs { display: grid; grid-template-columns: repeat(3, 1fr); min-height: 48px; border-bottom: 1px solid var(--line); }
        .lesson-tab { display: flex; justify-content: center; align-items: center; gap: 8px; color: #526176; font-family: "Plus Jakarta Sans", sans-serif; font-size: 12px; font-weight: 700; border-bottom: 3px solid transparent; }
        .lesson-tab.active { color: var(--navy); border-bottom-color: var(--sky); }
        .lesson-content { padding: 22px 26px 36px; }
        .lesson-trail { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
        .topic-chip { display: inline-flex; align-items: center; gap: 7px; min-height: 30px; padding: 0 13px; border: 1px solid #dce6f0; border-radius: 16px; color: #5d7088; background: #fff; font: 600 11px "Plus Jakarta Sans", sans-serif; }
        .topic-chip.primary { color: #fff; background: var(--blue); border-color: var(--blue); }
        .lesson-heading { border-bottom: 1px solid var(--line); padding-bottom: 15px; margin-bottom: 18px; }
        .lesson-heading h1 { margin: 0; color: #1b2532; font: 800 22px "Plus Jakarta Sans", sans-serif; }
        .lesson-heading p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
        .lesson-document { max-width: 930px; font-size: 15px; line-height: 1.65; }
        .lesson-document h1, .lesson-document h2, .lesson-document h3 { color: #1f2937; font-family: "Plus Jakarta Sans", sans-serif; line-height: 1.3; }
        .lesson-document h1 { font-size: 22px; } .lesson-document h2 { font-size: 18px; margin-top: 26px; } .lesson-document h3 { font-size: 16px; margin-top: 20px; }
        .lesson-document p { margin: 9px 0; } .lesson-document ul, .lesson-document ol { padding-left: 24px; } .lesson-document li { margin: 5px 0; }
        .lesson-document table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14px; } .lesson-document th { background: #0070b8; color: #fff; } .lesson-document th, .lesson-document td { border: 1px solid #b8d2e7; padding: 9px; text-align: left; vertical-align: top; }
        .lesson-document strong { font-weight: 700; } .lesson-document mark { background: var(--yellow); padding: 0 2px; }
        .empty-state { padding: 38px 0; color: var(--muted); text-align: center; } .empty-state a { color: var(--blue); font-weight: 700; }
        @media (max-width: 640px) { .lesson-shell { width: 100%; margin: 0; border-radius: 0; border-inline: 0; } .lesson-content { padding: 18px; } .lesson-tab { font-size: 10px; } .lesson-document { font-size: 14px; } }
    </style>
</head>
<body>
    <main class="lesson-shell">
        <nav class="lesson-tabs" aria-label="Learning views">
            <div class="lesson-tab">☀ Explanation</div>
            <div class="lesson-tab">♟ Video Step-by-Step</div>
            <div class="lesson-tab active">📚 Materi</div>
        </nav>
        <section class="lesson-content">
            <div class="lesson-trail"><span class="topic-chip primary" id="materialCode">Material</span><span class="topic-chip" id="materialTitle">Uploaded lesson</span></div>
            <header class="lesson-heading"><h1 id="lessonTitle">Material</h1><p id="lessonMeta">Structure learning material</p></header>
            <article class="lesson-document" id="lessonDocument"></article>
        </section>
    </main>
    <script>
        function safeHtml(value) {
            var template = document.createElement('template');
            template.innerHTML = String(value || '');
            template.content.querySelectorAll('script, style, iframe, object, embed').forEach(function(node) { node.remove(); });
            template.content.querySelectorAll('*').forEach(function(node) {
                Array.prototype.slice.call(node.attributes).forEach(function(attribute) {
                    if (/^on/i.test(attribute.name) || /javascript:/i.test(attribute.value)) node.removeAttribute(attribute.name);
                });
            });
            return template.innerHTML;
        }
        function escapeHtml(value) { return String(value || '').replace(/[&<>"']/g, function(char) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]; }); }
        var params = new URLSearchParams(location.search);
        var topicId = params.get('topic') || '';
        var records = {};
        try { records = JSON.parse(localStorage.getItem('toefl_structure_materials_v1') || '{}') || {}; } catch (_) {}
        var material = records[topicId] || null;
        var readableTopic = topicId.replace(/^Module\s+\d+-/, '');
        document.getElementById('materialCode').textContent = readableTopic || 'Material';
        document.getElementById('materialTitle').textContent = material ? material.title : 'No uploaded document';
        document.getElementById('lessonTitle').textContent = material ? material.title : 'Material not uploaded';
        document.getElementById('lessonMeta').textContent = material && material.fileName ? material.fileName : 'TOEFL Structure material';
        document.getElementById('lessonDocument').innerHTML = material && material.html
            ? safeHtml(material.html)
            : '<div class="empty-state">Upload a DOCX file for this topic from the Developer Materials Library, then open View Material again.</div>';
    </script>
</body>
</html>
