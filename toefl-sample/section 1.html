        function goToInstantQuestion(index, targetUid = "") {
            const uid = targetUid || instantProgressOrder[index] || instantOrder[index];
            if (!uid) return;
            if (!isPracticeTestType()) {
                currentMockNavigationUid = uid;
                scrollToQuestion(uid);
                renderInstantProgressDots();
                return;
            }

            const targetIndex = instantOrder.indexOf(uid);
            if (targetIndex < 0) return;
            instantIndex = targetIndex;
            activePartId = getPartIdFromUid(uid);
            if (isInstantFeedbackMode()) {
                const groupUids = getInstantGroupUids(targetIndex);
                instantRevealed = Boolean(instantChecked[instantOrder[instantIndex]]);
                instantReviewIndex = instantRevealed ? Math.max(0, groupUids.indexOf(uid)) : 0;
            } else {
                instantRevealed = false;
            }
            renderInstantQuestion();
            const targetCard = document.getElementById(`q-container-${uid}`);
            if (targetCard) targetCard.scrollIntoView({ behavior: "smooth", block: "center" });
        }

        function getInstantDraft() {
            return safeParse(localStorage.getItem(DRAFT_KEY), {}) || {};
        }

        function getInstantTranscriptSegments(uid) {
            const partId = getPartIdFromUid(uid);
            const questionNumber = Number(String(uid).split("_")[1] || 0);
            const draft = getInstantDraft();
            const grouped = resolveGroupTranscriptSegments(draft, partId, questionNumber);
            if (grouped.length) return grouped;
            const byQuestion = mapTranscriptByQuestion(getTranscriptForSmartQuestions(partId));
            return byQuestion[questionNumber] || [];
        }

        const INSTANT_SPEAKER_LABELS = { MEN: "Man", WOMEN: "Woman", NARR: "Narrator" };

        // The pasted block carries its markdown headings (EN or ID); keep only the explanation body.
        function extractInstantPenjelasanText(rawText) {
            let text = explanationHtmlToText(rawText).replace(/\r/g, "");
            const start = text.match(/^\s*\*{0,2}(?:PENJELASAN|EXPLAINATION|EXPLANATION)\*{0,2}\s*:?\s*$/im);
            if (start) text = text.slice(start.index + start[0].length);
            const end = text.search(/^\s*\*{0,2}(?:KENAPA OPSI LAIN SALAH|WHY THE OTHER OPTION IS INCORRECT)\*{0,2}\s*:?\s*$/im);
            if (end >= 0) text = text.slice(0, end);
            return text
                .replace(/^\s*#{0,6}\s*(?:Part|Question)\s+\d+\s*$/gim, "")
                .replace(/^\s*\*{0,2}(?:Jawaban Benar|Correct Answer)\s*:?\*{0,2}\s*:?.*$/gim, "")
                .replace(/\n{3,}/g, "\n\n")
                .trim();
        }

        function buildInstantExplanationHtml(uid) {
            const partId = getPartIdFromUid(uid);
            const questionNumber = Number(String(uid).split("_")[1] || 0);
            const draft = getInstantDraft();
            const schema = draft?.parts?.[partId]?.explanationSchemas?.[questionNumber] || null;
            const texts = draft?.parts?.[partId]?.explanationTexts?.[questionNumber] || {};
            const payload = schema?.explanation_payload || {};

            const correctLetter = String(globalAnswerKey[uid] || "").trim().toUpperCase();
            const question = globalQuestions[uid] || {};
            const correctText = String((question.options || {})[correctLetter] || "").trim();

            const segments = getInstantTranscriptSegments(uid);
            const toTranscriptLine = (segment) => {
                const raw = String(segment.speakerLabel || segment.speaker || "Narrator");
                return {
                    speakerKey: raw.toUpperCase(),
                    label: escapeHtml(INSTANT_SPEAKER_LABELS[raw.toUpperCase()] || titleCaseSpeakerLabel(raw)),
                    text: escapeHtml(String(segment.text || "").trim().replace(/^["\u201c\u201d]+|["\u201c\u201d]+$/g, "").trim())
                };
            };
            let transcriptHtml;
            if (!segments.length) {
                transcriptHtml = `<div class="transcript-modern-empty">No transcript available for this question.</div>`;
            } else if (partId === 1) {
                // Part A keeps the per-speaker card layout.
                transcriptHtml = `<div class="transcript-modern-list transcript-modern-list--flow transcript-part-a-list">${segments.map((segment) => {
                    const line = toTranscriptLine(segment);
                    return `
                    <article class="transcript-modern-item transcript-part-a-card">
                        <div class="transcript-modern-speaker-label">${line.label}</div>
                        <div class="transcript-part-a-divider" aria-hidden="true"></div>
                        <div class="transcript-part-a-text">${line.text}</div>
                    </article>`;
                }).join("")}</div>`;
            } else {
                // Parts B/C render as one continuous script; only the speaker name is styled.
                let previousSpeakerKey = "";
                const transcriptLines = segments.map((segment) => {
                    const line = toTranscriptLine(segment);
                    const showSpeaker = line.speakerKey !== previousSpeakerKey;
                    previousSpeakerKey = line.speakerKey;
                    return `<p class="transcript-plain-line">${showSpeaker ? `<span class="transcript-modern-speaker-label">${line.label}</span>: ` : ""}${line.text}</p>`;
                }).join("");
                transcriptHtml = `
                    <div class="transcript-modern-shell transcript-view transcript-plain-shell">
                        <div class="transcript-modern-panel content-container">
                            <div class="transcript-modern-list transcript-plain-block">${transcriptLines}</div>
                            <div class="transcript-scrollbar-track" id="transcriptScrollTrack"><div class="transcript-scrollbar-thumb" id="transcriptScrollThumb"></div></div>
                        </div>
                    </div>`;
            }

            // Raw bulk paste (EN headers, ID or EN body) as a fallback when the schema
            // wasn't rebuilt yet, so pasted text renders immediately without a re-save.
            const rawExplanationSource = String(texts.explanation || texts.explanationId || "").trim();
            const parsedFallback = rawExplanationSource ? parseExplanationCardMarkdown(rawExplanationSource) : null;

            const bahasa = String(texts.explanationId || "").trim();
            const mainHtml = bahasa
                ? explanationTextToHtml(extractInstantPenjelasanText(bahasa))
                : (String(payload.main_explanation_html || "")
                    || (parsedFallback?.explanationText ? explanationTextToHtml(parsedFallback.explanationText) : ""));
            const explanationHtml = mainHtml || `<p class="instant-empty">No explanation saved for this question yet.</p>`;

            const bahasaDistractors = bahasa
                ? parseExplanationCardMarkdown(explanationHtmlToText(bahasa).replace(/\*{0,2}KENAPA OPSI LAIN SALAH\*{0,2}/gi, "**WHY THE OTHER OPTION IS INCORRECT**")).distractors
                : [];
            const distractors = bahasaDistractors.length
                ? bahasaDistractors
                : (Array.isArray(payload.distractor_analysis) && payload.distractor_analysis.length
                    ? payload.distractor_analysis
                    : (parsedFallback?.distractors || []));
            const wrongOptionsHtml = ["A", "B", "C", "D"]
                .filter((letter) => letter !== correctLetter)
                .map((letter) => {
                    const distractor = distractors.find((item) => String(item?.letter || "").trim().toUpperCase() === letter) || {};
                    const optionText = String((question.options || {})[letter] || distractor.text || "").trim();
                    if (!optionText && !distractor.reason) return "";
                    return `
                    <article class="explaination-incorrect-option">
                        <div class="explaination-option-heading">
                            <div class="explaination-option-letter">${letter}</div>
                            <div class="explaination-option-title-group">
                                <div class="explaination-option-title">${escapeHtml(optionText)}</div>
                                <div class="explaination-option-accent" aria-hidden="true"></div>
                                <div class="explaination-option-reason">${explanationTextToHtml(distractor.reason || "")}</div>
                            </div>
                        </div>
                    </article>`;
                }).join("");
            const explanationHeading = bahasa ? "PENJELASAN" : "EXPLAINATION";
            const incorrectHeading = bahasa ? "KENAPA OPSI LAIN SALAH" : "WHY THE OTHER OPTION IS INCORRECT";

            return `
                <div class="instant-explanation explaination-figma-why-block">
                    <section class="explaination-correct-answer-card">
                        <div class="explaination-icon-badge explaination-icon-badge--correct"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 12.5l2.5 2.5 4.5-5"></path></svg></div>
                        <div class="explaination-answer-copy"><div class="explaination-answer-text">${escapeHtml(correctLetter || "?")} - ${escapeHtml(correctText || "Correct answer")}</div></div>
                    </section>
                    <div class="instant-explanation__body">
                        <section class="instant-explanation__pane">
                            <div class="instant-pane-card">
                                <h4 class="instant-pane-title">TRANSCRIPT</h4>
                                ${transcriptHtml}
                            </div>
                        </section>
                        <section class="instant-explanation__pane explaination-figma-why-body">
                            <section class="explaination-content-card">
                                <div class="explaination-icon-badge explaination-icon-badge--idea"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.47c.53.5.83 1.2.83 1.93V16h6.34v-.6c0-.73.3-1.43.83-1.93A6 6 0 0 0 12 3z"></path></svg></div>
                                <div class="explaination-copy-column">
                                    <h2>${explanationHeading}</h2><div class="explaination-accent" aria-hidden="true"></div>
                                    <div class="explaination-content-text">${explanationHtml}</div>
                                </div>
                            </section>
                            <section class="explaination-incorrect-section">
                                <div class="explaination-incorrect-heading"><h2>${incorrectHeading}</h2></div>
                                <div class="explaination-incorrect-divider" aria-hidden="true"></div>
                                <div class="explaination-incorrect-grid">${wrongOptionsHtml || `<p class="instant-empty">No distractor analysis saved yet.</p>`}</div>
                            </section>
                        </section>
                    </div>
                </div>`;
        }

        function isTranscriptListScrollable(list) {
            return !!list && list.scrollHeight > list.clientHeight + 1;
        }

        function updateTranscriptScrollThumb(list, track, thumb) {
            if (!isTranscriptListScrollable(list)) return;
            var trackHeight = track.clientHeight;
            var thumbHeight = Math.max(24, (list.clientHeight / list.scrollHeight) * trackHeight);
            var maxThumbTop = Math.max(0, trackHeight - thumbHeight);
            var scrollRange = list.scrollHeight - list.clientHeight;
            var scrollRatio = scrollRange > 0 ? (list.scrollTop / scrollRange) : 0;
            thumb.style.height = thumbHeight + 'px';
            thumb.style.top = (maxThumbTop * scrollRatio) + 'px';
        }

        function showTranscriptScrollbar(list, track, thumb) {
            if (!isTranscriptListScrollable(list)) {
                track.classList.remove('is-visible');
                return;
            }
            updateTranscriptScrollThumb(list, track, thumb);
            track.classList.add('is-visible');
            if (transcriptScrollHideTimer) clearTimeout(transcriptScrollHideTimer);
            transcriptScrollHideTimer = setTimeout(function() {
                track.classList.remove('is-visible');
            }, 1000);
        }

        function refreshTranscriptScrollbarMetrics() {
            var list = document.querySelector('.transcript-modern-list');
            var track = document.getElementById('transcriptScrollTrack');
            var thumb = document.getElementById('transcriptScrollThumb');
            if (!list || !track || !thumb) return;
            updateTranscriptScrollThumb(list, track, thumb);
            if (!isTranscriptListScrollable(list)) track.classList.remove('is-visible');
        }

        function initTranscriptCustomScrollbar() {
            var list = document.querySelector('.transcript-modern-list');
            var track = document.getElementById('transcriptScrollTrack');
            var thumb = document.getElementById('transcriptScrollThumb');
            if (!list || !track || !thumb) return;

            updateTranscriptScrollThumb(list, track, thumb);
            list.addEventListener('scroll', function() { showTranscriptScrollbar(list, track, thumb); });
            list.addEventListener('mouseenter', function() { showTranscriptScrollbar(list, track, thumb); });
        }

        function applyTranscriptColumnHeight(explanationHeight) {
            var leftCol = document.querySelector('.explaination-why-body');
            if (!leftCol) return;
            if (window.innerWidth < 901 || !(explanationHeight > 0)) {
                leftCol.style.height = '';
                return;
            }
            leftCol.style.height = explanationHeight + 'px';
            requestAnimationFrame(refreshTranscriptScrollbarMetrics);
        }

        function initTranscriptColumnHeightSync() {
            var tabs = document.getElementById('instant-explaination__pane');
            if (!tabs) return;

            if (window.ResizeObserver && !reviewColumnHeightObserver) {
                reviewColumnHeightObserver = new ResizeObserver(function(entries) {
                    var entry = entries && entries[0];
                    var height = entry ? entry.contentRect.height : tabs.getBoundingClientRect().height;
                    applyTranscriptColumnHeight(height);
                });
                reviewColumnHeightObserver.observe(tabs);
            }

            window.addEventListener('resize', function() {
                applyTranscriptColumnHeight(tabs.getBoundingClientRect().height);
            });

            applyTranscriptColumnHeight(tabs.getBoundingClientRect().height);
        }

        function getInstantGroupKeyForUid(uid) {
            const partId = getPartIdFromUid(uid);
            if (partId === 1) return "";
            const questionNumber = Number(String(uid).split("_")[1] || 0);
            const group = getAudioGroupForQuestion(partId, questionNumber, isPracticeTestType());
            return group ? `${partId}:${group.key}` : "";
        }

        // Part A steps one question at a time; Parts B/C reveal a whole talk (4 questions) together.
        function getInstantGroupUids(index = instantIndex) {
            const uid = instantOrder[index];
            if (!uid) return [];
            if (isPracticeFullTestMode()) {
                const partId = getPartIdFromUid(uid);
                return instantOrder.filter((item) => getPartIdFromUid(item) === partId);
            }
            const groupKey = getInstantGroupKeyForUid(uid);
            if (!groupKey) return [uid];
            return instantOrder.filter((item) => getInstantGroupKeyForUid(item) === groupKey);
        }

        // Answering shows the whole talk; the reveal walks its questions one page at a time.
        function getInstantVisibleUids() {
            const groupUids = getInstantGroupUids();
            if (!instantRevealed || groupUids.length <= 1) return groupUids;
            const safeIndex = Math.min(Math.max(instantReviewIndex, 0), groupUids.length - 1);
            return [groupUids[safeIndex]];
        }

        function getInstantCurrentUid() {
            return getInstantVisibleUids()[0] || instantOrder[instantIndex] || "";
        }

        // 1-based position of a question's talk inside its part (Talk 1, Talk 2, ...).
        function getInstantTalkNumber(uid) {
            const partId = getPartIdFromUid(uid);
            const questionNumber = Number(String(uid).split("_")[1] || 0);
            const group = getAudioGroupForQuestion(partId, questionNumber, isPracticeTestType());
            if (!group) return 0;
            return getAudioGroupsForPart(partId, isPracticeTestType()).findIndex((item) => item.key === group.key) + 1;
        }

        function buildInstantQuestionArticleHtml(uid) {
            const questionNumber = getPracticeQuestionDisplayNumber(uid);
            const question = globalQuestions[uid] || { questionText: "", options: {} };
            const selected = instantAnswers[uid] ? String(instantAnswers[uid]).toUpperCase() : "";
            const correctLetter = String(globalAnswerKey[uid] || "").trim().toUpperCase();
            const isCorrect = instantRevealed && selected === correctLetter;
            const showQuestionText = instantRevealed && !isPracticeFullTestMode();

            const badgeStateClass = instantRevealed
                ? (isCorrect ? " is-correct" : " is-incorrect")
                : (selected ? " is-selected" : "");

            const optionsHtml = ["A", "B", "C", "D"].map((letter) => {
                const classes = [];
                if (!instantRevealed && selected === letter) classes.push("selected");
                if (instantRevealed && letter === correctLetter) classes.push("is-correct");
                if (instantRevealed && letter === selected && letter !== correctLetter) classes.push("is-incorrect");
                const tagWrong = letter !== correctLetter;
                const tag = instantRevealed && letter === selected
                    ? `<span class="instant-option-tag${tagWrong ? " is-wrong" : ""}">Your Answer <i class="ph ph-${tagWrong ? "x" : "check"}" aria-hidden="true"></i></span>`
                    : "";
                return `
                    <label class="${classes.join(" ")}" ${instantRevealed ? "" : `onclick="selectInstantChoice('${letter}', '${uid}')"`}>
                        <span class="instant-option-letter">${letter}</span>
                        <span class="instant-option-text">${escapeHtml(String((question.options || {})[letter] || ""))}</span>
                        ${tag}
                    </label>`;
            }).join("");

            return `
                <article class="instant-question${instantRevealed ? " is-revealed" : ""}" id="q-container-${uid}" data-uid="${uid}">
                    <div class="instant-question-head">
                        <div class="question-number-badge${badgeStateClass}">${questionNumber}</div>
                        ${showQuestionText && question.questionText ? `<p class="instant-question-title">${escapeHtml(question.questionText)}</p>` : ""}
                        ${instantRevealed ? `<span class="instant-verdict ${isCorrect ? "is-correct" : "is-incorrect"}">${isCorrect ? "CORRECT" : "INCORRECT"}</span>` : ""}
                    </div>
                    <div class="radio-group instant-options">${optionsHtml}</div>
                </article>
                ${instantRevealed ? buildInstantExplanationHtml(uid) : ""}`;
        }

        function renderInstantQuestion() {
            const container = document.getElementById("instant-question-host");
            if (!container) return;

            const fullPractice = isPracticeFullTestMode();
            const actionBar = document.getElementById("instant-action-bar");
            const explanationWrapper = document.getElementById("explanation-wrapper");
            if (actionBar && actionBar.parentElement !== container.parentElement) {
                container.parentElement.insertBefore(actionBar, explanationWrapper?.nextSibling || null);
            }

            const uid = instantOrder[instantIndex];
            if (!uid) {
                container.innerHTML = `<div class="instant-card"><div class="instant-card__body"><div class="instant-empty-state">No questions available for this practice set.</div></div></div>`;
                if (actionBar) actionBar.style.display = "none";
                renderInstantProgressDots();
                return;
            }

            const groupUids = getInstantGroupUids();
            const partId = getPartIdFromUid(uid);
            const visibleUids = fullPractice
                ? (partId === 1
                    ? instantOrder.filter((item) => getPartIdFromUid(item) === 1)
                    : groupUids)
                : getInstantVisibleUids();
            const isStacked = visibleUids.length > 1;
            const hasMoreExplanations = instantRevealed && groupUids.length > 1 && instantReviewIndex < groupUids.length - 1;
            const lastGroupIndex = instantOrder.indexOf(groupUids[groupUids.length - 1]);
            const isLast = lastGroupIndex >= instantOrder.length - 1;
            const nextLabel = hasMoreExplanations
                ? "Next Question"
                : (isLast ? "Finish Practice" : (groupUids.length > 1 ? "Next Talk" : "Next Question"));
            const skipLabel = isStacked ? "Skip Talk" : "Skip Question";
            // Lets the user jump straight to the next talk instead of paging through the rest of the explanations.
            const nextTalkNumber = (groupUids.length > 1 && !isLast) ? getInstantTalkNumber(instantOrder[lastGroupIndex + 1]) : 0;
            const moveToTalkHtml = (instantRevealed && nextTalkNumber)
                ? `<button class="btn-action secondary" type="button" onclick="moveToNextTalk()">Move to Talk ${nextTalkNumber}</button>`
                : "";
            const actionsHtml = instantRevealed
                ? `${moveToTalkHtml}
                   <button class="btn-action primary" type="button" onclick="nextInstantQuestion()">${nextLabel} <i class="ph ph-caret-right" aria-hidden="true"></i></button>`
                : `<button class="btn-action secondary" type="button" onclick="skipInstantQuestion()">${skipLabel}</button>
                   <button class="btn-action primary" type="button" onclick="checkInstantAnswer()">Check Answer <i class="ph ph-caret-right" aria-hidden="true"></i></button>`;
            const actionContainer = document.getElementById("action-btn-container");
            const fullModeNextLabel = lastGroupIndex < instantOrder.length - 1 ? "Next Part" : "Submit";
            if (actionBar && actionContainer) {
                if (fullPractice && partId !== 1) {
                    actionContainer.innerHTML = `<button class="btn-action primary" type="button" onclick="${fullModeNextLabel === "Submit" ? "submitAnswers()" : "nextTalk()"}">${fullModeNextLabel} <i class="ph ph-caret-right" aria-hidden="true"></i></button>`;
                    actionBar.style.display = "block";
                } else {
                    actionContainer.innerHTML = "";
                    actionBar.style.display = "none";
                }
            }

            container.innerHTML = `
                <section class="instant-card" data-uid="${visibleUids[0]}">
                    ${instantRevealed ? `<div class="instant-card__tab"><span class="instant-tab-chip"><img src="../asst/icon/explaination tab.png" alt="Explaination tab icon"> Explanation</span></div>` : ""}
                    <div class="instant-card__body${isStacked ? " stack" : ""}">
                        ${visibleUids.map(buildInstantQuestionArticleHtml).join("")}
                        ${fullPractice ? "" : `<div class="instant-actions">${actionsHtml}</div>`}
                    </div>
                </section>`;

            if (fullPractice && partId !== 1 && actionBar) {
                const cardBody = container.querySelector(".instant-card__body");
                if (cardBody) cardBody.appendChild(actionBar);
            }

            initTranscriptCustomScrollbar();
            renderInstantProgressDots();
            syncInstantQuestionAudio();
        }

        function selectInstantChoice(letter, targetUid = "") {
            if (instantRevealed) return;
            const uid = targetUid || instantOrder[instantIndex];
            if (!uid) return;
            instantAnswers[uid] = String(letter || "").toUpperCase();
            renderInstantQuestion();
        }

        function nextTalk() {
            if (!isPracticeFullTestMode()) return;
            const groupUids = getInstantGroupUids();
            const lastGroupIndex = instantOrder.indexOf(groupUids[groupUids.length - 1]);
            const nextIndex = lastGroupIndex + 1;
            if (nextIndex >= instantOrder.length) {
                submitAnswers();
                return;
            }

            instantIndex = nextIndex;
            activePartId = getPartIdFromUid(instantOrder[instantIndex]);
            instantRevealed = false;
            instantReviewIndex = 0;
            renderInstantQuestion();
            const main = document.getElementById("user-passages-container");
            if (main) main.scrollTo({ top: 0, behavior: "smooth" });
        }

        function checkInstantAnswer() {
            const uid = instantOrder[instantIndex];
            if (!uid) return;

            if (!instantAnswers[uid]) {
                // If the user clicks Cancel, exit early.
                // If the user clicks OK, execution continues past this block.
                if (!confirm("Are you sure you want to check the answer without selecting one?")) {
                    return;
                }
            }

            instantChecked[uid] = true;
            instantRevealed = true;
            instantTab = "explaination"; // Note: fix typo to "explanation" if required in your project
            renderInstantQuestion();
        }

        function skipInstantQuestion() {
            instantRevealed = false;
            nextInstantQuestion(true);
        }

        function moveToNextTalk() {
            const groupUids = getInstantGroupUids();
            const lastGroupIndex = instantOrder.indexOf(groupUids[groupUids.length - 1]);
            if (lastGroupIndex < 0 || lastGroupIndex >= instantOrder.length - 1) return;

            instantIndex = lastGroupIndex + 1;
            instantReviewIndex = 0;
            instantRevealed = Boolean(instantChecked[instantOrder[instantIndex]]);
            renderInstantQuestion();
            const main = document.getElementById("user-passages-container");
            if (main) main.scrollTo({ top: 0, behavior: "smooth" });
        }

        function nextInstantQuestion(skipping = false) {
            if (!instantOrder.length) return;
            const groupUids = getInstantGroupUids();
            const main = document.getElementById("user-passages-container");

            // Walk the revealed talk's explanations before moving on to the next talk.
            if (!skipping && instantRevealed && groupUids.length > 1 && instantReviewIndex < groupUids.length - 1) {
                instantReviewIndex += 1;
                renderInstantQuestion();
                if (main) main.scrollTo({ top: 0, behavior: "smooth" });
                return;
            }

            const lastGroupIndex = instantOrder.indexOf(groupUids[groupUids.length - 1]);
            if (lastGroupIndex >= instantOrder.length - 1) {
                if (!skipping) finishInstantPractice();
                return;
            }
            instantIndex = lastGroupIndex + 1;
            instantReviewIndex = 0;
            const uid = instantOrder[instantIndex];
            instantRevealed = Boolean(instantChecked[uid]) && !skipping;
            renderInstantQuestion();
            if (main) main.scrollTo({ top: 0, behavior: "smooth" });
        }

        function finishInstantPractice() {
            instantOrder.forEach((uid) => {
                const radio = document.querySelector(`input[name="q_${uid}"]`);
                if (radio) radio.checked = false;
            });
            persistPreviewSectionResult();
            const params = new URLSearchParams();
            if (currentSetId) params.set("setId", currentSetId);
            const dateValue = (document.getElementById("set-date") || {}).value || "";
            if (dateValue) params.set("setDate", dateValue);
            const query = params.toString();
            window.location.href = `section 1-answered.html${query ? `?${query}` : ""}`;
        }

        function getAnsweredCount() {
            return questionOrder.reduce((count, uid) => {
                const radio = document.querySelector(`input[name="q_${uid}"]:checked`);
                return count + (radio || instantAnswers[uid] ? 1 : 0);
            }, 0);
        }

        function getPartAnsweredCount(partId) {
            return questionOrder.reduce((count, uid) => {
                const [uidPart] = uid.split("_");
                if (parseInt(uidPart, 10) !== partId) return count;
                const radio = document.querySelector(`input[name="q_${uid}"]:checked`);
                return count + (radio || instantAnswers[uid] ? 1 : 0);
            }, 0);
        }

        function getPartQuestionCount(partId) {
            return questionOrder.reduce((count, uid) => {
                const [uidPart] = uid.split("_");
                return count + (parseInt(uidPart, 10) === partId ? 1 : 0);
            }, 0);
        }

        function isPartComplete(partId) {
            const total = getPartQuestionCount(partId);
            if (total === 0) return false;
            return getPartAnsweredCount(partId) >= total;
        }

        function getPartIdFromUid(uid) {
            if (!uid) return 1;
            const partId = parseInt(String(uid).split("_")[0], 10);
            return Number.isFinite(partId) ? partId : 1;
        }

        function getQuestionUidsByPart(partId) {
            return questionOrder.filter((uid) => getPartIdFromUid(uid) === partId);
        }

        function findNextAvailablePart(fromPartId) {
            for (let partId = fromPartId + 1; partId <= PARTS.length; partId += 1) {
                if (getQuestionUidsByPart(partId).length > 0) {
                    return partId;
                }
            }
            return null;
        }

        function setActivePart(partId, options = {}) {
            const { resetScroll = true } = options;
            const targetPart = PARTS.find((item) => item.id === partId) ? partId : 1;
            
            // Stop current audio if switching to a different part
            if (activePartId !== targetPart) {
                const audio = document.getElementById("cbt-audio-player");
                if (audio) {
                    audio.pause();
                    audio.src = "";
                    audio.currentTime = 0;
                }
            }
            
            activePartId = targetPart;
            if (!isPracticeTestType() && getPartIdFromUid(currentMockNavigationUid) !== targetPart) {
                currentMockNavigationUid = getQuestionUidsByPart(targetPart)[0] || "";
            }

            PARTS.forEach((part) => {
                const section = document.getElementById(`user-part-${part.id}`);
                if (!section) return;
                section.classList.toggle("is-active", part.id === targetPart);
            });

            const mainContainer = document.getElementById("user-passages-container");
            if (mainContainer && resetScroll) {
                mainContainer.scrollTo({ top: 0, behavior: "smooth" });
            }

            setAudioShellTitle(activePartId);
            void restoreAudioForCurrentSet(activePartId, getCurrentInstantQuestionNumber());
            updateAudioShellStatus();
            refreshExamState();
        }

        function updatePlayControlState() {
            const playControl = document.getElementById("audio-play-control");
            const playIcon = document.getElementById("audio-play-icon");
            const audio = document.getElementById("cbt-audio-player");
            if (!playControl || !audio) return;

            playControl.classList.remove("play", "pause", "disabled");
            if (audioIsLocked) {
                playControl.classList.add("disabled");
                playControl.disabled = true;
                playControl.setAttribute("aria-label", "Audio already completed");
                if (playIcon) playIcon.src = "../asset/icon/pause 1.svg";
                return;
            }

            playControl.disabled = false;
            if (!audio.paused && !audio.ended) {
                playControl.classList.add("pause");
                playControl.setAttribute("aria-label", "Pause listening audio");
                if (playIcon) playIcon.src = "../asset/icon/pause 1.svg";
            } else {
                playControl.classList.add("play");
                playControl.setAttribute("aria-label", "Play listening audio");
                if (playIcon) playIcon.src = "../asst/icon/play.svg";
            }
        }

        function setNavigatorPanelCollapsed(collapsed) {
            const panel = document.getElementById("navigator-panel");
            const examBody = document.querySelector(".exam-body");
            if (!panel) return;
            const isCollapsed = Boolean(collapsed);
            panel.classList.toggle("is-collapsed", isCollapsed);
            if (examBody) {
                examBody.classList.toggle("is-navigator-collapsed", isCollapsed);
            }
        }

        function setFeaturesMenuOpen(open) {
            const overlay = document.getElementById("features-overlay");
            const triggerButton = document.getElementById("toggle-navigator-btn");
            if (!overlay) return;
            const shouldOpen = Boolean(open);
            overlay.classList.toggle("is-open", shouldOpen);
            overlay.setAttribute("aria-hidden", shouldOpen ? "false" : "true");
            if (triggerButton) {
                triggerButton.classList.toggle("is-active", shouldOpen);
            }
        }

        function applyDarkMode(enabled) {
            const userView = document.getElementById("user-view");
            const toggle = document.getElementById("darkmode-toggle");
            if (userView) userView.classList.toggle("is-dark", enabled);
            if (toggle) {
                toggle.classList.toggle("is-dark", enabled);
                toggle.setAttribute("aria-checked", enabled ? "true" : "false");
            }
            const timerElement = document.getElementById("time");
            if (timerElement && timerElement.style.color !== "rgb(211, 47, 47)") {
                timerElement.style.color = enabled ? "#E0F2FE" : "#005faa";
            }
        }

        function setDarkMode(enabled) {
            applyDarkMode(enabled);
            try {
                localStorage.setItem(DARK_MODE_KEY, enabled ? "1" : "0");
            } catch (_) {}
        }

        function toggleDarkMode() {
            const userView = document.getElementById("user-view");
            const isDark = userView ? userView.classList.contains("is-dark") : false;
            setDarkMode(!isDark);
        }

        function initDarkMode() {
            let enabled = false;
            try {
                enabled = localStorage.getItem(DARK_MODE_KEY) === "1";
            } catch (_) {}
            applyDarkMode(enabled);
        }

        function applyTextSize(size) {
            const normalized = ["s", "m", "l"].includes(size) ? size : "s";
            const userView = document.getElementById("user-view");
            const toggle = document.getElementById("textsize-toggle");
            if (userView) {
                userView.classList.remove("textsize-s", "textsize-m", "textsize-l");
                userView.classList.add(`textsize-${normalized}`);
            }
            if (toggle) {
                toggle.setAttribute("data-size", normalized);
                toggle.querySelectorAll(".textsize-toggle__option").forEach((option) => {
                    const isActive = option.getAttribute("data-size") === normalized;
                    option.classList.toggle("is-active", isActive);
                    option.setAttribute("aria-checked", isActive ? "true" : "false");
                });
            }
        }

        function setTextSize(size) {
            applyTextSize(size);
            try {
                localStorage.setItem(TEXT_SIZE_KEY, size);
            } catch (_) {}
        }

        function initTextSize() {
            let size = "s";
            try {
                size = localStorage.getItem(TEXT_SIZE_KEY) || "s";
            } catch (_) {}
            applyTextSize(size);
        }

        function toggleFeaturesMenu(event) {
            if (event) event.stopPropagation();
            const overlay = document.getElementById("features-overlay");
            if (!overlay) return;
            setFeaturesMenuOpen(!overlay.classList.contains("is-open"));
        }

        function handleFeaturesOverlayClick(event) {
            if (event.target === event.currentTarget) {
                setFeaturesMenuOpen(false);
            }
        }

        function handleFeaturesMenuKeydown(event) {
            if (event.key === "Escape") {
                setFeaturesMenuOpen(false);
            }
        }

        function toggleNavigatorPanel() {
            const panel = document.getElementById("navigator-panel");
            if (!panel) return;
            setNavigatorPanelCollapsed(!panel.classList.contains("is-collapsed"));
        }

        function handleNavigatorToggle(event) {
            if (event) event.stopPropagation();
            toggleNavigatorPanel();
        }

        function setAudioShellTitle(partId) {
            const titleElement = document.getElementById("audio-shell-title");
            if (!titleElement) return;
            const baseTitle = AUDIO_PART_TITLES[partId] || AUDIO_PART_TITLES[1];
            titleElement.innerText = baseTitle;

            // Practice Part B/C play one clip per talk, so name the talk that is loaded.
            if (!isPracticeTestType() || ![2, 3].includes(Number(partId))) return;

            const uid = typeof getInstantCurrentUid === "function" ? getInstantCurrentUid() : "";
            const questionNumber = Number(String(uid).split("_")[1] || 0);
            if (!questionNumber) return;

            const group = getAudioGroupForQuestion(partId, questionNumber, true);
            if (!group) return;

            const groupIndex = getAudioGroupsForPart(partId, true).findIndex((item) => item.key === group.key);
            if (groupIndex >= 0) titleElement.innerText = `${baseTitle} (Talk ${groupIndex + 1})`;
        }

        function updateAudioShellStatus() {
            const audio = document.getElementById("cbt-audio-player");
            const statusElement = document.getElementById("audio-shell-status");
            if (!statusElement || !audio) return;
            updateAudioVisualPlayingState();

            if (audioIsLocked) {
                statusElement.innerText = "Audio completed";
                updatePlayControlState();
                return;
            }

            const hasAudioSource = Boolean(audio.src);
            if (!hasAudioSource || (audio.paused && audio.currentTime === 0)) {
                statusElement.innerText = "Click To Play....";
                updatePlayControlState();
                return;
            }

            if (!audio.paused && !audio.ended) {
                statusElement.innerText = "Playing...";
                updatePlayControlState();
                return;
            }

            if (audio.paused && !audio.ended) {
                statusElement.innerText = "Paused";
                updatePlayControlState();
                return;
            }

            statusElement.innerText = "Click To Play....";
            updatePlayControlState();
        }

        function formatAudioClock(seconds) {
            const safe = Number.isFinite(seconds) ? Math.max(0, Math.floor(seconds)) : 0;
            const mins = Math.floor(safe / 60);
            const secs = safe % 60;
            return `${mins}:${String(secs).padStart(2, "0")}`;
        }

        function updateAudioSpeedLabel() {
            const audio = document.getElementById("cbt-audio-player");
            const speedLabel = document.getElementById("audio-speed-label");
            if (!audio || !speedLabel) return;
            const rate = Number(audio.playbackRate || 1);
            speedLabel.innerText = `${Number.isInteger(rate) ? rate : rate.toFixed(2).replace(/0$/, "")}x`;
        }

        function setAudioPlaybackRate(rate) {
            const audio = document.getElementById("cbt-audio-player");
            if (!audio) return;
            const normalized = Math.min(2, Math.max(0.5, Number(rate) || 1));
            audio.playbackRate = normalized;
            updateAudioSpeedLabel();
        }

        function cycleAudioSpeed() {
            const audio = document.getElementById("cbt-audio-player");
            if (!audio) return;
            const current = Number(audio.playbackRate || 1);
            const currentIndex = AUDIO_SPEED_STEPS.findIndex((step) => Math.abs(step - current) < 0.01);
            const nextIndex = currentIndex >= 0 ? ((currentIndex + 1) % AUDIO_SPEED_STEPS.length) : 1;
            setAudioPlaybackRate(AUDIO_SPEED_STEPS[nextIndex]);
        }

        function updateExamAudioProgressUI() {
            const audio = document.getElementById("cbt-audio-player");
            const fill = document.getElementById("audio-progress-fill");
            const knob = document.getElementById("audio-progress-knob");
            const current = document.getElementById("audio-cur-time");
            const remain = document.getElementById("audio-rem-time");
            const total = document.getElementById("audio-total-dur");
            if (!audio || !fill || !knob || !current || !remain || !total) return;

            const duration = Number.isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 0;
            const currentTime = Number.isFinite(audio.currentTime) ? Math.max(0, audio.currentTime) : 0;
            const progress = duration > 0 ? Math.min(1, Math.max(0, currentTime / duration)) : 0;

            fill.style.width = `${(progress * 100).toFixed(3)}%`;
            knob.style.left = `${(progress * 100).toFixed(3)}%`;
            current.innerText = formatAudioClock(currentTime);
            remain.innerText = `-${formatAudioClock(Math.max(0, duration - currentTime))}`;
            total.innerText = duration > 0 ? formatAudioClock(duration) : "--:--";
        }

        function examAudioSeekToProgress(progress) {
            const audio = document.getElementById("cbt-audio-player");
            if (!audio) return;
            if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
            const bounded = Math.min(1, Math.max(0, Number(progress) || 0));
            audio.currentTime = bounded * audio.duration;
            updateExamAudioProgressUI();
        }

        function examAudioSeekFromEvent(event) {
            const visual = document.getElementById("audio-visual-trigger");
            if (!visual || !event) return;
            const rect = visual.getBoundingClientRect();
            if (rect.width <= 0) return;
            const x = event.clientX - rect.left;
            examAudioSeekToProgress(x / rect.width);
        }

        function examAudioSeekRel(deltaSeconds) {
            const audio = document.getElementById("cbt-audio-player");
            if (!audio || !Number.isFinite(audio.duration) || audio.duration <= 0) return;
            const delta = Number(deltaSeconds) || 0;
            const next = Math.min(audio.duration, Math.max(0, (Number(audio.currentTime) || 0) + delta));
            audio.currentTime = next;
            updateExamAudioProgressUI();
        }

        function examAudioStop() {
            const audio = document.getElementById("cbt-audio-player");
            if (!audio) return;
            audio.pause();
            audio.currentTime = 0;
            updateExamAudioProgressUI();
            updateAudioShellStatus();

        function ensureAudioWaveFallbackBars() {
            const fallback = document.getElementById("audio-wave-fallback");
            if (!fallback || fallback.children.length > 0) return;
            const fragment = document.createDocumentFragment();
            const barCount = 44;
            for (let i = 0; i < barCount; i += 1) {
                const bar = document.createElement("span");
                bar.className = "audio-wave-fallback__bar";
                bar.style.setProperty("--bar-delay", `${(i % 11) * 0.06}s`);
                bar.style.setProperty("--bar-height", `${18 + ((i * 7) % 56)}%`);
                fragment.appendChild(bar);
            }
            fallback.appendChild(fragment);
        }

        function updateAudioVisualPlayingState() {
            const visual = document.getElementById("audio-visual-trigger");
            const audio = document.getElementById("cbt-audio-player");
            if (!visual || !audio) return;
            const isPlaying = Boolean(audio.src && !audio.paused && !audio.ended);
            visual.classList.toggle("is-playing", isPlaying);
        }

        function ensureAudioAnalyzer() {
            const audio = document.getElementById("cbt-audio-player");
            if (!audio) return false;
            if (!canUseWebAudioAnalyzer(audio)) return false;

            const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextCtor) return false;

            try {
                if (!audioContext) {
                    audioContext = new AudioContextCtor();
                }

                if (!audioAnalyser) {
                    audioAnalyser = audioContext.createAnalyser();
                    audioAnalyser.fftSize = 1024;
                    audioAnalyser.smoothingTimeConstant = 0.85;
                }

                if (!audioSourceNode) {
                    audioSourceNode = audioContext.createMediaElementSource(audio);
                    audioSourceNode.connect(audioAnalyser);
                    audioAnalyser.connect(audioContext.destination);
                }

                audioDataArray = new Uint8Array(audioAnalyser.frequencyBinCount);
                audioAnalyzerReady = true;
                return true;
            } catch (error) {
                console.warn("[AudioVisualizer] analyzer init failed:", error);
                audioAnalyzerReady = false;
                return false;
            }
        }

        function renderWaveform() {
            const canvas = document.getElementById("audio-wave-canvas");
            const knob = document.getElementById("audio-progress-knob");
            const audio = document.getElementById("cbt-audio-player");
            const track = document.querySelector(".audio-progress-track");
            if (!canvas || !audio || !track || !knob) return;

            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const targetWidth = Math.max(1, Math.floor(rect.width * dpr));
            const targetHeight = Math.max(1, Math.floor(rect.height * dpr));

            if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
                canvas.width = targetWidth;
                canvas.height = targetHeight;
            }

            const ctx = canvas.getContext("2d");
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const now = performance.now() / 1000;
            const colors = ["#4F46E5", "#0EA5E9", "#14B8A6", "#22C55E"];
            const canvasRect = canvas.getBoundingClientRect();
            const trackRect = track.getBoundingClientRect();
            const trackBottomY = (trackRect.bottom - canvasRect.top) * dpr;
            const audioLineY = Math.max(0, Math.min(canvas.height, trackBottomY + (0.7 * dpr)));
            const waveLayers = 4;

            const isActivelyPlaying = !!(audio.src && !audio.paused && !audio.ended);
            const targetState = {
                bass: 0.0,
                lowMid: 0.0,
                highMid: 0.0,
                treble: 0.0,
                pitch: 0.0
            };

            if (isActivelyPlaying && audioAnalyser && audioDataArray) {
                audioAnalyser.getByteFrequencyData(audioDataArray);

                const nyquist = (audioContext?.sampleRate || 44100) / 2;
                const binHz = nyquist / Math.max(1, audioDataArray.length - 1);

                const bandEnergy = (minHz, maxHz) => {
                    const start = Math.max(0, Math.floor(minHz / binHz));
                    const end = Math.min(audioDataArray.length - 1, Math.ceil(maxHz / binHz));
                    let sum = 0;
                    let count = 0;
                    for (let i = start; i <= end; i += 1) {
                        sum += audioDataArray[i];
                        count += 1;
                    }
                    return count > 0 ? sum / (count * 255) : 0;
                };

                targetState.bass = bandEnergy(20, 180);
                targetState.lowMid = bandEnergy(180, 900);
                targetState.highMid = bandEnergy(900, 3000);
                targetState.treble = bandEnergy(3000, 8000);

                let weightedSum = 0;
                let magnitudeSum = 0;
                for (let i = 1; i < audioDataArray.length; i += 1) {
                    const magnitude = audioDataArray[i] / 255;
                    const hz = i * binHz;
                    weightedSum += magnitude * hz;
                    magnitudeSum += magnitude;
                }
                const centroidHz = magnitudeSum > 0 ? (weightedSum / magnitudeSum) : 1000;
                targetState.pitch = Math.max(0, Math.min(1, centroidHz / 5000));
            }

            if (isActivelyPlaying) {
                const measuredActivity = (targetState.bass + targetState.lowMid + targetState.highMid + targetState.treble) / 4;
                if (measuredActivity < 0.05) {
                    const pulseA = (Math.sin(now * 4.1) + 1) / 2;
                    const pulseB = (Math.sin((now * 2.7) + 1.1) + 1) / 2;
                    targetState.bass = Math.max(targetState.bass, 0.22 + (pulseA * 0.12));
                    targetState.lowMid = Math.max(targetState.lowMid, 0.24 + (pulseB * 0.10));
                    targetState.highMid = Math.max(targetState.highMid, 0.20 + (pulseA * 0.12));
                    targetState.treble = Math.max(targetState.treble, 0.16 + (pulseB * 0.10));
                    targetState.pitch = Math.max(targetState.pitch, 0.34 + (pulseA * 0.20));
                }
            }

            const ease = (current, target, factor) => current + ((target - current) * factor);
            const attack = 0.38;
            const release = 0.10;
            waveformEnergyState.bass = ease(waveformEnergyState.bass, targetState.bass, targetState.bass > waveformEnergyState.bass ? attack : release);
            waveformEnergyState.lowMid = ease(waveformEnergyState.lowMid, targetState.lowMid, targetState.lowMid > waveformEnergyState.lowMid ? attack : release);
            waveformEnergyState.highMid = ease(waveformEnergyState.highMid, targetState.highMid, targetState.highMid > waveformEnergyState.highMid ? attack : release);
            waveformEnergyState.treble = ease(waveformEnergyState.treble, targetState.treble, targetState.treble > waveformEnergyState.treble ? attack : release);
            waveformEnergyState.pitch = ease(waveformEnergyState.pitch, targetState.pitch, targetState.pitch > waveformEnergyState.pitch ? 0.32 : 0.08);

            const bassEnergy = waveformEnergyState.bass;
            const lowMidEnergy = waveformEnergyState.lowMid;
            const highMidEnergy = waveformEnergyState.highMid;
            const trebleEnergy = waveformEnergyState.treble;
            const pitchProxy = waveformEnergyState.pitch;

            const audioEnergy = Math.max(
                0.002,
                Math.min(0.95, (bassEnergy * 0.34) + (lowMidEnergy * 0.28) + (highMidEnergy * 0.24) + (trebleEnergy * 0.14))
            );

            const layerConfigs = [
                // Highest layer
                { color: colors[0], energy: bassEnergy, speed: 0.9 + (bassEnergy * 0.5), phaseOffset: 0.0, lift: 0.0, heightScale: 1.45 },
                // Middle-high layer
                { color: colors[1], energy: lowMidEnergy, speed: 1.0 + (lowMidEnergy * 0.6), phaseOffset: 0.72, lift: 0.010, heightScale: 1.18 },
                // Normal layer
                { color: colors[2], energy: Math.min(1, (highMidEnergy * 0.7) + (pitchProxy * 0.3)), speed: 1.15 + (pitchProxy * 0.7), phaseOffset: 1.48, lift: 0.018, heightScale: 0.94 },
                // Lower texture layer
                { color: colors[3], energy: Math.min(1, (trebleEnergy * 0.75) + (pitchProxy * 0.25)), speed: 1.3 + (pitchProxy * 0.9), phaseOffset: 2.06, lift: 0.024, heightScale: 0.76 }
            ];

            const duration = audio.duration || 0;
            const timelineProgress = duration > 0 ? Math.min(1, Math.max(0, audio.currentTime / duration)) : 0;
            const visibleEndX = canvas.width;
            const waveStep = Math.max(3, Math.floor(canvas.width / 190));
            for (let i = 0; i < waveLayers; i += 1) {
                const layer = layerConfigs[i];
                const wavelength = canvas.width / (1.7 + (layer.energy * 5.8) + (i * 0.35));
                const frequency = (Math.PI * 2) / Math.max(28, wavelength);
                const amplitudeBase = isActivelyPlaying ? 0.056 : 0.0015;
                const amplitude = canvas.height * (amplitudeBase + (layer.energy * 0.46) + ((i * 0.024) * layer.energy)) * layer.heightScale;
                const phase = now * layer.speed + (layer.energy * 5.2) + layer.phaseOffset;

                ctx.fillStyle = layer.color;
                ctx.globalAlpha = 0.76 + (layer.energy * 0.2);
                ctx.beginPath();
                ctx.moveTo(0, audioLineY);

                for (let x = 0; x <= visibleEndX; x += waveStep) {
                    const progress = visibleEndX > 0 ? (x / visibleEndX) : 0;
                    const envelope = Math.pow(Math.sin(progress * Math.PI), 0.75);
                    const ripple = Math.sin((x * frequency) + phase);
                    const crest = Math.abs(ripple) * amplitude * (0.9 + envelope * 0.85);
                    const y = audioLineY - layer.lift * canvas.height - crest;
                    ctx.lineTo(x, y);
                }

                ctx.lineTo(visibleEndX, audioLineY);
                ctx.closePath();
                ctx.fill();
            }

            // Draw a bright stroke waveform on top so motion stays visible even when
            // analyzer data is weak/flat (e.g., low-volume tracks or cross-origin sources).
            if (isActivelyPlaying) {
                const strokeAmplitude = Math.max(canvas.height * 0.14, (audioEnergy * canvas.height * 0.46));
                const strokeFreq = (Math.PI * 2) / Math.max(36, canvas.width / 18);
                const strokePhase = now * 4.2 + (pitchProxy * 7);
                const strokeStep = Math.max(2, Math.floor(canvas.width / 260));

                ctx.save();
                ctx.beginPath();
                ctx.lineWidth = Math.max(2, Math.round(2 * dpr));
                ctx.strokeStyle = "rgba(186, 230, 253, 0.95)";
                ctx.shadowColor = "rgba(14, 165, 233, 0.65)";
                ctx.shadowBlur = Math.max(4, Math.round(6 * dpr));

                for (let x = 0; x <= visibleEndX; x += strokeStep) {
                    const y = audioLineY - (Math.abs(Math.sin((x * strokeFreq) + strokePhase)) * strokeAmplitude);
                    if (x === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }

                ctx.stroke();
                ctx.restore();
            }
            ctx.globalAlpha = 1;

            canvas.style.clipPath = "none";
            knob.style.left = `${timelineProgress * 100}%`;

            if (waveformShouldStopWhenSilent) {
                const settled = audioEnergy < 0.01 && pitchProxy < 0.02;
                if (settled) {
                    waveformShouldStopWhenSilent = false;
                    stopWaveformRenderer();
                    return;
                }
            }

            audioVisualFrame = requestAnimationFrame(renderWaveform);
        }

        function startWaveformRenderer() {
            if (audioVisualFrame) return;
            renderWaveform();
        }

        function stopWaveformRenderer() {
            if (!audioVisualFrame) return;
            cancelAnimationFrame(audioVisualFrame);
            audioVisualFrame = null;
        }

        async function toggleAudioFromUserGesture() {
            const audio = document.getElementById("cbt-audio-player");
            if (!audio) return false;
            if (Date.now() < audioToggleLockUntil) {
                return Boolean(audio.src && !audio.paused && !audio.ended);
            }
            if (audioToggleInFlight) return false;
            audioToggleInFlight = true;

            try {
                if (!audio.src) {
                    const recovered = await ensurePlayableAudioSource();
                    if (!recovered || !audio.src) {
                        alert("No saved listening audio was found for this selected package/date.");
                        return false;
                    }
                }

                const shouldUseAnalyzer = canUseWebAudioAnalyzer(audio);
                const analyzerReady = shouldUseAnalyzer ? ensureAudioAnalyzer() : false;
                if (analyzerReady && audioContext && audioContext.state === "suspended") {
                    try {
                        await audioContext.resume();
                    } catch (resumeError) {
                        console.warn("AudioContext resume failed, continuing with direct element playback:", resumeError);
                    }
                }

                if (audio.paused) {
                    audioIsLocked = false;
                    audio.muted = false;
                    if (audio.volume <= 0) {
                        audio.volume = 1;
                    }
                    if (audio.ended || (isFinite(audio.duration) && audio.duration > 0 && audio.currentTime >= (audio.duration - 0.05))) {
                        audio.currentTime = 0;
                    }
                    await audio.play();
                    if (audio.muted) audio.muted = false;
                    if (audio.volume <= 0) audio.volume = 1;
                } else {
                    audio.pause();
                }
            } catch (error) {
                const errorText = String(error?.message || error || "");
                const interruptedByPause = /interrupted by a call to pause/i.test(errorText);
                if (interruptedByPause) {
                    // Benign race from rapid input; ignore and keep control responsive.
                    return false;
                }

                console.warn("Audio play toggle failed:", error);
                alert(`Audio failed to play: ${errorText || "Unknown audio playback error"}`);
                return false;
            } finally {
                audioToggleInFlight = false;
                updateAudioShellStatus();
            }
            return Boolean(audio.src && !audio.paused && !audio.ended);
        }

        async function ensurePlayableAudioSource() {
            const audio = document.getElementById("cbt-audio-player");
            if (!audio) return false;
            if (audio.src) return true;

            const restoredCurrent = await restoreAudioForCurrentSet(activePartId || 1, getCurrentInstantQuestionNumber());
            if (restoredCurrent && audio.src) return true;
            if (isInstantFeedbackMode() && Number(activePartId || 1) === 1 && !getCurrentInstantQuestionNumber()) return false;

            try {
                // Try to get audio from Cloudflare for the current set.
                if (currentSetId) {
                    const storageUrl = await getCloudAudioUrl(currentSetId, activePartId || 1, 3500, getCurrentInstantQuestionNumber());
                    if (storageUrl) {
                        setAudioSourceFromUrl(storageUrl, currentSetId, activePartId || 1);
                        setAudioLabelReady("cloud audio", Number(activePartId || 1));
                        return Boolean(audio.src);
                    }
                }
                return false;
            } catch (error) {
                console.warn("[AudioPersistence] play-time recovery failed:", error);
                return false;
            }
        }

            return activePartId;
        }

        function syncAudioPanelFromView() {
            // 1. Audio Player Shell UI (Scroll & Active Part)
            if (typeof detectActivePartFromScroll === 'function') {
                activePartId = detectActivePartFromScroll();
            }
            if (typeof setAudioShellTitle === 'function') {
                setAudioShellTitle(activePartId);
            }
            if (typeof updateAudioShellStatus === 'function') {
                updateAudioShellStatus();
            }

            // 2. Developer/Editor Cloudflare Audio Panel UI
            const draft = typeof safeParse === 'function' 
                ? (safeParse(localStorage.getItem(DRAFT_KEY), {}) || {}) 
                : {};
            
            const folderUrl = currentSetId
                ? cloudflareUrlCache[`${currentTestType || "mocktest"}_${currentSetId}`] || ""
                : "";
            const folderEl = document.getElementById('cloud-audio-folder-url');

            if (folderUrl && folderEl) {
                folderEl.value = folderUrl;
            }

            // Update status indicators for each part (supporting both array and object structures)
            for (let i = 1; i <= 3; i++) {
                const partData = Array.isArray(draft.parts) ? draft.parts[i - 1] : draft.parts?.[i];
                const audioUrl = partData?.audio_cloudflare || partData?.audioUrl;
                
                const checkEl = document.getElementById(`cloud-audio-check-${i}`);
                if (checkEl) {
                    if (audioUrl) {
                        checkEl.textContent = `Part ${i}: ✓ Uploaded`;
                        checkEl.style.color = '#16a34a';
                        checkEl.style.borderColor = '#bbf7d0';
                    } else {
                        checkEl.textContent = `Part ${i}: Not checked`;
                        checkEl.style.color = '#1e3a5f';
                        checkEl.style.borderColor = '#e2e8f0';
                    }
                }
            }
        }

        function setupAudioInteractions() {
            const audio = document.getElementById("cbt-audio-player");
            const visual = document.getElementById("audio-visual-trigger");
            const playControl = document.getElementById("audio-play-control");
            const speedButton = document.getElementById("audio-speed-btn");
            const mainContainer = document.getElementById("user-passages-container");
            if (!audio || !mainContainer) return;

            if (visual) {
                visual.title = "Click to seek";
                visual.addEventListener("click", examAudioSeekFromEvent);
                visual.addEventListener("pointerdown", (pointerEvent) => {
                    if (pointerEvent.button !== 0) return;
                    examAudioSeekFromEvent(pointerEvent);
                    const move = (moveEvent) => examAudioSeekFromEvent(moveEvent);
                    const up = () => {
                        window.removeEventListener("pointermove", move);
                        window.removeEventListener("pointerup", up);
                    };
                    window.addEventListener("pointermove", move);
                    window.addEventListener("pointerup", up);
                });
            }
            if (playControl && !playControl.onclick) playControl.addEventListener("click", toggleAudioFromUserGesture);
            if (speedButton && !speedButton.onclick) speedButton.addEventListener("click", cycleAudioSpeed);

            // Allow clicking Part A/B/C titles in navigator to switch part and start that part audio.
            const navigatorTitles = document.querySelectorAll(".navigator-group__title");
            navigatorTitles.forEach((title, index) => {
                title.style.cursor = "pointer";
                title.setAttribute("title", "Switch to this part and play/pause audio");
                title.addEventListener("click", async () => {
                    const partId = index + 1;
                    if (!Number.isFinite(partId)) return;
                    if (activePartId !== partId) {
                        setActivePart(partId, { resetScroll: false });
                    }
                    await toggleAudioFromUserGesture();
                });
            });

            audio.addEventListener("play", () => {
                waveformShouldStopWhenSilent = false;
                startWaveformRenderer();
                updateAudioVisualPlayingState();
                updateAudioShellStatus();
            });
            audio.addEventListener("pause", () => {
                waveformShouldStopWhenSilent = true;
                startWaveformRenderer();
                updateAudioVisualPlayingState();
                updateAudioShellStatus();
            });
            audio.addEventListener("loadeddata", () => {
                audioIsLocked = false;
                waveformShouldStopWhenSilent = false;
                startWaveformRenderer();
                updateAudioVisualPlayingState();
                updateAudioShellStatus();
                void sendAudioPlaybackTelemetry("loadeddata", {
                    partId: activePartId || 1,
                    setId: currentSetId,
                    source: currentAudioPlaybackSource,
                    url: String(audio.currentSrc || audio.src || ""),
                });
            });
            audio.addEventListener("ended", () => {
                audioIsLocked = false;
                waveformShouldStopWhenSilent = true;
                startWaveformRenderer();
                updateAudioVisualPlayingState();
                updateAudioShellStatus();
            });
            audio.addEventListener("error", () => {
                const mediaError = audio.error;
                const code = mediaError?.code || 0;
                const codeText = {
                    1: "aborted",
                    2: "network",
                    3: "decode",
                    4: "source not supported"
                }[code] || "unknown";
                void (async () => {
                    const currentSrc = String(audio.currentSrc || audio.src || "");
                    await sendAudioPlaybackTelemetry("audio_error", {
                        partId: activePartId || 1,
                        setId: currentSetId,
                        source: currentAudioPlaybackSource,
                        url: currentSrc || "about:blank",
                    });

                    if (audioFallbackAttempted) {
                        // Only interrupt a real exam attempt; the editor just shows the status text.
                        if (examSessionStarted && isUserViewActive()) {
                            alert(`Audio error (${codeText}). Please re-upload this part audio in Developer mode.`);
                        } else {
                            console.warn(`[AudioPlayback] Audio error (${codeText}) for part ${activePartId || 1} of ${currentSetId}.`);
                        }
                        updateAudioShellStatus();
                        return;
                    }

                    audioFallbackAttempted = true;
                    // First, try fallback URLs (Firebase Storage alternatives)
                    let recovered = await tryFallbackAudioSource();
                    
                    // If fallback failed and current source is a Cloudflare URL, invalidate it and try Firebase directly
                    if (!recovered) {
                        // Firebase only holds full-part audio, which must not replace a per-question/talk clip.
                        const isClipSource = /question_set/i.test(decodeURIComponent(currentSrc));
                        if (currentSrc && currentSrc.includes("r2.dev") && !isClipSource) {
                            console.warn("[AudioPlayback] Cloudflare URL failed (", codeText, "), invalidating cache and falling back to Firebase Storage:", currentSrc);
                            
                            // Invalidate all cached Cloudflare URLs for this set
                            const testType = currentTestType || "mocktest";
                            const cloudflareKey = `toefl_section1_cloudflare_folder_url_${testType}_${String(currentSetId || "default")}`;
                            localStorage.removeItem(cloudflareKey);
                            
                            // Clear in-memory cache
                            const cacheKey = `${testType}_${currentSetId}`;
                            delete cloudflareUrlCache[cacheKey];
                            
                            // Now try Firebase Storage as last resort
                            if (window.toeflStorage && (typeof toeflStorage.getPlayableAudioFromFirebase === "function" || typeof toeflStorage.getAudioFromFirebase === "function")) {
                                const partId = activePartId || 1;
                                const fetchFn = typeof toeflStorage.getPlayableAudioFromFirebase === "function"
                                    ? toeflStorage.getPlayableAudioFromFirebase.bind(toeflStorage)
                                    : toeflStorage.getAudioFromFirebase.bind(toeflStorage);
                                const firebaseUrl = await fetchFn(currentSetId, partId).catch(() => null);
                                if (firebaseUrl) {
                                    audio.src = firebaseUrl;
                                    currentAudioPlaybackSource = inferPlaybackSource(firebaseUrl);
                                    audio.currentTime = 0;
                                    try {
                                        await audio.play();
                                        await sendAudioPlaybackTelemetry("fallback_activated", {
                                            partId,
                                            setId: currentSetId,
                                            source: currentAudioPlaybackSource,
                                            url: firebaseUrl,
                                        });
                                        console.log("[AudioPlayback] Successfully switched to Firebase Storage fallback");
                                        recovered = true;
                                    } catch {
                                        // Still failed
                                    }
                                }
                            }
                        }
                    }
                    
                    if (!recovered) {
                        if (examSessionStarted && isUserViewActive()) {
                            alert(`Audio error (${codeText}). Please re-upload this part audio in Developer mode.`);
                        } else {
                            console.warn(`[AudioPlayback] Audio error (${codeText}) for part ${activePartId || 1} of ${currentSetId}.`);
                        }
                    }
                    updateAudioShellStatus();
                })();
            });
            audio.addEventListener("timeupdate", updateAudioShellStatus);
            audio.addEventListener("timeupdate", updateExamAudioProgressUI);
            audio.addEventListener("loadedmetadata", updateExamAudioProgressUI);
            audio.addEventListener("durationchange", updateExamAudioProgressUI);
            audio.addEventListener("ended", updateExamAudioProgressUI);
            audio.addEventListener("ratechange", updateAudioSpeedLabel);

            mainContainer.addEventListener("scroll", syncAudioPanelFromView);

            ensureAudioWaveFallbackBars();
            startWaveformRenderer();
            updateAudioVisualPlayingState();
            syncAudioPanelFromView();
            updatePlayControlState();
            updateAudioSpeedLabel();
            updateExamAudioProgressUI();
        }

        function scrollToQuestion(uid) {

        function scrollToNextQuestion() {
            const activePartQuestions = getQuestionUidsByPart(activePartId);
            const nextUid = activePartQuestions.find((uid) => !document.querySelector(`input[name="q_${uid}"]:checked`));

            if (nextUid) {
                scrollToQuestion(nextUid);
                return;
            }

            const nextPartId = findNextAvailablePart(activePartId);
            if (nextPartId) {
                setActivePart(nextPartId, { resetScroll: true });
                const nextPartQuestions = getQuestionUidsByPart(nextPartId);
                const firstUnanswered = nextPartQuestions.find((uid) => !document.querySelector(`input[name="q_${uid}"]:checked`));
                const targetUid = firstUnanswered || nextPartQuestions[0];
                if (targetUid) {
                    setTimeout(() => scrollToQuestion(targetUid), 80);
                }
                return;
            }

            if (activePartQuestions[0]) {
                scrollToQuestion(activePartQuestions[0]);
            }
        }

            if (!isPartComplete(activePartId)) return;

            const nextPartId = findNextAvailablePart(activePartId);
            if (nextPartId) {
                setActivePart(nextPartId, { resetScroll: true });
                const nextPartQuestions = getQuestionUidsByPart(nextPartId);
                if (nextPartQuestions[0]) {
                    setTimeout(() => scrollToQuestion(nextPartQuestions[0]), 80);

            submitAnswers();
        }
