        function updateNextSectionButtonState() {
            const nextSectionButton = document.getElementById("btn-next-section");
            const headerSubmitButton = document.getElementById("submit-header-btn");
            if (!nextSectionButton && !headerSubmitButton) return;

            const canProceed = isPartComplete(activePartId);
            const nextPartId = findNextAvailablePart(activePartId);
            const isFinalPart = !nextPartId;
            const sideButtonLabel = isFinalPart ? "Submit Section 1" : "Next Section";
            const headerButtonLabel = "Submit";

            if (nextSectionButton) {
                nextSectionButton.disabled = !canProceed;
                nextSectionButton.classList.toggle("is-enabled", canProceed);
                nextSectionButton.innerText = sideButtonLabel;
            }

            if (headerSubmitButton) {
                headerSubmitButton.disabled = false;
                headerSubmitButton.style.opacity = "1";
                headerSubmitButton.style.cursor = "pointer";
                const labelElement = headerSubmitButton.querySelector(".submit");
                if (labelElement) labelElement.textContent = headerButtonLabel;
            }
        }

        function toggleQuestionFlag(uid) {
            if (!uid) return;
            if (isQuestionFlagged(uid)) {
                delete flaggedQuestions[uid];
            } else {
                flaggedQuestions[uid] = true;
            }
            persistFlagState();
            refreshExamState();
        }

        function refreshExamState() {
            const totalQuestions = questionOrder.length || 0;
            const answerSummary = document.getElementById("answer-summary");

            const progressFillA = document.getElementById("progress-fill-a");
            const progressFillB = document.getElementById("progress-fill-b");
            const progressFillC = document.getElementById("progress-fill-c");

            // Dynamic counts per part
            const answeredA = getPartAnsweredCount(1);
            const answeredB = getPartAnsweredCount(2);
            const answeredC = getPartAnsweredCount(3);

            const totalA = getPartQuestionCount(1);
            const totalB = getPartQuestionCount(2);
            const totalC = getPartQuestionCount(3);

            // Update section progress bars
            if (progressFillA) progressFillA.style.width = totalA > 0 ? `${Math.round((answeredA / totalA) * 100)}%` : "0%";
            if (progressFillB) progressFillB.style.width = totalB > 0 ? `${Math.round((answeredB / totalB) * 100)}%` : "0%";
            if (progressFillC) progressFillC.style.width = totalC > 0 ? `${Math.round((answeredC / totalC) * 100)}%` : "0%";

            // Get current section stats dynamically
            const currentAnswered = getPartAnsweredCount(activePartId);
            const currentTotal = getPartQuestionCount(activePartId);

            // Dynamically updates "Answered X/Y" based on active section total
            if (answerSummary) {
                answerSummary.textContent = `Answered ${currentAnswered}/${currentTotal}`;
            }

            // Update question card styles & navigator buttons
            questionOrder.forEach((uid) => {
                const questionCard = document.getElementById(`q-container-${uid}`);
                const navigatorButton = document.querySelector(`.navigator-btn[data-uid="${uid}"]`);
                const checkedInput = document.querySelector(`input[name="q_${uid}"]:checked`);
                const isAnswered = Boolean(checkedInput);

                if (questionCard) {
                    questionCard.classList.toggle("is-answered", isAnswered);
                    const badge = questionCard.querySelector(".question-number-badge");
                    if (badge) badge.classList.toggle("is-answered", isAnswered);
                    questionCard.querySelectorAll(".radio-group label").forEach((label) => {
                        const radio = label.querySelector('input[type="radio"]');
                        label.classList.toggle("selected", Boolean(radio && radio.checked));
                    });
                }

                if (navigatorButton) {
                    navigatorButton.classList.toggle("is-answered", isAnswered);
                }
            });

            updateNextSectionButtonState();
            renderInstantProgressDots();
        }

        async function saveSectionDraft(options = {}) {
            const publishExplanationCards = Boolean(options.publishExplanationCards);
            const existingDraft = safeParse(localStorage.getItem(DRAFT_KEY), {}) || {};
            const bulkExplanationIdEditorValue = (document.getElementById("input-bulk-explanation-id-all") || {}).value || "";
            const bulkExplanationEnEditorValue = (document.getElementById("input-bulk-explanation-en-all") || {}).value || "";
            const isFocusedPractice = Boolean(forcedPracticePartId && isPracticeTestType());
            const bulkExplanationIdValue = isFocusedPractice
                ? mergeFocusedBulkExplanationPart(existingDraft.bulkExplanationId, bulkExplanationIdEditorValue, forcedPracticePartId)
                : bulkExplanationIdEditorValue;
            const bulkExplanationEnValue = isFocusedPractice
                ? mergeFocusedBulkExplanationPart(existingDraft.bulkExplanationEn, bulkExplanationEnEditorValue, forcedPracticePartId)
                : bulkExplanationEnEditorValue;
            const draft = { 
                parts: {} ,
                bulkExplanationId: bulkExplanationIdValue,
                bulkExplanationEn: bulkExplanationEnValue
            };
            const bulkEnglishByUid = parseAllListeningBulkExplanations(bulkExplanationEnValue);
            const bulkBahasaByUid = parseAllListeningBulkExplanations(bulkExplanationIdValue);
            PARTS.forEach((part) => {
                const p = part.id;
                const questionInputValue = (document.getElementById(`input-magic-questions-${p}`) || {}).value || "";
                const transcriptInput = document.getElementById(`input-transcript-${p}`);
                const transcriptValue = getTranscriptForSmartQuestions(p);
                if (transcriptInput && transcriptValue && !hasTimedTranscriptContent(transcriptInput.value)) transcriptInput.value = transcriptValue;

                // Read every group-transcript textarea directly instead of trusting the
                // localStorage cache written by handleGroupTranscriptChange's onchange —
                // that cache goes stale whenever a textarea is edited but never blurred
                // before this save runs, silently dropping that group's transcript.
                const existingGroupTranscript = existingDraft.parts?.[p]?.groupTranscript && typeof existingDraft.parts[p].groupTranscript === "object" ? existingDraft.parts[p].groupTranscript : {};
                const groupTranscript = { ...existingGroupTranscript };
                getAudioGroupsForPart(p, isPracticeTestType()).forEach((group) => {
                    const groupTextarea = document.getElementById(`input-group-transcript-${p}-${group.key}`);
                    if (groupTextarea) groupTranscript[group.key] = String(groupTextarea.value || "").trim();
                });
                const explanationTexts = {
                    ...(existingDraft.parts?.[p]?.explanationTexts && typeof existingDraft.parts[p].explanationTexts === "object"
                        ? existingDraft.parts[p].explanationTexts
                        : {})
                };
                const explanationSchemas = {
                    ...(existingDraft.parts?.[p]?.explanationSchemas && typeof existingDraft.parts[p].explanationSchemas === "object"
                        ? existingDraft.parts[p].explanationSchemas
                        : {})
                };
                // Practice Part B/C are numbered from 1 ("Part 2 / Question 1"); mock tests use 31-38 / 39-50.
                const usesPracticeNumbering = isPracticeTestType() && p !== 1;
                const firstNumber = usesPracticeNumbering ? 1 : part.start;
                const lastNumber = usesPracticeNumbering ? part.end - part.start + 1 : part.end;
                const questionNumbers = new Set();
                for (let n = firstNumber; n <= lastNumber; n += 1) questionNumbers.add(n);
                for (const questionNumber of [...questionNumbers]) {
                    const uid = `${p}_${questionNumber}`;
                    const english = String(bulkEnglishByUid[uid] || "").trim();
                    const bahasa = String(bulkBahasaByUid[uid] || "").trim();
                    const hasEnglish = english && !isGenericExplanationFallback(english);
                    if (!hasEnglish && !bahasa) continue;
                    const target = questionNumber;
                    if (hasEnglish) {
                        explanationTexts[target] = {
                            ...(explanationTexts[target] || {}),
                            explanation: english,
                            explanationId: bahasa,
                            showBahasaExplanation: Boolean(bahasa)
                        };
                    } else {
                        explanationTexts[target] = {
                            ...(explanationTexts[target] || {}),
                            explanationId: bahasa,
                            showBahasaExplanation: true
                        };
                    }
                    // Bahasa is the primary display language; English is only used when no Bahasa text exists.
                    const schemaSource = bahasa
                        ? bahasa
                            .replace(/\*{2}PENJELASAN\*{2}/gi, "**EXPLAINATION**")
                            .replace(/\*{2}KENAPA OPSI LAIN SALAH\*{2}/gi, "**WHY THE OTHER OPTION IS INCORRECT**")
                        : english;
                    explanationSchemas[target] = applyExplanationCardToSchema(
                        explanationSchemas[target], p, target, schemaSource
                    );
                }

                // An empty editor usually means the draft has not hydrated yet, so never let
                // a save blank out content that is already stored for this part.
                const keepIfBlank = (value, previous) => (String(value || "").trim() ? value : (previous || value));
                const previousPart = existingDraft.parts?.[p] || {};

                draft.parts[p] = {
                    questions: keepIfBlank(questionInputValue, previousPart.questions),
                    answerKey: keepIfBlank((document.getElementById(`input-answer-key-${p}`) || {}).value || "", previousPart.answerKey),
                    explanation: keepIfBlank((document.getElementById(`input-explanation-${p}`) || {}).value || "", previousPart.explanation),
                    explanationSchemas: explanationSchemas,
                    explanationTexts: explanationTexts,
                    transcript: keepIfBlank(transcriptValue, previousPart.transcript),
                    transcriptSegments: Array.isArray(existingDraft.parts?.[p]?.transcriptSegments) ? existingDraft.parts[p].transcriptSegments : [],
                    questionAudio: existingDraft.parts?.[p]?.questionAudio && typeof existingDraft.parts[p].questionAudio === "object" ? existingDraft.parts[p].questionAudio : {},
                    groupAudio: existingDraft.parts?.[p]?.groupAudio && typeof existingDraft.parts[p].groupAudio === "object" ? existingDraft.parts[p].groupAudio : {},
                    groupTranscript: groupTranscript,
                    audio_cloudflare: audioUrlsByPart[p] || "",
                    audio_firebase: audioFirebaseByPart[p] || ""
                };
            });
            localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
            if (window.toeflStorage && typeof window.toeflStorage.saveDraftBySetIdAndType === "function") {
                const folderInput = document.getElementById("cloud-audio-folder-url");
                const folderUrl = String((folderInput && folderInput.value) || "").trim();
                let setId = extractCloudflareSetId(currentSetId) || extractCloudflareSetId(folderUrl);
                const rawSetDate = String((document.getElementById("set-date") || {}).value || "").trim();
                const normalizedSetDate = normalizeDateKey(rawSetDate);
                const setDate = currentTestType === "practicetest"
                    ? (normalizedSetDate || "")
                    : (normalizedSetDate || new Date().toISOString().split("T")[0]);
                const difficulty = (document.getElementById("set-difficulty") || {}).value || "intermediate";

                if (!setId) {
                    console.warn("[ListeningData] Draft save skipped: no stable setId yet.");
                    return;
                }

                currentSetId = setId;

                const draftSaved = await toeflStorage.saveDraftBySetIdAndType(setId, MODULE_ID, draft, currentTestType)
                    .then(() => true)
                    .catch((error) => {
                        console.warn("[ToeflSync] draft save failed:", error);
                        return false;
                    });
                if (!draftSaved) {
                    console.warn("[ToeflSync] Draft save to remote storage returned false; local draft updated.");
                }

                // Also save complete listening data to Firebase RTDB with audio URLs and content
                const cloudflareFolder = folderUrl;
                const metadata = {
                    setDate: setDate,
                    difficulty: difficulty,
                    testType: currentTestType,
                    cloudflare_folder: cloudflareFolder
                };

                // Gather parts data with audio URLs
                const parts = {};
                PARTS.forEach((part) => {
                    const p = part.id;
                    const cloudflareUrl = audioUrlsByPart[p] || "";
                    const firebaseUrl = draft.parts[p]?.audio_firebase || "";
                    if (!cloudflareUrl) {
                        console.warn(`[ListeningData] No Cloudflare URL for part ${p}. audioUrlsByPart:`, audioUrlsByPart);
                    }
                    parts[p] = {
                        audio_cloudflare: cloudflareUrl,
                        audio_firebase: firebaseUrl,
                        answerKey: draft.parts[p]?.answerKey || "",
                        explanation: draft.parts[p]?.explanation || "",
                        explanationSchemas: draft.parts[p]?.explanationSchemas || {},
                        explanationTexts: draft.parts[p]?.explanationTexts || {},
                        questions: draft.parts[p]?.questions || "",
                        transcripts: draft.parts[p]?.transcript || "",
                        transcriptSegments: draft.parts[p]?.transcriptSegments || [],
                        questionAudio: draft.parts[p]?.questionAudio || {},
                        groupAudio: draft.parts[p]?.groupAudio || {},
                        groupTranscript: draft.parts[p]?.groupTranscript || {}
                    };
                });

                // CRITICAL: Await Firebase save to ensure audio URLs persist
                console.log("[ListeningData] Saving complete listening data with audio URLs:", parts);
                const completeDataSaved = await saveCompleteListeningDataToFirebase(setId, metadata, parts).catch((error) => {
                    console.warn("[ListeningData] Firebase save failed:", error);
                    return false;
                });
                if (!completeDataSaved) {
                    console.warn("[ListeningData] Complete listening data save to Firebase returned false; local draft updated.");
                }
            }
        }

        async function loadSectionDraft() {
            const forceBlankNew = isExplicitNewPackageRequest();
            if (forceBlankNew && !currentSetId) {
                clearListeningEditorInputs();
                return;
            }

            if (isDateTargetWithoutSetIdRequest()) {
                clearListeningEditorInputs();
                return;
            }

            let draft = {};
            // Only reset maps if we're actually going to load new data
            // Preserve in-memory URLs during current editing session
            let resetMaps = false;
            
            // First, try to load complete listening data from Firebase RTDB
            if (currentSetId && !draft.parts) {
                try {
                    const firebaseData = await getCompleteListeningDataFromFirebase(currentSetId);
                    if (firebaseData && firebaseData.parts) {
                        // We're loading fresh data from Firebase - OK to reset maps
                        audioUrlsByPart = {};
                        audioFirebaseByPart = {};
                        resetMaps = true;
                        
                        // Convert Firebase data structure back to draft format
                        draft = {
                            parts: {}
                        };
                        Object.entries(firebaseData.parts || {}).forEach(([partId, partData]) => {
                            draft.parts[partId] = {
                                questions: partData?.questions || "",
                                answerKey: partData?.answerKey || "",
                                explanation: partData?.explanation || "",
                                explanationSchemas: partData?.explanationSchemas && typeof partData.explanationSchemas === "object" ? partData.explanationSchemas : {},
                                explanationTexts: partData?.explanationTexts && typeof partData.explanationTexts === "object" ? partData.explanationTexts : {},
                                transcript: partData?.transcripts || "",
                                transcriptSegments: Array.isArray(partData?.transcriptSegments) ? partData.transcriptSegments : [],
                                questionAudio: partData?.questionAudio && typeof partData.questionAudio === "object" ? partData.questionAudio : {},
                                groupAudio: partData?.groupAudio && typeof partData.groupAudio === "object" ? partData.groupAudio : {},
                                groupTranscript: partData?.groupTranscript && typeof partData.groupTranscript === "object" ? partData.groupTranscript : {},
                                audio_cloudflare: partData?.audio_cloudflare || "",
                                audio_firebase: partData?.audio_firebase || ""
                            };
                        });
                        console.log("[ListeningData] Loaded complete listening data from Firebase for setId", currentSetId);

                        // The complete-listening-data payload only stores per-part
                        // explanation fields; the bulk explanation textareas are saved
                        // separately on the drafts_v2 record, so pull them in here too
                        // or they silently vanish on refresh even though save succeeded.
                        if (window.toeflStorage && typeof toeflStorage.getDraftBySetIdAndType === "function") {
                            try {
                                const typedDraft = await toeflStorage.getDraftBySetIdAndType(currentSetId, currentTestType);
                                if (typedDraft && typeof typedDraft.bulkExplanationId === "string") draft.bulkExplanationId = typedDraft.bulkExplanationId;
                                if (typedDraft && typeof typedDraft.bulkExplanationEn === "string") draft.bulkExplanationEn = typedDraft.bulkExplanationEn;
                            } catch (_) {}
                        }
                    }
                } catch (error) {
                    console.warn("[ListeningData] Failed to load from Firebase, falling back to local storage:", error);
                }
            }
            
            // Fallback to toeflStorage
            if (!draft.parts && currentSetId && window.toeflStorage) {
                try {
                    draft = await toeflStorage.getDraftBySetIdAndType(currentSetId, currentTestType);
                    if (!resetMaps) {
                        audioUrlsByPart = {};
                        audioFirebaseByPart = {};
                        resetMaps = true;
                    }
                } catch {
                    draft = {};
                }
            }

            // Fallback 1: local V1 draft cache used by the editor save flow.
            if (!hasListeningDraftContent(draft)) {
                draft = safeParse(localStorage.getItem(DRAFT_KEY), {});
                if (!resetMaps) {
                    audioUrlsByPart = {};
                    audioFirebaseByPart = {};
                    resetMaps = true;
                }
            }

            // Fallback 2: legacy module-scoped draft from Firebase/local cache.
            if (!hasListeningDraftContent(draft) && window.toeflStorage && typeof toeflStorage.getDraft === "function") {
                try {
                    draft = await toeflStorage.getDraft("listening");
                    if (!resetMaps) {
                        audioUrlsByPart = {};
                        audioFirebaseByPart = {};
                        resetMaps = true;
                    }
                } catch {
                    draft = draft || {};
                }
            }

            if (!draft || typeof draft !== "object" || !draft.parts) return;
            if (!hasListeningDraftContent(draft)) return;
            localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
            applyDraftToEditorInputs(draft);
        }

        async function loadSectionMeta() {
            const dateInput = document.getElementById("set-date");
            const dateContainer = dateInput?.parentElement?.parentElement;
            const difficultyInput = document.getElementById("set-difficulty");
            const params = new URLSearchParams(window.location.search);
            const forceBlankNew = isExplicitNewPackageRequest();
            currentTestType = params.get("testType") || "mocktest";
            
            if (dateContainer) {
                dateContainer.style.display = currentTestType === "practicetest" ? "none" : "flex";
            }
            const requestedDate = params.get("setDate");
            const normalizedRequestedDate = normalizeDateKey(requestedDate);
            const requestedSetId = String(params.get("setId") || "").trim();
            currentSetId = requestedSetId && requestedSetId !== "sets" ? requestedSetId : "";
            let stored = {};

            if (requestedDate) {
                const byDate = await resolveSetRecordByDate(normalizedRequestedDate || requestedDate);
                const currentSetDate = parseSetDateFromSetId(currentSetId);
                const requestedNormalizedDate = normalizedRequestedDate || normalizeDateKey(requestedDate);
                const currentMatchesRequested = Boolean(currentSetId) && currentSetDate === requestedNormalizedDate;

                if (byDate?.setId && (!currentSetId || !currentMatchesRequested)) {
                    currentSetId = byDate.setId;
                    stored = byDate;
                } else if (!currentMatchesRequested) {
                    currentSetId = "";
                }
            }

            if (!currentSetId && requestedDate) {
                const byDate = await resolveSetRecordByDate(normalizedRequestedDate || requestedDate);
                if (byDate?.setId) {
                    currentSetId = byDate.setId;
                    stored = byDate;
                }
            }

            if (!currentSetId && !requestedDate && !forceBlankNew) {
                const latest = await resolveLatestUserSetRecord();
                if (latest?.setId) {
                    currentSetId = latest.setId;
                    stored = latest;
                }
            }

            if (!currentSetId && !requestedDate && !forceBlankNew) {
                const latestAudioSetId = await resolveLatestSetIdFromAudioIndex();
                if (latestAudioSetId) {
                    currentSetId = latestAudioSetId;
                    const parsedDate = String(latestAudioSetId).split("_")[1] || "";
                    if (!stored.setDate && /^\d{4}-\d{2}-\d{2}$/.test(parsedDate)) {
                        stored.setDate = parsedDate;
                    }
                }
            }

            // Minimal fallback: if setId is still unknown, use latest set from Developer draft map.
            if (!currentSetId && !forceBlankNew) {
                const draftEntry = resolveLatestLocalDraftV2ForModule(MODULE_ID);
                if (draftEntry?.setId) {
                    currentSetId = String(draftEntry.setId);
                    const parsedDate = String(currentSetId).split("_")[1] || "";
                    if (!stored.setDate && /^\d{4}-\d{2}-\d{2}$/.test(parsedDate)) {
                        stored.setDate = parsedDate;
                    }
                }
            }

            if (window.toeflStorage) {
                try {
                    if (currentSetId && typeof toeflStorage.getSetRecordById === "function") {
                        stored = await toeflStorage.getSetRecordByIdAndType(currentSetId, currentTestType) || {};
                    }
                } catch {
                    stored = stored || {};
                }
            }

            if (!stored.setDate) {
                const local = getStoredSetMap();
                if (currentSetId && local[currentSetId]) {
                    stored = local[currentSetId];
                }
            }

            const today = new Date().toISOString().split("T")[0];
            const effectiveDate = normalizedRequestedDate || requestedDate || stored.setDate || (currentTestType === "practicetest" ? "" : today);
            if (dateInput) dateInput.value = effectiveDate;
            if (difficultyInput) difficultyInput.value = stored.difficulty || "intermediate";
            // Reopening from the developer list drops ?focus=, so recover it from the saved record.
            if (!forcedPracticePartId && currentTestType === "practicetest") {
                const storedFocus = Number(String(stored.focus || "").replace(/[^\d]/g, ""));
                if ([1, 2, 3].includes(storedFocus)) {
                    forcedPracticePartId = storedFocus;
                    applyPracticeFocusFilter();
                }
            }
            if (forcedPracticePartId) {
                activePartId = forcedPracticePartId;
            }
            lastValidSetDate = effectiveDate;
            updatePackageLabel(effectiveDate, currentTestType, getPracticeRunMode() === "instant" ? "instant" : "full test");
            try {
                await restoreAudioForCurrentSet(activePartId || 1);
            } catch (error) {
                console.warn("[AudioPersistence] restore during meta load failed:", error);
            }
            try {
                await refreshAudioLabelsForCurrentSet();
            } catch (error) {
                console.warn("[AudioPersistence] label refresh during meta load failed:", error);
            }
            try {
                await refreshCloudflareFolderPanelForCurrentSet();
            } catch (error) {
                console.warn("[CloudflareFolder] panel refresh during meta load failed:", error);
            }
        }

        async function saveSectionMeta() {
            const dateInput = document.getElementById("set-date");
            const difficultyInput = document.getElementById("set-difficulty");
            const rawSetDate = String(dateInput?.value || "").trim();
            const normalizedSetDate = normalizeDateKey(rawSetDate);
            const setDate = currentTestType === "practicetest"
                ? (normalizedSetDate || "")
                : (normalizedSetDate || new Date().toISOString().split("T")[0]);
            const setId = await ensureCurrentSetId(setDate, currentTestType);
            let folderUrl = "";
            try {
                folderUrl = await createCloudAudioFolderForCurrentSet();
            } catch (error) {
                console.warn("[CloudflareFolder] folder ensure during set save failed:", error);
            }
            if (!folderUrl) throw new Error("Folder link was not saved in Firebase. Sign in with the developer account and retry.");
            const record = {
                setId,
                module: MODULE_ID,
                label: MODULE_LABEL,
                setDate,
                difficulty: difficultyInput?.value || "intermediate",
                focus: forcedPracticePartId ? `part${forcedPracticePartId}` : "",
                updatedAt: new Date().toISOString()
            };
            if (currentTestType === "practicetest" && getRequestedPracticePackage()) record.packageNumber = getRequestedPracticePackage();
            if (window.toeflStorage && typeof toeflStorage.upsertSetRecord === "function") {
                try {
                    await toeflStorage.upsertSetRecordWithType(record, currentTestType);
                } catch (error) {
                    if (error?.code === "DUPLICATE_SET_DATE") {
                        alert("A test in this category already exists for this date. Open the existing set instead.");
                        throw error;
                    }
                    console.warn("[ToeflSync] set save failed:", error);
                }
            }
            upsertLocalRecord(record);
            updateEditorUrl(setId, setDate);
            updatePackageLabel(setDate);
            try {
                await refreshCloudflareFolderPanelForCurrentSet();
            } catch (error) {
                console.warn("[CloudflareFolder] panel refresh during set save failed:", error);
            } 
        }

        // Mock Test owns day 1, 5, 9, 13... (every 4th day); Practice Test owns the days in between (e.g. 2-4, 6-8).
        let lastValidSetDate = "";
        function isMockTestDayNumber(day) {
            return ((day - 1) % 4) === 0;
        }
        function isDateAllowedForTestType(dateString, testType) {
            const parsed = new Date(`${dateString}T00:00:00`);
            if (Number.isNaN(parsed.getTime())) return true;
            const isMockSlot = isMockTestDayNumber(parsed.getDate());
            return testType === "practicetest" ? !isMockSlot : isMockSlot;
        }

        async function handleSetDateChange() {
            const dateInput = document.getElementById("set-date");
            const selectedDate = dateInput?.value;
            if (!selectedDate) return;

            const testType = (typeof currentTestType !== "undefined" && currentTestType) 
                ? currentTestType 
                : (new URLSearchParams(window.location.search).get("testType") || "practicetest");

            if (!isDateAllowedForTestType(selectedDate, currentTestType)) {
                const ownerLabel = currentTestType === "practicetest" ? "Mock Test" : "Practice Test";
                alert(`This date is reserved for ${ownerLabel} only. Please pick a different date.`);
                dateInput.value = lastValidSetDate || selectedDate;
                return;
            }
            lastValidSetDate = selectedDate;

            const activeSetId = currentSetId || new URLSearchParams(window.location.search).get("setId");

            let existing = null;
            if (activeSetId) {
                existing = await toeflStorage.getSetRecordByIdAndType(activeSetId, testType);
            }

            if (existing?.setId) {
                currentSetId = existing.setId;
                upsertLocalRecord(existing);
                updateEditorUrl(currentSetId, selectedDate);
                updatePackageLabel(selectedDate);
                await loadSectionDraft();
                await restoreAudioForCurrentSet(activePartId || 1);
                await refreshAudioLabelsForCurrentSet();
                updateUserView();
                updateOnboardingVisibility();
                return;
            }

            if (isDeveloperMode()) {
                // In developer mode, a new date can intentionally represent a new package.
                currentSetId = "";
                clearListeningEditorInputs();
                await saveSectionMeta();
                await refreshAudioLabelsForCurrentSet();
                updateUserView();
                updateOnboardingVisibility();
                return;
            }

        let runtimeApiGatewayUrlCache = null;

        async function resolveRuntimeApiGatewayUrl() {
            if (runtimeApiGatewayUrlCache !== null) return runtimeApiGatewayUrlCache;

            runtimeApiGatewayUrlCache = "";
            const inlineUrl = String(window.__TOEFL_API_GATEWAY_URL__ || "").trim().replace(/\/+$/, "");
            if (inlineUrl) {
                runtimeApiGatewayUrlCache = inlineUrl;
                return runtimeApiGatewayUrlCache;
            }

            if (typeof fetch !== "function" || !window.location || window.location.protocol === "file:") {
                return runtimeApiGatewayUrlCache;
            }

            try {
                const response = await fetch("/api/runtime-config", {
                    method: "GET",
                    cache: "no-store",
                    headers: { "Accept": "application/json" }
                });
                if (!response.ok) return runtimeApiGatewayUrlCache;

                const payload = await response.json().catch(() => ({}));
                const runtimeUrl = String(payload?.gatewayUrl || payload?.apiGatewayUrl || payload?.url || "").trim().replace(/\/+$/, "");
                if (runtimeUrl) {
                    runtimeApiGatewayUrlCache = runtimeUrl;
                }
            } catch (error) {
                console.warn("[ToeflSync] runtime gateway config lookup failed:", error);
            }

            return runtimeApiGatewayUrlCache;
        }

        function getApiGatewayBaseCandidates(runtimeApiGatewayUrl = "") {
            const baseOverride = String(localStorage.getItem("toefl_api_gateway_url") || "").trim();
            if (baseOverride) return [baseOverride.replace(/\/+$/, "")];

            const hostOverride = String(localStorage.getItem("toefl_api_gateway_host") || "").trim();
            const port = String(localStorage.getItem("toefl_api_gateway_port") || "8000").trim() || "8000";
            const protocol = String(localStorage.getItem("toefl_api_gateway_protocol") || "http").trim() || "http";
            const candidates = [];
            const pageHost = String(window.location?.hostname || "").toLowerCase();
            const isLocalPage = !pageHost || pageHost === "localhost" || pageHost === "127.0.0.1" || window.location?.protocol === "file:";

            if (hostOverride) candidates.push(`${protocol}://${hostOverride}:${port}`);
            if (isLocalPage) {
                candidates.push(`${protocol}://127.0.0.1:${port}`);
                candidates.push(`${protocol}://localhost:${port}`);
            }
            if (runtimeApiGatewayUrl) candidates.push(String(runtimeApiGatewayUrl).replace(/\/+$/, ""));
            
            if (!isLocalPage && window.location && window.location.origin && window.location.protocol !== "file:") {
                candidates.push(window.location.origin.replace(/\/+$/, ""));
            }
            
            return Array.from(new Set(candidates.filter(Boolean)));
        }

        function getCloudflareFolderStorageKey(setId) {
            return `toefl_section1_cloudflare_folder_url_${currentTestType || "mocktest"}_${String(setId || "default")}`;
        }

        function extractCloudflareSetId(url = "") {
            const raw = String(url || "").trim();
            if (!raw) return "";
            if (raw === "sets") return "";

            const extractFromPath = (path) => {
                const parts = String(path || "").split("/").filter(Boolean);
                const listeningIndex = parts.lastIndexOf("listening");
                if (listeningIndex >= 0) {
                    const tail = parts.slice(listeningIndex + 1).filter(Boolean);
                    if (!tail.length) return "";
                    if (tail[0] === "sets" && tail[1]) return String(tail[1]).trim();
                    return String(tail[tail.length - 1]).trim();
                }

                const lastPart = parts[parts.length - 1] || "";
                if (lastPart === "sets" && parts.length > 1) {
                    return String(parts[parts.length - 2] || "").trim();
                }
                if (lastPart === "sets") return "";
                return String(lastPart || "").trim();
            };

            try {
                return extractFromPath(new URL(raw).pathname);
            } catch {
                return extractFromPath(raw.replace(/^https?:\/\/[^/]+/i, ""));
            }
        }

        function buildCloudflareFolderUrl(setId = "") {
            const safeSetId = String(setId || "").trim();
            if (!safeSetId) return "";
            return toPublicR2Url(`${DEFAULT_R2_PUBLIC_BASE_URL}/audio/listening/sets/${safeSetId}/`);
        }

        function normalizeCloudAudioFolderUrl(url = "") {
            return String(url || "").trim().replace(/\/+$/, "");
        }

        function toPublicR2Url(url = "") {
            const raw = normalizeCloudAudioFolderUrl(url);
            if (!raw) return "";
            if (raw.startsWith(DEFAULT_R2_PUBLIC_BASE_URL)) return raw;
            if (!/^https?:\/\//i.test(raw)) return raw;

            try {
                const parsed = new URL(raw);
                const path = String(parsed.pathname || "").replace(/^\/+/, "");
                const bucketIndex = path.indexOf("/");
                if (bucketIndex < 0) return raw;
                const objectPath = path.slice(bucketIndex + 1);
                return `${DEFAULT_R2_PUBLIC_BASE_URL}/${objectPath}`.replace(/\/+$/, "");
            } catch {
                return raw;
            }
        }

        function setCloudflareFolderStatus(message, color = "#1e3a5f") {
            const statusElement = document.getElementById("cloud-audio-folder-status");
            if (!statusElement) return;
            statusElement.innerText = message;
            statusElement.style.color = color;
        }

        function setCloudflarePartStatus(partId, message, color = "#1e3a5f") {
            const row = document.getElementById(`cloud-audio-check-${partId}`);
            if (!row) return;
            const focusedPart = forcedPracticePartId === Number(partId) && isPracticeTestType()
                ? PARTS.find((part) => part.id === Number(partId))
                : null;
            const label = focusedPart ? focusedPart.name.split(":")[0] : `Part ${partId}`;
            row.innerText = `${label}: ${message}`;
            row.style.color = color;
        }

        function getCloudflareFolderUrlInput() {
            return document.getElementById("cloud-audio-folder-url");
        }

        function deriveCloudflareFolderUrlFromRecord(record) {
            const rawUrl = String(record?.url || record?.objectUrl || record?.storageUrl || "").trim();
            const objectKey = String(record?.objectKey || record?.storagePath || "").trim();
            const candidates = [rawUrl, objectKey];

            for (const candidate of candidates) {
                if (!candidate) continue;
                if (/^https?:\/\//i.test(candidate)) {
                    try {
                        const parsed = new URL(candidate);
                        const path = String(parsed.pathname || "").replace(/\/+$/, "");
                        const folderPath = path.replace(/\/[^/]+$/, "/");
                        return toPublicR2Url(`${DEFAULT_R2_PUBLIC_BASE_URL}${folderPath}`);
                    } catch {
                        continue;
                    }
                }

                if (candidate.includes("/")) {
                    const folderPath = candidate.replace(/\/[^/]+$/, "/");
                    if (folderPath !== candidate) {
                        return toPublicR2Url(`${DEFAULT_R2_PUBLIC_BASE_URL}/${folderPath.replace(/^\/+/, "")}`);
                    }
                }
            }

            return "";
        }

        async function checkAudioExistsViaGateway(objectKey) {
            const key = String(objectKey || "").trim();
            if (!key) return { exists: false, error: "Missing object key" };

            const runtimeApiGatewayUrl = await resolveRuntimeApiGatewayUrl();
            const apiBases = getApiGatewayBaseCandidates(runtimeApiGatewayUrl);
            const errors = [];
            for (const apiBase of apiBases) {
                try {
                    const response = await fetch(`${apiBase}/api/developer/audio-exists?objectKey=${encodeURIComponent(key)}`, {
                        method: "GET"
                    });
                    if (!response.ok) {
                        const detail = await response.text().catch(() => "");
                        errors.push(`${apiBase} -> ${response.status} ${detail}`.trim());
                        continue;
                    }
                    const payload = await response.json().catch(() => ({}));
                    return {
                        exists: Boolean(payload?.exists),
                        error: String(payload?.error || ""),
                        objectKey: String(payload?.objectKey || key)
                    };
                } catch (error) {
                    errors.push(`${apiBase} -> ${error?.message || String(error)}`);
                }
            }

            return { exists: false, error: errors.join(" | ") || "Gateway lookup failed", objectKey: key };
        }

        function getCloudflarePartSyncStatusKey(setId) {

        function getCachedPartSyncStatus(setId) {

        async function validateCloudAudioFolderPartsForCurrentSet(partIds = [1, 2, 3]) {
            const targetPartIds = Array.from(new Set((Array.isArray(partIds) ? partIds : [1, 2, 3]).map(Number).filter((partId) => AUDIO_PART_IDS.includes(partId))));
            if (!targetPartIds.length) return;
            const input = getCloudflareFolderUrlInput();
            const rawFolderUrl = input?.value || "";
            
            // Extract setId from folder URL FIRST (this is the source of truth)
            const urlSetId = extractCloudflareSetId(rawFolderUrl);
            if (urlSetId) {
                currentSetId = urlSetId;
            }

            const setId = currentSetId || urlSetId;
            if (!setId) {
                setCloudflareFolderStatus("No folder URL or setId available. Create a folder first.", "#b91c1c");
                return;
            }
            
            // Check cached sync status first - if all parts synced, skip re-validation
            const cachedStatus = getCachedPartSyncStatus(setId);
            if (cachedStatus && targetPartIds.every((partId) => cachedStatus[partId - 1] === true)) {
                console.log("[CloudflareSync] Requested parts already verified as synced for", setId, "- skipping re-validation");
                for (const partId of targetPartIds) {
                    setCloudflarePartStatus(partId, `✓ Synced (cached)`, "#0f766e");
                }
                setCloudflareFolderStatus(`Requested audio already synced for ${setId} (loaded from cache).`, "#0f766e");
                return;
            }
            
            // Now normalize and transform the folder URL
            const folderUrl = toPublicR2Url(rawFolderUrl || await getCloudflareAudioFolderUrlFromFirebase(setId) || "");

            if (!folderUrl) {
                setCloudflareFolderStatus("Save a Cloudflare folder URL first.", "#b91c1c");
                return;
            }

            if (!await saveCloudflareFolderUrlForCurrentSetValue(folderUrl)) {
                setCloudflareFolderStatus("Firebase folder save failed. Sign in with the developer account and retry.", "#b91c1c");
                return;
            }
            setCloudflareFolderStatus(`Checking Cloudflare sync for ${setId}...`, "#1d4ed8");

            // Try to get actual folder contents from gateway
            let folderContents = null;
            try {
                const runtimeApiGatewayUrl = await resolveRuntimeApiGatewayUrl();
                const apiBases = getApiGatewayBaseCandidates(runtimeApiGatewayUrl);
                for (const apiBase of apiBases) {
                    try {
                        const response = await fetch(`${apiBase}/api/developer/audio-folder-contents?setId=${encodeURIComponent(setId)}`);
                        if (response.ok) {
                            folderContents = await response.json();
                            break;
                        }
                        // Response not OK (e.g., 404), continue to next candidate
                    } catch (err) {
                        // Fetch failed (e.g., network error), continue to next candidate
                        continue;
                    }
                }
            } catch (err) {
                console.warn("Failed to fetch folder contents:", err);
            }

            // Expected part file names (in order: part 1, part 2, part 3)
            const partFileNames = ["part_1.mp3", "part_2.mp3", "part_3.mp3"];
            const discoveredUrls = {}; // Store URLs for later Firebase save

            for (const partId of targetPartIds) {
                setCloudflarePartStatus(partId, "Checking...", "#1d4ed8");
                const expectedFileName = partFileNames[partId - 1];

                // Check actual folder contents first (for manually uploaded files)
                if (folderContents && folderContents.files && folderContents.files.length > 0) {
                    const matchingFile = folderContents.files.find(f => f.name === expectedFileName);
                    if (matchingFile) {
                        discoveredUrls[partId] = matchingFile.url;
                        setCloudflarePartStatus(partId, `Synced in Cloudflare
${matchingFile.url}`, "#0f766e");
                        continue;
                    }
                }

                // Fallback: check Firebase records (for programmatically uploaded files)
                if (!window.toeflStorage || typeof window.toeflStorage.getAudioRecordFromCloudflare !== "function") {
                    setCloudflarePartStatus(partId, `No file found (${expectedFileName} not in folder)`, "#b91c1c");
                    continue;
                }

                const record = await window.toeflStorage.getAudioRecordFromCloudflare(setId, partId);
                if (!record) {
                    setCloudflarePartStatus(partId, `No file found (${expectedFileName} not in folder)`, "#b91c1c");
                    continue;
                }

                const objectKey = String(record?.objectKey || record?.storagePath || "").trim();
                const existsCheck = await checkAudioExistsViaGateway(objectKey);
                if (existsCheck.exists) {
                    const resolvedUrl = existsCheck.objectKey || objectKey;
                    discoveredUrls[partId] = resolvedUrl;
                    setCloudflarePartStatus(partId, `Synced in Cloudflare
${resolvedUrl}`, "#0f766e");
                } else {
                    setCloudflarePartStatus(partId, `Found record but playback check failed
${existsCheck.error || "Object not reachable"}`, "#b91c1c");
                }
            }

            setCloudflareFolderStatus(`Verification finished for ${setId}.`, "#0f766e");
            
            // Populate audioUrlsByPart with discovered Cloudflare URLs for Firebase save
            Object.entries(discoveredUrls).forEach(([partId, url]) => {
                audioUrlsByPart[partId] = url;
                console.log(`[CloudflareSync] Populated audioUrlsByPart for part ${partId}:`, url);
            });
            console.log("[CloudflareSync] Discovered URLs to save:", discoveredUrls);
            
            // After verification completes, save sync status to cache
            // Determine which parts are synced by checking current UI status display
            const syncStatus = getCachedPartSyncStatus(setId) || [false, false, false];
            for (const partId of targetPartIds) {
                const statusEl = document.getElementById(`cloud-audio-check-${partId}`);
                const isSynced = statusEl && statusEl.textContent.includes("Synced");
                syncStatus[partId - 1] = Boolean(isSynced);
            }
            saveCachedPartSyncStatus(setId, syncStatus);
            console.log("[CloudflareSync] Saved sync status for", setId, ":", syncStatus);
            console.log("[CloudflareSync] Calling saveSectionDraft with populated URLs:", discoveredUrls);
            
            // After verification completes, save complete listening data to RTDB
            // This ensures Cloudflare URLs and content are synced globally
            await saveSectionDraft();
        }

        function parseTimestampToSeconds(value) {
            const text = String(value || "").trim();
            if (!text) return 0;
            const parts = text.split(":").map((part) => Number(part));
            if (parts.some((part) => Number.isNaN(part))) return 0;
            if (parts.length === 3) return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
            if (parts.length === 2) return (parts[0] * 60) + parts[1];
            return parts[0] || 0;
        }

        function titleCaseSpeakerLabel(value) {
            const text = String(value || "").trim();
            if (!text) return "";
            return text.split(/\s+/).map((word) => {
                if (!word) return word;
                return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
            }).join(" ");
        }

        function parseTranscriptSpeakerLine(rawLine) {
            const line = String(rawLine || "").replace(/\*\*/g, "").trim();
            const speakerMatch = line.match(/^([A-Za-z][A-Za-z\s]*(?:\([^)]+\))?)\s*:\s*(.*)$/i);
            if (speakerMatch) {
                const rawSpeaker = String(speakerMatch[1] || "").trim();
                const upperSpeaker = rawSpeaker.toUpperCase();
                let normalized = upperSpeaker;
                let label = titleCaseSpeakerLabel(rawSpeaker);

                if (/NARR|MODERATOR/.test(upperSpeaker)) {
                    normalized = "NARR";
                    label = "Narrator"; // Automatically convert Moderator to Narrator label
                } else if (/WOM|LIBRARIAN|FEMALE|STUDENT\s*B/.test(upperSpeaker)) {
                    normalized = "WOMEN";
                } else if (/MAN|MALE|STUDENT\s*A|STUDENT/.test(upperSpeaker)) {
                    normalized = "MEN";
                }

                return {
                    speaker: normalized,
                    speakerLabel: label,
                    text: String(speakerMatch[2] || "").trim()
                };
            }
            return { speaker: "NARR", speakerLabel: "Narrator", text: line };
        }

        function deriveTranscriptTextFromSmartQuestions(rawText) {
            const lines = String(rawText || "").replace(/\r/g, "").split("\n");
            const output = [];
            let currentQuestion = 0;
            let optionSection = false;

            lines.forEach((rawLine) => {
                let line = String(rawLine || "").replace(/^MODERATOR\s*:/i, "Narrator:").trim();
                if (!line) return;
                const questionMatch = line.match(/^(?:question\s*)?(\d+)[\.:)\-]?\s*(.*)$/i);
                if (questionMatch) {
                    currentQuestion = Number(questionMatch[1] || 0);
                    optionSection = false;
                    output.push(`<Question ${currentQuestion}>`);
                    const remainingText = String(questionMatch[2] || "").replace(/^MODERATOR\s*:/i, "Narrator:").trim();
                    if (/^(?:man|woman|narrator|narr|speaker\s*[a-z]|professor|student|host|interviewer)(?:\s*\([^)]*\))?\s*:/i.test(String(questionMatch[2] || "").trim())) {
                        output.push(String(questionMatch[2]).trim());
                    }
                    return;
                }
                if (!currentQuestion) return;
                if (/^[\(\[]?A[\)\].:\-]\s+/i.test(line)) optionSection = true;
                if (optionSection) return;
                if (/^(?:man|woman|narrator|narr|speaker\s*[a-z]|professor|student(?:\s*[ab])?|host|interviewer)(?:\s*\([^)]*\))?\s*:/i.test(line)) output.push(line);
            });

            return output.length ? `${output.join("\n")}\n` : "";
        }

        function hasTimedTranscriptContent(value) {
            const text = String(value || "").trim();
            return /<Question\s+\d+\s+start=/i.test(text)
                || /^\s*(?:\[)?\d{1,2}:\d{2}(?::\d{2})?(?:[\.,]\d+)?(?:\])?\s*(?:-->|[-\u2013\u2014])/m.test(text);
        }

        function getTranscriptForSmartQuestions(partNumber) {
            const transcriptInput = document.getElementById(`input-transcript-${partNumber}`);
            if (!transcriptInput) return "";
            const questionInput = document.getElementById(`input-magic-questions-${partNumber}`);
            const derived = deriveTranscriptTextFromSmartQuestions((questionInput || {}).value || "");
            const existing = String((transcriptInput || {}).value || "").trim();

            return derived && !hasTimedTranscriptContent(existing) ? derived : (existing || derived);
        }

        function mapTranscriptByQuestion(rawText) {
            const map = {};
            const lines = String(rawText || "").split(/\r?\n/);
            let currentQuestion = 0;
            let pendingTimestamp = "";
            let pendingStart = 0;
            let pendingEnd = 0;

            function ensureBucket(key) {
                if (!map[key]) map[key] = [];
            }

            function pushSegment(targetQuestion, timestamp, start, end, speaker, text) {
                const cleanText = String(text || "").trim();
                if (!cleanText) return;

                const segment = {
                    timestamp: String(timestamp || ""),
                    start: Number(start || 0),
                    speaker: String(speaker || "NARR"),
                    text: cleanText,
                    end: Number(end || 0)
                };

                ensureBucket(0);
                map[0].push({ ...segment });

                if (targetQuestion > 0) {
                    ensureBucket(targetQuestion);
                    map[targetQuestion].push({ ...segment });
                }
            }

            lines.forEach((rawLine) => {
                const line = String(rawLine || "").trim();
                if (!line) return;

                const openTag = line.match(/<Question\s+(\d+)(?:\s+start=["']([^"']+)["']\s+end=["']([^"']+)["'])?>/i);
                if (openTag) {
                    currentQuestion = Number(openTag[1] || 0);
                    ensureBucket(currentQuestion);
                    if (openTag[2] && openTag[3]) {
                        pendingTimestamp = `${openTag[2]} - ${openTag[3]}`;
                        pendingStart = parseTimestampToSeconds(openTag[2]);
                        pendingEnd = parseTimestampToSeconds(openTag[3]);
                    }
                    return;
                }

                const closeTag = line.match(/<\/Question\s+(\d+)>/i);
                if (closeTag) {
                    currentQuestion = 0;
                    pendingTimestamp = "";
                    pendingStart = 0;
                    pendingEnd = 0;
                    return;
                }

                const legacyQuestion = line.match(/^\s*Question\s*(\d+)\b/i);
                if (legacyQuestion) {
                    currentQuestion = Number(legacyQuestion[1] || 0);
                    ensureBucket(currentQuestion);
                    return;
                }

                const rangeMatch = line.match(/^(\d{1,2}:\d{2}(?::\d{2})?(?:\.\d+)?)\s*-\s*(\d{1,2}:\d{2}(?::\d{2})?(?:\.\d+)?)/);
                if (rangeMatch) {
                    pendingTimestamp = String(rangeMatch[1] || "");
                    pendingStart = parseTimestampToSeconds(pendingTimestamp);
                    pendingEnd = parseTimestampToSeconds(String(rangeMatch[2] || ""));
                    return;
                }

                const timedSpeakerMatch = line.match(/^(?:\[)?(\d{1,2}:\d{2}(?::\d{2})?(?:[\.,]\d+)?)(?:\])?\s*(?:-->|[-\u2013\u2014])?\s*(.+)$/);
                if (timedSpeakerMatch && /^(?:man|woman|narrator|moderator|narr|speaker\s*[a-z]|professor|student|host|interviewer)\s*:/i.test(timedSpeakerMatch[2])) {
                    const timedTimestamp = String(timedSpeakerMatch[1] || "").replace(",", ".");
                    const timedStart = parseTimestampToSeconds(timedTimestamp);
                    const timedLine = parseTranscriptSpeakerLine(timedSpeakerMatch[2]);
                    pushSegment(currentQuestion, timedTimestamp, timedStart, 0, timedLine.speaker, timedLine.text);
                    return;
                }

                const segmentMatch = line.match(/(?:^\s*[-*]\s*)?\*\*(\d{1,2}:\d{2}(?::\d{2})?)\*\*\s*[�-]\s*(.+)$/);
                let matched = segmentMatch;
                if (!matched) {
                    matched = line.match(/(?:^\s*[-*]\s*)?\[(\d{1,2}:\d{2}(?::\d{2})?)\]\s*(.+)$/);
                }
                if (!matched) {
                    matched = line.match(/^(\d{1,2}:\d{2}(?::\d{2})?)\s*[�\-]\s*(.+)$/);
                }

                if (matched) {
                    const timestamp = String(matched[1] || "");
                    const parsedLine = parseTranscriptSpeakerLine(matched[2]);
                    pushSegment(currentQuestion, timestamp, parseTimestampToSeconds(timestamp), 0, parsedLine.speaker, parsedLine.text);
                    pendingTimestamp = "";
                    pendingStart = 0;
                    pendingEnd = 0;
                    return;
                }

                if (pendingTimestamp) {
                    const parsedLine = parseTranscriptSpeakerLine(line);
                    pushSegment(currentQuestion, pendingTimestamp, pendingStart, pendingEnd, parsedLine.speaker, parsedLine.text);
                    pendingTimestamp = "";
                    pendingStart = 0;
                    pendingEnd = 0;
                    return;
                }

                if (currentQuestion > 0 && /^(?:man|woman|narrator|moderator|narr|speaker\s*[a-z]|professor|student|host|interviewer)\s*:/i.test(line)) {
                    const parsedLine = parseTranscriptSpeakerLine(line);
                    const syntheticStart = (map[currentQuestion] || []).length * 8;
                    pushSegment(currentQuestion, "", syntheticStart, syntheticStart + 8, parsedLine.speaker, parsedLine.text);
                }
            });

            Object.keys(map).forEach((questionKey) => {
                const segments = map[questionKey].sort((left, right) => left.start - right.start);
                for (let index = 0; index < segments.length; index += 1) {
                    const current = segments[index];
                    const next = segments[index + 1];
                    if (!(current.end > current.start)) {
                        current.end = next ? Math.max(current.start + 1, next.start) : (current.start + 8);
                    }
                }
            });

            return map;
        }

        function buildPreviewSectionResult() {
            const transcriptMapsByPart = {};
            const transcriptTextsByPart = {};
            const savedDraft = safeParse(localStorage.getItem(DRAFT_KEY), {}) || {};

            PARTS.forEach((part) => {
                const transcriptText = getTranscriptForSmartQuestions(part.id);
                transcriptTextsByPart[part.id] = transcriptText;
                transcriptMapsByPart[part.id] = mapTranscriptByQuestion(transcriptText);
            });

            const previewQuestions = questionOrder.map((uid) => {
                const parts = String(uid || "").split("_");
                const partId = Number(parts[0] || 0);
                const qNum = Number(parts[1] || 0);
                const question = globalQuestions[uid] || {};
                const correct = String(globalAnswerKey[uid] || "").trim().toLowerCase();
                const savedSegments = Array.isArray(savedDraft.parts?.[partId]?.transcriptSegments)
                    ? savedDraft.parts[partId].transcriptSegments.filter((segment) => Number(segment?.end) > Number(segment?.start))
                    : [];
                const questionAudio = resolveExplanationAudioRecord(savedDraft, partId, qNum);
                const groupSegments = resolveGroupTranscriptSegments(savedDraft, partId, qNum);
                const transcriptSegments = (savedSegments.length
                    ? savedSegments.filter((segment) => Number(segment?.questionNumber || segment?.question_number || 0) === qNum)
                    : (((transcriptMapsByPart[partId] || {})[qNum]) || [])
                ).map((segment) => ({ ...segment }));
                const resolvedSegments = transcriptSegments.length ? transcriptSegments : groupSegments;
                const partMeta = PARTS.find((item) => Number(item.id) === partId) || {};
                return {
                    uid,
                    number: qNum,
                    partId,
                    partName: String(partMeta.name || ""),
                    questionText: String(question.questionText || `Question ${qNum}`),
                    options: question.options || {},
                    correctAnswer: correct,
                    userAnswer: correct,
                    isCorrect: Boolean(correct),
                    explanation: String(globalExplanations[uid] || ""),
                    explanationSchema: savedDraft.parts?.[partId]?.explanationSchemas?.[qNum]
                        ? JSON.stringify(savedDraft.parts[partId].explanationSchemas[qNum])
                        : "",
                    questionAudio: questionAudio,
                    questionAudioUrl: String(questionAudio?.url || ""),
                    questionAudioObjectKey: String(questionAudio?.objectKey || ""),
                    transcriptSegments: resolvedSegments
                };
            }).filter((item) => Number.isFinite(item.number) && item.number > 0)
            .sort((left, right) => left.number - right.number);

            const totalQuestions = previewQuestions.length || Object.keys(globalAnswerKey).length || 0;
            const rawScore = previewQuestions.reduce((sum, item) => sum + (item.isCorrect ? 1 : 0), 0);
            const scaledScore = totalQuestions > 0
                ? Math.round(31 + ((rawScore / totalQuestions) * (68 - 31)))
                : 31;

            return {
                sectionTitle: "Section 1: Listening Comprehension",
                sectionKey: "listening",
                setId: currentSetId || "",
                setDate: (document.getElementById("set-date") || {}).value || "",
                transcriptsByPart: transcriptTextsByPart,
                totalQuestions,
                rawScore,
                scaledScore,
                submittedAt: new Date().toISOString().slice(0, 10),
                questions: previewQuestions
            };
        }

        function buildAiEndpointCandidates(path) {
            const params = new URLSearchParams(window.location.search || "");
            const port = String(params.get("aiPort") || localStorage.getItem("ai_review_port") || "8787");
            const endpoints = [];

            function pushEndpoint(value) {
                const endpoint = String(value || "").trim();
                if (!endpoint || endpoints.includes(endpoint)) return;
                endpoints.push(endpoint);
            }

            function pushLocalHost(value) {
                const host = String(value || "").trim();
                if (!host) return;
                pushEndpoint(`http://${host}:${port}${path}`);
            }

            const gatewayBase = String(
                localStorage.getItem("toefl_api_gateway_url") ||
                window.__TOEFL_API_GATEWAY_URL__ ||
                "https://ielts-api-gateway-753959270698.asia-southeast1.run.app"
            ).replace(/\/+$/, "");
            const isSecurePage = window.location.protocol === "https:";

            // Priority: Cloud gateway / proxy first for high reliability, followed by local host options
            pushEndpoint(`${gatewayBase}${path}`);
            pushEndpoint(`https://quickcheck-25590.web.app${path}`);

            if (!isSecurePage) {
                pushLocalHost(params.get("aiHost"));
                pushLocalHost(localStorage.getItem("ai_review_host"));
                pushLocalHost("127.0.0.1");
                pushLocalHost("localhost");
            }

            return endpoints;
        }

        async function precomputeExplanationSchemasForResult(result) {
            if (!result || !Array.isArray(result.questions) || !result.questions.length) return result;

            let fullSetDraft = null;
            if (window.toeflStorage && currentSetId && typeof toeflStorage.getDraftBySetIdAndType === "function") {
                try {
                    fullSetDraft = await toeflStorage.getDraftBySetIdAndType(currentSetId, currentTestType);
                } catch {
                    fullSetDraft = null;
                }
            }
            if (!fullSetDraft || !fullSetDraft.parts) {
                fullSetDraft = safeParse(localStorage.getItem(DRAFT_KEY), {}) || {};
            }
            if (!fullSetDraft || !fullSetDraft.parts) {
                try {
                    const firebaseData = await getCompleteListeningDataFromFirebase(currentSetId);
                    if (firebaseData && firebaseData.parts) {
                        fullSetDraft = { parts: {} };
                        const rawParts = Array.isArray(firebaseData.parts) ? firebaseData.parts : Object.values(firebaseData.parts);
                        rawParts.forEach((pData, idx) => {
                            if (!pData) return;
                            const pid = String(pData.partId || pData.id || idx || 1);
                            fullSetDraft.parts[pid] = pData;
                        });
                    }
                } catch (_) {}
            }
            if (!fullSetDraft || !fullSetDraft.parts) return result;

            for (let i = 0; i < result.questions.length; i += 1) {
                const rq = result.questions[i] || {};
                const qNum = Number(rq.number || 0);
                if (!qNum) continue;
                const partId = Number(rq.partId || (qNum <= 30 ? 1 : (qNum <= 38 ? 2 : 3)));
                const savedSchema = fullSetDraft.parts?.[partId]?.explanationSchemas?.[qNum];

                if (savedSchema && savedSchema.explanation_payload) {
                    rq.explanationSchema = typeof savedSchema === "string" ? savedSchema : JSON.stringify(savedSchema);
                    const englishInput = document.getElementById(`input-explanation-en-${qNum}`);
                    if (englishInput && !String(englishInput.value || "").trim()) {
                        englishInput.value = buildWhySectionTextFromSchema(savedSchema);
                    }
                }
            }

            return result;
        }

        async function updateUserView(shouldSaveMeta = false, options = {}) {
            const { preferEditedPart = true } = options || {};
            if (shouldHydrateEditorFromFallbackDraft()) {
                hydrateEditorInputsFromLocalDraftIfEmpty();
            }
            examSessionStarted = false;
            clearInterval(timerInterval);
            const timerElement = document.getElementById("time");
            if (timerElement) {
                const isDark = document.getElementById("user-view") &&
                    document.getElementById("user-view").classList.contains("is-dark");
                timerElement.innerText = "35:00";
                timerElement.style.color = isDark ? "#E0F2FE" : "#005faa";
                timerElement.style.animation = "none";
            }

            if (shouldSaveMeta) {
                await saveSectionMeta();
                await saveSectionDraft().catch(() => {});
            }

            const scoreBoard = document.getElementById("global-score-board");
            if (scoreBoard) scoreBoard.style.display = "none";

            globalAnswerKey = {};
            globalExplanations = {};
            globalQuestions = {};
            questionOrder = [];

            PARTS.forEach((part) => {
                const p = part.id;
                const answerKeyElement = document.getElementById(`input-answer-key-${p}`);
                const explanationElement = document.getElementById(`input-explanation-${p}`);
                const questionsElement = document.getElementById(`input-magic-questions-${p}`);
                const displayElement = document.getElementById(`display-questions-${p}`);
                if (!answerKeyElement || !explanationElement || !questionsElement || !displayElement) return;

                answerKeyElement.value.split("\n").forEach((line) => {
                    const match = line.match(/^\s*(\d+)\s*[\.\):\-]?\s*[\.\):\-]?\s*([A-Za-z])\b/);
                    if (match) globalAnswerKey[`${p}_${match[1]}`] = match[2].trim().toLowerCase();
                });

                let currentExpNum = null;
                explanationElement.value.split("\n").forEach((line) => {
                    const match = line.match(/^(\d+)[\.\):\-]?\s+(.*)/);
                    if (match) {
                        currentExpNum = `${p}_${match[1]}`;
                        globalExplanations[currentExpNum] = match[2].trim();
                    } else if (currentExpNum && line.trim()) {
                        globalExplanations[currentExpNum] += "<br>" + line.trim();
                    }
                });

                const lines = questionsElement.value.split("\n").filter((line) => line.trim() !== "");
                const blocks = [];
                let currentBlock = null;

                for (let index = 0; index < lines.length; index += 1) {
                    const rawLine = lines[index].trim();
                    let questionMatch = rawLine.match(/^question\s*(\d+)\s*[:.)-]?\s*(.*)$/i);
                    if (!questionMatch) {
                        questionMatch = rawLine.match(/^(\d+)(?:[\.:\)\-]\s*(.*)|\s+(.*)|$)/);
                    }
                    if (questionMatch && (!currentBlock || currentBlock.lines.length >= 4)) {
                        if (currentBlock) blocks.push(currentBlock);
                        currentBlock = { num: questionMatch[1], text: questionMatch[2] || questionMatch[3] || "", lines: [] };
                    } else if (currentBlock) {
                        currentBlock.lines.push(rawLine);
                    }
                }
                if (currentBlock) blocks.push(currentBlock);

                // If question text is unavailable, derive question numbers from answer key as fallback.
                if (!blocks.length) {
                    const answerLines = String(answerKeyElement.value || "").split("\n");
                    answerLines.forEach((line) => {
                        const keyMatch = String(line || "").trim().match(/^(\d+)[\.\):\-]?\s+([a-d])/i);
                        if (!keyMatch) return;
                        blocks.push({
                            num: keyMatch[1],
                            text: `Question ${keyMatch[1]}`,
                            lines: ["(A) Option A", "(B) Option B", "(C) Option C", "(D) Option D"]
                        });
                    });
                }

                const letters = ["A", "B", "C", "D"];
                let cleanHtml = "";

                blocks.forEach((block) => {
                    const questionNumber = block.num;
                    const uid = `${p}_${questionNumber}`;
                    const allBodyLines = Array.isArray(block.lines) ? block.lines : [];
                    let optionStart = -1;
                    const optionLinePattern = /^[\(\[]?\s*[A-D][\)\].:-]?\s+.+/i;
                    for (let i = 0; i < allBodyLines.length; i += 1) {
                        const chunk = allBodyLines.slice(i, i + 4);
                        if (chunk.length < 4) break;
                        const labels = ["A", "B", "C", "D"];
                        const isOptionChunk = chunk.every((line, idx) => {
                            const text = String(line || "").trim();
                            if (!optionLinePattern.test(text)) return false;
                            return new RegExp(`^[\\(\\[]?\\s*${labels[idx]}[\\)\\].:-]?\\s+`, "i").test(text);
                        });
                        if (isOptionChunk) {
                            optionStart = i;
                            break;
                        }
                    }

                    let options = [];
                    let promptLines = allBodyLines;
                    if (optionStart >= 0) {
                        options = allBodyLines.slice(optionStart, optionStart + 4);
                        promptLines = allBodyLines.slice(0, optionStart);
                    }

                    if (!options.length) {
                        options = [
                            "(A) Option A",
                            "(B) Option B",
                            "(C) Option C",
                            "(D) Option D"
                        ];
                    }

                    function normalizePromptLine(raw) {
                        const text = String(raw || "").trim();
                        if (!text) return "";
                        const speakerMatch = text.match(/^(?:Man|Woman|Narrator|Moderator|Narr)\s*:\s*(.+)$/i);
                        return String((speakerMatch ? speakerMatch[1] : text) || "").trim();
                    }

                    function pickQuestionPrompt(blockText, lines) {
                        const blockLine = normalizePromptLine(blockText);
                        const normalizedLines = (lines || []).map(normalizePromptLine).filter(Boolean);

                        // 1) Prefer Narrator/Narr question line.
                        for (let i = (lines || []).length - 1; i >= 0; i -= 1) {
                            const raw = String(lines[i] || "").trim();
                            const narr = raw.match(/^(?:Narrator|Narr|Moderator)\s*:\s*(.+)$/i);
                            if (narr && /\?$/.test(String(narr[1] || "").trim())) {
                                return String(narr[1] || "").trim();
                            }
                        }

                        // 2) Otherwise use last line ending with a question mark.
                        for (let i = normalizedLines.length - 1; i >= 0; i -= 1) {
                            if (/\?$/.test(normalizedLines[i])) return normalizedLines[i];
                        }

                        // 3) If heading text itself is a question, use it.
                        if (/\?$/.test(blockLine)) return blockLine;

                        // 4) Fallback to a neutral label.
                        return `Question ${questionNumber}`;
                    }

                    const promptText = pickQuestionPrompt(block.text, promptLines);
                    const questionText = escapeHtml(promptText);
                    const showQuestionTitle = false;
                    questionOrder.push(uid);

                    cleanHtml += `<article class="question-item" id="q-container-${uid}" data-uid="${uid}">`;
                    cleanHtml += `<div class="question-number-badge">${questionNumber}</div>`;
                    cleanHtml += `<div class="question-content">`;
                    if (showQuestionTitle && questionText !== "") cleanHtml += `<h4 class="question-title">${questionText}</h4>`;
                    cleanHtml += `<div class="radio-group">`;

                    options.forEach((optLine, index) => {
                        const letter = letters[index];
                        const cleanOptionText = escapeHtml(optLine.replace(/^[\(]?([A-D])[\.\)]?\s*/i, ""));
                        cleanHtml += `<label><input type="radio" name="q_${uid}" value="${letter.toLowerCase()}" onchange="refreshExamState()"><span class="option-letter">(${letter})</span><span>${cleanOptionText}</span></label>`;
                    });

                    cleanHtml += `</div>`;
                    cleanHtml += `</div></article>`;

                    const qOpts = {};
                    options.forEach((optLine, index) => {
                        qOpts[letters[index]] = optLine.replace(/^[\(]?([A-D])[\.\)]?\s*/i, "");
                    });
                    globalQuestions[uid] = { questionText: promptText || `Question ${questionNumber}`, options: qOpts };
                });

                displayElement.innerHTML = cleanHtml;
            });

            if (!questionOrder.length) {
                const firstPartHost = document.getElementById("display-questions-1");
                if (firstPartHost) {
                    firstPartHost.innerHTML = `
                        <article class="question-item" style="border:1px dashed #cbd5e1; background:#f8fafc;">
                            <div class="question-content">
                                <h4 class="question-title">No question set loaded yet</h4>
                                <div style="font-size:14px; color:#475569; line-height:1.6;">
                                    Open Developer mode, choose the correct package date, then ensure Question Input and Answer Key are saved for this set.
                                </div>
                            </div>
                        </article>`;
                }
            }

            const preferredPartId = (shouldSaveMeta && preferEditedPart) ? getPreferredPartFromActiveDevTab() : null;
            if (preferredPartId) {
                activePartId = preferredPartId;
            } else if (!PARTS.find((part) => part.id === activePartId)) {
                activePartId = 1;
            }
            setActivePart(activePartId, { resetScroll: false });
            refreshExamState();
            updateOnboardingVisibility();

            if (shouldSaveMeta) {
                try {
                    await persistPreviewSectionResultWithSchemas();
                    localStorage.setItem(EDITOR_APPLY_SYNC_KEY, JSON.stringify({
                        at: new Date().toISOString(),
