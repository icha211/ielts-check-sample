            const activeTestType = urlParams.get("testType")
                || testType
                || (typeof currentTestType !== "undefined" && currentTestType)
                || "practicetest";
            
            // Sync the global variable so subsequent functions stay in sync
            currentTestType = activeTestType;

            const normalizedSetDate = normalizeDateKey(setDate || "");
            const currentSetDate = parseSetDateFromSetId(currentSetId);

            // 2. Check if currentSetId in memory matches the active testType
            if (currentSetId && currentSetId.startsWith(activeTestType)) {
                if (!normalizedSetDate || currentSetDate === normalizedSetDate || activeTestType === "practicetest") {
                    return currentSetId;
                }
                currentSetId = "";
            }

            // 3. Check if a set ALREADY EXISTS for this date/testType/module
            const existingSet = await resolveSetRecordByDate(normalizedSetDate || setDate, activeTestType);
            if (existingSet && existingSet.setId) {
                console.log(`[SetIdempotency] Reusing existing set for date ${normalizedSetDate}:`, existingSet.setId);
                currentSetId = existingSet.setId;
                return currentSetId;
            }

            // 4. Create new ID matching the active test type
            const stamp = Date.now();
            const rand = Math.random().toString(36).slice(2, 8);
            const moduleId = typeof MODULE_ID !== "undefined" ? MODULE_ID : "listening";

            if (activeTestType === "practicetest") {
                // Practice listening IDs are date-independent, so the focused part disambiguates them.
                const focusSlug = getPracticeFocusSlug();
                currentSetId = focusSlug
                    ? `${activeTestType}_${moduleId}_${focusSlug}_${stamp}_${rand}`
                    : `${activeTestType}_${moduleId}_${stamp}_${rand}`;
            } else {
                const datePart = normalizedSetDate || normalizeDateKey(setDate) || new Date().toISOString().split("T")[0];
                currentSetId = `${activeTestType}_${moduleId}_${datePart}_${stamp}_${rand}`;
            }

            console.log(`[SetIdempotency] Created new set for date ${normalizedSetDate}:`, currentSetId);
            return currentSetId;
        }

        function parseSetDateFromSetId(setId) {
            const raw = String(setId || "").trim();
            const parts = raw.split("_");
            if (parts.length < 3) return "";
            const maybeDate = String(parts[2] || "").trim();
            if (!/^\d{4}-\d{2}-\d{2}$/.test(maybeDate)) return "";
            return normalizeDateKey(maybeDate);
        }


        function normalizeDateKey(value) {
            const raw = String(value || "").trim();
            if (!raw) return "";
            if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
            if (/^\d{4}-\d{2}-\d{2}T/.test(raw)) return raw.slice(0, 10);

            // Support Indonesian date labels like "1 Juli" or "1 Juli 2026".
            const indoMatch = raw.match(/^(\d{1,2})\s+([A-Za-z\.]+)(?:\s+(\d{4}))?$/);
            if (indoMatch) {
                const day = Number(indoMatch[1]);
                const monthRaw = String(indoMatch[2] || "").toLowerCase().replace(/\./g, "");
                const monthMap = {
                    januari: 1,
                    februari: 2,
                    maret: 3,
                    april: 4,
                    mei: 5,
                    juni: 6,
                    juli: 7,
                    agustus: 8,
                    september: 9,
                    oktober: 10,
                    november: 11,
                    desember: 12,
                    jan: 1,
                    feb: 2,
                    mar: 3,
                    apr: 4,
                    jun: 6,
                    jul: 7,
                    agu: 8,
                    sep: 9,
                    okt: 10,
                    nov: 11,
                    des: 12
                };
                const month = monthMap[monthRaw];
                if (day >= 1 && day <= 31 && month) {
                    const year = Number(indoMatch[3]) || new Date().getFullYear();
                    return `${year.toString().padStart(4, "0")}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
                }
            }

            const parsed = new Date(raw);
            if (Number.isNaN(parsed.getTime())) return raw;
            return parsed.toISOString().slice(0, 10);
        }

        // Practice sets are date-independent, so the focused part is what makes them distinct.
        function getPracticeFocusSlug() {
            const params = new URLSearchParams(window.location.search);
            const fromUrl = String(params.get("focus") || "").toLowerCase().replace(/[^a-z0-9]/g, "");
            if (fromUrl) return fromUrl;
            return forcedPracticePartId ? `part${forcedPracticePartId}` : "";
        }

        // Dashboard package links pass ?package=N so each package resolves to its own set.
        function getRequestedPracticePackage() {
            const value = parseInt(new URLSearchParams(window.location.search).get("package"), 10);
            return Number.isFinite(value) && value > 0 ? value : 0;
        }

        function recordMatchesRequestedPackage(record) {
            const requested = getRequestedPracticePackage();
            if (!requested || currentTestType !== "practicetest") return true;
            const own = parseInt(record?.packageNumber, 10);
            return (Number.isFinite(own) && own > 0 ? own : 1) === requested;
        }

        function setRecordMatchesPracticeFocus(record, focusSlug) {
            if (!recordMatchesRequestedPackage(record)) return false;
            if (!focusSlug) return true;
            const recordFocus = String(record?.focus || "").toLowerCase().replace(/[^a-z0-9]/g, "");
            // Sets saved before focus was persisted have no focus; fall back to the id segment.
            if (!recordFocus) return String(record?.setId || "").toLowerCase().includes(`_${focusSlug}_`);
            return recordFocus === focusSlug;
        }

        async function resolveSetRecordByDate(setDate, filterTestType = null) {
            const normalizedTarget = normalizeDateKey(setDate);
            const testTypeToCheck = filterTestType || currentTestType;
            const focusSlug = testTypeToCheck === "practicetest" ? getPracticeFocusSlug() : "";
            try {
                if (window.toeflStorage && typeof toeflStorage.getSetRecordsByTestType === "function") {
                    const records = await toeflStorage.getSetRecordsByTestType(testTypeToCheck);
                    const match = (records || [])
                        .filter((item) => item && item.module === MODULE_ID && normalizeDateKey(item.setDate) === normalizedTarget)
                        .filter((item) => setRecordMatchesPracticeFocus(item, focusSlug))
                        .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime())[0];
                    if (match) return match;
                }
            } catch (error) {
                console.warn("[ToeflSync] date-based lookup failed:", error);
            }

            const local = getStoredSetMap();
            return Object.values(local)
                .filter((item) => item && item.module === MODULE_ID && normalizeDateKey(item.setDate) === normalizedTarget && item.testType === testTypeToCheck)
                .filter((item) => setRecordMatchesPracticeFocus(item, focusSlug))
                .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime())[0] || null;
        }

        async function resolveSetRecordById(setId) {
            if (!setId) return null;

            if (window.toeflStorage && typeof toeflStorage.getSetRecordById === "function") {
                try {
                    const remote = await toeflStorage.getSetRecordByIdAndType(setId, currentTestType);
                    if (remote && remote.setId) return remote;
                } catch (error) {
                    console.warn("[ToeflSync] setId lookup failed:", error);
                }
            }

            const local = getStoredSetMap();
            return local[setId] || null;
        }

        async function resolveLatestSetRecord() {
            const focusSlug = currentTestType === "practicetest" ? getPracticeFocusSlug() : "";
            try {
                if (window.toeflStorage && typeof toeflStorage.getSetRecordsByTestType === "function") {
                    const records = await toeflStorage.getSetRecordsByTestType(currentTestType);
                    const latest = (records || [])
                        .filter((item) => item && item.module === MODULE_ID)
                        .filter((item) => setRecordMatchesPracticeFocus(item, focusSlug))
                        .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime())[0];
                    if (latest) return latest;
                }
            } catch (error) {
                console.warn("[ToeflSync] latest-set lookup failed:", error);
            }

            const local = getStoredSetMap();
            return Object.values(local)
                .filter((item) => item && item.module === MODULE_ID)
                .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime())[0] || null;
        }

        function hasListeningDraftContent(draft) {
            if (!draft || typeof draft !== "object" || !draft.parts) return false;
            return PARTS.some((part) => {
                const row = draft.parts[part.id] || {};
                return Boolean(String(row.questions || "").trim() || String(row.answerKey || "").trim() || String(row.explanation || "").trim());
            });
        }

        function resolveLatestLocalDraftV2ForModule(moduleId = MODULE_ID) {
            const draftsMap = safeParse(localStorage.getItem("toefl_developer_drafts_v2"), {});
            if (!draftsMap || typeof draftsMap !== "object") return null;

            const candidates = Object.entries(draftsMap)
                .map(([setId, draft]) => ({ setId, draft }))
                .filter((entry) => entry && entry.setId && entry.draft && typeof entry.draft === "object")
                .filter((entry) => {
                    const draftModule = String(entry.draft.module || "").trim();
                    const byModuleField = draftModule ? draftModule === moduleId : true;
                    const bySetPrefix = String(entry.setId || "").startsWith(`${moduleId}_`);
                    return (byModuleField || bySetPrefix) && hasListeningDraftContent(entry.draft);
                })
                .sort((left, right) => {
                    const leftUpdated = new Date(left.draft?._updatedAt || 0).getTime();
                    const rightUpdated = new Date(right.draft?._updatedAt || 0).getTime();
                    if (rightUpdated !== leftUpdated) return rightUpdated - leftUpdated;
                    const leftStamp = Number(String(left.setId).split("_")[2] || 0);
                    const rightStamp = Number(String(right.setId).split("_")[2] || 0);
                    return rightStamp - leftStamp;
                });

            return candidates[0] || null;
        }

        function applyDraftToEditorInputs(draft) {
            if (!draft || typeof draft !== "object" || !draft.parts) return;

            const bulkExplanationIdInput = document.getElementById("input-bulk-explanation-id-all");
            const bulkExplanationEnInput = document.getElementById("input-bulk-explanation-en-all");
            if (bulkExplanationIdInput && typeof draft.bulkExplanationId === "string" && (draft.bulkExplanationId.trim() || !String(bulkExplanationIdInput.value || "").trim())) {
                bulkExplanationIdInput.value = draft.bulkExplanationId;
            }
            if (bulkExplanationEnInput && typeof draft.bulkExplanationEn === "string" && (draft.bulkExplanationEn.trim() || !String(bulkExplanationEnInput.value || "").trim())) {
                bulkExplanationEnInput.value = draft.bulkExplanationEn;
            }

            PARTS.forEach((part) => {
                const p = part.id;
                const row = draft.parts[p] || {};
                const questionsElement = document.getElementById(`input-magic-questions-${p}`);
                const answerElement = document.getElementById(`input-answer-key-${p}`);
                const explanationElement = document.getElementById(`input-explanation-${p}`);
                const transcriptElement = document.getElementById(`input-transcript-${p}`);

                // Never wipe existing editor content with empty remote/local fields.
                const questionValue = typeof row.questions === "string" ? row.questions : "";
                const answerValue = typeof row.answerKey === "string" ? row.answerKey : "";
                const explanationValue = typeof row.explanation === "string" ? row.explanation : "";
                const transcriptValue = typeof row.transcript === "string" ? row.transcript : "";
                const audioCloudflareValue = typeof row.audio_cloudflare === "string" ? row.audio_cloudflare.trim() : "";
                const audioFirebaseValue = typeof row.audio_firebase === "string" ? row.audio_firebase.trim() : "";

                if (questionsElement && (questionValue.trim() || !String(questionsElement.value || "").trim())) {
                    questionsElement.value = questionValue;
                }
                if (answerElement && (answerValue.trim() || !String(answerElement.value || "").trim())) {
                    answerElement.value = answerValue;
                }
                if (explanationElement && (explanationValue.trim() || !String(explanationElement.value || "").trim())) {
                    explanationElement.value = explanationValue;
                }
                if (transcriptElement && (transcriptValue.trim() || !String(transcriptElement.value || "").trim())) {
                    transcriptElement.value = transcriptValue;
                }
                if (audioCloudflareValue) {
                    audioUrlsByPart[p] = audioCloudflareValue;
                }
                if (audioFirebaseValue) {
                    audioFirebaseByPart[p] = audioFirebaseValue;
                }
                if (p === 1 && row.questionAudio && typeof row.questionAudio === "object") {
                    Object.entries(row.questionAudio).forEach(([questionNumber, audioRecord]) => {
                        const statusElement = document.getElementById(`audio-file-name-1-q-${questionNumber}`);
                        if (!statusElement) return;
                        statusElement.textContent = `Uploaded Q${questionNumber}: ${audioRecord?.fileName || "saved question audio"}`;
                        statusElement.style.color = "#16a34a";
                    });
                }
                if (row.groupAudio && typeof row.groupAudio === "object") {
                    Object.entries(row.groupAudio).forEach(([groupKey, audioRecord]) => {
                        setGroupAudioStatus(p, groupKey, `Uploaded ${groupKey}: ${audioRecord?.fileName || "saved group audio"}`, "#16a34a");
                    });
                }
                if (row.groupTranscript && typeof row.groupTranscript === "object") {
                    getAudioGroupsForPart(p, isPracticeTestType()).forEach((group) => {
                        const groupKey = group.key;
                        const transcriptText = row.groupTranscript[groupKey];
                        const groupTextarea = document.getElementById(`input-group-transcript-${p}-${groupKey}`);
                        const value = String(transcriptText || "");
                        if (groupTextarea && (value.trim() || !String(groupTextarea.value || "").trim())) {
                            groupTextarea.value = value;
                        }
                        if (value.trim()) {
                            setGroupTranscriptStatus(p, groupKey, `Saved transcript for ${groupKey} (${parseGroupTranscriptSegments(value).length} line(s)).`, "#16a34a");
                        }
                    });
                }
            });
            scopePracticeBulkExplanationInputs(true);
        }

        function getBulkExplanationPartRange(text, partId) {
            const source = String(text || "").replace(/\r/g, "");
            const partRegex = /^\s*#{0,6}\s*(?:\*{0,2}\s*)?part\s+(\d+)\s*(?:\*{0,2})\s*$/gim;
            const matches = Array.from(source.matchAll(partRegex));
            const matchIndex = matches.findIndex((match) => Number(match[1]) === Number(partId));
            if (matchIndex < 0) return null;
            return {
                start: matches[matchIndex].index,
                end: matchIndex + 1 < matches.length ? matches[matchIndex + 1].index : source.length
            };
        }

        function getBulkExplanationPart(text, partId) {
            const source = String(text || "").replace(/\r/g, "");
            const range = getBulkExplanationPartRange(source, partId);
            return range ? source.slice(range.start, range.end).trim() : "";
        }

        function mergeFocusedBulkExplanationPart(existingText, focusedText, partId) {
            const existing = String(existingText || "").replace(/\r/g, "");
            const edited = String(focusedText || "").trim();
            if (!edited || new RegExp(`^\\s*Part\\s+${partId}\\s*$`, "i").test(edited)) return existing;

            const replacement = getBulkExplanationPart(edited, partId) || `Part ${partId}\n\n${edited}`;
            const range = getBulkExplanationPartRange(existing, partId);
            if (!range) return [existing.trim(), replacement].filter(Boolean).join("\n\n");
            return `${existing.slice(0, range.start)}${replacement}${existing.slice(range.end)}`;
        }

        function scopePracticeBulkExplanationInputs(force = false) {
            if (!forcedPracticePartId || !isPracticeTestType()) return;
            ["input-bulk-explanation-id-all", "input-bulk-explanation-en-all"].forEach((id) => {
                const input = document.getElementById(id);
                if (!input || (!force && input.dataset.focusedPart === String(forcedPracticePartId))) return;
                const section = getBulkExplanationPart(input.value, forcedPracticePartId);
                const part = PARTS.find((item) => item.id === forcedPracticePartId) || {};
                // Practice Part B/C restart numbering at 1; only mock tests use 31-38 / 39-50.
                const firstQuestion = forcedPracticePartId === 1 ? (part.start || 1) : 1;
                input.value = section;
                input.placeholder = id.includes("-id-")
                    ? `Part ${forcedPracticePartId}\n\n## Question ${firstQuestion}\n\n**Jawaban Benar:** A - ...\n\n**PENJELASAN**\n\n...\n\n**KENAPA OPSI LAIN SALAH**\n\n* **(B) ...:** ...`
                    : `Part ${forcedPracticePartId}\n\n## Question ${firstQuestion}\n\n**Correct Answer:** A - ...\n\n**EXPLAINATION**\n\n...\n\n**WHY THE OTHER OPTION IS INCORRECT**\n\n* **(B) ...:** ...`;
                input.dataset.focusedPart = String(forcedPracticePartId);
            });
        }

        function explanationHtmlToText(value) {
            let str = String(value || "")
                .replace(/<mark\s+style="[^"]*">/gi, "<mark>")
                .replace(/<br\s*\/?>/gi, "\n")
                .replace(/<\/p>|<\/div>/gi, "\n");
            str = str.replace(/<mark>/gi, "___MARK_OPEN___").replace(/<\/mark>/gi, "___MARK_CLOSE___");
            const host = document.createElement("div");
            host.innerHTML = str;
            return String(host.textContent || "")
                .replace(/___MARK_OPEN___/g, "<mark>")
                .replace(/___MARK_CLOSE___/g, "</mark>")
                .replace(/\u00a0/g, " ")
                .replace(/[ \t]+\n/g, "\n")
                .replace(/\n{3,}/g, "\n\n")
                .trim();
        }

        function buildWhySectionTextFromSchema(schema) {
            const model = schema || {};
            const meta = model.question_metadata || {};
            const payload = schema?.explanation_payload || {};
            const main = explanationHtmlToText(payload.main_explanation_html || "");
            const closing = explanationHtmlToText(payload.closing_analysis_html || "");
            const distractors = Array.isArray(payload.distractor_analysis) ? payload.distractor_analysis : [];
            if (!main && !closing && !distractors.length) {
                return "";
            }

            const options = Array.isArray(model.options_status) ? model.options_status : [];
            const correct = options.find((item) => item && item.is_correct_choice) || {};
            const correctLetter = String(correct.letter || "").trim().toUpperCase();
            const correctText = String(correct.text || "").trim();
            const questionNumber = Number(meta.question_number || 0);
            if (!questionNumber && !correctLetter && !main) {
                return "";
            }

            const lines = [
                `## Question ${questionNumber || "[Number]"}`,
                "",
                `**Correct Answer:** ${correctLetter || "[Letter]"} - ${correctText || "[Text of the correct answer]"}`,
                "",
                "**EXPLAINATION**",
                ""
            ];
            const explanationLines = [];

            if (main) explanationLines.push(main);
            if (!main && closing) explanationLines.push(closing);
            lines.push(explanationLines.join(" ").trim());
            lines.push("", "**WHY THE OTHER OPTION IS INCORRECT**", "");

            const wrongOptions = options.filter((item) => item && !item.is_correct_choice);
            wrongOptions.forEach((item) => {
                const letter = String(item.letter || "").trim().toUpperCase();
                const distractor = distractors.find((entry) => String(entry?.letter || "").trim().toUpperCase() === letter) || {};
                const optionText = String(item.text || distractor.text || "").trim();
                const reason = String(distractor.reason || "").trim();
                if (reason) lines.push(`* **(${letter}) ${optionText}:** ${reason}`);
            });

            return lines.join("\n").trim();
        }

        // A pasted block that still only holds the template placeholders must not overwrite a real explanation.
        function isGenericExplanationFallback(text) {
            const body = String(text || "")
                .replace(/^\s*#{0,6}\s*(?:\*\*\s*)?question\s+\d+\s*(?:\*\*)?\s*$/gim, "")
                .replace(/\*\*(?:Correct Answer|EXPLAINATION|WHY THE OTHER OPTION IS INCORRECT|Jawaban Benar|PENJELASAN|KENAPA OPSI LAIN SALAH)\s*:?\*\*/gi, "")
                .replace(/\[[^\]]*\]/g, "")
                .replace(/[\s*\-•:_.]/g, "");
            return body.length < 12;
        }

        // Splits a single Part's pasted text into per-question blocks keyed by "partId_questionNumber".
        function parseListeningBulkExplanationBlocks(rawText, partId) {
            const blocks = {};
            const text = String(rawText || "").replace(/\r/g, "");
            const matches = Array.from(text.matchAll(/^\s*#{0,6}\s*(?:\*\*\s*)?question\s+(\d+)\s*(?:\*\*)?\s*$/gim));
            matches.forEach((match, index) => {
                const contentStart = match.index + match[0].length;
                const contentEnd = index + 1 < matches.length ? matches[index + 1].index : text.length;
                const content = `${match[0].trim()}\n\n${text.slice(contentStart, contentEnd).trim()}`.trim();
                if (content) blocks[`${partId}_${match[1]}`] = content;
            });
            return blocks;
        }

        // Splits the full bulk explanation document (Part 1-3) into per-question blocks.
        function parseAllListeningBulkExplanations(rawText) {            const text = String(rawText || "").replace(/\r/g, "");
            const blocks = {};
            const parts = Array.from(text.matchAll(/^\s*#{0,6}\s*(?:\*\*\s*)?part\s+(\d+)\s*(?:\*\*)?\s*$/gim));
            parts.forEach((match, index) => {
                const start = match.index + match[0].length;
                const end = index + 1 < parts.length ? parts[index + 1].index : text.length;
                Object.assign(blocks, parseListeningBulkExplanationBlocks(text.slice(start, end), Number(match[1])));
            });
            return blocks;
        }

        function markExplanationCardUnsaved(questionNumber) {
            const card = document.querySelector(`.explaination-card[data-question-number="${questionNumber}"]`);
            if (!card) return;
            card.classList.add("is-unsaved");
            const badge = card.querySelector(".explanation-save-state");
            if (badge) badge.hidden = false;
        }

        function markAllExplanationCardsSaved() {
            document.querySelectorAll(".explaination-card.is-unsaved").forEach((card) => {
                card.classList.remove("is-unsaved");
                const badge = card.querySelector(".explanation-save-state");
                if (badge) badge.hidden = true;
            });
        }

        function explanationTextToHtml(value) {
            return escapeHtml(String(value || "").trim())
                .replace(/&lt;(\/?)mark(?: style=&quot;[^&]*&quot;)?&gt;/gi, '<$1mark>')
                .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>')
                .replace(/\n/g, "<br>");
        }

        function parseExplanationCardMarkdown(text) {
            const source = String(text || "").replace(/\r/g, "").trim();
            const explanationMarker = source.search(/\*{2}EXPLAINATION\*{2}/i);
            const distractorMarker = source.search(/\*{2}WHY THE OTHER OPTION IS INCORRECT\*{2}/i);
            const explanationStart = explanationMarker >= 0 ? explanationMarker + source.match(/\*{2}EXPLAINATION\*{2}/i)[0].length : 0;
            const explanationEnd = distractorMarker >= 0 ? distractorMarker : source.length;
            const explanationText = source.slice(explanationStart, explanationEnd).trim();
            const distractorText = distractorMarker >= 0
                ? source.slice(distractorMarker + source.match(/\*{2}WHY THE OTHER OPTION IS INCORRECT\*{2}/i)[0].length).trim()
                : "";
            const distractors = [];
            const itemRegex = /^\s*[\*\-]\s*\*{0,2}\(?([A-D])\)?\s*(?:([^:\*\n]+?)\s*(?::\*{0,2}|\*{0,2}:)|\*{0,2}:\*{0,2})?\s*(?:This option is incorrect because\s*)?([^\n]+)$/gim;
            let match;
            while ((match = itemRegex.exec(distractorText))) {
                distractors.push({
                    letter: String(match[1] || "").toUpperCase(),
                    text: String(match[2] || "").trim(),
                    reason: String(match[3] || "").trim()
                });
            }
            return { explanationText, distractors };
        }

        function applyExplanationCardToSchema(schema, partId, questionNumber, englishText) {
                const rawText = String(englishText || "").trim();
                if (!rawText) {
                    return schema || null;
                }

                const model = schema && typeof schema === "object" ? { ...schema } : {};
                const uid = `${partId}_${questionNumber}`;
                const question = globalQuestions[uid] || {};
                const options = question.options || {};

                let correctLetter = String(globalAnswerKey[uid] || "").replace(/[^A-Za-z]/g, "").trim().toUpperCase();
                if (!correctLetter) {
                    const answerMatch = rawText.match(/\*\*Correct Answer:\*\*\s*([A-D])/i);
                    if (answerMatch) correctLetter = answerMatch[1].toUpperCase();
                }

                const parsedMarkdown = parseExplanationCardMarkdown(rawText);
                const paragraphs = parsedMarkdown.explanationText.split(/\n\s*\n/).filter(Boolean);

                if (!paragraphs.length && !parsedMarkdown.distractors.length) {
                    return schema || null;
                }

                let headerTitle = `Why (${correctLetter || "?"})?`;
                if (paragraphs.length && /^why\b/i.test(paragraphs[0])) headerTitle = paragraphs.shift();

                model.question_metadata = {
                    ...(model.question_metadata || {}),
                    question_number: questionNumber,
                    question_text: String(question.questionText || model?.question_metadata?.question_text || `Question ${questionNumber}`)
                };

                model.options_status = ["A", "B", "C", "D"].map((letter) => ({
                    letter,
                    text: String(options[letter] || ""),
                    is_correct_choice: letter === correctLetter,
                    is_user_answer: false
                }));

                model.explanation_payload = {
                    header_title: headerTitle,
                    main_explanation_html: explanationTextToHtml(paragraphs.join("\n\n")),
                    dialogue_blocks: Array.isArray(model?.explanation_payload?.dialogue_blocks) ? model.explanation_payload.dialogue_blocks : [],
                    distractor_analysis: parsedMarkdown.distractors,
                    closing_analysis_html: String(model?.explanation_payload?.closing_analysis_html || "")
                };

                return model;
        }

        function hasEditorQuestionOrAnswerContent() {
            return PARTS.some((part) => {
                const p = part.id;
                const questionValue = String((document.getElementById(`input-magic-questions-${p}`) || {}).value || "").trim();
                const answerValue = String((document.getElementById(`input-answer-key-${p}`) || {}).value || "").trim();
                return Boolean(questionValue || answerValue);
            });
        }

        function clearListeningEditorInputs() {
            PARTS.forEach((part) => {
                const p = part.id;
                const questionsElement = document.getElementById(`input-magic-questions-${p}`);
                const answerElement = document.getElementById(`input-answer-key-${p}`);
                const explanationElement = document.getElementById(`input-explanation-${p}`);
                const transcriptElement = document.getElementById(`input-transcript-${p}`);

                if (questionsElement) questionsElement.value = "";
                if (answerElement) answerElement.value = "";
                if (explanationElement) explanationElement.value = "";
                if (transcriptElement) transcriptElement.value = "";

                const groups = getAudioGroupsForPart(p, isPracticeTestType());
                groups.forEach((group) => {
                    const groupTextarea = document.getElementById(`input-group-transcript-${p}-${group.key}`);
                    if (groupTextarea) groupTextarea.value = "";
                    setGroupTranscriptStatus(p, group.key, `No transcript saved for questions ${group.key}.`);
                    setGroupAudioStatus(p, group.key, `No audio selected for questions ${group.key}.`);
                });
            });

            // A fresh package must never inherit the previous package's cached
            // draft (localStorage is not scoped per-setId), so wipe it here.
            localStorage.removeItem(DRAFT_KEY);

            // Reset in-memory audio URL maps so a new package never inherits
            // Cloudflare/Firebase URLs from a previously opened set.
            audioUrlsByPart = {};
            audioFirebaseByPart = {};
        }

        function isDateTargetWithoutSetIdRequest() {
            const params = new URLSearchParams(window.location.search);
            const requestedDate = normalizeDateKey(params.get("setDate") || "");
            const requestedSetId = String(params.get("setId") || "").trim();
            return Boolean(requestedDate) && !currentSetId && !requestedSetId;
        }

        function shouldHydrateEditorFromFallbackDraft() {
            if (isExplicitNewPackageRequest() && !currentSetId) return false;
            if (isDateTargetWithoutSetIdRequest()) return false;
            return true;
        }

        function hydrateEditorInputsFromLocalDraftIfEmpty() {
            if (hasEditorQuestionOrAnswerContent()) return;

            const directLocal = safeParse(localStorage.getItem(DRAFT_KEY), {});
            if (hasListeningDraftContent(directLocal)) {
                applyDraftToEditorInputs(directLocal);
                if (hasEditorQuestionOrAnswerContent()) return;
            }

            const latestV2 = resolveLatestLocalDraftV2ForModule(MODULE_ID);
            if (latestV2 && hasListeningDraftContent(latestV2.draft)) {
                applyDraftToEditorInputs(latestV2.draft);
            }
        }

        async function resolveLatestUserSetRecord() {
            const latestAudio = await getLatestAudioRecordForModule().catch(() => null);
            if (latestAudio?.setId) {
                const audioLinked = await resolveSetRecordById(latestAudio.setId);
                if (audioLinked?.setId) return audioLinked;
            }

            try {
                if (window.toeflStorage && typeof toeflStorage.getSetRecordsByTestType === "function" && typeof toeflStorage.getDraftBySetIdAndType === "function") {
                    const records = await toeflStorage.getSetRecordsByTestType(currentTestType);
                    const ordered = (records || [])
                        .filter((item) => item && item.module === MODULE_ID && item.setId)
                        .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime());

                    for (const record of ordered) {
                        const draft = await toeflStorage.getDraftBySetIdAndType(record.setId, currentTestType).catch(() => null);
                        if (hasListeningDraftContent(draft)) {
                            return record;
                        }
                    }
                }
            } catch (error) {
                console.warn("[ToeflSync] latest user set by draft lookup failed:", error);
            }

            return resolveLatestSetRecord();
        }

        async function findLatestSetWithAudio(partId = 1) {
            if (!window.toeflStorage || typeof toeflStorage.getSetRecordsByTestType !== "function") return null;
            const records = await toeflStorage.getSetRecordsByTestType(currentTestType);
            const ordered = (records || [])
                .filter((item) => item && item.module === MODULE_ID && item.setId)
                .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime());

            for (const record of ordered) {
                const url = await getCloudAudioUrl(record.setId, partId);
                if (url) return { record, url };
            }
            return null;
        }

        async function resolveLatestSetIdFromAudioIndex() {
            if (!window.toeflStorage || typeof toeflStorage.getAudioIndexMap !== "function") return "";
            const audioIndex = await toeflStorage.getAudioIndexMap();
            const entries = Object.entries(audioIndex || {})
                .map(([setId, parts]) => ({ setId, parts }))
                .filter((item) => item && typeof item.setId === "string" && item.setId.startsWith(`${MODULE_ID}_`))
                .filter((item) => item.parts && typeof item.parts === "object" && Object.keys(item.parts).length > 0)
                .sort((left, right) => {
                    const leftStamp = Number(String(left.setId).split("_")[2] || 0);
                    const rightStamp = Number(String(right.setId).split("_")[2] || 0);
                    return rightStamp - leftStamp;
                });
            return entries[0]?.setId || "";
        }

        function updatePackageLabel(dateValue, testType = '', practiceMode = '') {
            const packageLabel = document.getElementById("package-label");
            if (!packageLabel) return;

            // Standardize input strings to lowercase
            const type = String(testType).toLowerCase().trim();
            const mode = String(practiceMode).toLowerCase().trim();

            // Format Date: If dateValue is a Date object or valid date string, format it.
            // Otherwise, keep dateValue as a string if it's already pre-formatted.
            let formattedDate = "";
            if (dateValue) {
                const dateObj = new Date(dateValue);
                if (!isNaN(dateObj.getTime())) {
                    const day = String(dateObj.getDate()).padStart(2, '0');
                    const month = dateObj.toLocaleString('en-US', { month: 'short' });
                    const year = dateObj.getFullYear();
                    formattedDate = `${day} ${month} ${year}`;
                } else {
                    formattedDate = String(dateValue); // Use pre-formatted string as-is
                }
            } else {
                const dateObj = new Date();
                const day = String(dateObj.getDate()).padStart(2, '0');
                const month = dateObj.toLocaleString('en-US', { month: 'short' });
                const year = dateObj.getFullYear();
                formattedDate = `${day} ${month} ${year}`;
            }

            // Determine label output
            if (type === 'full_mock' || type === 'full mock test') {
                packageLabel.textContent = `Full Mock Test Package ${formattedDate}`;
            } else if (type === 'mock' || type === 'mocktest') {
                packageLabel.textContent = `Mock Test ${formattedDate}`;
            } else if (type === 'practice' || type === 'practice test' || type === 'practicetest') {
                // Handle practice mode variations
                if (mode === 'instant feedback' || mode === 'instant' || mode === 'instantfeedback' || mode === 'dev') {
                    packageLabel.textContent = `Practice Test ${formattedDate} (Instant Feedback)`;
                } else if (mode === 'full test mode' || mode === 'full test' || mode === 'fulltest') {
                    packageLabel.textContent = `Practice Test ${formattedDate} (Full Test Mode)`;
                } else {
                    packageLabel.textContent = `Practice Test ${formattedDate}`;
                }
            } else {
                packageLabel.textContent = `Package ${formattedDate}`;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            
            // 1. Parse parameters matching confirmStartTest() output
            const testType = urlParams.get('testType') || 'practice';
            const mode = urlParams.get('mode') || '';
            
            // Read setDate first, fallback to date, fallback to today's date
            const dateParam = urlParams.get('setDate') || urlParams.get('date') || new Date(); 

            // 2. Setup Header (internally updates package label, submit button, and dev mode)
            if (typeof setupHeaderUI === "function") {
                setupHeaderUI(dateParam, testType, mode);

        // Practice sets run either as a one-question-at-a-time instant feedback drill
        // or as a straight copy of the mock-test layout.
        function getPracticeRunMode() {
            const params = new URLSearchParams(window.location.search);
            const testType = String(params.get("testType") || "").toLowerCase();
            if (!testType.includes("practice")) return "full";

            const raw = String(params.get("runMode") || params.get("practiceMode") || params.get("mode") || "").toLowerCase().trim();
            if (raw === "instant" || raw === "instantfeedback" || raw === "instant feedback") return "instant";
            return "full";
        }

        function isInstantFeedbackMode() {
            return getPracticeRunMode() === "instant";
        }

        function isPracticeFullTestMode() {
            return isPracticeTestType() && !isInstantFeedbackMode();
        }

        function getPracticeQuestionDisplayNumber(uid) {
            const questionNumber = Number(String(uid).split("_")[1] || 0);
            const part = PARTS.find((item) => item.id === getPartIdFromUid(uid));
            if (isPracticeTestType() && part && part.id !== 1 && questionNumber >= part.start) {
                return questionNumber - part.start + 1;
            }
            return questionNumber;
        }

        let instantOrder = [];
        let instantIndex = 0;
        let instantAnswers = {};
        let instantRevealed = false;
        let instantChecked = {};
        let instantProgressOrder = [];
        let currentMockNavigationUid = "";
        // Which question of the revealed Part B/C group is currently being explained.
        let instantReviewIndex = 0;
        let loadedInstantAudioUid = "";
        let loadedInstantGroupKey = "";

        function getCurrentInstantQuestionNumber() {
            if (!isInstantFeedbackMode()) return null;
            const uid = instantOrder[instantIndex];
            if (!uid) return null;
            return Number(String(uid).split("_")[1] || 0) || null;
        }

        // Re-renders (Check Answer, explanation) must not restart the clip, so only
        // reload when the question itself changes.
        function syncInstantQuestionAudio() {
            const uid = instantOrder[instantIndex];
            if (!uid) return;

            const partId = getPartIdFromUid(uid);
            const questionNumber = Number(String(uid).split("_")[1] || 0);
            const isPractice = isPracticeTestType();
            setAudioShellTitle(partId);

            if (isPracticeFullTestMode()) {
                const partKey = `${currentSetId}:part_${partId}`;
                if (loadedInstantGroupKey === partKey) return;
                loadedInstantGroupKey = partKey;
                loadedInstantAudioUid = "";
                void restoreAudioForCurrentSet(partId);
                return;
            }

            // 1. Handle Part A (Per-Question Audio)
            if (usesPerQuestionAudio(partId, questionNumber)) {
                if (loadedInstantAudioUid === uid) return; // Prevent re-triggering if on same question
                loadedInstantAudioUid = uid;
                loadedInstantGroupKey = ""; // Clear group tracking
                void restoreAudioForCurrentSet(partId, questionNumber);
                return;
            }

            // 2. Handle Part B & Part C (Group Audio, e.g. Talk 1 vs Talk 2)
            const group = getAudioGroupForQuestion(partId, questionNumber, isPractice);
            if (group) {
                // Prevent reloading audio if navigating within the same talk/group (e.g., Question 5 to 6)
                if (loadedInstantGroupKey === group.key) return;
                
                loadedInstantGroupKey = group.key;
                loadedInstantAudioUid = ""; // Clear per-question tracking
                void restoreAudioForCurrentSet(partId, questionNumber);
            }
        }

        function applyPracticeRunMode() {
            const instant = isInstantFeedbackMode();
            const fullPractice = isPracticeFullTestMode();
            const isPractice = isPracticeTestType();
            const useQuestionDots = instant || fullPractice;
            document.body.classList.toggle("instant-feedback-mode", instant);

            const navigatorPanel = document.getElementById("navigator-panel");
            const progressBlock = document.querySelector(".progressbar-final .progress-bar-question");
            const dots = document.getElementById("instant-progress-dots");
            const actionBar = document.getElementById("instant-action-bar");
            const mockStack = document.getElementById("question-sections-container");
            const instantHost = document.getElementById("instant-question-host");

            if (navigatorPanel) navigatorPanel.style.display = instant || fullPractice ? "none" : "";
            if (progressBlock) progressBlock.style.display = useQuestionDots ? "none" : "";
            if (dots) dots.style.display = useQuestionDots ? "flex" : "none";
            if (mockStack) mockStack.style.display = instant || fullPractice ? "none" : "";
            if (instantHost) instantHost.style.display = instant || fullPractice ? "" : "none";
            if (actionBar) actionBar.style.display = "none";
            updatePackageLabel((document.getElementById("set-date") || {}).value || "", currentTestType, instant ? "instant" : "full test");

            const explanationWrapper = document.getElementById("explanation-wrapper");
            if (explanationWrapper) {
                explanationWrapper.innerHTML = "";
                explanationWrapper.style.display = "none";
            }

            if (!isPractice) {
                instantOrder = [];
                instantProgressOrder = [];
                if (dots) dots.innerHTML = "";
                return;
            }

            instantOrder = questionOrder.filter((uid) => !forcedPracticePartId || getPartIdFromUid(uid) === forcedPracticePartId);
            if (instantIndex >= instantOrder.length) instantIndex = 0;
            instantRevealed = instant ? Boolean(instantChecked[instantOrder[instantIndex]]) : false;
            instantReviewIndex = 0;
            if (instant || fullPractice) renderInstantQuestion();
            renderInstantProgressDots();
        }

        function applyFullTestMode() {
            applyPracticeRunMode();
        }

        function getInstantCircleState(uid, index) {
            const mockCurrentUid = currentMockNavigationUid || getQuestionUidsByPart(activePartId)[0];
            const isCurrent = isInstantFeedbackMode()
                ? uid === getInstantCurrentUid()
                : (isPracticeFullTestMode() ? uid === instantOrder[instantIndex] : uid === mockCurrentUid);
            const currentClass = isCurrent ? "is-current" : "";
            const radio = document.querySelector(`input[name="q_${uid}"]:checked`);
            const selected = String(instantAnswers[uid] || radio?.value || "").toUpperCase();

            // 1. If checked, determine if correct or incorrect (even if it's current)
            if (instantChecked[uid]) {
                const correctLetter = String(globalAnswerKey[uid] || "").trim().toUpperCase();
                const isCorrect = selected === correctLetter;
                const statusClass = isCorrect ? "is-correct" : "is-incorrect";
                return `${statusClass} ${currentClass}`.trim();
            }

            // 2. If answered but not checked yet
            if (selected) {
                return `is-answered ${currentClass}`.trim();
            }

            // 3. Default state (idle or current)
            return currentClass;
        }

        function renderInstantProgressDots() {
            const host = document.getElementById("instant-progress-dots");
            if (!host) return;
            if (!isPracticeTestType()) {
                host.innerHTML = "";
                instantProgressOrder = [];
                return;
            }
            if (isInstantFeedbackMode()) {
                instantProgressOrder = instantOrder.slice();
            } else {
                const currentPartId = getPartIdFromUid(instantOrder[instantIndex]) || activePartId || 1;
                instantProgressOrder = instantOrder.filter((uid) => getPartIdFromUid(uid) === currentPartId);
            }
            if (!instantProgressOrder.length) {
                host.innerHTML = "";
                return;
            }

            const partId = isPracticeFullTestMode()
                ? getPartIdFromUid(instantOrder[instantIndex]) || activePartId || 1
                : activePartId || 1;
            const partObj = PARTS.find((part) => part.id === partId) || {};
            const partTitle = partObj.name ? partObj.name.split(":")[0].toUpperCase() : `PART ${partId}`;
            const circles = instantProgressOrder.map((uid, index) => {
                const questionNumber = String(getPracticeQuestionDisplayNumber(uid) || index + 1);
                return `<button type="button" class="progress-q-circle ${getInstantCircleState(uid, index)}" onclick="goToInstantQuestion(${index}, '${uid}')" aria-label="Question ${escapeHtml(questionNumber)}">${escapeHtml(questionNumber)}</button>`;
            }).join("");

            host.innerHTML = `
                <div class="progress-part-chip active">
                    <span class="progress-part-title">${escapeHtml(partTitle)}</span>
                    <div class="reading-part-circles">${circles}</div>
