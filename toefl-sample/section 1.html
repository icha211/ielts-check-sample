                    console.error("[AI Explanation] Automatic generation failed:", error);
                    alert(String(error?.message || "Automatic explanation generation failed. Apply again to retry."));
                    throw error;
                }
            }
        }

        async function getNextSectionSetId(currentSetId, targetModule) {
            const urlParams = new URLSearchParams(window.location.search);
            let targetDate = urlParams.get("setDate");
            const testType = urlParams.get("testType") || "mocktest";

            // Fallback: extract date from currentSetId if not in URL
            if (!targetDate && currentSetId) {
                const dateMatch = currentSetId.match(/\d{4}-\d{2}-\d{2}/);
                if (dateMatch) targetDate = dateMatch[0];
            }

            if (!targetDate) return null;

            try {
                // Fetch all sets from Firebase/localStorage using your ToeflStorageSync class
                const records = await window.toeflStorage.getSetRecordsByTestType(testType);
                
                // Find the record that matches the target module (e.g., 'structure' or 'reading') and the same date
                const matchingRecord = records.find(item => 
                    String(item.module).toLowerCase() === targetModule.toLowerCase() && 
                    String(item.setDate) === targetDate
                );

                return matchingRecord ? matchingRecord.setId : null;
            } catch (e) {
                console.warn("[ToeflSync] Failed to dynamically fetch next setId:", e);
                return null;
            }
        }

        async function submitAnswers() {
            const total = Object.keys(globalAnswerKey).length;
            if (total === 0) {
                alert("Answer key data is empty. Unable to score.");
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const isFullTest = urlParams.get("fullTest") === "true";

            const confirmMessage = isFullTest 
                ? "Finish Section 1, are you sure you want to continue to Section 2?" 
                : "Finish Section 1 and see your score?";

            if (!confirm(confirmMessage)) return;

            clearInterval(timerInterval);
            const audio = document.getElementById("cbt-audio-player");
            if (audio) {
                audio.pause();
                updateAudioShellStatus();
            }

            let score = 0;
            for (const uid in globalAnswerKey) {
                const radio = document.querySelector(`input[name="q_${uid}"]:checked`);
                const userAnswer = radio ? radio.value.trim().toLowerCase() : String(instantAnswers[uid] || "").trim().toLowerCase();
                if (userAnswer === globalAnswerKey[uid]) score += 1;
            }

            const transcriptMapsByPart = {};
            const transcriptTextsByPart = {};
            const savedDraft = safeParse(localStorage.getItem(DRAFT_KEY), {}) || {};
            PARTS.forEach((part) => {
                const transcriptText = getTranscriptForSmartQuestions(part.id);
                transcriptTextsByPart[part.id] = transcriptText;
                transcriptMapsByPart[part.id] = mapTranscriptByQuestion(transcriptText);
            });

            const scaledScore = Math.round(31 + ((score / total) * (68 - 31)));

            const answeredQs = Object.keys(globalAnswerKey).map((uid) => {
                const pId = parseInt(uid.split("_")[0], 10);
                const qNum = parseInt(uid.split("_")[1], 10);
                const radio = document.querySelector(`input[name="q_${uid}"]:checked`);
                const userAnswer = radio ? radio.value.trim().toLowerCase() : String(instantAnswers[uid] || "").trim().toLowerCase();
                const correct = globalAnswerKey[uid];
                const q = globalQuestions[uid] || {};
                const part = PARTS.find((item) => item.id === pId) || {};
                const savedSegments = Array.isArray(savedDraft.parts?.[pId]?.transcriptSegments)
                    ? savedDraft.parts[pId].transcriptSegments.filter((segment) => Number(segment?.end) > Number(segment?.start))
                    : [];
                const questionAudio = resolveExplanationAudioRecord(savedDraft, pId, qNum);
                const groupSegments = resolveGroupTranscriptSegments(savedDraft, pId, qNum);
                const transcriptSegments = (savedSegments.length
                    ? savedSegments.filter((segment) => Number(segment?.questionNumber || segment?.question_number || 0) === qNum)
                    : ((transcriptMapsByPart[pId] || {})[qNum] || [])
                ).map((segment) => ({ ...segment }));
                const resolvedSegments = transcriptSegments.length ? transcriptSegments : groupSegments;
                return {
                    uid,
                    number: qNum,
                    partId: pId,
                    partName: part.name || "",
                    questionText: q.questionText || `Question ${qNum}`,
                    options: q.options || {},
                    correctAnswer: correct,
                    userAnswer,
                    isCorrect: userAnswer === correct,
                    explanation: globalExplanations[uid] || "",
                    explanationSchema: savedDraft.parts?.[pId]?.explanationSchemas?.[qNum]
                        ? JSON.stringify(savedDraft.parts[pId].explanationSchemas[qNum])
                        : "",
                    questionAudio: questionAudio,
                    questionAudioUrl: String(questionAudio?.url || ""),
                    questionAudioObjectKey: String(questionAudio?.objectKey || ""),
                    transcriptSegments: resolvedSegments
                };
            }).sort((left, right) => left.number - right.number);

            const selectedDate = (document.getElementById("set-date") || {}).value || "";

            const result = {
                sectionTitle: "Section 1: Listening Comprehension",
                sectionKey: "listening",
                setId: currentSetId || "",
                setDate: selectedDate,
                transcriptsByPart: transcriptTextsByPart,
                totalQuestions: total,
                rawScore: score,
                scaledScore,
                submittedAt: new Date().toISOString().slice(0, 10),
                questions: answeredQs
            };
            
            // Save results to storage
            localStorage.setItem("toefl_section1_result", JSON.stringify(result));
            if (window.toeflTestHistory) window.toeflTestHistory.record(result);

            if (isFullTest) {
                // Dynamically find the corresponding Structure set ID for this date
                const nextSetId = await getNextSectionSetId(currentSetId, "structure");
                
                if (nextSetId) {
                    urlParams.set("setId", nextSetId);
                }
                
                window.location.href = `section 2.html?${urlParams.toString()}`;
            } else {
                if (currentSetId && !urlParams.has("setId")) urlParams.set("setId", currentSetId);
                if (selectedDate && !urlParams.has("setDate")) urlParams.set("setDate", selectedDate);
                if (isPracticeTestType() && !urlParams.has("runMode") && !urlParams.has("practiceMode")) {
                    urlParams.set("runMode", isInstantFeedbackMode() ? "instant" : "full");
                }
                window.location.href = `section 1-answered.html?${urlParams.toString()}`;
            }
        }

            let t = 2100;

            const timerElement = document.getElementById("time");

                timerElement.style.animation = "none";

            timerInterval = setInterval(() => {
                const minutes = Math.floor(t / 60);
                const seconds = t % 60;
                if (timerElement) timerElement.innerText = `${minutes < 10 ? "0" + minutes : minutes}:${seconds < 10 ? "0" + seconds : seconds}`;
                if (timerElement && t <= 180) {
                    timerElement.style.color = "#d32f2f";

                }
                if (--t < 0) {
                    clearInterval(timerInterval);
                    alert("Time is up. Answers will be auto-submitted.");
                    submitAnswers();
                }
            }, 1000);
        }

        function positionListeningHeaderTimer() {
            const header = document.querySelector(".figma-header--listening");
            const timer = header ? header.querySelector(".timer") : null;
            const packageFrame = header ? header.querySelector(".test-package-frame") : null;
            const progressBlock = header ? header.querySelector(".progressbar-final") : null;
            if (!header || !timer || !packageFrame || !progressBlock) return;

            const packageRight = packageFrame.offsetLeft + packageFrame.offsetWidth;
            const progressLeft = progressBlock.offsetLeft;
            const timerWidth = timer.offsetWidth || 0;
            const sidePadding = 16;

            const targetCenterX = (packageRight + progressLeft) / 2;
            const minCenterX = packageRight + (timerWidth / 2) + sidePadding;
            const maxCenterX = progressLeft - (timerWidth / 2) - sidePadding;
            const clampedCenterX = Math.min(Math.max(targetCenterX, minCenterX), maxCenterX);

            timer.style.left = `${clampedCenterX}px`;
        }

        const audioUploadStates = {};

        async function alignUploadedTranscript(partNumber, audioUrl) {
            const transcriptText = getTranscriptForSmartQuestions(partNumber);
            if (!transcriptText || !audioUrl) return null;

            const runtimeApiGatewayUrl = await resolveRuntimeApiGatewayUrl();
            const apiBase = getApiGatewayBaseCandidates(runtimeApiGatewayUrl)[0] || '';
            if (!apiBase) return null;

            const response = await fetch(`${apiBase}/api/developer/align-transcript`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ audioUrl: audioUrl, transcriptText: transcriptText })
            });
            if (!response.ok) {
                const detail = await response.text().catch(() => '');
                throw new Error(`Automatic alignment failed: ${response.status} ${detail}`.trim());
            }
            return await response.json();
        }

        async function handleAudioUpload(event, partNumber) {
            const file = event.target.files?.[0];
            if (!file) return;

            const partLabel = ['A', 'B', 'C'][partNumber - 1] || 'Unknown';
            const fileNameEl = document.getElementById(`audio-file-name-${partNumber}`);
            
            if (fileNameEl) {
                fileNameEl.textContent = `Uploading ${file.name}...`;
                fileNameEl.style.color = '#0066cc';
            }

            try {
                if (!currentSetId) {
                    throw new Error('No test set selected. Create or select a test set first.');
                }

                const uploadResult = await uploadAudioPartToCloudflare(file, partNumber);

                try {
                    const alignment = uploadResult.alignment || await alignUploadedTranscript(partNumber, uploadResult.objectUrl);
                    if (alignment && Array.isArray(alignment.segments)) {
                        const draft = safeParse(localStorage.getItem(DRAFT_KEY), {}) || {};
                        draft.parts = draft.parts || {};
                        draft.parts[partNumber] = draft.parts[partNumber] || {};
                        draft.parts[partNumber].transcriptSegments = alignment.segments;
                        localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
                        await window.toeflStorage?.saveDraftBySetIdAndType?.(currentSetId, MODULE_ID, draft, currentTestType);
                        console.log(`[Audio Alignment] Part ${partNumber} aligned with ${alignment.provider}.`);
                        const transcriptStatus = document.getElementById(`transcript-status-${partNumber}`);
                        if (transcriptStatus) {
                            transcriptStatus.textContent = `Audio uploaded and aligned automatically with WhisperX.`;
                            transcriptStatus.style.color = '#15803d';
                        }
                    }
                } catch (alignmentError) {
                    console.warn(`[Audio Alignment] Part ${partNumber} skipped:`, alignmentError?.message || alignmentError);
                    const transcriptStatus = document.getElementById(`transcript-status-${partNumber}`);
                    if (transcriptStatus) {
                        transcriptStatus.textContent = 'Audio uploaded. Automatic WhisperX alignment unavailable; check the aligner configuration.';
                        transcriptStatus.style.color = '#b45309';
                    }
                }
                
                if (fileNameEl) {
                    fileNameEl.textContent = `✓ Uploaded: ${file.name}`;
                    fileNameEl.style.color = '#16a34a';
                }
                
                audioUploadStates[partNumber] = {
                    fileName: file.name,
                    uploadedAt: new Date().toISOString(),
                    status: 'completed'

                console.error(`[Audio Upload] Part ${partLabel} failed:`, error);
                if (fileNameEl) {
                    fileNameEl.textContent = `✗ Error: ${error.message}`;
                    fileNameEl.style.color = '#dc2626';

                audioUploadStates[partNumber] = {
                    status: 'failed',
                    error: String(error.message)
                };

        function getAudioGroupsForPart(partNumber, isPractice = false) {
            const pNum = Number(partNumber || 0);

                if (AUDIO_QUESTION_GROUPS[practiceKey]) {
                    return AUDIO_QUESTION_GROUPS[practiceKey];

        function getAudioGroupForQuestion(partNumber, questionNumber, isPractice = isPracticeTestType()) {
            const pNum = Number(partNumber || 0);
            const groups = getAudioGroupsForPart(pNum, isPractice);
            let qNum = Number(questionNumber || 0);
            if (isPractice) {
                const part = PARTS.find((item) => item.id === pNum);
                if (part && qNum >= part.start && qNum <= part.end) {
                    qNum -= part.start - 1;

            return groups.find((group) => qNum >= group.start && qNum <= group.end) || null;

        function parseGroupTranscriptSegments(rawText) {
            const cleaned = String(rawText || "").replace(/\r/g, "").replace(/\*\*/g, "");
            const lines = cleaned.split("\n").map((line) => line.trim());
            const segments = [];
            let startsNewParagraph = false;

            lines.forEach((rawLine) => {
                const line = rawLine.replace(/<\/?Question[^>]*>/gi, "").trim();
                if (!line) {
                    startsNewParagraph = segments.length > 0;
                    return;
                }
                const hasSpeakerPrefix = /^[A-Za-z][A-Za-z\s]*(?:\([^)]+\))?\s*:/.test(line);
                const stripQuotes = (value) => String(value || "").replace(/^["“]+|["”]+$/g, "").trim();

                // Wrapped paragraph lines continue the previous speaker turn.
                if (!hasSpeakerPrefix && segments.length > 0) {
                    const previous = segments[segments.length - 1];
                    if (startsNewParagraph) {
                        const start = segments.length * 8;
                        segments.push({
                            timestamp: "",
                            start,
                            end: start + 8,
                            speaker: previous.speaker,
                            speakerLabel: previous.speakerLabel,
                            text: stripQuotes(line)
                        });
                        startsNewParagraph = false;
                        return;
                    }
                    previous.text = `${previous.text} ${stripQuotes(line)}`.trim();
                    return;
                }

                const parsed = parseTranscriptSpeakerLine(line);
                const text = stripQuotes(parsed.text);
                if (!text) return;
                const start = segments.length * 8;
                segments.push({
                    timestamp: "",
                    start,
                    end: start + 8,
                    speaker: parsed.speaker,
                    speakerLabel: parsed.speakerLabel,
                    text
                });
                startsNewParagraph = false;
            });

            return segments;
        }

        async function uploadAudioPartToCloudflare(file, partNumber) {

            if (!AUDIO_PART_IDS.includes(Number(partNumber || 0))) {

            const runtimeApiGatewayUrl = await resolveRuntimeApiGatewayUrl();
            const apiBases = getApiGatewayBaseCandidates(runtimeApiGatewayUrl);
            let apiBase = apiBases[0] || '';

            let objectUrl = canonicalObjectUrl;
            let alignment = null;
            let uploadMode = 'proxy';

            // Step 1: proxy-first upload to enforce exact server-side key write.
            const proxyFormData = new FormData();
            proxyFormData.append('file', file);
            proxyFormData.append('fileName', file.name);
            proxyFormData.append('fileType', fileType);
            proxyFormData.append('objectKey', objectKey);
            proxyFormData.append('setId', currentSetId);
            proxyFormData.append('partNumber', partNumber);
            const transcriptText = getTranscriptForSmartQuestions(partNumber);
            if (transcriptText) proxyFormData.append('transcriptText', transcriptText);

            try {
                const proxyResponse = await fetch(`${apiBase}/api/developer/upload-proxy`, {
                    method: 'POST',
                    body: proxyFormData
                });
                if (!proxyResponse.ok) {
                    const proxyDetail = await proxyResponse.text().catch(() => '');
                    throw new Error(`Proxy upload failed: ${proxyResponse.status} ${proxyDetail}`.trim());
                }

                const proxyPayload = await proxyResponse.json().catch(() => ({}));
                const responseObjectKey = String(proxyPayload?.objectKey || '').trim();
                if (responseObjectKey && responseObjectKey !== objectKey) {
                    throw new Error(`Endpoint rewrote objectKey: expected ${objectKey}, got ${responseObjectKey}`);
                }
                objectUrl = String(proxyPayload?.objectUrl || canonicalObjectUrl).trim() || canonicalObjectUrl;
                if (proxyPayload?.alignment && Array.isArray(proxyPayload.alignment.segments)) {
                    alignment = proxyPayload.alignment;
                }
            } catch (proxyError) {
                console.warn('[Audio Upload] Proxy upload path failed, trying signed URL fallback:', proxyError?.message || proxyError);
                uploadMode = 'signed-url';

                // Step 2 fallback: signed URL flow, still enforcing canonical objectKey contract.
                const uploadUrlResponse = await fetch(`${apiBase}/api/developer/upload-url`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        objectKey,
                        fileName: file.name,
                        fileType
                    })
                });

                if (!uploadUrlResponse.ok) {
                    const errorText = await uploadUrlResponse.text();
                    throw new Error(`Failed to get upload URL: ${uploadUrlResponse.status} ${errorText}`);
                }

                const signedPayload = await uploadUrlResponse.json().catch(() => ({}));
                const uploadUrl = String(signedPayload?.uploadUrl || '').trim();
                const responseObjectKey = String(signedPayload?.objectKey || '').trim();
                if (!uploadUrl) {
                    throw new Error('Backend returned invalid upload URL');
                }
                if (responseObjectKey && responseObjectKey !== objectKey) {
                    throw new Error(`Endpoint rewrote objectKey: expected ${objectKey}, got ${responseObjectKey}`);
                }

                const putResponse = await fetch(uploadUrl, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': fileType
                    },
                    body: file
                });

                if (!putResponse.ok) {
                    throw new Error(`Upload to Cloudflare failed: ${putResponse.status}`);
                }

                objectUrl = canonicalObjectUrl;
            }

            // Step 3: Save the returned objectUrl to Firebase at toefl_itp/audio_urls/{setId}/part_{n}
            // This matches the format expected by playback code
            if (window.toeflStorage && typeof toeflStorage._put === 'function') {
                try {
                    await toeflStorage._put(`toefl_itp/audio_urls/${currentSetId}/part_${partNumber}`, {
                        url: canonicalObjectUrl,
                        objectKey: objectKey,
                        storageProvider: 'cloudflare-r2',
                        candidateUrls: [canonicalObjectUrl],
                        contentType: fileType,
                        fileName: file.name,
                        size: file.size,
                        type: fileType,
                        uploadMode,
                        uploadedAt: new Date().toISOString()
                    });
                    console.log(`[Audio Upload] Part ${partNumber} saved to Firebase audio_urls: ${canonicalObjectUrl}`);
                } catch (fbError) {
                    console.warn('[Audio Upload] Firebase audio_urls save failed:', fbError.message);
                    // Continue anyway - local draft will still be updated below
                }
            }

            // Step 4: Also save to draft for UI state
            const draft = safeParse(localStorage.getItem(DRAFT_KEY), {}) || await toeflStorage?.getDraftBySetIdAndType?.(currentSetId, currentTestType) || {};
            
            if (!draft.parts) {
                draft.parts = {};
            }
            if (!draft.parts[partNumber]) {
                draft.parts[partNumber] = {};
            }

            draft.parts[partNumber].audio_cloudflare = canonicalObjectUrl;
            draft.parts[partNumber].audio_cloudflare_uploaded_at = new Date().toISOString();

            // Save to local storage immediately
            localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));

            // Step 5: Also update the global audioUrlsByPart so saveSectionDraft() picks it up
            audioUrlsByPart[partNumber] = canonicalObjectUrl;

            // Save draft to Firebase asynchronously (non-blocking)
            if (window.toeflStorage && typeof toeflStorage.saveDraftBySetIdAndType === 'function') {
                toeflStorage.saveDraftBySetIdAndType(currentSetId, MODULE_ID, draft, currentTestType).catch((err) => {
                    console.warn('[Audio Upload] Firebase draft save failed (non-blocking):', err.message);
                });
            }

            console.log(`[Audio Upload] Part ${partNumber} saved (${uploadMode}): ${canonicalObjectUrl}`);
            return { objectKey, objectUrl: canonicalObjectUrl, uploadMode, alignment };
        }

            ];

            const draft = safeParse(localStorage.getItem(DRAFT_KEY), {}) || await toeflStorage?.getDraftBySetIdAndType?.(currentSetId, currentTestType) || {};
            let allValid = true;

            for (let i = 1; i <= 3; i++) {
                // Check both draft and Firebase for URLs
                let audioUrl = draft.parts?.[i]?.audio_cloudflare;
                const expectedUrl = `${DEFAULT_R2_PUBLIC_BASE_URL}/audio/listening/sets/${currentSetId}/part_${i}.mp3`;
                
                // Also check Firebase audio_urls if draft doesn't have it
                if (!audioUrl && window.toeflStorage && typeof toeflStorage.getAudioRecordFromFirebase === 'function') {
                    try {
                        const fbRecord = await toeflStorage.getAudioRecordFromFirebase(currentSetId, i);
                        audioUrl = fbRecord?.url;
                    } catch (err) {
                        console.warn(`[Validation] Failed to check Firebase for part ${i}:`, err.message);
                    }
                }

                const statusEl = statusEls[i - 1];
                
                if (!statusEl) continue;

                if (!audioUrl) {
                    statusEl.textContent = `Part ${i}: ✗ Not uploaded`;
                    statusEl.style.color = '#dc2626';
                    statusEl.style.borderColor = '#fca5a5';
                    allValid = false;
                    continue;
                }

                const normalizedAudioUrl = String(audioUrl || '').trim();
                if (normalizedAudioUrl !== expectedUrl) {
                    statusEl.textContent = `Part ${i}: ✗ Non-canonical URL`;
                    statusEl.style.color = '#dc2626';
                    statusEl.style.borderColor = '#fca5a5';
                    allValid = false;
                    continue;
                }

                statusEl.textContent = `Part ${i}: ✓ Canonical URL saved`;
                statusEl.style.color = '#16a34a';
                statusEl.style.borderColor = '#bbf7d0';
            }

            if (!allValid) {
                alert('❌ All 3 parts must be uploaded before saving.');
                return false;
            }

            alert('✅ All audio files validated and ready to save.');
            return true;
        }

        // ===== END AUDIO UPLOAD FUNCTIONALITY =====

        window.onload = async () => {
            const forceBlankNew = isExplicitNewPackageRequest();
            initStructure();
            initAutoSave();
            const initialEditorTab = new URLSearchParams(window.location.search).get("editorTab");
            if (initialEditorTab === "questions") {
                const firstQuestionTab = document.querySelector('#dev-sub-nav-container .dev-sub-btn[data-part-id="1"]');
                if (firstQuestionTab) firstQuestionTab.click();
            }
            applyViewMode();
            activateInitialTab();
            initZoom();
            initDarkMode();
            initTextSize();
            applyFigmaFrameScale();
            updateFullScreenButton();
            document.addEventListener("fullscreenchange", handleFullScreenStateChange);
            window.addEventListener("resize", applyFigmaFrameScale);
            // Fast first paint: render questions from locally stored draft data
            // before the slower remote meta/audio restore runs, so the exam view
            // is never blank while awaiting network calls that may fail/time out.
            if (forceBlankNew) {
                clearListeningEditorInputs();
            } else {
                hydrateEditorInputsFromLocalDraftIfEmpty();
            }
            updateUserView(false);
            try {
                await loadSectionMeta();
                await loadSectionDraft();
            } catch (error) {
                console.warn("[Init] Failed to fully restore section data:", error);
            } finally {
                // Always render question cards from available draft/input data,
                // even if non-critical startup steps (e.g. audio restore) fail.
                updateUserView();
            }
            positionListeningHeaderTimer();
            setTimeout(positionListeningHeaderTimer, 60);
            const featuresOverlay = document.getElementById("features-overlay");
            if (featuresOverlay) {
                featuresOverlay.addEventListener("click", handleFeaturesOverlayClick);
            }
            document.addEventListener("keydown", handleFeaturesMenuKeydown);
            setupAudioInteractions();
            syncAudioPanelFromView();
            applyViewMode();
            window.addEventListener("hashchange", applyViewMode);
            updateOnboardingVisibility();
            setTimeout(updateOnboardingVisibility, 120);
            const setDateEl = document.getElementById("set-date");
            const setDifficultyEl = document.getElementById("set-difficulty");
            if (setDateEl) setDateEl.addEventListener("change", handleSetDateChange);
            if (setDifficultyEl) setDifficultyEl.addEventListener("change", saveSectionMeta);
            window.addEventListener("beforeunload", revokeCurrentAudioUrl);
            window.addEventListener("storage", handleCrossTabApplySync);
            applyPracticeRunMode();
        };

        if (typeof practiceData === 'undefined') {
            window.practiceData = [];
        }
    </script>
</body>
</html>
