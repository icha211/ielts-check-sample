<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL ITP Simulator - Section 1: Listening Comprehension</title>
    <script src="app-config.js?v=20260802a"></script>
    <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
    <style>
    /* Helper active/hidden classes */
    .hidden {
    display: none !important;
    }

    #dev-view.active {
        display: flex;
        flex-direction: column;
    }

    .progress-q-circle {
        width: 20px;
        height: 20px;
        border-radius: 999px;
        border: 1px solid #d1dce8;
        background: #e8eef5;
        color: #fff;
        font: 400 10px/1 "Plus Jakarta Sans", Arial, sans-serif;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 1px;
        transition: all 0.2s ease;
        box-sizing: border-box;
    }

    /* Default unanswered/idle circle */
    .progress-q-circle:not(.is-answered):not(.is-current):not(.is-correct):not(.is-incorrect) {
        background: #7a8fa6;
        border-color: #d1dce8;
        color: #fff;
    }

    /* Current active question -> Blue */
    .progress-q-circle.is-current {
        background: #005FAA;
        border-color: #fff;
        color: #fff;
        box-shadow: 0 0 0 2px #005FAA;
    }

    /* Answered prior to check */
    .progress-q-circle.is-answered {
        background: #005FAA;
        color: #fff;
        border-color: #fff;
        box-shadow: 0 0 2px #005FAA;
    }

    /* Correct post-instant check -> Green */
    .progress-q-circle.is-correct {
        background: #0d9488;
        color: #fff;
        border-color: #fff;
        box-shadow: 0 0 2px #0d9488;
    }

    /* Incorrect post-instant check -> Red */
    .progress-q-circle.is-incorrect {
        background: #dc2626;
        color: #fff;
        border-color: #fff;
        box-shadow: 0 0 2px #dc2626;
    }

    .progress-q-circle:hover {
        border-color: #fff;
    }

    /* Part Chip Layout */
    .progress-part-chip {
        border: none;
        border-radius: 0;
        background: transparent;
        width: auto;
        min-width: 33px;
        height: 28px;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .progress-part-chip.active {
        width: max-content;
        min-width: max-content;
        height: auto;
        align-items: center;
        cursor: default;
        padding: 0;
        box-shadow: none;
    }

    .reading-part-circles {
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        gap: 4px;
        padding-top: 4px;
    }

    .progress-part-chip.active .progress-part-title {
        height: 21px;
        width: 100%;
        border-bottom: 1px solid #d1dce8;
        font: 700 14px/18px "Plus Jakarta Sans", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
    }

    /* ===== Instant feedback practice mode ===== */
    .instant-progress {
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: min(48vw, 620px);
        overflow-x: auto;
        scrollbar-width: none;
    }

    .instant-progress::-webkit-scrollbar { display: none; }

    .instant-progress-label {
        font: 700 9px/1 "Plus Jakarta Sans", Arial, sans-serif;
        letter-spacing: 0.08em;
        color: #0f172a;
    }

    .instant-progress-dots-row { display: inline-flex; gap: 5px; }

    .instant-progress-dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #cbd5e1;
    }

    .instant-progress-dot.is-done { background: #94a3b8; }
    .instant-progress-dot.is-current { background: #005faa; }

    .instant-card {
        /* Matches the audio shell's centred content track. */
        width: min(922px, 100%);
        margin: 16px auto 0;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
        overflow: hidden;
    }

    .instant-card__body { 
        padding: 24px 28px; 
        display: grid; 
        gap: 16px; 
    }

    .instant-card__tab {
        display: flex;
        justify-content: center;
        padding: 10px 0 0;
        border-bottom: 2px solid #005faa;
    }

    .instant-card__tab img {
        width: 18px;
        height: 18px;
        object-fit: contain;
    }

    .instant-tab-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px 10px;
        color: #005faa;
        font: 600 12px/1 "Plus Jakarta Sans", Arial, sans-serif;
    }

    .instant-question { 
        display: flex; 
        align-items: flex-start;
        gap: 24px; 
        box-shadow: 0 0px 4px rgba(15, 23, 42, 0.16);
        padding: 16px 24px;
        border-radius: 16px;
    }

    .instant-question.is-revealed {
        flex-direction: column;
        gap: 20px;
    }

    .instant-question-head {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .instant-question.is-revealed .instant-question-head {
        width: 100%;
    }

    .instant-question-head .question-number-badge { flex: 0 0 auto; }

    .instant-question-title {
        flex: 1 1 auto;
        margin: 0;
        color: #0f172a;
        font: 400 16px/1.4 "Times New Roman", Times, serif;
    }

    .instant-verdict {
        font: 600 16px/1 "Plus Jakarta Sans", Arial, sans-serif;
        letter-spacing: 0.04em;
        /* padding-bottom: 4px; */
        white-space: nowrap;
    }

    .instant-verdict.is-correct { color: #0d9488; }
    .instant-verdict.is-incorrect { color: #dc2626; }

    .instant-question.is-revealed .instant-verdict {
        margin-left: auto;
    }

    .question-number-badge.is-selected {
        background: #005FAA;
        border-color: #ffffff;
        box-shadow: 0 0px 4px #0EA5E9;
        color: #fff;
    }

    .question-number-badge.is-correct {
        background: #0d9488;
        border-color: #ffffff;
        box-shadow: 0 0px 4px #0d9488;
        color: #fff;
    }

    .question-number-badge.is-incorrect {
        background: #DC2626;
        border-color: #ffffff;
        box-shadow: 0 0px 4px #DC2626;
        color: #fff;
    }

    .instant-options { flex: 1;display: grid; gap: 10px; }

    .instant-question.is-revealed .instant-options {
        width: 100%;
        flex: 0 0 auto;
    }

    .instant-options label {
        width: 100%;
        min-height: 44px;
        height: auto;
        padding: 9px 16px;
        gap: 14px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        background: #fff;
        font: 400 15px/1.4 "Times New Roman", Times, serif;
        transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .instant-options label.selected {
        border-color: var(--navy-mid);
        background: rgba(14, 165, 233, 0.2);
        box-shadow: 0 4px 4px rgba(14, 165, 233, 0.25);
    }

    .instant-options label.is-correct {
        border-color: #0d9488;
        background: #d7f5ee;
    }

    .instant-options label.is-incorrect {
        border-color: #fca5a5;
        background: #fef2f2;
    }

    .instant-option-letter {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        border-radius: 999px;
        border: 1px solid #e2e8f0;
        background: #fff;
        color: #64748b;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font: 400 13px/1 "Times New Roman", Times, serif;
    }

    .instant-options label.selected .instant-option-letter {
        background: #005FAA;
        border-color: #005faa;
        color: #fff;
    }

    .instant-options label.is-correct .instant-option-letter {
        background: #0d9488;
        border-color: #0d9488;
        color: #fff;
    }

    .instant-option-text { flex: 1; min-width: 0; }

    .instant-option-tag {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: 500 13px/1 "Plus Jakarta Sans", Arial, sans-serif;
        color: #0d9488;
    }

    .instant-option-tag.is-wrong { color: #dc2626; }

    .instant-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        padding-top: 16px;
        border-top: 1px solid #e2e8f0;
    }

    .btn-action {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 10px 18px;
        cursor: pointer;
        font: 600 14px/1 "Plus Jakarta Sans", Arial, sans-serif;
    }

    .btn-action.primary { background: #0d9488; color: #fff; }
    .btn-action.secondary { background: #94a3b8; color: #fff; }
    .btn-action:hover { filter: brightness(1.06); }

    .instant-explanation {
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        overflow: hidden;
        background: #f8fafc;
    }

    .instant-explanation__head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        background: #0b3b3c;
        color: #fff;
        font: 500 15px/1.3 "Plus Jakarta Sans", Arial, sans-serif;
    }

    .instant-explanation__head i { font-size: 24px; color: #22c55e; }

    .instant-explanation__body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 16px;
    }

    .instant-explanation__pane { display: grid; gap: 12px; align-content: start; }

    .instant-pane-card {
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #fff;
        padding: 14px 16px;
    }

    .instant-pane-title {
        margin: 0 0 10px;
        font: 500 11px/1 "Plus Jakarta Sans", Arial, sans-serif;
        letter-spacing: 0.08em;
        color: #94a3b8;
    }

    /* Mirrors the section 1-answered why-block (css/explaination.css #explainationTabContent). */
    .instant-explanation.explaination-figma-why-block { background: #fff; border: 1px solid #d1dce8; border-radius: 16px; color: #082f5e; }
    .instant-explanation .explaination-figma-why-body { display: flex; flex-direction: column; gap: 16px; }

    .instant-explanation .explaination-correct-answer-card,
    .instant-explanation .explaination-content-card {
        display: flex;
        align-items: flex-start;
        gap: 24px;
        width: 100%;
        box-sizing: border-box;
        padding: 16px 26px;
    }

    .instant-explanation .explaination-correct-answer-card { align-items: center; background: #003d46; }

    .instant-explanation .explaination-content-card {
        padding: 26px;
        background: #fff;
        border: 1px solid #c7e3f7;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(8, 47, 94, 0.08);
    }

    .instant-explanation .explaination-icon-badge {
        width: 40px;
        height: 40px;
        flex: 0 0 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #09a982;
    }

    .instant-explanation .explaination-answer-copy,
    .instant-explanation .explaination-copy-column { flex: 1 1 auto; min-width: 0; }

    .instant-explanation .explaination-answer-text {
        color: #fff;
        font: 600 16px/1.4 "Plus Jakarta Sans", Arial, sans-serif;
        overflow-wrap: anywhere;
    }

    .instant-explanation .explaination-copy-column { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }

    .instant-explanation .explaination-copy-column h2 {
        margin: 0;
        color: #082f5e;
        font: 600 16px/1.4 "Plus Jakarta Sans", Arial, sans-serif;
    }

    .instant-explanation .explaination-accent { height: 3px; width: 52px; border-radius: 999px; background: #09a982; }

    .instant-explanation .explaination-content-text {
        width: 100%;
        color: #082f5e;
        font: 400 16px/1.48 "Plus Jakarta Sans", Arial, sans-serif;
        overflow-wrap: anywhere;
    }

    .instant-explanation .explaination-content-text strong { color: #008080; font-weight: 700; }

    .instant-explanation .explaination-incorrect-section { display: flex; flex-direction: column; gap: 12px; width: 100%; }

    .instant-explanation .explaination-incorrect-heading h2 {
        margin: 0;
        color: #7a8fa6;
        font: 700 16px/1.4 "Plus Jakarta Sans", Arial, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.02em;
    }

    .instant-explanation .explaination-incorrect-divider { height: 1px; width: 100%; background: #d9e4ee; }
    .instant-explanation .explaination-incorrect-grid { display: flex; flex-direction: column; gap: 16px; width: 100%; }
    .instant-explanation .explaination-incorrect-option { display: flex; flex-direction: column; width: 100%; }

    .instant-explanation .explaination-incorrect-option + .explaination-incorrect-option {
        padding-top: 16px;
        border-top: 1px solid #d9e4ee;
    }

    .instant-explanation .explaination-option-heading { display: flex; align-items: flex-start; gap: 18px; width: 100%; min-width: 0; }

    .instant-explanation .explaination-option-letter {
        width: 32px;
        height: 32px;
        flex: 0 0 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #e63862;
        color: #fff;
        font: 700 19px/1 "Plus Jakarta Sans", Arial, sans-serif;
    }

    .instant-explanation .explaination-option-title-group { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; flex: 1 1 auto; }

    .instant-explanation .explaination-option-title {
        color: #082f5e;
        font: 600 14px/1.25 "Plus Jakarta Sans", Arial, sans-serif;
        overflow-wrap: anywhere;
    }

    .instant-explanation .explaination-option-accent { width: 38px; height: 4px; border-radius: 999px; background: #e63862; }

    .instant-explanation .explaination-option-reason {
        width: 100%;
        color: #082f5e;
        font: 400 12px/1.34 "Plus Jakarta Sans", Arial, sans-serif;
        overflow-wrap: anywhere;
    }

    .instant-explanation .explaination-content-text mark,
    .instant-explanation .explaination-option-reason mark {
        background-color: #ffde00;
        color: #000;
        font-weight: 500;
        border-radius: 3px;
        padding: 1px 3px;
    }

    #transcript-section {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            height: auto;
        }

        #transcript-cards-container {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        /* Missing link in the flex chain: without this, the shell hugs its
           full content height instead of shrinking to the parent's height,
           so the inner list never gets a chance to scroll. */
        .transcript-modern-shell {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        .transcript-modern-panel.content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            min-height: 0;
            height: 100%;
            overflow: hidden;
            position: relative;
        } 

        .transcript-modern-list {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .transcript-modern-list::-webkit-scrollbar {
            display: none;
        }

        /* Overlay scrollbar: hidden at rest, fades in on scroll/hover, fades
           back out after a short delay instead of sitting there permanently. */
        .transcript-scrollbar-track {
            position: absolute;
            top: 4px;
            right: 3px;
            bottom: 4px;
            width: 5px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.16);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 2;
        }

        .transcript-scrollbar-track.is-visible {
            opacity: 1;
        }

        .transcript-scrollbar-thumb {
            position: absolute;
            left: 0;
            right: 0;
            border-radius: 999px;
            background: rgba(100, 116, 139, 0.6);
        }

        .transcript-modern-item.is-active {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 1px rgba(14, 165, 233, 0.22);
        }

    /* Mirrors the section 1-answered transcript modal (css/explaination.css). */
    .instant-pane-card .transcript-modern-list { display: flex; flex-direction: column; gap: 12px; }
    .instant-pane-card .transcript-part-a-list { gap: 8px; }

    .instant-pane-card .transcript-part-a-card {
        width: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 9px 10px;
        border: 1px solid #bccada;
        border-radius: 12px;
        background: #ffffff;
    }

    .instant-pane-card .transcript-modern-speaker-label {
        font-weight: 600;
        color: #005faa;
        font-family: "Plus Jakarta Sans", Arial, sans-serif;
    }

    .instant-pane-card .transcript-part-a-card .transcript-modern-speaker-label {
        margin: 0;
        font: 500 20px/1.2 "Outfit", Arial, sans-serif;
    }

    .instant-pane-card .transcript-part-a-divider {
        width: 100%;
        height: 1px;
        margin: 4px 0;
        background: #d1dce8;
    }

    .instant-pane-card .transcript-part-a-text {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        color: #000000;
        text-align: justify;
        letter-spacing: 1.26px;
        font: 400 14px/1.45 "Plus Jakarta Sans", Arial, sans-serif;
    }

    .instant-pane-card .transcript-plain-line {
        margin: 0;
        color: #000;
        text-align: justify;
        letter-spacing: 0.02em;
        font: 400 14px/1.6 "Plus Jakarta Sans", Arial, sans-serif;
    }

    .instant-pane-card .transcript-modern-empty {
        border-radius: 8px;
        border: 1px solid #d1dce8;
        background: #f8fafc;
        color: #475569;
        font: 500 14px/1.5 "Plus Jakarta Sans", Arial, sans-serif;
        padding: 14px;
    }

    .instant-transcript-block { padding: 12px 0; border-top: 1px solid #eef2f7; }
    .instant-transcript-block:first-of-type { border-top: 0; padding-top: 0; }

    .instant-transcript-speaker {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        font: 500 13px/1 "Plus Jakarta Sans", Arial, sans-serif;
        color: #1d4ed8;
    }

    .instant-transcript-speaker.is-man { color: #ea7317; }
    .instant-transcript-speaker.is-woman { color: #2f80ed; }
    .instant-transcript-speaker.is-narrator { color: #1e3a8a; }

    .instant-transcript-text {
        margin: 0;
        text-align: justify;
        font: 400 11px/1.75 "JetBrains Mono", "Courier New", monospace;
        color: #334155;
    }

    .instant-pane-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: 999px;
        background: #0d9488;
        color: #fff;
        margin-bottom: 12px;
    }

    .instant-pane-heading {
        margin: 0 0 8px;
        font: 600 12px/1 "Plus Jakarta Sans", Arial, sans-serif;
        letter-spacing: 0.06em;
        color: #0f172a;
    }

    .instant-pane-text {
        font: 400 12px/1.65 "Plus Jakarta Sans", Arial, sans-serif;
        color: #2f6fb0;
    }

    .instant-distractor-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }

    .instant-distractor {
        display: grid;
        grid-template-columns: 22px 1fr;
        gap: 10px;
        align-items: start;
    }

    .instant-distractor-letter {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: #e8497c;
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font: 600 11px/1 "Plus Jakarta Sans", Arial, sans-serif;
    }

    .instant-distractor-title {
        font: 500 12px/1.4 "Plus Jakarta Sans", Arial, sans-serif;
        color: #0d9488;
        padding-bottom: 5px;
        margin-bottom: 6px;
        border-bottom: 2px solid #e8497c;
        width: fit-content;
    }

    .instant-distractor-reason {
        margin: 0;
        font: 400 10px/1.55 "Plus Jakarta Sans", Arial, sans-serif;
        color: #64748b;
    }

    .instant-empty,
    .instant-empty-state {
        margin: 0;
        color: #94a3b8;
        font: 400 13px/1.5 "Plus Jakarta Sans", Arial, sans-serif;
    }

    .instant-empty-state { padding: 24px; text-align: center; }

    @media (max-width: 900px) {
        .instant-explanation__body { grid-template-columns: 1fr; }
    }
    </style>
</head>
<body>
    <div class="view-tab-navigation" id="view-tab-navigation" style="display:none;">
        <button class="view-tab-button active" id="tab-user-view-btn" type="button" onclick="openUserPreviewFromDeveloper()"> Simulasi Ujian User</button>
        <button class="view-tab-button" id="tab-dev-view-btn" type="button" onclick="openDeveloperEditor()">Panel Developer</button>
    </div>

    <div id="user-view" class="tab-content active">
        <div id="global-score-board"></div>
        <div class="exam-shell">
            <header class="cbt-header figma-header figma-header--listening">
                <div class="logo-test-package-timer">
                    <img class="logo-frame-icon" src="../asst/icon/QuickCheckLogo.png" alt="">
                    <div class="test-package-timer">
                        <div class="test-package-frame">
                            <div class="structure-writing">Listening Comprehension</div>
                            <div class="package-01-jan" id="package-label">Loading Package...</div>
                        </div>

    <script>
        const PARTS = [
            { id: 1, name: "Part A: Short Dialogues", range: "Questions 1-30", start: 1, end: 30, instr: "<strong>Directions:</strong> In Part A, you will hear short conversations between two people. After each conversation, you will hear a question about the conversation. The conversations and questions will not be repeated. After you hear a question, choose the best answer." },
            { id: 2, name: "Part B: Longer Conversations", range: "Questions 31-38", start: 31, end: 38, instr: "<strong>Directions:</strong> In this part of the test, you will hear longer conversations. After each conversation, you will hear several questions. The conversations and questions will not be repeated." },
            { id: 3, name: "Part C: Short Talks", range: "Questions 39-50", start: 39, end: 50, instr: "<strong>Directions:</strong> In this part of the test, you will hear several short talks. After each talk, you will hear some questions. The talks and questions will not be repeated." }
        ];

        const SETS_KEY = "toefl_developer_sets_v1";
        const SETS_KEY_V2 = "toefl_developer_sets_v2";
        const MODULE_ID = "listening";
        const MODULE_LABEL = "Listening";
        const ONBOARDING_KEY_BASE = "toefl_section1_onboarding_seen_v1";
        const DRAFT_KEY = "toefl_section1_dev_draft_v1";
        const EDITOR_APPLY_SYNC_KEY = "toefl_section1_editor_apply_sync_v1";
        const DARK_MODE_KEY = "toefl_section1_dark_mode_v1";
        const DEFAULT_R2_PUBLIC_BASE_URL = "https://pub-1975cb14188340238a5d6d34750e4880.r2.dev";
        const TEXT_SIZE_KEY = "toefl_section1_text_size_v1";
        const ZOOM_KEY = "toefl_section1_zoom_v1";
        const FLAG_KEY = "toefl_section1_flagged_questions_v1";
        const FIREBASE_RTDB_URL = "https://quickcheck-25590-default-rtdb.asia-southeast1.firebasedatabase.app";
        const AUDIO_DB_NAME = "toefl_listening_audio_db_v1";
        const AUDIO_STORE_NAME = "set_audio";
        const AUDIO_PART_TITLES = {
            1: "Part A: Short Conversation",
            2: "Part B: Extended Conversation",
            3: "Part C: Short Talks"
        };
        const AUDIO_PART_IDS = [1, 2, 3];
        const PART_PROGRESS_SEGMENTS = {
            1: { start: 0, end: 30 },
            2: { start: 30, end: 40 },
            3: { start: 40, end: 50 }
        };

        // --- GLOBAL MOCK TEST STATE ---
        let currentSetId = "";
        // Seeded from the URL so callers that run before loadSectionMeta() never assume the wrong test type.
        let currentTestType = new URLSearchParams(window.location.search).get("testType") || "mocktest";
        let questionOrder = [];
        let globalAnswerKey = {};
        let globalExplanations = {};
        let globalQuestions = {};
        let timerInterval = null;
        let examSessionStarted = false;
        let flaggedQuestions = safeParse(localStorage.getItem(FLAG_KEY), {});
        let activePartId = 1;
        let forcedPracticePartId = null;

        // --- AUDIO ENGINE STATE ---
        let audioContext = null;
        let audioAnalyser = null;
        let audioSourceNode = null;
        let audioDataArray = null;
        let audioVisualFrame = null;
        let audioIsLocked = false;
        let audioToggleInFlight = false;
        let audioToggleLockUntil = 0;
        let currentAudioObjectUrl = "";
        let currentAudioFallbackUrls = [];
        let audioFallbackAttempted = false;
        let currentAudioPlaybackSource = "unknown";
        let audioAnalyzerReady = false;

        // --- PRACTICE TEST STATE (DECLARE ONCE HERE) ---
        let packageId = new URLSearchParams(window.location.search).get('packageId') || new URLSearchParams(window.location.search).get('setId') || null; 
        let currentStep = 'audio'; 
        let currentIndex = 0;
        let selectedOption = null;
        let userAnswers = {};
        let examTimerInterval = null;
        let activeQuestionIndex = 0;
        let isExplanationRevealed = false;

        function startExamTimer() {
            const timerDisplay = document.getElementById("time");
            if (!timerDisplay) return;

            if (examTimerInterval) clearInterval(examTimerInterval);

            const urlParams = new URLSearchParams(window.location.search);
            const testType = (urlParams.get('testType') || '').toLowerCase().trim();
            const isMock = testType.includes('mock');

            // -------------------------------------------------------------
            // 1. MOCK TEST MODE: Strictly locked to official time (35:00)
            // -------------------------------------------------------------
            if (isMock) {
                let totalSeconds = 35 * 60; // Standard 35 minutes for TOEFL Listening

                const formatTime = (secs) => {
                    const m = Math.floor(secs / 60);
                    const s = secs % 60;
                    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                };

                timerDisplay.textContent = formatTime(totalSeconds);

                examTimerInterval = setInterval(() => {
                    totalSeconds--;
                    if (totalSeconds <= 0) {
                        clearInterval(examTimerInterval);
                        timerDisplay.textContent = "00:00";
                        alert("Time's up! Submitting your Mock Test.");
                        if (typeof submitFromHeader === "function") submitFromHeader();
                    } else {
                        timerDisplay.textContent = formatTime(totalSeconds);
                    }
                }, 1000);

                return; // Exit function so practice settings are ignored
            }

            // -------------------------------------------------------------
            // 2. PRACTICE TEST MODE: Uses user's selected time/unlimited
            // -------------------------------------------------------------
            const rawTimeParam = (urlParams.get('time') || urlParams.get('timer') || '35').toLowerCase().trim();

            // Check for Unlimited Mode
            if (rawTimeParam === 'unlimited' || rawTimeParam === 'none' || rawTimeParam === '0') {
                timerDisplay.textContent = "Unlimited";
                return;
            }

            // Parse user-selected minutes (default to 35 if invalid)
            let durationMinutes = parseInt(rawTimeParam, 10);
            if (isNaN(durationMinutes) || durationMinutes <= 0) {
                durationMinutes = 35;
            }

            let totalSeconds = durationMinutes * 60;

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            };

            timerDisplay.textContent = formatTime(totalSeconds);

            examTimerInterval = setInterval(() => {
                totalSeconds--;
                if (totalSeconds <= 0) {
                    clearInterval(examTimerInterval);
                    timerDisplay.textContent = "00:00";
                    alert("Time's up! Submitting your Practice Session.");
                    if (typeof submitFromHeader === "function") submitFromHeader();
                } else {
                    timerDisplay.textContent = formatTime(totalSeconds);
                }
            }, 1000);
        }

        function getListeningPracticeFocusPartId() {
            const params = new URLSearchParams(window.location.search);
            const testType = String(params.get("testType") || "mocktest").toLowerCase();
            if (testType !== "practicetest") return null;

            const focus = String(params.get("focus") || "").toLowerCase();
            if (focus === "part1" || focus === "parta") return 1;
            if (focus === "part2" || focus === "partb") return 2;
            if (focus === "part3" || focus === "partc") return 3;
            return null;
        }
        let audioUrlsByPart = {};
        let audioFirebaseByPart = {};
        let waveformEnergyState = {
            bass: 0.06,
            lowMid: 0.06,
            highMid: 0.06,
            treble: 0.06,
            pitch: 0.22
        };
        let waveformShouldStopWhenSilent = false;
        const AUDIO_SPEED_STEPS = [0.75, 1, 1.25, 1.5, 2];
        let zoomLevel = 1;
        let frameFitScale = 1;
        let zoomBeforeFullScreen = null;

        const ZOOM_MIN = 0.8;
        const ZOOM_MAX = 1.3;
        const ZOOM_STEP = 0.1;
        const DEFAULT_ZOOM = 1.1;

        function clampZoom(value) {
            return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Number(value) || 1));
        }

        function isFirebaseRtdbEnabled() {
            return true;
        }

        function markFirebaseRtdbDisabled() {
            // Keep Firebase connected; only mark this call as failed.
        }

        function updateZoomButtons() {
            const zoomInButton = document.getElementById("zoom-in-btn");
            const zoomOutButton = document.getElementById("zoom-out-btn");
            if (zoomInButton) zoomInButton.disabled = zoomLevel >= ZOOM_MAX;
            if (zoomOutButton) zoomOutButton.disabled = zoomLevel <= ZOOM_MIN;
        }

        function applyZoom(value, options = {}) {
            const { persist = true } = options;
            zoomLevel = clampZoom(value);
            const examShell = document.querySelector("#user-view .exam-shell");
            if (examShell) {
                const safeFrameFitScale = Math.max(frameFitScale, 0.01);
                const combinedScale = zoomLevel * safeFrameFitScale;
                const verticalBoost = combinedScale < 1 ? 0.75 : 0;
                examShell.style.transformOrigin = "top left";
                examShell.style.transform = `scale(${combinedScale})`;
                examShell.style.width = `${100 / combinedScale}%`;
                examShell.style.height = `${100 / combinedScale + verticalBoost}%`;
                examShell.style.minHeight = `${100 / combinedScale + verticalBoost}%`;
            }
            if (persist) {
                localStorage.setItem(ZOOM_KEY, String(zoomLevel));
            }
            updateZoomButtons();
        }

        function handleZoomIn() {
            applyZoom(zoomLevel + ZOOM_STEP);
        }

        function handleZoomOut() {
            applyZoom(zoomLevel - ZOOM_STEP);
        }

        function initZoom() {
            const saved = Number(localStorage.getItem(ZOOM_KEY));
            const migratedSaved = Number.isFinite(saved) && saved > 1 ? saved : DEFAULT_ZOOM;
            applyZoom(migratedSaved);
        }

        function updateFullScreenButton() {
            const fullScreenButton = document.getElementById("fullscreen-btn");
            if (!fullScreenButton) return;
            const isFullScreen = Boolean(document.fullscreenElement);
            fullScreenButton.setAttribute("aria-label", isFullScreen ? "Exit full screen" : "Enter full screen");
            fullScreenButton.classList.toggle("is-active", isFullScreen);
        }

        function handleFullScreenStateChange() {
            const isFullScreen = Boolean(document.fullscreenElement);
            if (!isFullScreen && zoomBeforeFullScreen !== null) {
                applyZoom(zoomBeforeFullScreen, { persist: false });
                zoomBeforeFullScreen = null;
            }
            updateFullScreenButton();
        }

        async function toggleFullScreenMode() {
            try {
                if (!document.fullscreenElement) {
                    const userView = document.getElementById("user-view");
                    zoomBeforeFullScreen = zoomLevel;
                    applyZoom(1, { persist: false });
                    await (userView || document.documentElement).requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
            } catch (error) {
                console.warn("[Fullscreen] Unable to toggle full screen:", error);
            } finally {
                handleFullScreenStateChange();
            }
        }

        function toggleExplanationLanguage(event) {
            // Implement the logic to toggle the explanation language here.
            console.log("Toggling explanation language", event);
        }

        function isPracticeTestType(testType = currentTestType) {
            return String(testType || "").toLowerCase().includes("practice");
        }

        function padQuestionNumber(questionNumber) {
            return String(Number(questionNumber || 0)).padStart(2, "0");
        }

        // Only practice-test Part A in instant-feedback mode splits audio per question.
        function usesPerQuestionAudio(partId, questionNumber, testType = currentTestType) {
            return isPracticeTestType(testType)
                && isInstantFeedbackMode()
                && Number(partId) === 1
                && Number(questionNumber) > 0;
        }

        function getAudioStorageKey(setId, partId = 1, questionNumber = null) {
            if (usesPerQuestionAudio(partId, questionNumber)) {
                return `${MODULE_ID}:${setId}:q-${padQuestionNumber(questionNumber)}`;
            }
            return `${MODULE_ID}:${setId}:part-${partId}`;
        }

        function openAudioDatabase() {
            return new Promise((resolve, reject) => {
                if (!("indexedDB" in window)) {
                    resolve(null);
                    return;
                }

                const request = window.indexedDB.open(AUDIO_DB_NAME, 1);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(AUDIO_STORE_NAME)) {
                        db.createObjectStore(AUDIO_STORE_NAME, { keyPath: "id" });
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function saveAudioRecord(record) {
            return openAudioDatabase().then((db) => new Promise((resolve, reject) => {
                if (!db) {
                    resolve(false);
                    return;
                }
                const tx = db.transaction(AUDIO_STORE_NAME, "readwrite");
                const store = tx.objectStore(AUDIO_STORE_NAME);
                store.put(record);
                tx.oncomplete = () => {
                    db.close();
                    resolve(true);
                };
                tx.onerror = () => {
                    db.close();
                    reject(tx.error);
                };
            }));
        }

        function getAudioRecordBySetAndPart(setId, partId = 1, questionNumber = null) {
            if (!setId) return Promise.resolve(null);
            return openAudioDatabase().then((db) => new Promise((resolve, reject) => {
                if (!db) {
                    resolve(null);
                    return;
                }
                const tx = db.transaction(AUDIO_STORE_NAME, "readonly");
                const store = tx.objectStore(AUDIO_STORE_NAME);
                const request = store.get(getAudioStorageKey(setId, partId, questionNumber));
                request.onsuccess = () => {
                    db.close();
                    resolve(request.result || null);
                };
                request.onerror = () => {
                    db.close();
                    reject(request.error);
                };
            }));
        }

        function getLatestAudioRecordForModule(partId = null) {
            return openAudioDatabase().then((db) => new Promise((resolve, reject) => {
                if (!db) {
                    resolve(null);
                    return;
                }
                const tx = db.transaction(AUDIO_STORE_NAME, "readonly");
                const store = tx.objectStore(AUDIO_STORE_NAME);
                const request = store.getAll();
                request.onsuccess = () => {
                    const latest = (request.result || [])
                        .filter((item) => item && item.module === MODULE_ID && item.setId && item.blob)
                        .filter((item) => partId == null || Number(item.partId || 1) === Number(partId))
                        .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime())[0] || null;
                    db.close();
                    resolve(latest);
                };
                request.onerror = () => {
                    db.close();
                    reject(request.error);
                };
            }));
        }

        function inferPlaybackSource(url = "") {
            const normalized = String(url || "").toLowerCase();
            if (normalized.includes("/audio-proxy?")) return "proxy";
            if (normalized.includes("r2.dev") || normalized.includes("cloudflare") || normalized.includes("audio/listening/")) return "direct";
            if (normalized.includes("firebasestorage")) return "firebase";
            if (normalized.startsWith("blob:")) return "local_blob";
            return "unknown";
        }

        }

        async function sendAudioPlaybackTelemetry(eventName, payload = {}) {
            const allowedEvents = ["loadeddata", "fallback_activated", "audio_error"];
            if (!allowedEvents.includes(String(eventName))) return;

            const partId = Number(payload.partId || activePartId || 1);
            if (!AUDIO_PART_IDS.includes(partId)) return;

            const attemptedUrl = String(payload.url || "").trim();
            if (!attemptedUrl) return;

            const runtimeApiGatewayUrl = await resolveRuntimeApiGatewayUrl();
            const apiBases = getApiGatewayBaseCandidates(runtimeApiGatewayUrl);
            const body = {
                event: eventName,
                setId: String(payload.setId || currentSetId || ""),
                partKey: getActivePartKey(partId),
                source: String(payload.source || inferPlaybackSource(attemptedUrl) || "unknown"),
                attemptedUrl,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent || ""
            };

            for (const apiBase of apiBases) {
                try {
                    await fetch(`${apiBase}/api/developer/audio-playback-event`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(body),
                        keepalive: true,
                    });
                    return;
                } catch {
                    // Try next candidate.
                }
            }
        }

        function resetWebAudioAnalyzerIfSourceChanged() {
            if (!audioSourceNode || !audioContext) return;
            try {
                const audio = document.getElementById("cbt-audio-player");
                if (!audio) return;
                const currentSource = String(audio.currentSrc || audio.src || "");
                const lastRecordedSource = audio.dataset?.webAudioLastSrc || "";
                
                if (currentSource && currentSource !== lastRecordedSource && currentSource !== "blob:") {
                    console.log("[AudioAnalyzer] Resetting Web Audio state due to source change");
                    audioSourceNode.disconnect();
                    audioSourceNode = null;
                    audioAnalyser = null;
                    audioAnalyzerReady = false;
                    if (audio.dataset) {
                        audio.dataset.webAudioLastSrc = currentSource;
                    }
                }
            } catch (error) {
                console.warn("[AudioAnalyzer] Reset failed:", error);
                audioSourceNode = null;
                audioAnalyzer = null;
                audioAnalyzerReady = false;
            }
        }

        function setAudioSourceFromUrl(url, setId = currentSetId, partId = activePartId || 1, fallbackUrls = []) {
            const audio = document.getElementById("cbt-audio-player");
            if (!audio || !url) return;
            revokeCurrentAudioUrl();
            currentAudioObjectUrl = null;
            
            // Clear old fallback URLs before loading new ones
            currentAudioFallbackUrls = [];
            audioFallbackAttempted = false;
            currentAudioPlaybackSource = inferPlaybackSource(url);

            const normalizedFallbacks = Array.isArray(fallbackUrls)
                ? fallbackUrls.filter((item) => item && item !== url)
                : [];
            if (normalizedFallbacks.length > 0) {
                currentAudioFallbackUrls = normalizedFallbacks;
            }
            
            // Only get fallback candidates if url is a Cloudflare URL (not Firebase Storage)
            // This prevents mixing old Firebase fallbacks with new Cloudflare sources
            if (url && url.includes("r2.dev")) {
                // Part-level candidates would replace a per-question/talk clip with the full part audio.
                const partCandidates = !url.includes("/question_set/") && currentAudioFallbackUrls.length === 0
                    && window.toeflStorage && typeof toeflStorage.getAudioUrlCandidates === "function" && setId
                    ? (toeflStorage.getAudioUrlCandidates(setId, partId, url) || [])
                    : [];
                currentAudioFallbackUrls = [...buildGatewayAudioProxyUrls(url), ...currentAudioFallbackUrls, ...partCandidates]
                    .filter((item, index, arr) => item && item !== url && arr.indexOf(item) === index);
            }
            
            audio.removeAttribute("crossorigin");
            audio.muted = false;
            audio.volume = 1;
            audio.src = url;
            audio.preload = "auto";
            audio.load();
            audio.currentTime = 0;
            audioIsLocked = false;
            resetWebAudioAnalyzerIfSourceChanged();
            updateAudioShellStatus();
        }

        function canUseWebAudioAnalyzer(audio) {
            if (!audio) return false;
            const src = String(audio.currentSrc || audio.src || "");
            if (!src) return false;
            if (src.startsWith("blob:")) return true;
            try {
                const srcUrl = new URL(src, window.location.href);
                return srcUrl.origin === window.location.origin;
            } catch {
                return false;
            }
        }

        // Some networks/ISPs block or intercept r2.dev (ERR_CERT_COMMON_NAME_INVALID); the gateway streams the same object.
        function buildGatewayAudioProxyUrls(r2Url) {
            const match = String(r2Url || "").match(/r2\.dev\/(audio\/listening\/sets\/[^?#]+)/i);
            if (!match) return [];
            const objectKey = decodeURIComponent(match[1]);
            const pageOrigin = window.location?.origin || "";
            return getApiGatewayBaseCandidates(runtimeApiGatewayUrlCache || window.__TOEFL_API_GATEWAY_URL__ || "")
                .filter((base) => base && base !== pageOrigin)
                .map((base) => `${base}/api/developer/audio-proxy?objectKey=${encodeURIComponent(objectKey)}`);
        }

        async function tryFallbackAudioSource() {
            const audio = document.getElementById("cbt-audio-player");
            if (!audio || currentAudioFallbackUrls.length === 0) return false;

            while (currentAudioFallbackUrls.length > 0) {
                const nextUrl = currentAudioFallbackUrls.shift();
                if (!nextUrl || nextUrl === audio.src) continue;
                audio.src = nextUrl;
                audio.currentTime = 0;
                try {
                    await audio.play();
                    currentAudioPlaybackSource = inferPlaybackSource(nextUrl);
                    await sendAudioPlaybackTelemetry("fallback_activated", {
                        partId: activePartId || 1,
                        setId: currentSetId,
                        source: currentAudioPlaybackSource,
                        url: nextUrl,
                    });
                    updateAudioShellStatus();
                    return true;
                } catch (playError) {
                    // Autoplay being blocked means the source itself loaded fine; keep it.
                    if (playError?.name === "NotAllowedError") {
                        currentAudioPlaybackSource = inferPlaybackSource(nextUrl);
                        updateAudioShellStatus();
                        return true;
                    }
                }
            }

            return false;
        }

        let audioRestoreToken = 0;

        async function restoreAudioForCurrentSet(partId = activePartId || 1, questionNumber = null) {
            if (!AUDIO_PART_IDS.includes(Number(partId || 1))) {
                return false;
            }

            if (!currentSetId) {
                AUDIO_PART_IDS.forEach((id) => setAudioLabelEmpty(id));
                if (isPartActive(partId)) clearAudioSource();
                return false;
            }

            const isInstantPractice = isPracticeTestType() && isInstantFeedbackMode();
            if (isInstantPractice && !Number(questionNumber)) questionNumber = getCurrentInstantQuestionNumber();
            // Instant Part A must never fall back to the full-part clip while the question is unknown.
            if (isInstantPractice && Number(partId) === 1 && !Number(questionNumber)) return false;

            // Concurrent restores resolve out of order; only the latest one may touch the player.
            const restoreToken = ++audioRestoreToken;
            const canApply = () => isPartActive(partId) && restoreToken === audioRestoreToken;

            // Practice-test Part A in instant mode plays one clip per question; everything else plays the whole part.
            const useQuestionAudio = usesPerQuestionAudio(partId, questionNumber);
            const practiceGroup = isPracticeTestType() && isInstantFeedbackMode()
                ? getAudioGroupForQuestion(partId, questionNumber, true)
                : null;

            try {
                const groupRecord = practiceGroup
                    ? getInstantDraft()?.parts?.[partId]?.groupAudio?.[practiceGroup.key]
                    : null;
                const groupObjectKey = String(groupRecord?.objectKey || "");
                const groupBelongsToCurrentSet = !groupObjectKey || groupObjectKey.includes(`/sets/${currentSetId}/`);
                const groupAudioUrl = groupBelongsToCurrentSet ? String(groupRecord?.url || "").trim() : "";
                if (groupAudioUrl) {
                    if (canApply()) {
                        setAudioSourceFromUrl(groupAudioUrl, currentSetId, partId);
                    }
                    setAudioLabelReady(`cloud audio (${practiceGroup.key})`, partId);
                    return true;
                }

                const storageUrl = await getCloudAudioUrl(currentSetId, partId, 3500, useQuestionAudio ? questionNumber : null);
                let fallbackUrls = [];
                if (!useQuestionAudio && window.toeflStorage && typeof toeflStorage.getAudioRecordFromFirebase === "function") {
                    const record = await toeflStorage.getAudioRecordFromFirebase(currentSetId, partId).catch(() => null);
                    const objectKey = String(record?.objectKey || "").trim();
                    const directUrl = String(record?.url || "").trim();

                    if (objectKey) {
                        const runtimeApiGatewayUrl = await resolveRuntimeApiGatewayUrl();
                        const apiBases = getApiGatewayBaseCandidates(runtimeApiGatewayUrl);
                        for (const apiBase of apiBases) {
                            try {
                                const response = await fetch(`${apiBase}/api/developer/audio-url?objectKey=${encodeURIComponent(objectKey)}`, { method: "GET" });
                                if (!response.ok) continue;
                                const payload = await response.json().catch(() => ({}));
                                const proxyUrl = String(payload?.audioUrl || "").trim();
                                const fallbackUrl = String(payload?.fallbackUrl || "").trim();
                                if (proxyUrl) {
                                    fallbackUrls = [fallbackUrl, directUrl, storageUrl].filter(Boolean).filter((v, i, arr) => arr.indexOf(v) === i);
                                    if (canApply()) {
                                        setAudioSourceFromUrl(proxyUrl, currentSetId, partId, fallbackUrls);
                                    }
                                    setAudioLabelReady(`cloud audio`, partId);
                                    return true;
                                }
                            } catch {
                                // Try next candidate.
                            }
                        }
                    }

                    fallbackUrls = [directUrl].filter(Boolean);
                }

                if (storageUrl) {
                    if (canApply()) {
                        setAudioSourceFromUrl(storageUrl, currentSetId, partId, fallbackUrls);
                    }
                    setAudioLabelReady(useQuestionAudio ? `cloud audio (Q${questionNumber})` : `cloud audio`, partId);
                    return true;
                }

                // Fallback to IndexedDB
                let record = await getAudioRecordBySetAndPart(currentSetId, partId, useQuestionAudio ? questionNumber : null);
                // Backward compatibility: old builds stored only one file without part suffix.
                if (!record && Number(partId) === 1) {
                    record = await openAudioDatabase().then((db) => new Promise((resolve, reject) => {
                        if (!db) {
                            resolve(null);
                            return;
                        }
                        const tx = db.transaction(AUDIO_STORE_NAME, "readonly");
                        const store = tx.objectStore(AUDIO_STORE_NAME);
                        const request = store.get(`${MODULE_ID}:${currentSetId}`);
                        request.onsuccess = () => {
                            db.close();
                            resolve(request.result || null);
                        };
                        request.onerror = () => {
                            db.close();
                            reject(request.error);
                        };
                    }));
                }
                if (!record || !record.blob) {
                    setAudioLabelEmpty(partId);
                    if (canApply()) clearAudioSource();
                    return false;
                }

                if (canApply()) {
                    setAudioSourceFromBlob(record.blob);
                }
                setAudioLabelReady(record.fileName, partId);
                return true;
            } catch (error) {
                console.warn("[AudioPersistence] restore failed:", error);
                if (canApply()) clearAudioSource();
                return false;
            }
        }

        function isValidCloudflareFolderUrl(url = "") {
            const normalized = String(url || "").trim().toLowerCase();
            if (!normalized.includes("/audio/") || (!normalized.includes("/sets/") && !normalized.includes("/listening/"))) {

            if (normalized.endsWith(".mp3") || normalized.endsWith(".m4a") || normalized.endsWith(".wav")) {

        // In-memory cache for Cloudflare folder URLs to avoid re-fetching for every part
        const cloudflareUrlCache = {};

        async function getCloudAudioUrl(setId, partId = 1, timeoutMs = 3500, questionNumber = null) {
            if (!setId) return null;

            const testType = currentTestType || "mocktest";
            const cacheKey = `${testType}_${setId}`;
            const useQuestionAudio = usesPerQuestionAudio(partId, questionNumber, testType);
            const objectSuffix = useQuestionAudio
                ? `question_set/part_${partId}/q_${padQuestionNumber(questionNumber)}.mp3`
                : `part_${partId}.mp3`;

            // Check in-memory cache first (same setId for all parts)
            if (cloudflareUrlCache[cacheKey]) {
                const cachedFolderUrl = cloudflareUrlCache[cacheKey];
                const r2Url = `${cachedFolderUrl}/${objectSuffix}`;
                console.log("[AudioPlayback] Using cached Cloudflare folder URL for part", partId, ":", r2Url);
                return r2Url;
            }

            // Fetch from Firebase RTDB (with timeout to avoid blocking on part 2+)
            try {
                const firebaseFolderUrl = await getCloudflareAudioFolderUrlFromFirebase(setId);
                if (firebaseFolderUrl) {
                    const folderUrl = normalizeCloudAudioFolderUrl(firebaseFolderUrl);
                    if (folderUrl && isValidCloudflareFolderUrl(folderUrl)) {
                        // Cache it in memory for next part
                        cloudflareUrlCache[cacheKey] = folderUrl;
                        const r2Url = `${folderUrl}/${objectSuffix}`;
                        console.log("[AudioPlayback] Using Cloudflare folder URL from Firebase for part", partId, ":", r2Url);
                        return r2Url;
                    }
                }
            } catch (error) {
                console.warn("[AudioPlayback] Firebase fetch failed, will try fallback:", error);
            }

            if (useQuestionAudio) {
                return null;
            }

            // ONLY fall back to Firebase Storage if Cloudflare is completely unavailable
            console.warn("[AudioPlayback] No valid Cloudflare URL found for setId", setId, "- using Firebase Storage fallback");
            if (!window.toeflStorage) return null;
            const fetchAudioUrl = typeof window.toeflStorage.getPlayableAudioUrl === "function"
                ? window.toeflStorage.getPlayableAudioUrl.bind(window.toeflStorage)
                : (typeof window.toeflStorage.getPlayableAudioFromFirebase === "function"
                    ? window.toeflStorage.getPlayableAudioFromFirebase.bind(window.toeflStorage)
                    : window.toeflStorage.getAudioFromFirebase.bind(window.toeflStorage));
            const fetchPromise = fetchAudioUrl(setId, partId).catch(() => null);
            return await withTimeout(fetchPromise, timeoutMs, null);
        }

            const parsedDate = new Date(`${dateValue}T00:00:00`);

            const formatter = new Intl.DateTimeFormat("en-US", { day: "2-digit", month: "short" });
            const parts = formatter.formatToParts(parsedDate);
            const day = parts.find((item) => item.type === "day")?.value || "01";
            const month = parts.find((item) => item.type === "month")?.value || "Jan";
            return `Package ${day} ${month}`;

        async function ensureCurrentSetId(setDate, testType) {
            // 1. Resolve testType dynamically from argument, global state, or URL parameters
