<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Test History | TOEFL ITP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="toefl-navigation.css?v=20260918b">
    <style>
        :root {
            color-scheme: light;
            --ink: #152437;
            --muted: #7a8fa6;
            --navy: #08265f;
            --blue: #005faa;
            --teal: #0d9488;
            --line: #d1dce8;
            --surface: #f4f7fb;
            --white: #ffffff;
        }

        * { box-sizing: border-box; }
        body { margin: 0; min-width: 320px; min-height: 100vh; color: var(--ink); background: var(--surface); font-family: "Inter", sans-serif; }
        button, input, select { font: inherit; }
        button, a, select { -webkit-tap-highlight-color: transparent; }
        .app-shell { min-height: 100vh; display: grid; grid-template-columns: 218px minmax(0, 1fr); grid-template-rows: 70px minmax(0, 1fr); }
        .topbar { grid-column: 1 / -1; grid-row: 1; display: grid; grid-template-columns: 218px minmax(0, 1fr); background: var(--white); border-bottom: 1px solid var(--line); }
        .brand-area { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 16px 22px;           /* Match Figma padding (top/bottom: 16px, left/right: 15px) */
            gap: 12px;                    /* Match Figma spacing between logo and toggle button */
            border-right: 1px solid var(--line); 
            box-sizing: border-box;       /* Include padding within width/height dimensions */
        }

        .brand { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px;                     /* Spacing between the icon and the text image */
            color: var(--teal); 
            text-decoration: none; 
            font-size: 15px; 
            font-weight: 800; 
            white-space: nowrap; 
        }

        .brand img:nth-child(1) {
            width: 36px;                  /* Calendar check icon size */
            height: 36px;
            object-fit: contain;
        }

        .brand img:nth-child(2) {
            height: 28px;                 /* "QUICK CHECK" text graphic height */
            width: auto;                  /* Keeps text graphic from distorting */
            object-fit: contain;
        }
        .collapse-button, .icon-button { display: inline-grid; align-items: center; place-items: center; flex: 0 0 auto; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: #475569; cursor: pointer; }
        .collapse-button:hover, .icon-button:hover { background: #f1f5f9; }
        .topbar-main { display: flex; align-items: center; justify-content: space-between; gap: 18px; min-width: 0; padding: 0 24px; }
        .nav-calendar-icon { width: 13.3px; height: 15px; flex: 0 0 auto; stroke-width: 1.5; }
        .nav-calendar-day { font: 700 6px "Space Grotesk", sans-serif; }
        .top-links, .top-actions { display: flex; align-items: center; gap: 10px; }
        .top-link { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 14px; border: 1px solid transparent; border-radius: 22px; color: #0e7067; text-decoration: none; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .top-link.is-current { border-color: #e3edf0; background: #fff; box-shadow: 0 1px 4px rgba(14,112,103,.1); }
        .upgrade-link { display: inline-flex; align-items: center; min-height: 34px; padding: 0 15px; border-radius: 20px; color: #fff; background: var(--teal); text-decoration: none; font-size: 12px; font-weight: 600; }
        .top-avatar { width: 32px; height: 32px; border: 2px solid #e7eef4; border-radius: 50%; object-fit: cover; }
        .sidebar { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; justify-content: space-between; min-height: calc(100vh - 70px); padding: 18px 12px 20px; background: var(--white); border-right: 1px solid var(--line); }
        .side-groups { display: grid; align-content: start; gap: 22px; }
        .side-group { display: grid; gap: 5px; }
        .side-heading { margin: 0 8px 3px; color: #475569; font-size: 10px; font-weight: 700; letter-spacing: .04em; }
        .side-link { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 10px; border-radius: 8px; color: #1c1c1c; text-decoration: none; font-size: 12px; }
        .side-link i { display: inline-grid; place-items: center; width: 18px; color: #344b62; font-size: 16px; }
        .side-link:hover, .side-link.is-active { color: var(--blue); background: #f0f7fd; }
        .side-link.is-active { font-weight: 600; }
        .side-profile { display: flex; align-items: center; gap: 10px; padding: 15px 7px 0; border-top: 1px solid #e6eef7; }
        .side-profile img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
        .side-profile strong, .side-profile small { display: block; }
        .side-profile strong { font-size: 12px; font-weight: 600; }
        .side-profile small { margin-top: 3px; color: #8495a7; font-size: 10px; }
        .history-main { grid-column: 2; grid-row: 2; min-width: 0; padding: 24px clamp(18px, 3vw, 40px) 40px; }
        .history-content { width: min(1176px, 100%); margin: 0 auto; }
        .hero { display: grid; grid-template-columns: minmax(0, 1fr) 191px; align-items: center; gap: 32px; min-height: 170px; padding: 0 8px 18px; }
        .breadcrumbs { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
        h1 { margin: 0; color: var(--navy); font-size: 34px; line-height: 1.15; font-weight: 800; }
        .hero-copy { max-width: 590px; margin: 9px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
        .hero-art { display: block; width: 191px; height: 155px; object-fit: contain; }
        .history-panel { padding: 24px; border-radius: 12px; background: var(--white); }
        .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
        .tabs { display: flex; align-self: stretch; gap: 4px; border-bottom: 1px solid var(--line); }
        .tab { display: inline-flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 14px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; }
        .tab[aria-selected="true"] { border-bottom-color: var(--blue); color: var(--blue); }
        .tab-count { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 6px; background: #e0f2fe; color: var(--blue); font-size: 11px; }
        .filters { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-width: 0; }
        .filter-wrap { position: relative; display: flex; align-items: center; }
        .filter-wrap > i { position: absolute; left: 12px; color: #8194a9; pointer-events: none; }
        .filter-select, .search-input { min-height: 38px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: #70859b; font-size: 12px; }
        .filter-select { min-width: 126px; padding: 0 28px 0 36px; }
        .search-wrap { position: relative; display: flex; align-items: center; width: min(205px, 25vw); }
        .search-wrap i { position: absolute; left: 12px; color: #8194a9; }
        .search-input { width: 100%; padding: 0 12px 0 36px; outline: none; }
        .search-input::placeholder { color: #a0b0c0; }
        .search-input:focus, .filter-select:focus { border-color: #73b7df; outline: 3px solid rgba(14,165,233,.12); }
        .attempt-list { display: grid; gap: 14px; }
        .attempt-card { display: grid; grid-template-columns: 122px minmax(0, 1fr) 150px 104px; align-items: center; gap: 20px; min-height: 132px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
        .attempt-card.is-latest { background: #e0f2fe; }
        .attempt-art { width: 122px; height: 100px; object-fit: contain; }
        .attempt-copy { min-width: 0; }
        .attempt-title-line { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 13px; }
        .attempt-title { margin: 0; color: #101820; font: 700 19px/1.2 "Outfit", sans-serif; }
        .status-pill { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 9px; border-radius: 20px; background: #ccfbf1; color: var(--teal); font-size: 11px; font-weight: 700; }
        .status-pill i { font-size: 14px; }
        .attempt-subtitle { margin: 0 0 12px; color: #71869b; font-size: 12px; line-height: 1.45; }
        .attempt-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; color: #8296aa; font-size: 11px; }
        .attempt-meta span { display: inline-flex; align-items: center; gap: 6px; }
        .meta-divider { width: 1px; height: 14px; margin: 0 8px; background: #b8c8d7; }
        .score-box { display: grid; align-content: center; gap: 7px; min-height: 68px; padding: 10px 12px; border: 1px solid #dce6f0; border-radius: 9px; background: #fff; }
        .is-latest .score-box { border-color: transparent; background: var(--navy); color: #fff; }
        .score-label { color: inherit; font-size: 10px; font-weight: 600; }
        .score-number { color: #475569; font: 600 23px/1 "Outfit", sans-serif; white-space: nowrap; }
        .is-latest .score-number { color: #fff; }
        .score-number small { margin-left: 5px; font-size: 13px; font-weight: 500; }
        .attempt-actions { display: grid; gap: 8px; }
        .attempt-action { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 0 9px; border: 1px solid #dce6f0; border-radius: 18px; background: #fff; color: #6c8298; text-decoration: none; font-size: 10px; font-weight: 500; white-space: nowrap; }
        .attempt-action:hover { border-color: #91bad3; color: var(--blue); }
        .attempt-action i { font-size: 14px; }
        .empty-state { display: grid; justify-items: center; gap: 10px; padding: 54px 18px; border: 1px dashed #cad8e5; border-radius: 10px; color: #71869b; text-align: center; }
        .empty-state i { color: #7aa9c8; font-size: 28px; }
        .empty-state h2 { margin: 0; color: #233b53; font: 600 17px "Outfit", sans-serif; }
        .empty-state p { max-width: 380px; margin: 0; font-size: 12px; line-height: 1.5; }
        .pagination { display: flex; align-items: center; justify-content: center; gap: 5px; min-height: 38px; margin-top: 18px; }
        .page-button { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 7px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: #71869b; font-size: 11px; cursor: pointer; }
        .page-button[aria-current="page"] { border-color: var(--blue); background: var(--blue); color: #fff; }
        .page-button:disabled { opacity: .45; cursor: default; }
        .pagination-note { margin: 0 0 0 9px; color: #8296aa; font-size: 11px; }
        .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

        @media (max-width: 1180px) {
            .toolbar { align-items: flex-start; flex-direction: column; }
            .filters { width: 100%; justify-content: flex-start; }
            .search-wrap { width: min(280px, 40vw); }
        }
        @media (max-width: 900px) {
            .app-shell, .topbar { grid-template-columns: 72px minmax(0, 1fr); }
            .brand-area { justify-content: center; padding: 0; }
            .brand span, .collapse-button, .side-heading, .side-link span, .side-profile > div { display: none; }
            .sidebar { align-items: center; padding: 16px 10px; }
            .side-groups { width: 100%; gap: 18px; }
            .side-group { justify-items: center; }
            .side-link { justify-content: center; width: 42px; padding: 0; }
            .side-link i { font-size: 18px; }
            .side-profile { justify-content: center; width: 100%; padding-right: 0; padding-left: 0; }
            .side-profile img { width: 34px; height: 34px; }
            .topbar-main { padding: 0 14px; }
            .history-main { padding: 20px 16px 32px; }
            .attempt-card { grid-template-columns: 88px minmax(0, 1fr) 126px; gap: 14px; padding: 14px; }
            .attempt-art { width: 88px; height: 82px; }
            .attempt-actions { grid-column: 2 / -1; grid-row: 2; display: flex; justify-content: flex-end; }
        }
        @media (max-width: 620px) {
            .app-shell { grid-template-columns: 1fr; grid-template-rows: 58px auto minmax(0,1fr); }
            .topbar { grid-column: 1; grid-row: 1; grid-template-columns: 1fr; min-width: 0; }
            .brand-area { display: none; }
            .topbar-main { padding: 0 12px; }
            .top-links { min-width: 0; gap: 2px; }
            .top-link { min-height: 34px; padding: 0 8px; font-size: 10px; }
            .top-actions { gap: 3px; }
            .upgrade-link { display: none; }
            .sidebar { grid-column: 1; grid-row: 2; min-height: 0; padding: 6px 8px; border-right: 0; border-bottom: 1px solid var(--line); }
            .side-groups { display: flex; justify-content: space-around; gap: 4px; }
            .side-group { display: flex; }
            .side-link { width: 42px; height: 36px; }
            .side-profile { display: none; }
            .history-main { grid-column: 1; grid-row: 3; padding: 16px 12px 28px; }
            .hero { grid-template-columns: minmax(0,1fr) 90px; gap: 8px; min-height: 130px; padding: 0 2px 14px; }
            .hero-art { width: 90px; height: 90px; }
            h1 { font-size: 27px; }
            .hero-copy { font-size: 12px; }
            .history-panel { padding: 14px 10px; }
            .toolbar { gap: 12px; margin-bottom: 16px; }
            .tabs { width: 100%; }
            .tab { flex: 1; justify-content: center; gap: 6px; padding: 0 4px; font-size: 11px; }
            .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
            .filter-wrap, .filter-select, .search-wrap { width: 100%; min-width: 0; }
            .search-wrap { grid-column: 1 / -1; }
            .attempt-card { grid-template-columns: 58px minmax(0,1fr); gap: 8px 12px; min-height: 0; padding: 12px; }
            .attempt-art { grid-column: 1; grid-row: 1; width: 58px; height: 58px; }
            .attempt-copy { grid-column: 2; grid-row: 1; }
            .attempt-title-line { gap: 6px; margin-bottom: 7px; }
            .attempt-title { font-size: 16px; }
            .status-pill { min-height: 22px; padding: 0 7px; font-size: 9px; }
            .attempt-subtitle { margin-bottom: 7px; font-size: 11px; }
            .attempt-meta { gap: 4px; font-size: 10px; }
            .meta-divider { margin: 0 3px; }
            .score-box { grid-column: 1 / -1; grid-row: 2; display: flex; align-items: center; justify-content: space-between; min-height: 42px; padding: 7px 10px; }
            .score-number { font-size: 19px; }
            .score-label { font-size: 9px; }
            .attempt-actions { grid-column: 1 / -1; grid-row: 3; display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
            .attempt-action { min-height: 32px; font-size: 9px; }
            .empty-state { padding: 38px 14px; }
        }
        @media (prefers-reduced-motion: no-preference) {
            .attempt-card { animation: enter .28s ease both; }
            @keyframes enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        }
    </style>
</head>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script>
        (() => {
            const pageSize = 5;
            const state = { type: "mocktest", page: 1, attempts: [] };
            const list = document.getElementById("attemptList");
            const pagination = document.getElementById("pagination");
            const dateFilter = document.getElementById("dateFilter");
            const statusFilter = document.getElementById("statusFilter");
            const search = document.getElementById("historySearch");
            const sectionPaths = {
                listening: { review: "section 1-answered.html", test: "section 1.html", icon: "mock-listening.png" },
                structure: { review: "section 2-answered.html", test: "section 2.html", icon: "mock-structure.png" },
                reading: { review: "section 3-answered.html", test: "section 3.html", icon: "mock-reading.png" }
            };

            function escapeHtml(value) {
                return String(value == null ? "" : value).replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[character]));
            }

            function getDate(attempt) {
                const value = attempt.recordedAt || attempt.submittedAt || attempt.setDate;
                const date = new Date(value);
                return Number.isNaN(date.getTime()) ? null : date;
            }

            function formatDate(attempt) {
                const date = getDate(attempt);
                if (!date) return "Date unavailable";
                return new Intl.DateTimeFormat("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }).format(date);
            }

            function getFilteredAttempts() {
                const query = search.value.trim().toLowerCase();
                const days = Number(dateFilter.value) || 0;
                const afterDate = days ? Date.now() - days * 86400000 : 0;
                return state.attempts
                    .filter((attempt) => attempt.testType === state.type)
                    .filter((attempt) => statusFilter.value !== "completed" || attempt.status !== "in-progress")
                    .filter((attempt) => !days || (getDate(attempt) && getDate(attempt).getTime() >= afterDate))
                    .filter((attempt) => !query || `${attempt.sectionTitle} ${attempt.setId} ${attempt.testType} ${attempt.setDate}`.toLowerCase().includes(query))
                    .sort((left, right) => (getDate(right)?.getTime() || 0) - (getDate(left)?.getTime() || 0));
            }

            function makeLink(attempt, target) {
                const paths = sectionPaths[attempt.sectionKey] || sectionPaths.structure;
                const params = new URLSearchParams();
                if (attempt.setId) params.set("setId", attempt.setId);
                if (attempt.setDate) params.set("setDate", attempt.setDate);
                params.set("testType", attempt.testType || "mocktest");
                if (attempt.runMode) params.set("runMode", attempt.runMode);
                if (target === "review" && attempt.testType !== "practicetest") return `full-test-summary.html?${params.toString()}`;
                return `${paths[target]}?${params.toString()}`;
            }

            function renderAttempt(attempt, index, isLatest) {
                const rawScore = Math.max(0, Number(attempt.rawScore) || 0);
                const totalQuestions = Math.max(0, Number(attempt.totalQuestions) || 0);
                const section = sectionPaths[attempt.sectionKey] || sectionPaths.structure;
                const testName = attempt.testType === "practicetest" ? "Practice Test" : "Mock Test";
                const title = `${testName} - ${String(index).padStart(2, "0")}`;
                const sectionTitle = escapeHtml(attempt.sectionTitle || "TOEFL ITP");
                return `<article class="attempt-card${isLatest ? " is-latest" : ""}">
                    <img class="attempt-art" src="../asset/figma/test-history-card.png" alt="">
                    <div class="attempt-copy">
                        <div class="attempt-title-line"><h2 class="attempt-title">${title}</h2><span class="status-pill"><i data-lucide="circle-check"></i>Completed</span></div>
                        <p class="attempt-subtitle">${sectionTitle}${totalQuestions ? ` · ${totalQuestions} ${totalQuestions === 1 ? "question" : "questions"}` : ""}</p>
                        <div class="attempt-meta"><span><i data-lucide="calendar-days"></i>${escapeHtml(formatDate(attempt))}</span><span class="meta-divider" aria-hidden="true"></span><span><i data-lucide="circle-check"></i>${rawScore} correct</span></div>
                    </div>
                    <div class="score-box"><span class="score-label">Raw Score</span><strong class="score-number">${rawScore}<small>/ ${totalQuestions || "--"}</small></strong></div>
                    <div class="attempt-actions"><a class="attempt-action" href="${escapeHtml(makeLink(attempt, "review"))}"><i data-lucide="file-chart-column"></i>View Result</a><a class="attempt-action" href="${escapeHtml(makeLink(attempt, "test"))}"><i data-lucide="rotate-ccw"></i>Try Again</a></div>
                </article>`;
            }

            function renderPagination(totalPages, totalItems) {
                if (totalPages <= 1) {
                    pagination.innerHTML = totalItems ? `<span class="pagination-note">${totalItems} ${totalItems === 1 ? "attempt" : "attempts"}</span>` : "";
                    return;
                }
                let html = `<button class="page-button" type="button" data-page="${state.page - 1}" aria-label="Previous page" ${state.page === 1 ? "disabled" : ""}><i data-lucide="chevron-left"></i></button>`;
                for (let page = 1; page <= totalPages; page += 1) {
                    html += `<button class="page-button" type="button" data-page="${page}" ${page === state.page ? 'aria-current="page"' : ""}>${page}</button>`;
                }
                html += `<button class="page-button" type="button" data-page="${state.page + 1}" aria-label="Next page" ${state.page === totalPages ? "disabled" : ""}><i data-lucide="chevron-right"></i></button><span class="pagination-note">${totalItems} attempts</span>`;
                pagination.innerHTML = html;
            }

            function render() {
                state.attempts = window.toeflTestHistory ? window.toeflTestHistory.readAttempts() : [];
                const mockCount = state.attempts.filter((attempt) => attempt.testType === "mocktest").length;
                const practiceCount = state.attempts.filter((attempt) => attempt.testType === "practicetest").length;
                document.getElementById("mockCount").textContent = String(mockCount);
                document.getElementById("practiceCount").textContent = String(practiceCount);
                const filtered = getFilteredAttempts();
                const totalPages = Math.ceil(filtered.length / pageSize);
                state.page = Math.max(1, Math.min(state.page, totalPages || 1));
                const firstIndex = (state.page - 1) * pageSize;
                const visible = filtered.slice(firstIndex, firstIndex + pageSize);
                if (!visible.length) {
                    list.innerHTML = `<div class="empty-state"><i data-lucide="clipboard-list"></i><h2>No ${state.type === "practicetest" ? "practice" : "mock"} test attempts yet</h2><p>Completed tests will appear here automatically with their score and completion time.</p></div>`;
                } else {
                    const totalByType = state.attempts.filter((attempt) => attempt.testType === state.type).length;
                    list.innerHTML = visible.map((attempt, index) => renderAttempt(attempt, totalByType - firstIndex - index, firstIndex + index === 0)).join("");
                }
                renderPagination(totalPages, filtered.length);
                if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 1.7 } });
            }

            document.querySelectorAll("[data-test-type]").forEach((tab) => tab.addEventListener("click", () => {
                state.type = tab.dataset.testType;
                state.page = 1;
                document.querySelectorAll("[data-test-type]").forEach((item) => item.setAttribute("aria-selected", String(item === tab)));
                render();
            }));
            [dateFilter, statusFilter].forEach((control) => control.addEventListener("change", () => { state.page = 1; render(); }));
            search.addEventListener("input", () => { state.page = 1; render(); });
            pagination.addEventListener("click", (event) => {
                const button = event.target.closest("[data-page]");
                if (!button || button.disabled) return;
                state.page = Number(button.dataset.page) || 1;
                render();
            });
            document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
            if (window.toeflTestHistory) window.toeflTestHistory.subscribe(render);
            render();
        })();
    </script>
</body>
</html>
