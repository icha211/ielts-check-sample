<head>

    <style>

            gap: 20px;

            padding: 0 16px;

        .figma-header--listening .structure-writing {

        }

        .figma-header--listening .package-01-jan {

        }

        .figma-header--listening .timer-header-parent {

        }

        .figma-header--listening .progressbar-final {

            min-width: 0;

        .figma-header--listening .features {

        .reading-part-header {

            align-items: center;
            gap: 14px;
            width: auto;
            max-width: none;
            height: 64px;
            overflow: visible;
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
            flex: 0 1 auto;
            min-width: auto;
            margin-left: 0;
            margin-right: 0;
        }

        .reading-part-chip {

    <script src="toefl-storage-sync.js?v=20260801a"></script>
    <script>
        const TOTAL_PASSAGES = 5; 
        const SETS_KEY = "toefl_developer_sets_v1";
        const SETS_KEY_V2 = "toefl_developer_sets_v2";
        const MODULE_ID = "reading";
        const MODULE_LABEL = "Reading";
        const DRAFT_KEY = "toefl_section3_dev_draft_v1";
        let currentSetId = "";
        let currentTestType = "mocktest";

        function safeParse(raw, fallback) {
            try {
                return JSON.parse(raw) || fallback;
            } catch {
                return fallback;
            }
        }

        function getStoredSetMap() {
            const parsedV2 = safeParse(localStorage.getItem(SETS_KEY_V2), {});
            const hasV2 = parsedV2 && typeof parsedV2 === "object" && Object.keys(parsedV2).length > 0;
            const parsed = hasV2 ? parsedV2 : safeParse(localStorage.getItem(SETS_KEY), {});
            if (Array.isArray(parsed)) {
                return parsed.reduce((accumulator, item) => {
                    const key = item?.setId || item?.module;
                    if (item && key) accumulator[key] = item;
                    return accumulator;
                }, {});
            }
            return parsed && typeof parsed === "object" ? parsed : {};
        }

        function persistStoredSetMap(map) {
            localStorage.setItem(SETS_KEY_V2, JSON.stringify(map));
        }

        function upsertLocalRecord(record) {
            const map = getStoredSetMap();
            map[record.setId] = record;
            persistStoredSetMap(map);
        }

        function updateEditorUrl(setId, setDate) {
            const params = new URLSearchParams(window.location.search);
            params.set("setId", setId);
            if (setDate) params.set("setDate", setDate);
            const query = params.toString();
            const hash = window.location.hash || "#dev-view";
            window.history.replaceState({}, "", `${window.location.pathname}?${query}${hash}`);
        }

        function ensureCurrentSetId(setDate) {
            if (currentSetId) return currentSetId;
            if (window.toeflStorage && typeof toeflStorage.createSetId === "function") {
                currentSetId = toeflStorage.createSetId(MODULE_ID, setDate, currentTestType);
            } else {
                currentSetId = `${currentTestType}_${MODULE_ID}_${Date.now()}`;
            }
            return currentSetId;
        }

        async function resolveSetRecordByDate(setDate) {
            try {
                if (window.toeflStorage && typeof toeflStorage.getSetRecords === "function") {
                    const records = await toeflStorage.getSetRecords();
                    const match = (records || [])
                        .filter((item) => item && item.module === MODULE_ID && item.setDate === setDate)
                        .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime())[0];
                    if (match) return match;
                }
            } catch (error) {
                console.warn("[ToeflSync] date-based lookup failed:", error);
            }

            const local = getStoredSetMap();
            return Object.values(local)
                .filter((item) => item && item.module === MODULE_ID && item.setDate === setDate)
                .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime())[0] || null;
        }

        async function resolveLatestSetRecord() {
            try {
                if (window.toeflStorage && typeof toeflStorage.getSetRecords === "function") {
                    const records = await toeflStorage.getSetRecords();
                    const latest = (records || [])
                        .filter((item) => item && item.module === MODULE_ID)
                        .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime())[0];
                    if (latest) return latest;
                }
            } catch (error) {
                console.warn("[ToeflSync] latest-set lookup failed:", error);
            }

            const local = getStoredSetMap();
            return Object.values(local)
                .filter((item) => item && item.module === MODULE_ID)
                .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime())[0] || null;
        }

        function clearSectionDraftInputs() {
            for (let p = 1; p <= TOTAL_PASSAGES; p++) {
                const titleEl = document.getElementById(`input-title-${p}`);
                const passageEl = document.getElementById(`input-passage-${p}`);
                const qEl = document.getElementById(`input-magic-questions-${p}`);
                const aEl = document.getElementById(`input-answer-key-${p}`);
                const eEl = document.getElementById(`input-explanation-${p}`);

        async function handleSetDateChange() {
            const dateInput = document.getElementById("set-date");
            const selectedDate = dateInput?.value;
            if (!selectedDate) return;

            const existing = await resolveSetRecordByDate(selectedDate).catch(() => null);
            if (existing?.setId) {
                currentSetId = existing.setId;
                upsertLocalRecord(existing);
                updateEditorUrl(currentSetId, selectedDate);
                updateHeaderPackageLabel(selectedDate);
                await loadSectionDraft();
                updateUserView();
                return;
            }

            if (isDeveloperMode()) {
                currentSetId = "";
                clearSectionDraftInputs();
                await saveSectionMeta();
                updateUserView();
                return;
            }

            // User mode: do not create empty package metadata for dates with no real content.
            currentSetId = "";
            clearSectionDraftInputs();
            updateHeaderPackageLabel(selectedDate);
            updateUserView();
        }

        function saveSectionDraft() {
            const draft = { passages: {} };
            for (let p = 1; p <= TOTAL_PASSAGES; p++) {
                draft.passages[p] = {
                    title: (document.getElementById(`input-title-${p}`) || {}).value || "",
                    passage: (document.getElementById(`input-passage-${p}`) || {}).value || "",
                    questions: (document.getElementById(`input-magic-questions-${p}`) || {}).value || "",
                    answerKey: (document.getElementById(`input-answer-key-${p}`) || {}).value || "",
                    explanation: (document.getElementById(`input-explanation-${p}`) || {}).value || ""
                };
            }
            localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
            const setDate = (document.getElementById("set-date") || {}).value || new Date().toISOString().split("T")[0];
            const setId = ensureCurrentSetId(setDate);
            if (setId) {
                localStorage.setItem(`${DRAFT_KEY}_${setId}`, JSON.stringify(draft));
            }
            if (window.toeflStorage) {
                toeflStorage.saveDraftBySetIdAndType(setId, MODULE_ID, draft, currentTestType).catch((e) => console.warn("[ToeflSync] draft save failed:", e));
            }
        }

        async function loadSectionDraft() {
            let draft = {};
            if (currentSetId && window.toeflStorage) {
                try {
                    draft = await toeflStorage.getDraftBySetIdAndType(currentSetId, currentTestType);
                } catch { /* fallback below */ }
            }

            // Local fallback (per-set, then latest generic draft) so test tab always picks up updates.
            if ((!draft || typeof draft !== "object" || !draft.passages) && currentSetId) {
                draft = safeParse(localStorage.getItem(`${DRAFT_KEY}_${currentSetId}`), {});
            }
            if (!draft || typeof draft !== "object" || !draft.passages) {
                draft = safeParse(localStorage.getItem(DRAFT_KEY), {});
            }

            if (!draft || typeof draft !== "object" || !draft.passages) return;

            for (let p = 1; p <= TOTAL_PASSAGES; p++) {
                const row = draft.passages[p] || {};
                const titleEl = document.getElementById(`input-title-${p}`);
                const passageEl = document.getElementById(`input-passage-${p}`);
                const qEl = document.getElementById(`input-magic-questions-${p}`);
                const aEl = document.getElementById(`input-answer-key-${p}`);
                const eEl = document.getElementById(`input-explanation-${p}`);

                if (titleEl && typeof row.title === "string") titleEl.value = row.title;
                if (passageEl && typeof row.passage === "string") passageEl.value = row.passage;
                if (qEl && typeof row.questions === "string") qEl.value = row.questions;
                if (aEl && typeof row.answerKey === "string") aEl.value = row.answerKey;
                if (eEl && typeof row.explanation === "string") eEl.value = row.explanation;
            }
        }

        async function loadSectionMeta() {
            const dateInput = document.getElementById("set-date");
            const dateContainer = dateInput?.parentElement?.parentElement;
            const difficultyInput = document.getElementById("set-difficulty");
            const params = new URLSearchParams(window.location.search);
            currentTestType = params.get("testType") || "mocktest";
            
            if (dateContainer) {
                dateContainer.style.display = currentTestType === "practicetest" ? "none" : "flex";
            }
            const requestedDate = params.get("setDate");
            currentSetId = params.get("setId") || "";
            let stored = {};
            if (!currentSetId && requestedDate) {
                const byDate = await resolveSetRecordByDate(requestedDate);
                if (byDate?.setId) {
                    currentSetId = byDate.setId;
                    stored = byDate;
                }
            }
            if (!currentSetId && !requestedDate) {
                const latest = await resolveLatestSetRecord();
                if (latest?.setId) {
                    currentSetId = latest.setId;
                    stored = latest;
                }
            }
            if (window.toeflStorage) {
                try {
                    if (currentSetId && typeof toeflStorage.getSetRecordById === "function") {
                        stored = await toeflStorage.getSetRecordByIdAndType(currentSetId, currentTestType) || {};
                    }
                } catch { /* fallback below */ }
            }
            if (!stored.setDate) {
                const local = getStoredSetMap();
                if (currentSetId && local[currentSetId]) {
                    stored = local[currentSetId];
                }
            }
            const today = new Date().toISOString().split("T")[0];
            dateInput.value = requestedDate || stored.setDate || today;
            difficultyInput.value = stored.difficulty || "intermediate";
            updateHeaderPackageLabel(dateInput.value);
        }

        async function saveSectionMeta() {
            const dateInput = document.getElementById("set-date");
            const difficultyInput = document.getElementById("set-difficulty");
            const setDate = dateInput.value || new Date().toISOString().split("T")[0];
            updateHeaderPackageLabel(setDate);
            const setId = ensureCurrentSetId(setDate);
            const record = {
                setId,
                module: MODULE_ID,
                label: MODULE_LABEL,
                setDate,
                difficulty: difficultyInput.value || "intermediate",
                updatedAt: new Date().toISOString()
            };
            upsertLocalRecord(record);
            updateEditorUrl(setId, setDate);
            if (window.toeflStorage && typeof toeflStorage.upsertSetRecord === "function") {
                try {
                    await toeflStorage.upsertSetRecordWithType(record, currentTestType);
                } catch (error) {
                    console.warn("[ToeflSync] set save failed:", error);
                }
            }
        }

        function setupSection3Splitters() {
            const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
            const rows = document.querySelectorAll('#user-passages-container .user-main');

            rows.forEach((row, index) => {
                const leftPanel = row.querySelector('.passage-section');
                const divider = row.querySelector('.split-resizer');
                if (!leftPanel || !divider || divider.dataset.bound === '1') return;

                const storageKey = `toefl_section3_split_${index + 1}`;
                const saved = parseFloat(localStorage.getItem(storageKey) || '');
                if (!Number.isNaN(saved)) {
                    leftPanel.style.width = `${clamp(saved, 30, 70)}%`;
                }

                let startX = 0;
                let startWidth = 0;
                let containerWidth = 0;

                const setWidth = (nextPercent) => {
                    const clamped = clamp(nextPercent, 30, 70);
                    leftPanel.style.width = `${clamped}%`;
                    localStorage.setItem(storageKey, String(Math.round(clamped * 10) / 10));
                };

                const onMove = (event) => {
                    const deltaX = event.clientX - startX;
                    const newWidthPx = startWidth + deltaX;
                    const nextPercent = (newWidthPx / containerWidth) * 100;
                    setWidth(nextPercent);
                };

                const onUp = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    row.classList.remove('is-resizing');
                    divider.classList.remove('is-resizing');
                    document.body.style.userSelect = '';
                };

                divider.addEventListener('mousedown', (event) => {
                    startX = event.clientX;
                    startWidth = leftPanel.getBoundingClientRect().width;
                    containerWidth = row.getBoundingClientRect().width;
                    row.classList.add('is-resizing');
                    divider.classList.add('is-resizing');
                    document.body.style.userSelect = 'none';
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                });

                divider.addEventListener('keydown', (event) => {
                    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
                    event.preventDefault();
                    const current = parseFloat(leftPanel.style.width) || 48;
                    const step = event.shiftKey ? 4 : 2;
                    const next = event.key === 'ArrowLeft' ? current - step : current + step;
                    setWidth(next);
                });

                divider.dataset.bound = '1';
            });
        }

        function renumberPassageLineMarkers(passageId) {
            const box = document.getElementById(`display-passage-${passageId}`);
            if (!box) return;
            const paragraphs = Array.from(box.querySelectorAll('p'));
            const lineColumn = box.closest('.passage-shell')?.querySelector('.passage-line-column');
            const lineTextLabel = lineColumn?.querySelector('.passage-line-text');
            const fixedLabels = [
                document.getElementById(`line-marker-${passageId}-0`),
                document.getElementById(`line-marker-${passageId}-1`),
                document.getElementById(`line-marker-${passageId}-2`)
            ].filter(Boolean);

            if (!fixedLabels.length || !paragraphs.length || !lineColumn) return;

            const lineHeight = parseFloat(getComputedStyle(box).lineHeight) || 24;
            const boxRect = box.getBoundingClientRect();
            const boxTop = boxRect.top + 10;
            const columnRect = lineColumn.getBoundingClientRect();

            const syncLabelToParagraph = (label, paragraph) => {
                if (!label || !paragraph) return;
                const paragraphTop = paragraph.getBoundingClientRect().top;
                const lineNumber = Math.max(1, Math.round((paragraphTop - boxTop) / lineHeight) + 1);
                const relativeTop = paragraphTop - columnRect.top;
                label.textContent = `(${lineNumber})`;
                label.style.top = `${relativeTop}px`;
                return relativeTop;
            };

            const syncFirstLabelToParagraphLine = (label, paragraph, targetLine) => {
                if (!label || !paragraph) return;
                const paragraphTop = paragraph.getBoundingClientRect().top;
                const relativeTop = (paragraphTop - columnRect.top) + ((Math.max(1, targetLine) - 1) * lineHeight);
                label.textContent = `(${targetLine})`;
                label.style.top = `${relativeTop}px`;
                return relativeTop;
            };

            const firstParagraph = paragraphs[0];
            const secondParagraph = paragraphs[1];
            const thirdParagraph = paragraphs[2];

            const firstMarkerTop = syncFirstLabelToParagraphLine(fixedLabels[0], firstParagraph, 5);
            syncLabelToParagraph(fixedLabels[1], secondParagraph);
            syncLabelToParagraph(fixedLabels[2], thirdParagraph);

            if (lineTextLabel && Number.isFinite(firstMarkerTop)) {
                const lineTop = Math.max(0, firstMarkerTop - (lineHeight * 0.6));
                lineTextLabel.style.top = `${lineTop}px`;
            }
        }

        function renumberAllPassageMarkers() {

                    const radio = label.querySelector('input[type="radio"]');
                    const isSelected = Boolean(radio && radio.checked);
                    const letterBadge = label.querySelector('.option-letter-badge');
                    const optionCard = label.querySelector('.option-card-text');

                    label.classList.toggle('selected', isSelected);

                    if (letterBadge) {
                        letterBadge.style.backgroundColor = isSelected ? '#003560' : 'transparent';
                        letterBadge.style.borderColor = isSelected ? '#003560' : '#d1dce8';
                        letterBadge.style.color = isSelected ? '#ffffff' : '#000000';
                    }

                    if (optionCard) {
                        optionCard.style.backgroundColor = isSelected ? 'rgba(14, 165, 233, 0.14)' : '#ffffff';
                        optionCard.style.borderColor = isSelected ? '#003560' : '#d1dce8';
                        optionCard.style.boxShadow = isSelected ? '0 0 0 2px rgba(14, 165, 233, 0.18)' : 'none';
                    }
                });
            });

            updateHeaderProgress();
            renderSection3NavigatorDrawer();
        }

        function isDeveloperMode() {
            const params = new URLSearchParams(window.location.search);
            return window.location.hash === "#dev-view" || params.get("mode") === "dev";
        }

        function applyViewMode() {
            if (isDeveloperMode()) return;
            const userButton = Array.from(document.querySelectorAll(".tab-button")).find((button) => (button.getAttribute("onclick") || "").includes("'user-view'"));
            if (userButton) userButton.remove();
            const userView = document.getElementById("user-view");
            if (userView) userView.classList.add("active");
        }

        function activateInitialTab() {
            if (!isDeveloperMode()) return;
            const devButton = Array.from(document.querySelectorAll(".tab-button")).find((button) => (button.getAttribute("onclick") || "").includes("'dev-view'"));
            if (devButton) {
                openTab({ currentTarget: devButton }, 'dev-view');
            }
        }

        function openSubTab(evt, tabName, btnClass) {
            const parent = document.getElementById(tabName).parentElement;
            parent.querySelectorAll(".sub-content").forEach(c => c.classList.remove("active"));
            
            const navContainer = btnClass.includes('user') ? document.getElementById('user-sub-nav-container') : document.getElementById('dev-sub-nav-container');
            navContainer.querySelectorAll(`.${btnClass}`).forEach(b => b.classList.remove("active"));
            
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        function formatText(areaId, openTag, closeTag) {
            const textArea = document.getElementById(areaId);
            const start = textArea.selectionStart;
            const end = textArea.selectionEnd;
            const text = textArea.value;
            textArea.value = text.substring(0, start) + openTag + text.substring(start, end) + closeTag + text.substring(end);
            textArea.focus();
        }

        function formatSource(p) {
            const qNum = prompt("Tandai lokasi jawaban untuk soal nomor berapa? (contoh: 34)");
            if (qNum) formatText(`input-passage-${p}`, `<span id="source-${p}_${qNum.trim()}" class="source-highlight">`, `</span>`);
        }

        function scrollToSource(uniqueID) {
            const el = document.getElementById(`source-${uniqueID}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('active-highlight');
                setTimeout(() => el.classList.remove('active-highlight'), 2500);
            } else {
                alert("Lokasi jawaban (Highlight) belum ditambahkan oleh instruktur di teks bacaan ini.");
            }
        }

        let globalAnswerKey = {};
        let globalExplanations = {};
        let globalQuestions = {};
        let globalPassages = {};
        let timerInterval;

        function updateUserView(shouldSaveMeta = false) {
            if (shouldSaveMeta) {
                saveSectionMeta();
                saveSectionDraft();
            }
            document.getElementById('global-score-board').style.display = 'none';
            globalAnswerKey = {};
            globalExplanations = {};
            globalQuestions = {};
            globalPassages = {};

            for(let p=1; p<=TOTAL_PASSAGES; p++) {
                document.getElementById(`display-title-${p}`).innerText = document.getElementById(`input-title-${p}`).value || `Questions ${p}`;
                let passageText = document.getElementById(`input-passage-${p}`).value;
                
                // SISTEM PENDETEKSI (AUTO-PARSE) NOMOR BARIS
                passageText = passageText.split('\n\n').map(para => {
                    if(para.trim() === '') return '';
                    // 1. Ubah enter tunggal menjadi <br>
                    let processedPara = para.trim().replace(/\n/g, '<br>');
                    // 2. Deteksi teks (1), (5), (14) di awal paragraf atau setelah <br>, lalu jadikan span
                    processedPara = processedPara.replace(/(^|<br>)\s*\((\d+)\)\s*/g, '$1<span class="line-marker" data-source-line="$2">($2)</span>');
                    return `<p>${processedPara}</p>`;
                }).join('');
                document.getElementById(`display-passage-${p}`).innerHTML = passageText;
                globalPassages[p] = { title: document.getElementById(`input-title-${p}`).value || `Passage ${p}`, content: passageText };

                document.getElementById(`input-answer-key-${p}`).value.split('\n').forEach(l => {
                    let m = l.match(/^(\d+)[\.\)]?\s+(.*)/);
                    if(m) globalAnswerKey[`${p}_${m[1]}`] = m[2].trim().toLowerCase();
                });

                let currentExpNum = null;
                document.getElementById(`input-explanation-${p}`).value.split('\n').forEach(l => {
                    let m = l.match(/^(\d+)[\.\)]?\s+(.*)/);
                    if(m) { currentExpNum = `${p}_${m[1]}`; globalExplanations[currentExpNum] = m[2].trim(); }
                    else if(currentExpNum && l.trim()) globalExplanations[currentExpNum] += "<br>" + l.trim();
                });

                const lines = document.getElementById(`input-magic-questions-${p}`).value.split('\n');
                let cleanHtml = '';
                let openDiv = false;
                let currentUID = '';

                for (let line of lines) {
                    let rawLine = line.trim();
                    if (!rawLine) continue;
                    
                    let qMatch = rawLine.match(/^(?:<[^>]+>)*(\d+)[\.\)]?\s+(.*)/);
                    let isOption = rawLine.match(/^[\(]?([A-D])[\.\)]?\s+(.*)/i);

                    if (qMatch && !isOption) {
                        if (openDiv) cleanHtml += `</div><div class="feedback" id="feedback-${currentUID}"></div></div>`;
                        let currentQuestionNum = qMatch[1];
                        currentUID = `${p}_${currentQuestionNum}`;
                        globalQuestions[currentUID] = { questionText: qMatch[2], options: {}, passageId: p };
                        cleanHtml += `<div class="question-item" id="q-container-${currentUID}">`;
                        cleanHtml += `<div class="question-head">`;
                        cleanHtml += `<div class="question-index-pill">${currentQuestionNum}</div>`;
                        cleanHtml += `<div class="question-stem-text">${qMatch[2]}</div>`;
                        cleanHtml += `</div>`;
                        cleanHtml += `<div class="radio-group">`;
                        openDiv = true;
                    } else if (isOption && openDiv) {
                        let letter = isOption[1].toUpperCase();
                        if (globalQuestions[currentUID]) globalQuestions[currentUID].options[letter] = isOption[2];
                        cleanHtml += `<label>
                            <input type="radio" name="q_${currentUID}" value="${letter.toLowerCase()}"> 
                            <span class="option-letter-badge">${letter}</span>
                            <span class="option-card-text">${isOption[2]}</span>
                        </label>`;
                    }
                }
                if (openDiv) cleanHtml += `</div><div class="feedback" id="feedback-${currentUID}"></div></div>`;

                document.getElementById(`display-questions-${p}`).innerHTML = cleanHtml;
            }
            renumberAllPassageMarkers();
            refreshSection3QuestionState();
            startTimer();
        }

        function submitAnswers() {
            let score = 0;
            let total = Object.keys(globalAnswerKey).length;

            if (total === 0) { alert("Kunci jawaban belum dimasukkan oleh instruktur/developer."); return; }
            if (!confirm("Yakin ingin mengakhiri ujian dan melihat skor?")) return;

            clearInterval(timerInterval);

            for (let uid in globalAnswerKey) {
                const radio = document.querySelector(`input[name="q_${uid}"]:checked`);
                const userAnswer = radio ? radio.value.trim().toLowerCase() : '';
                if (userAnswer === globalAnswerKey[uid]) score++;
            }

            const scaledScore = Math.round(31 + ((score / total) * (67 - 31)));

            const answeredQs = Object.keys(globalAnswerKey).map(uid => {
                const pId = parseInt(uid.split('_')[0]);
                const qNum = parseInt(uid.split('_')[1]);
                const radio = document.querySelector(`input[name="q_${uid}"]:checked`);
                const userAnswer = radio ? radio.value.trim().toLowerCase() : '';
                const correct = globalAnswerKey[uid];
                const q = globalQuestions[uid] || {};
                return { uid, number: qNum, passageId: pId, questionText: q.questionText || `Question ${qNum}`, options: q.options || {}, correctAnswer: correct, userAnswer, isCorrect: userAnswer === correct, explanation: globalExplanations[uid] || '' };
            }).sort((a, b) => a.number - b.number);

            const passages = {};
            for (let pid in globalPassages) passages[pid] = globalPassages[pid];

            const result = { sectionTitle: "Section 3: Reading Comprehension", sectionKey: "reading", totalQuestions: total, rawScore: score, scaledScore, submittedAt: new Date().toISOString().slice(0, 10), questions: answeredQs, passages };
            localStorage.setItem('toefl_section3_result', JSON.stringify(result));
            window.location.href = 'section 3-answered.html';
        }

        function startTimer() {
            let t = 3300; 
            clearInterval(timerInterval);
            const timeEl = document.getElementById('time');
            if (timeEl) {
                timeEl.style.color = "#005FAA";
                timeEl.style.animation = "none";
                const startMinutes = Math.floor(t / 60);
                const startSeconds = t % 60;
                timeEl.innerText = `${startMinutes < 10 ? '0' + startMinutes : startMinutes}:${startSeconds < 10 ? '0' + startSeconds : startSeconds}`;
            }
            timerInterval = setInterval(() => {
                let m = Math.floor(t/60), s = t%60;
                document.getElementById('time').innerText = `${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
                if(t <= 300) {
                    document.getElementById('time').style.color = "#d32f2f";
                    document.getElementById('time').style.animation = "blink 1s infinite";
                } else {
                    document.getElementById('time').style.color = "#005FAA";
                    document.getElementById('time').style.animation = "none";
                }
                if(--t < 0) { 
                    clearInterval(timerInterval); 
                    alert("Waktu Habis! Jawaban Anda disubmit otomatis.");
                    submitAnswers(); 
                }
            }, 1000);
        }

        function bindUserToolbarActions() {
            const userContainer = document.getElementById("user-passages-container");
            if (userContainer) {
                userContainer.addEventListener("change", (event) => {
                    const target = event.target;
                    if (target && target.matches('input[type="radio"]')) {
                        refreshSection3QuestionState();
                    }
                });

                userContainer.addEventListener("dblclick", (event) => {
                    const clickableLabel = event.target.closest('label');
                    if (!clickableLabel) return;

                    let radio = null;
                    if (clickableLabel.hasAttribute('for')) {
                        radio = document.getElementById(clickableLabel.getAttribute('for'));
                    } else {
                        radio = clickableLabel.querySelector('input[type="radio"]');
                    }

                    if (!radio || radio.type !== 'radio' || !radio.checked) return;

                    event.preventDefault();
                    event.stopPropagation();

                    setTimeout(() => {
                        radio.checked = false;
                        refreshSection3QuestionState();
                    }, 0);
                });
            }
        }
        // ===== AUTO-SAVE FUNCTIONALITY =====
        let autoSaveTimeout = null;
        let lastAutoSaveTime = 0;
        const AUTO_SAVE_DELAY = 2000;

        function showAutoSaveStatus(msg, isSuccess = true) {
            let statusEl = document.getElementById("auto-save-status");
            if (!statusEl) {
                statusEl = document.createElement("span");
                statusEl.id = "auto-save-status";
                statusEl.style.cssText = "font-size:12px; color:#64748b; margin-left:auto; padding:0 12px; transition:all 0.3s ease;";
                const header = document.querySelector('header[style*="background:white"]');
                if (header) {
                    const actionDiv = header.querySelector('[style*="display: flex; gap"]');
                    if (actionDiv) {
                        actionDiv.insertBefore(statusEl, actionDiv.firstChild);
                    }
                }
            }
            if (!statusEl) return;
            statusEl.textContent = msg;
            statusEl.style.color = isSuccess ? "#16a34a" : "#dc2626";
            statusEl.style.opacity = "1";
            if (isSuccess) {
                setTimeout(() => { statusEl.style.opacity = "0.5"; }, 2500);
            }
        }

        async function performAutoSave() {
            try {
                saveSectionDraft();
                await saveSectionMeta();
                lastAutoSaveTime = Date.now();
                showAutoSaveStatus("? Auto-saved", true);
            } catch (error) {
                console.error("[Auto-save] Error:", error);
                showAutoSaveStatus("? Save failed", false);
            }
        }

        function triggerAutoSave() {
            clearTimeout(autoSaveTimeout);
            showAutoSaveStatus("? Saving...", true);
            autoSaveTimeout = setTimeout(() => {
                performAutoSave();
            }, AUTO_SAVE_DELAY);
        }

        function initAutoSave() {
            const fields = ['set-date', 'set-difficulty', 'input-magic-questions-1', 'input-answer-key-1', 'input-explanation-1', 'input-video-step-1'];
            fields.forEach(fieldId => {
                const el = document.getElementById(fieldId);
                if (el) {
                    el.addEventListener('input', triggerAutoSave);
                    el.addEventListener('change', triggerAutoSave);
                }
            });
            showAutoSaveStatus("Ready", true);
        }
        // ===== END AUTO-SAVE FUNCTIONALITY =====

        

        window.onload = async () => {
            initAutoSave();
            initStructure();
            applyViewMode();
            activateInitialTab();
            bindUserToolbarActions();
            updateFullScreenButton();
            document.addEventListener("fullscreenchange", handleFullScreenStateChange);
            try {
                await loadSectionMeta();
                await loadSectionDraft();
                updateUserView();
            } catch (error) {
                console.warn("[Init] Failed to fully restore section data:", error);
            }
            const featuresOverlay = document.getElementById("features-overlay");
            if (featuresOverlay) {
                featuresOverlay.addEventListener("click", handleFeaturesOverlayClick);
            }
            document.addEventListener("keydown", handleFeaturesMenuKeydown);
            window.addEventListener("resize", () => {
                renumberAllPassageMarkers();
            });
            const setDateEl = document.getElementById("set-date");
            const setDifficultyEl = document.getElementById("set-difficulty");
            if (setDateEl) setDateEl.addEventListener("change", handleSetDateChange);
            if (setDifficultyEl) setDifficultyEl.addEventListener("change", saveSectionMeta);

            // Keep user test tab synced when developer tab updates draft/meta in another tab.
            window.addEventListener("storage", (event) => {
                const syncKeys = [
                    DRAFT_KEY,
                    SETS_KEY_V2,
                    "toefl_developer_drafts_v2",
                    "toefl_developer_sets_v2"
                ];
                if (event.key && syncKeys.includes(event.key)) {
                    refreshFromStorageSync();
                }
            });
        };
    </script>
