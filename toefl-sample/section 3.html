        function getActivePassageNumber() {
            const activePanel = document.querySelector('#user-passages-container .sub-content.active');
            if (!activePanel) return 1;
            const match = activePanel.id.match(/user-part-(\d+)/);
            return match ? Number(match[1]) : 1;
        }

        function openUserPassage(passageNumber) {
            const maxPassages = Math.max(1, Math.min(TOTAL_PASSAGES, forcedReadingPartsCount || TOTAL_PASSAGES));
            const target = Math.min(Math.max(Number(passageNumber || 1), 1), maxPassages);
            document.querySelectorAll('#user-passages-container .sub-content').forEach((content) => {
                content.classList.remove('active');
            });
            const targetPanel = document.getElementById(`user-part-${target}`);
            if (targetPanel) targetPanel.classList.add('active');
            updateHeaderProgress();
            renderSection3NavigatorDrawer();
            refreshPassageLayout(target);
        }

        function getPassageQuestionUIDs(passageNumber) {
            return Object.keys(globalQuestions || {})
                .filter((uid) => uid.startsWith(`${passageNumber}_`))
                .sort((left, right) => {
                    const leftNum = Number(left.split('_')[1]) || 0;
                    const rightNum = Number(right.split('_')[1]) || 0;
                    return leftNum - rightNum;
                });
        }

        function buildPartChip(passageNumber, activePassage, answered, total, questionUIDs) {
            const isActive = passageNumber === activePassage;
            if (!isActive) {
                return `<button type="button" class="reading-part-chip" onclick="openUserPassage(${passageNumber})"><span class="reading-part-title">PART ${passageNumber}</span><span class="reading-part-fraction"><span>${answered}</span><small>/${total || 0}</small></span></button>`;
            }

            const circles = questionUIDs.map((uid, index) => {
                const checked = document.querySelector(`input[name="q_${uid}"]:checked`);
                const circleClass = checked ? 'reading-q-circle is-answered' : 'reading-q-circle';
                const questionNumber = uid.split('_')[1] || String(index + 1);
                return `<button type="button" class="${circleClass}" onclick="scrollToUserQuestion('${uid}')">${questionNumber}</button>`;
            }).join('');

            return `<div class="reading-part-chip active"><span class="reading-part-title">PART ${passageNumber}</span><div class="reading-part-circles">${circles}</div></div>`;
        }

        function updateHeaderProgress() {
            const header = document.getElementById('reading-part-header');
            if (!header) return;

            const activePassage = getActivePassageNumber();
            let html = '';

            const maxPassages = Math.max(1, Math.min(TOTAL_PASSAGES, forcedReadingPartsCount || TOTAL_PASSAGES));
            for (let passageNumber = 1; passageNumber <= maxPassages; passageNumber++) {
                const questionUIDs = getPassageQuestionUIDs(passageNumber);
                const total = questionUIDs.length;
                const answered = questionUIDs.reduce((count, uid) => {
                    const checked = document.querySelector(`input[name="q_${uid}"]:checked`);
                    return count + (checked ? 1 : 0);
                }, 0);
                html += buildPartChip(passageNumber, activePassage, answered, total, questionUIDs);
            }

            header.innerHTML = html;
        }

            if (!uid) return;
            const passageNumber = Number(uid.split('_')[0] || 1);
            if (passageNumber !== getActivePassageNumber()) {
                openUserPassage(passageNumber);
            }

            const card = document.getElementById(`q-container-${uid}`);
            if (!card) return;
            card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            card.classList.add('is-focused');
            setTimeout(() => card.classList.remove('is-focused'), 900);

        function setupSection3Splitters() {
            const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
            const rows = document.querySelectorAll('#user-passages-container .user-main');

            rows.forEach((row, index) => {
                const leftPanel = row.querySelector('.passage-section');
                const divider = row.querySelector('.split-resizer');
                if (!leftPanel || !divider || divider.dataset.bound === '1') return;

                const storageKey = `toefl_section3_split_${index + 1}`;
                const saved = parseFloat(localStorage.getItem(storageKey) || '');
                if (!Number.isNaN(saved)) {
                    leftPanel.style.width = `${clamp(saved, 30, 70)}%`;
                }

                let startX = 0;
                let startWidth = 0;
                let containerWidth = 0;

                const setWidth = (nextPercent) => {
                    const clamped = clamp(nextPercent, 30, 70);
                    leftPanel.style.width = `${clamped}%`;
                    localStorage.setItem(storageKey, String(Math.round(clamped * 10) / 10));
                };

                const onMove = (event) => {
                    const deltaX = event.clientX - startX;
                    const newWidthPx = startWidth + deltaX;
                    const nextPercent = (newWidthPx / containerWidth) * 100;
                    setWidth(nextPercent);
                };

                const onUp = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    row.classList.remove('is-resizing');
                    divider.classList.remove('is-resizing');
                    document.body.style.userSelect = '';
                };

                divider.addEventListener('mousedown', (event) => {
                    startX = event.clientX;
                    startWidth = leftPanel.getBoundingClientRect().width;
                    containerWidth = row.getBoundingClientRect().width;
                    row.classList.add('is-resizing');
                    divider.classList.add('is-resizing');
                    document.body.style.userSelect = 'none';
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                });

                divider.addEventListener('keydown', (event) => {
                    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
                    event.preventDefault();
                    const current = parseFloat(leftPanel.style.width) || 48;
                    const step = event.shiftKey ? 4 : 2;
                    const next = event.key === 'ArrowLeft' ? current - step : current + step;
                    setWidth(next);
                });

                divider.dataset.bound = '1';
            });
        }

        function renumberPassageLineMarkers(passageId) {
            const box = document.getElementById(`display-passage-${passageId}`);
            if (!box) return;
            const lineColumn = box.closest('.passage-shell')?.querySelector('.passage-line-column');
            const lineTextLabel = lineColumn?.querySelector('.passage-line-text');

            if (!lineColumn) return;

            lineColumn.querySelectorAll('.passage-line-marker-fixed').forEach((marker) => marker.remove());

            const lineHeight = parseFloat(getComputedStyle(box).lineHeight) || 24;
            const columnRect = lineColumn.getBoundingClientRect();
            const visualLineTops = getPassageVisualLineTops(box);
            let firstMarkerTop = null;

            for (let sourceLine = 5; sourceLine <= visualLineTops.length; sourceLine += 5) {
                const lineTop = visualLineTops[sourceLine - 1];
                if (!Number.isFinite(lineTop)) continue;
                const label = document.createElement('div');
                label.className = 'passage-line-marker-fixed';
                label.dataset.markerIndex = String(sourceLine - 1);
                label.textContent = `(${sourceLine})`;
                lineColumn.appendChild(label);
                const relativeTop = lineTop - columnRect.top + (lineHeight / 2);
                label.style.top = `${relativeTop}px`;
                if (firstMarkerTop === null) firstMarkerTop = relativeTop;
            }

            if (lineTextLabel && Number.isFinite(firstMarkerTop)) {
                const lineTop = Math.max(0, firstMarkerTop - (lineHeight * 0.6));
                lineTextLabel.style.top = `${lineTop}px`;
            }
        }

        function getPassageVisualLineTops(box) {
            const tops = [];
            const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT, {
                acceptNode(node) {
                    return String(node.nodeValue || '').trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
                }
            });
            const range = document.createRange();
            let node;

            while ((node = walker.nextNode())) {
                const text = String(node.nodeValue || '');
                for (let index = 0; index < text.length; index += 1) {
                    if (!text[index].trim()) continue;
                    range.setStart(node, index);
                    range.setEnd(node, index + 1);
                    const rect = Array.from(range.getClientRects()).find((item) => item && item.height > 0);
                    if (!rect) continue;
                    if (!tops.some((top) => Math.abs(top - rect.top) < 2)) tops.push(rect.top);
                }
            }

            range.detach();
            return tops.sort((left, right) => left - right);
        }

        function getPhraseTopInPassage(box, phrase) {
            const match = findTextNodeForPhrase(box, phrase);
            if (!match || match.index < 0) return null;
            const range = document.createRange();
            range.setStart(match.node, match.index);
            range.setEnd(match.node, Math.min(match.node.length, match.index + 1));
            const rect = Array.from(range.getClientRects()).find((item) => item && item.height > 0);
            range.detach();
            return rect ? rect.top : null;
        }

        function getQuestionAnchoredLineTops(box, passageId) {

                if (Number.isFinite(top)) anchored[target.line] = top;

                let match;
                while ((match = matcher.exec(text))) {

        function isWordCharacter(character) {
            return /[a-z0-9]/i.test(character || '');
        }

        function isWholePhraseMatch(text, start, phrase) {
            const before = text[start - 1];
            const after = text[start + phrase.length];
            return !(isWordCharacter(before) && isWordCharacter(phrase[0]))
                && !(isWordCharacter(after) && isWordCharacter(phrase[phrase.length - 1]));
        }

        function findTextNodeForPhrase(root, phrase) {
            const target = String(phrase || '').toLowerCase();
            if (!root || !target) return null;
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
                acceptNode(node) {
                    return String(node.nodeValue || '').toLowerCase().includes(target) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
                }
            });
            const node = walker.nextNode();
            if (!node) return null;
            return { node, index: String(node.nodeValue || '').toLowerCase().indexOf(target) };
        }

        function findPhraseRanges(root, phrase) {
            const target = String(phrase || '').trim().replace(/\s+/g, ' ').toLowerCase();
            if (!root || !target) return [];
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const normalizedText = [];
            const positions = [];
            let node;
            while ((node = walker.nextNode())) {
                const value = String(node.nodeValue || '');
                let whitespacePending = false;
                for (let index = 0; index < value.length; index += 1) {
                    if (/\s/.test(value[index])) {
                        whitespacePending = true;
                        continue;
                    }
                    if (whitespacePending && normalizedText.length) {
                        normalizedText.push(' ');
                        positions.push({ node, start: index, end: index });
                    }
                    normalizedText.push(value[index].toLowerCase());
                    positions.push({ node, start: index, end: index + 1 });
                    whitespacePending = false;
                }
            }
            const normalized = normalizedText.join('');
            const ranges = [];
            let matchIndex = normalized.indexOf(target);
            while (matchIndex >= 0) {
                const start = positions[matchIndex];
                const end = positions[matchIndex + target.length - 1];
                if (start && end && isWholePhraseMatch(normalized, matchIndex, target)) {
                    const range = document.createRange();
                    range.setStart(start.node, start.start);
                    range.setEnd(end.node, end.end);
                    ranges.push(range);
                }
                matchIndex = normalized.indexOf(target, matchIndex + Math.max(1, target.length));
            }
            return ranges;
        }

        function getVisualLineForPhrase(box, phrase, expectedLine = null) {
            const visualLineTops = getPassageVisualLineTops(box);
            if (!visualLineTops.length) return null;

            const candidates = [];
            findPhraseRanges(box, phrase).forEach((range) => {
                const rects = Array.from(range.getClientRects()).filter((item) => item && item.height > 0);
                range.detach();
                rects.forEach((rect) => {
                    let bestIndex = 0;
                    let bestDistance = Infinity;
                    visualLineTops.forEach((top, index) => {
                        const distance = Math.abs(top - rect.top);
                        if (distance < bestDistance) {
                            bestDistance = distance;
                            bestIndex = index;
                        }
                    });
                    const line = bestIndex + 1;
                    if (!candidates.includes(line)) candidates.push(line);
                });
            });

            if (candidates.length) {
                return Number.isFinite(expectedLine)
                    ? candidates.sort((left, right) => Math.abs(left - expectedLine) - Math.abs(right - expectedLine))[0]
                    : candidates[0];
            }
            return null;
        }

        function scorePassageLineCalibration(box, targets) {
            let score = 0;
            let matched = 0;
            targets.forEach((target) => {
                const actualLine = getVisualLineForPhrase(box, target.phrase);
                if (!actualLine) {
                    score += 100;
                    return;
                }
                matched += 1;
                score += Math.abs(actualLine - target.line);
            });
            return { score, matched };
        }

        function parseBulkExplanations(rawText, passageNumber) {
            const blocks = {};
            const text = String(rawText || '').replace(/\r/g, '');
            const matches = Array.from(text.matchAll(/^\s*(?:\*\*\s*)?question\s+(\d+)\s*(?:\*\*)?\s*$/gim));
            matches.forEach((match, index) => {
                const contentStart = match.index + match[0].length;
                const contentEnd = index + 1 < matches.length ? matches[index + 1].index : text.length;
                const content = text.slice(contentStart, contentEnd).trim();
                if (content) blocks[`${passageNumber}_${match[1]}`] = content;
            });
            return blocks;
        }

        function renderPassageParagraphHtml(paragraph, lineState) {
            const lines = String(paragraph || '').split('\n');
            const renderedLines = [];
            for (const rawLine of lines) {
                let line = rawLine.trim();
                if (!line) continue;
                const markerMatch = line.match(/^\s*(?:\*\*)?\((\d+)\)(?:\*\*)?\s*/);
                if (markerMatch) {
                    lineState.nextLine = Number(markerMatch[1]) || lineState.nextLine;
                    line = line.slice(markerMatch[0].length);
                }
                renderedLines.push(`<span class="passage-source-line" data-source-line="${lineState.nextLine}">${line}</span>`);
                lineState.nextLine += 1;
            }
            return renderedLines.length ? `<p>${renderedLines.join('<br>')}</p>` : '';
        }

            if (!section || !track || !thumb) return;
            if (!isReadingPassageScrollable(section)) {
                track.classList.remove('is-visible');
                return;
            }
            const trackHeight = track.clientHeight;
            const thumbHeight = Math.max(24, (section.clientHeight / section.scrollHeight) * trackHeight);
            const maxThumbTop = Math.max(0, trackHeight - thumbHeight);
            const scrollRange = section.scrollHeight - section.clientHeight;
            const scrollRatio = scrollRange > 0 ? section.scrollTop / scrollRange : 0;
            thumb.style.height = `${thumbHeight}px`;
            thumb.style.top = `${maxThumbTop * scrollRatio}px`;
        }

        function showReadingPassageScrollbar(section) {
            const track = section?.querySelector('.reading-passage-scrollbar-track');

            if (!isReadingPassageScrollable(section)) {

                return;

            updateReadingPassageScrollThumb(section);
            track.classList.add('is-visible');
            if (section._readingScrollHideTimer) clearTimeout(section._readingScrollHideTimer);

        function updateUserView(shouldSaveMeta = false) {
            if (shouldSaveMeta) {
                return saveAndUpdateUserView();
            }
            document.getElementById('global-score-board').style.display = 'none';
            globalAnswerKey = {};
            globalExplanations = {};
            globalEnglishExplanations = {};
            globalQuestions = {};
            globalPassages = {};

            Object.assign(globalExplanations, parseAllBulkExplanations(
                document.getElementById("input-bulk-explanation-id-all")?.value
            ));
            Object.assign(globalEnglishExplanations, parseAllBulkExplanations(
                document.getElementById("input-bulk-explanation-en-all")?.value
            ));

            const maxPassages = Math.max(1, Math.min(TOTAL_PASSAGES, forcedReadingPartsCount || TOTAL_PASSAGES));
            for(let p=1; p<=maxPassages; p++) {
                const questionRange = getPassageQuestionRange(p);
                document.getElementById(`display-title-${p}`).textContent = `Questions ${questionRange.start}-${questionRange.end}`;
                let passageText = document.getElementById(`input-passage-${p}`).value;
                
                // SISTEM PENDETEKSI (AUTO-PARSE) NOMOR BARIS
                const passageLineState = { nextLine: 1 };
                passageText = passageText.split(/\n\s*\n/).map(para => renderPassageParagraphHtml(para, passageLineState)).join('');
                document.getElementById(`display-passage-${p}`).innerHTML = passageText;
                globalPassages[p] = { title: document.getElementById(`input-title-${p}`).value || `Passage ${p}`, content: passageText };

                document.getElementById(`input-answer-key-${p}`).value.split('\n').forEach(l => {
                    let m = l.match(/^(\d+)[\.\)]?\s+(.*)/);
                    if(m) globalAnswerKey[`${p}_${m[1]}`] = m[2].trim().toLowerCase();
                });

                const lines = document.getElementById(`input-magic-questions-${p}`).value.split('\n');
                let cleanHtml = '';
                let openDiv = false;
                let currentUID = '';

                for (let line of lines) {
                    let rawLine = line.trim();
                    if (!rawLine) continue;
                    
                    let qMatch = rawLine.match(/^(?:<[^>]+>)*(\d+)[\.\)]?\s+(.*)/);
                    let isOption = rawLine.match(/^[\(]?([A-D])[\.\)]?\s+(.*)/i);

                    if (qMatch && !isOption) {
                        if (openDiv) cleanHtml += `</div><div class="feedback" id="feedback-${currentUID}"></div></div>`;
                        let currentQuestionNum = qMatch[1];
                        currentUID = `${p}_${currentQuestionNum}`;
                        const correctedQuestionText = correctQuestionLineReferences(p, qMatch[2], currentUID);
                        globalQuestions[currentUID] = {
                            questionText: correctedQuestionText,
                            rawQuestionText: qMatch[2],
                            options: {},
                            passageId: p
                        };
                        cleanHtml += `<div class="question-item" id="q-container-${currentUID}">`;
                        cleanHtml += `<div class="question-head">`;
                        cleanHtml += `<div class="question-index-pill">${currentQuestionNum}</div>`;
                        cleanHtml += `<div class="question-stem-text">${correctedQuestionText}</div>`;
                        cleanHtml += `</div>`;
                        cleanHtml += `<div class="radio-group">`;
                        openDiv = true;
                    } else if (isOption && openDiv) {
                        let letter = isOption[1].toUpperCase();
                        if (globalQuestions[currentUID]) globalQuestions[currentUID].options[letter] = isOption[2];
                        cleanHtml += `<label>
                            <input type="radio" name="q_${currentUID}" value="${letter.toLowerCase()}"> 
                            <span class="option-letter-badge">${letter}</span>
                            <span class="option-card-text">${isOption[2]}</span>
                        </label>`;
                    }
                }
                if (openDiv) cleanHtml += `</div><div class="feedback" id="feedback-${currentUID}"></div></div>`;

                document.getElementById(`display-questions-${p}`).innerHTML = cleanHtml;
            }
            calibrateAllPassageBoxesToQuestions();
            renumberAllPassageMarkers();
            refreshSection3QuestionState();
            initReadingPassageScrollbars();
            requestAnimationFrame(() => {
                refreshAllQuestionLineReferences();
                renumberAllPassageMarkers();
            });
            if (document.fonts?.ready) {
                document.fonts.ready.then(() => refreshAllQuestionLineReferences());
            }
            setTimeout(() => refreshAllQuestionLineReferences(), 250);
            startTimer();
        }

        function submitAnswers() {
            let score = 0;
            let total = Object.keys(globalAnswerKey).length;

            if (total === 0) { alert("Kunci jawaban belum dimasukkan oleh instruktur/developer."); return; }

            // 1. Check for full test mode to customize confirmation
            const urlParams = new URLSearchParams(window.location.search);
            const isFullTest = urlParams.get("fullTest") === "true";

            const confirmMessage = isFullTest 
                ? "Finish Section 3, are you sure you want to finish the entire test and see your final score?" 
                : "Yakin ingin mengakhiri ujian dan melihat skor?";

            if (!confirm(confirmMessage)) return;

            clearInterval(timerInterval);

            for (let uid in globalAnswerKey) {
                const radio = document.querySelector(`input[name="q_${uid}"]:checked`);
                const userAnswer = radio ? radio.value.trim().toLowerCase() : '';
                if (userAnswer === globalAnswerKey[uid]) score++;
            }

            const scaledScore = Math.round(31 + ((score / total) * (67 - 31)));

            const answeredQs = Object.keys(globalAnswerKey).map(uid => {
                const pId = parseInt(uid.split('_')[0]);
                const qNum = parseInt(uid.split('_')[1]);
                const radio = document.querySelector(`input[name="q_${uid}"]:checked`);
                const userAnswer = radio ? radio.value.trim().toLowerCase() : '';
                const correct = globalAnswerKey[uid];
                const q = globalQuestions[uid] || {};
                return { uid, number: qNum, passageId: pId, questionText: q.questionText || `Question ${qNum}`, options: q.options || {}, correctAnswer: correct, userAnswer, isCorrect: userAnswer === correct, explanation: globalExplanations[uid] || '', explanationEnglish: globalEnglishExplanations[uid] || '' };
            }).sort((a, b) => a.number - b.number);

            const passages = {};
            for (let pid in globalPassages) passages[pid] = globalPassages[pid];

            const result = { setId: currentSetId, testType: currentTestType, sectionTitle: "Section 3: Reading Comprehension", sectionKey: "reading", totalQuestions: total, rawScore: score, scaledScore, submittedAt: new Date().toISOString().slice(0, 10), questions: answeredQs, passages };
            localStorage.setItem('toefl_section3_result', JSON.stringify(result));
            if (window.toeflTestHistory) window.toeflTestHistory.record(result);
            if (isFullTest) {
                // If it's a full test, forward to your final summary/report page with the parameters intact
                window.location.href = `full-test-summary.html?${urlParams.toString()}`; // Adjust filename if your final summary page has a different name
            } else {
                // Normal single-section flow
                const reviewParams = new URLSearchParams({ testType: currentTestType });
                if (currentSetId) reviewParams.set("setId", currentSetId);
                window.location.href = `section 3-answered.html?${reviewParams}`;
            }
        }

        function startTimer() {
            const params = new URLSearchParams(window.location.search);
            const isPractice = String(params.get("testType") || currentTestType).toLowerCase() === "practicetest";
            const requestedTime = String(params.get("time") || params.get("timer") || "55").trim().toLowerCase();
            if (isPractice && ["unlimited", "none", "0"].includes(requestedTime)) {
                clearInterval(timerInterval);
                const timeEl = document.getElementById("time");
                if (timeEl) {
                    timeEl.textContent = "Unlimited";
                    timeEl.style.color = "#005FAA";
                    timeEl.style.animation = "none";
                }
                return;
            }
            const requestedMinutes = Number.parseInt(requestedTime, 10);
            const durationMinutes = isPractice && Number.isFinite(requestedMinutes) && requestedMinutes > 0
                ? requestedMinutes
                : 55;
            let t = durationMinutes * 60;
            clearInterval(timerInterval);
            const timeEl = document.getElementById('time');
            if (timeEl) {
                timeEl.style.color = "#005FAA";
                timeEl.style.animation = "none";
                const startMinutes = Math.floor(t / 60);
                const startSeconds = t % 60;
                timeEl.innerText = `${startMinutes < 10 ? '0' + startMinutes : startMinutes}:${startSeconds < 10 ? '0' + startSeconds : startSeconds}`;
            }
            timerInterval = setInterval(() => {
                let m = Math.floor(t/60), s = t%60;
                document.getElementById('time').innerText = `${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
                if(t <= 300) {
                    document.getElementById('time').style.color = "#d32f2f";
                    document.getElementById('time').style.animation = "blink 1s infinite";
                } else {
                    document.getElementById('time').style.color = "#005FAA";
                    document.getElementById('time').style.animation = "none";
                }
                if(--t < 0) { 
                    clearInterval(timerInterval); 
                    alert("Waktu Habis! Jawaban Anda disubmit otomatis.");
                    submitAnswers(); 
                }
            }, 1000);
        }

        function bindUserToolbarActions() {
            const userContainer = document.getElementById("user-passages-container");
            if (userContainer) {
                userContainer.addEventListener("change", (event) => {
                    const target = event.target;
                    if (target && target.matches('input[type="radio"]')) {
                        refreshSection3QuestionState();
                    }
                });

                userContainer.addEventListener("dblclick", (event) => {
                    const clickableLabel = event.target.closest('label');
                    if (!clickableLabel) return;

                    let radio = null;
                    if (clickableLabel.hasAttribute('for')) {
                        radio = document.getElementById(clickableLabel.getAttribute('for'));
                    } else {
                        radio = clickableLabel.querySelector('input[type="radio"]');
                    }

                    if (!radio || radio.type !== 'radio' || !radio.checked) return;

                    event.preventDefault();
                    event.stopPropagation();

                    setTimeout(() => {
                        radio.checked = false;
                        refreshSection3QuestionState();
                    }, 0);
                });
            }
        }
        // ===== AUTO-SAVE FUNCTIONALITY =====
        let autoSaveTimeout = null;
        let lastAutoSaveTime = 0;
        const AUTO_SAVE_DELAY = 2000;

        function showAutoSaveStatus(msg, isSuccess = true) {
            let statusEl = document.getElementById("auto-save-status");
            if (!statusEl) {
                statusEl = document.createElement("span");
                statusEl.id = "auto-save-status";
                statusEl.style.cssText = "font-size:12px; color:#64748b; margin-left:auto; padding:0 12px; transition:all 0.3s ease;";
                const header = document.querySelector('header[style*="background:white"]');
                if (header) {
                    const actionDiv = header.querySelector('[style*="display: flex; gap"]');
                    if (actionDiv) {
                        actionDiv.insertBefore(statusEl, actionDiv.firstChild);
                    }
                }
            }
            if (!statusEl) return;
            statusEl.textContent = msg;
            statusEl.style.color = isSuccess ? "#16a34a" : "#dc2626";
            statusEl.style.opacity = "1";
            if (isSuccess) {
                setTimeout(() => { statusEl.style.opacity = "0.5"; }, 2500);
            }
        }

        async function performAutoSave() {
            try {
                const savedRemotely = await queueSectionSave();
                updateUserView();
                lastAutoSaveTime = Date.now();
                showAutoSaveStatus(savedRemotely ? "Saved to Firebase" : "Saved locally; Firebase unavailable", savedRemotely);
            } catch (error) {
                console.error("[Auto-save] Error:", error);
                showAutoSaveStatus("? Save failed", false);
            }
        }

        function triggerAutoSave() {
            if (!sectionReady) return;
            clearTimeout(autoSaveTimeout);
            showAutoSaveStatus("? Saving...", true);
            autoSaveTimeout = setTimeout(() => {
                performAutoSave();
            }, AUTO_SAVE_DELAY);
        }

        function initAutoSave() {
            document.querySelectorAll('#dev-view input, #dev-view textarea, #dev-view select').forEach((element) => {
                if (element.dataset.autoSaveBound === '1') return;
                element.addEventListener('input', triggerAutoSave);
                element.addEventListener('change', triggerAutoSave);
                element.dataset.autoSaveBound = '1';
            });
            showAutoSaveStatus("Ready", true);
        }

        async function saveAndUpdateUserView(button) {
            if (button) button.disabled = true;
            showAutoSaveStatus("? Saving to Firebase...", true);
            try {
                const savedRemotely = await queueSectionSave();
                updateUserView();
                showAutoSaveStatus(savedRemotely ? "Saved to Firebase" : "Saved locally; Firebase unavailable", savedRemotely);
            } catch (error) {
                console.error("[SaveAndUpdate] Error:", error);
                showAutoSaveStatus("? Save failed", false);
            } finally {
                if (button) button.disabled = false;
            }
        }
        // ===== END AUTO-SAVE FUNCTIONALITY =====

        function queueSectionSave() {
            if (!sectionReady) return Promise.reject(new Error("Wait for the selected test to finish loading"));
            clearTimeout(autoSaveTimeout);
            const task = sectionSaveQueue.then(async () => {
                await saveSectionMeta();
                return saveSectionDraft();
            });
            sectionSaveQueue = task.catch((error) => {
                console.error("[Reading Save] Failed:", error);
                showAutoSaveStatus("Save failed", false);
            });
            return task;
        }

        

        window.onload = async () => {
            initStructure();
            applyViewMode();
            activateInitialTab();
            bindUserToolbarActions();
            updateFullScreenButton();
            document.addEventListener("fullscreenchange", handleFullScreenStateChange);
            try {
                await loadSectionMeta();
                await loadSectionDraft();
                updateUserView();
                applyPracticeRunMode();
                sectionReady = true;
                initAutoSave();
            } catch (error) {
                console.warn("[Init] Failed to fully restore section data:", error);
            }
            const featuresOverlay = document.getElementById("features-overlay");
            if (featuresOverlay) {
                featuresOverlay.addEventListener("click", handleFeaturesOverlayClick);
            }
            document.addEventListener("keydown", handleFeaturesMenuKeydown);
            window.addEventListener("resize", () => {
                calibrateAllPassageBoxesToQuestions();
                renumberAllPassageMarkers();
                refreshReadingPassageScrollbars();
            });
            const setDateEl = document.getElementById("set-date");
            const setDifficultyEl = document.getElementById("set-difficulty");
            if (setDateEl) setDateEl.addEventListener("change", handleSetDateChange);
            if (setDifficultyEl) setDifficultyEl.addEventListener("change", triggerAutoSave);
            document.getElementById("view-explanation-link")?.addEventListener("click", async (event) => {
                event.preventDefault();
                try {
                    const saved = await queueSectionSave();
                    updateUserView();
                    if (!saved) {
                        showAutoSaveStatus("Saved locally; Firebase unavailable", false);
                        return;
                    }
                    window.location.href = document.getElementById("view-explanation-link").href;
                } catch (error) {
                    console.error("[Reading Review] Save failed:", error);
                    showAutoSaveStatus("Save failed; explanation page not opened", false);
                }
            });

            // Keep user test tab synced when developer tab updates draft/meta in another tab.
            window.addEventListener("storage", (event) => {
                const syncKeys = [
                    `${DRAFT_KEY}_${currentSetId}`,
                    SETS_KEY_V2,
                    "toefl_developer_drafts_v2",
                    "toefl_developer_sets_v2",
                    `toefl_developer_${currentTestType}_drafts_v2`,
                    `toefl_developer_${currentTestType}_sets_v2`
                ];
                if (event.key && syncKeys.includes(event.key)) {
                    refreshFromStorageSync();
                }
            });
        };
    </script>
