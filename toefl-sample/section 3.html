    /* Helper active/hidden classes */
    .hidden {
    display: none !important;
    }

    #dev-view.active {
        display: flex;
        flex-direction: column;
    }

    .progress-q-circle {
        width: 20px;
        height: 20px;
        border-radius: 999px;
        border: 1px solid #d1dce8;
        background: #e8eef5;
        color: #fff;
        font: 400 10px/1 "Plus Jakarta Sans", Arial, sans-serif;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 1px;
        transition: all 0.2s ease;
        box-sizing: border-box;
    }

    /* Default unanswered/idle circle */
    .progress-q-circle:not(.is-answered):not(.is-current):not(.is-correct):not(.is-incorrect) {
        background: #7a8fa6;
        border-color: #d1dce8;
        color: #fff;
    }

    /* Current active question -> Blue */
    .progress-q-circle.is-current {
        background: #005FAA;
        border-color: #fff;
        color: #fff;
        box-shadow: 0 0 0 2px #005FAA;
    }

    /* Answered prior to check */
    .progress-q-circle.is-answered {
        background: #005FAA;
        color: #fff;
        border-color: #fff;
        box-shadow: 0 0 2px #005FAA;
    }

    /* Correct post-instant check -> Green */
    .progress-q-circle.is-correct {
        background: #0d9488;
        color: #fff;
        border-color: #fff;
        box-shadow: 0 0 2px #0d9488;
    }

    /* Incorrect post-instant check -> Red */
    .progress-q-circle.is-incorrect {
        background: #dc2626;
        color: #fff;
        border-color: #fff;
        box-shadow: 0 0 2px #dc2626;
    }

    .progress-q-circle:hover {
        border-color: #fff;
    }

    /* Part Chip Layout */
    .progress-part-chip {
        border: none;
        border-radius: 0;
        background: transparent;
        width: auto;
        min-width: 33px;
        height: 28px;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .progress-part-chip.active {
        width: max-content;
        min-width: max-content;
        height: auto;
        align-items: center;
        cursor: default;
        padding: 0;
        box-shadow: none;
    }

    .reading-part-circles {
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        gap: 4px;
        padding-top: 4px;
    }

    .progress-part-chip.active .progress-part-title {
        height: 21px;

        display: flex;
        align-items: center;
        justify-content: center;

    /* ===== Instant feedback practice mode ===== */
    .instant-progress {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .instant-progress-label {
        font: 700 9px/1 "Plus Jakarta Sans", Arial, sans-serif;
        letter-spacing: 0.08em;
        color: #0f172a;
    }

    .instant-progress-dots-row { display: inline-flex; gap: 5px; }

    .instant-progress-dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #cbd5e1;
    }

    .instant-progress-dot.is-done { background: #94a3b8; }
    .instant-progress-dot.is-current { background: #005faa; }

    .instant-card {
        /* Matches the audio shell's centred content track. */
        width: min(922px, 100%);
        margin: 16px auto 0;
        background: #fff;
        /* border: 1px solid #e2e8f0; */
        border-radius: 16px;
        /* box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06); */
        overflow: hidden;
    }

    .instant-card__body { 
        padding: 18px 20px 20px; 
        display: grid; 
        gap: 16px; 
    }

    .instant-card__tab {
        display: flex;
        justify-content: center;
        padding: 10px 0 0;
        border-bottom: 2px solid #005faa;
    }

    .instant-card__tab img {
        width: 18px;
        height: 18px;
        object-fit: contain;
    }

    .instant-tab-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px 10px;
        color: #005faa;
        font: 600 12px/1 "Plus Jakarta Sans", Arial, sans-serif;
    }

    .instant-question { display: grid; gap: 14px; }

    .instant-question-head {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .instant-question-head .question-number-badge { flex: 0 0 auto; }

    .instant-question-title {
        flex: 1;
        margin: 0;
        color: #0f172a;
        font: 400 18px "Times New Roman", Times, serif;
    }

    .instant-verdict {
        font: 600 16px/1 "Plus Jakarta Sans", Arial, sans-serif;
        letter-spacing: 0.04em;

        white-space: nowrap;
    }

    .instant-verdict.is-correct { color: #0d9488; }
    .instant-verdict.is-incorrect { color: #dc2626; }

    .question-number-badge.is-selected {
        background: #005FAA;
        border-color: #ffffff;
        box-shadow: 0 0px 4px #0EA5E9;
        color: #fff;
    }

    .question-number-badge.is-correct {
        background: #0d9488;
        border-color: #ffffff;
        box-shadow: 0 0px 4px #0d9488;
        color: #fff;
    }

    .question-number-badge.is-incorrect {
        background: #DC2626;
        border-color: #ffffff;
        box-shadow: 0 0px 4px #DC2626;
        color: #fff;
    }

    .instant-options { display: grid; gap: 10px; }

    .instant-options label {
        width: 100%;
        min-height: 44px;
        height: auto;
        padding: 9px 16px;
        gap: 14px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        background: #fff;
        font: 400 18px/1.4 "Times New Roman", Times, serif;
        transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .instant-options label.selected {
        border-color: var(--navy-mid);
        background: rgba(14, 165, 233, 0.2);
        box-shadow: 0 4px 4px rgba(14, 165, 233, 0.25);
    }

    .instant-options label.is-correct {
        border-color: #0d9488;
        background: #d7f5ee;
    }

    .instant-options label.is-incorrect {
        border-color: #fca5a5;
        background: #fef2f2;
    }

    .instant-option-letter {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        border-radius: 999px;
        border: 1px solid #e2e8f0;
        background: #fff;

        display: inline-flex;
        align-items: center;
        justify-content: center;
        font: 400 18px/1 "Times New Roman", Times, serif;
    }

    .instant-options label.selected .instant-option-letter {
        background: #005FAA;
        border-color: #005faa;
        color: #fff;
    }

    .instant-options label.is-correct .instant-option-letter {
        background: #0d9488;
        border-color: #0d9488;
        color: #fff;
    }

    .instant-option-text { flex: 1; min-width: 0; }

    .instant-option-tag {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;

    }

    .instant-option-tag.is-wrong { color: #dc2626; }

    <script>
        const TOTAL_PASSAGES = 5; 
        const PRACTICE_READING_TOTAL_PASSAGES = 1;
        const SETS_KEY = "toefl_developer_sets_v1";
        const SETS_KEY_V2 = "toefl_developer_sets_v2";
        const MODULE_ID = "reading";
        const MODULE_LABEL = "Reading";
        const DRAFT_KEY = "toefl_section3_dev_draft_v1";
        let currentSetId = "";
        let currentTestType = "mocktest";
        let lastValidSetDate = "";
        let forcedReadingPartsCount = TOTAL_PASSAGES;
        let activeSectionDraft = {};
        let sectionReady = false;
        let sectionSaveQueue = Promise.resolve();

        function getReadingPracticePartsCount() {
            const params = new URLSearchParams(window.location.search);
            const testType = String(params.get("testType") || "mocktest").toLowerCase();
            if (testType !== "practicetest") return TOTAL_PASSAGES;

            return PRACTICE_READING_TOTAL_PASSAGES;
        }

        // Mock Test owns day 1, 5, 9, 13... (every 4th day); Practice Test owns the days in between (e.g. 2-4, 6-8).
        function isMockTestDayNumber(day) {
            return ((day - 1) % 4) === 0;
        }
        function isDateAllowedForTestType(dateString, testType) {
            const parsed = new Date(`${dateString}T00:00:00`);
            if (Number.isNaN(parsed.getTime())) return true;
            const isMockSlot = isMockTestDayNumber(parsed.getDate());
            return testType === "practicetest" ? !isMockSlot : isMockSlot;
        }

        function safeParse(raw, fallback) {
            try {
                return JSON.parse(raw) || fallback;
            } catch {
                return fallback;
            }
        }

        function getStoredSetMap() {
            const parsedV2 = safeParse(localStorage.getItem(SETS_KEY_V2), {});
            const hasV2 = parsedV2 && typeof parsedV2 === "object" && Object.keys(parsedV2).length > 0;
            const parsed = hasV2 ? parsedV2 : safeParse(localStorage.getItem(SETS_KEY), {});
            if (Array.isArray(parsed)) {
                return parsed.reduce((accumulator, item) => {
                    const key = item?.setId || item?.module;
                    if (item && key) accumulator[key] = item;
                    return accumulator;
                }, {});
            }
            return parsed && typeof parsed === "object" ? parsed : {};
        }

        function persistStoredSetMap(map) {
            localStorage.setItem(SETS_KEY_V2, JSON.stringify(map));
        }

        function upsertLocalRecord(record) {
            const map = getStoredSetMap();
            map[record.setId] = record;
            persistStoredSetMap(map);
        }

        function updateEditorUrl(setId, setDate) {
            const params = new URLSearchParams(window.location.search);
            params.set("setId", setId);
            params.delete("new");
            if (setDate) params.set("setDate", setDate);
            const query = params.toString();
            const hash = window.location.hash || "#dev-view";
            window.history.replaceState({}, "", `${window.location.pathname}?${query}${hash}`);
            updateReviewLink();
        }

        function updateReviewLink() {
            const link = document.getElementById("view-explanation-link");
            if (!link) return;
            const params = new URLSearchParams();
            if (currentSetId) params.set("setId", currentSetId);
            params.set("testType", currentTestType);
            link.href = `section 3-answered.html?${params.toString()}`;
        }

        // Reading practice sets differ only by difficulty, so that is the category key.
        function getPracticeVariant() {
            const params = new URLSearchParams(window.location.search);
            const slug = (value) => String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
            const difficulty = slug(params.get("difficulty")) || slug((document.getElementById("set-difficulty") || {}).value);
            return { difficulty, slug: difficulty };
        }

        // Dashboard package links pass ?package=N so each package resolves to its own set.
        function getRequestedPracticePackage() {
            const value = parseInt(new URLSearchParams(window.location.search).get("package"), 10);
            return Number.isFinite(value) && value > 0 ? value : 0;
        }

        function recordMatchesRequestedPackage(record) {
            const requested = getRequestedPracticePackage();
            if (!requested || currentTestType !== "practicetest") return true;
            const own = parseInt(record?.packageNumber, 10);
            return (Number.isFinite(own) && own > 0 ? own : 1) === requested;
        }

        function setRecordMatchesPracticeVariant(record, variant) {
            if (!recordMatchesRequestedPackage(record)) return false;
            if (currentTestType !== "practicetest" || !variant || !variant.slug) return true;
            const recordDifficulty = String(record?.difficulty || "").toLowerCase().replace(/[^a-z0-9]/g, "");
            // Sets saved before the category was persisted fall back to the id segment.
            if (!recordDifficulty) return String(record?.setId || "").toLowerCase().includes(`_${variant.slug}_`);
            return recordDifficulty === variant.slug;
        }

        async function ensureCurrentSetId(setDate) {
            if (currentSetId) return currentSetId;
            
            // CRITICAL FIX: Check if a set ALREADY EXISTS for this date/testType/module
            // Only create a new one if none exists (idempotency constraint per day per testType)
            const existingSet = isExplicitNewPackageRequest() ? null : await resolveSetRecordByDate(setDate);
            if (existingSet && existingSet.setId) {
                console.log(`[SetIdempotency] Reusing existing set for date ${setDate}:`, existingSet.setId);
                currentSetId = existingSet.setId;
                return currentSetId;
            }
            
            // Only create new ID if no existing set found for this date/testType
            const variant = getPracticeVariant();
            if (window.toeflStorage && typeof toeflStorage.createSetId === "function") {
                currentSetId = toeflStorage.createSetId(MODULE_ID, setDate, currentTestType, variant);
            } else {
                const suffix = currentTestType === "practicetest" && variant.slug ? `${variant.slug}_` : "";
                currentSetId = `${currentTestType}_${MODULE_ID}_${suffix}${Date.now()}`;
            }
            console.log(`[SetIdempotency] Created new set for date ${setDate}:`, currentSetId);
            return currentSetId;
        }

        async function resolveSetRecordByDate(setDate, filterTestType = null) {
            const testTypeToCheck = filterTestType || currentTestType;
            const variant = getPracticeVariant();
            try {
                if (window.toeflStorage && typeof toeflStorage.getSetRecordsByTestType === "function") {
                    const records = await toeflStorage.getSetRecordsByTestType(testTypeToCheck);
                    const match = (records || [])
                        .filter((item) => item && item.module === MODULE_ID && item.setDate === setDate)
                        .filter((item) => setRecordMatchesPracticeVariant(item, variant))
                        .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime())[0];
                    if (match) return match;
                }
            } catch (error) {
                console.warn("[ToeflSync] date-based lookup failed:", error);
            }

            const local = getStoredSetMap();
            return Object.values(local)
                .filter((item) => item && item.module === MODULE_ID && item.setDate === setDate)
                .filter((item) => String(item.setId || "").startsWith(`${testTypeToCheck}_`))
                .filter((item) => setRecordMatchesPracticeVariant(item, variant))
                .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime())[0] || null;
        }

        async function resolveLatestSetRecord() {
            const variant = getPracticeVariant();
            try {
                if (window.toeflStorage && typeof toeflStorage.getSetRecordsByTestType === "function") {
                    const records = await toeflStorage.getSetRecordsByTestType(currentTestType);
                    const latest = (records || [])
                        .filter((item) => item && item.module === MODULE_ID)
                        .filter((item) => setRecordMatchesPracticeVariant(item, variant))
                        .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime())[0];
                    if (latest) return latest;
                }
            } catch (error) {
                console.warn("[ToeflSync] latest-set lookup failed:", error);
            }

            const local = getStoredSetMap();
            return Object.values(local)
                .filter((item) => item && item.module === MODULE_ID)
                .filter((item) => String(item.setId || "").startsWith(`${currentTestType}_`))
                .filter((item) => setRecordMatchesPracticeVariant(item, variant))
                .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime())[0] || null;
        }

        function clearSectionDraftInputs() {
            activeSectionDraft = {};
            const maxPassages = Math.max(1, Math.min(TOTAL_PASSAGES, forcedReadingPartsCount || TOTAL_PASSAGES));
            for (let p = 1; p <= maxPassages; p++) {

                if (passageEl) passageEl.value = "";

                if (aEl) aEl.value = "";

        function getBulkPassageRange(text, passageNumber) {
            const source = String(text || "").replace(/\r/g, "");
            const headings = Array.from(source.matchAll(/^\s*(?:\*{0,2}\s*)?(?:passage|part)\s+(\d+)\s*(?:\*{0,2})\s*$/gim));
            const index = headings.findIndex((heading) => Number(heading[1]) === Number(passageNumber));
            if (index < 0) return null;
            return {
                start: headings[index].index,
                end: index + 1 < headings.length ? headings[index + 1].index : source.length
            };
        }

        function getBulkPassageSection(text, passageNumber) {
            const source = String(text || "").replace(/\r/g, "");
            const range = getBulkPassageRange(source, passageNumber);
            return range ? source.slice(range.start, range.end).trim() : "";
        }

        function mergeBulkPassageSection(savedText, editedText, passageNumber) {
            const saved = String(savedText || "").replace(/\r/g, "");
            const edited = String(editedText || "").trim();
            if (!edited) {
                const range = getBulkPassageRange(saved, passageNumber);
                return range ? `${saved.slice(0, range.start)}${saved.slice(range.end)}`.trim() : "";
            }
            const replacement = getBulkPassageSection(edited, passageNumber) || `Passage ${passageNumber}\n\n${edited}`;
            const range = getBulkPassageRange(saved, passageNumber);
            if (!range) return [saved.trim(), replacement].filter(Boolean).join("\n\n");
            return `${saved.slice(0, range.start)}${replacement}${saved.slice(range.end)}`;
        }

        function scopePracticeExplanationInputs(force = false) {
            if (currentTestType !== "practicetest" || forcedReadingPartsCount !== 1) return;
            ["input-bulk-explanation-id-all", "input-bulk-explanation-en-all"].forEach((id) => {
                const input = document.getElementById(id);
                if (!input || (!force && input.dataset.practicePassage === "1")) return;
                const hasPassageHeading = /^\s*(?:\*\*\s*)?(?:passage|part)\s+\d+/im.test(input.value);
                input.value = getBulkPassageSection(input.value, 1) || (hasPassageHeading ? "" : input.value);
                input.dataset.practicePassage = "1";
            });
        }

        async function handleSetDateChange() {
            clearTimeout(autoSaveTimeout);
            await sectionSaveQueue;
            const dateInput = document.getElementById("set-date");
            const selectedDate = dateInput?.value;
            if (!selectedDate) return;

            if (!isDateAllowedForTestType(selectedDate, currentTestType)) {
                const ownerLabel = currentTestType === "practicetest" ? "Mock Test" : "Practice Test";
                alert(`This date is reserved for ${ownerLabel} only. Please pick a different date.`);
                dateInput.value = lastValidSetDate || selectedDate;
                return;
            }
            lastValidSetDate = selectedDate;

            const existing = await resolveSetRecordByDate(selectedDate).catch(() => null);
            if (existing?.setId) {
                currentSetId = existing.setId;
                upsertLocalRecord(existing);
                updateEditorUrl(currentSetId, selectedDate);
                updateHeaderPackageLabel(selectedDate);
                await loadSectionDraft();
                updateUserView();
                return;
            }

            if (isDeveloperMode()) {
                currentSetId = "";
                const params = new URLSearchParams(window.location.search);
                params.delete("setId");
                params.set("new", "1");
                window.history.replaceState({}, "", `${window.location.pathname}?${params}${window.location.hash}`);
                clearSectionDraftInputs();
                await saveSectionMeta();
                updateUserView();
                return;
            }

            // User mode: do not create empty package metadata for dates with no real content.
            currentSetId = "";
            clearSectionDraftInputs();
            updateHeaderPackageLabel(selectedDate);
            updateUserView();
        }

        async function saveSectionDraft() {
            const existingDraft = activeSectionDraft;
            const bulkExplanationIdInput = (document.getElementById("input-bulk-explanation-id-all") || {}).value || "";
            const bulkExplanationEnInput = (document.getElementById("input-bulk-explanation-en-all") || {}).value || "";
            const isSinglePassagePractice = currentTestType === "practicetest" && forcedReadingPartsCount === 1;
            const draft = {
                passages: { ...(existingDraft.passages || {}) },
                bulkExplanationId: isSinglePassagePractice
                    ? mergeBulkPassageSection(existingDraft.bulkExplanationId, bulkExplanationIdInput, 1)
                    : bulkExplanationIdInput,
                bulkExplanationEn: isSinglePassagePractice
                    ? mergeBulkPassageSection(existingDraft.bulkExplanationEn, bulkExplanationEnInput, 1)
                    : bulkExplanationEnInput
            };
            const maxPassages = Math.max(1, Math.min(TOTAL_PASSAGES, forcedReadingPartsCount || TOTAL_PASSAGES));
            for (let p = 1; p <= maxPassages; p++) {
                draft.passages[p] = {
                    title: (document.getElementById(`input-title-${p}`) || {}).value || "",
                    passage: (document.getElementById(`input-passage-${p}`) || {}).value || "",
                    questions: (document.getElementById(`input-magic-questions-${p}`) || {}).value || "",
                    answerKey: (document.getElementById(`input-answer-key-${p}`) || {}).value || "",
                    explanation: ""
                };
            }
            const setDate = (document.getElementById("set-date") || {}).value || new Date().toISOString().split("T")[0];
            const setId = await ensureCurrentSetId(setDate);
            draft.setId = setId;
            draft.testType = currentTestType;
            activeSectionDraft = draft;
            if (setId) {
                localStorage.setItem(`${DRAFT_KEY}_${setId}`, JSON.stringify(draft));
            }
            if (window.toeflStorage && typeof toeflStorage.saveDraftBySetIdAndType === "function") {
                try {
                    return await toeflStorage.saveDraftBySetIdAndType(setId, MODULE_ID, draft, currentTestType);
                } catch (error) {
                    console.warn("[ToeflSync] draft save failed:", error);
                    return false;
                }
            }
            throw new Error("Shared storage is unavailable");
        }

        async function loadSectionDraft() {
            const forceBlankNew = isExplicitNewPackageRequest();
            if (forceBlankNew && !currentSetId) {
                clearSectionDraftInputs();
                return;
            }

            const params = new URLSearchParams(window.location.search);
            const requestedDate = params.get("setDate");
            const requestedSetId = String(params.get("setId") || "").trim();
            if (requestedDate && !currentSetId && !requestedSetId) {
                clearSectionDraftInputs();
                return;
            }

            clearSectionDraftInputs();
            let draft = {};
            let remoteReadFailed = !window.toeflStorage;
            if (currentSetId && window.toeflStorage) {
                try {
                    draft = await toeflStorage.getDraftBySetIdAndType(currentSetId, currentTestType);
                } catch (error) {
                    remoteReadFailed = true;
                    console.warn("[ToeflSync] Draft load failed:", error);
                }
            }

            // Only fall back to this set's cache when the remote read failed.
            if ((!draft || typeof draft !== "object" || !draft.passages) && currentSetId
                && (remoteReadFailed || !window.toeflStorage?.isRemoteAvailable)) {
                draft = safeParse(localStorage.getItem(`${DRAFT_KEY}_${currentSetId}`), {});
            }
            if (!draft || typeof draft !== "object" || !draft.passages) return;
            if ((draft.setId && draft.setId !== currentSetId) || (draft.testType && draft.testType !== currentTestType)) {
                console.error("[Reading Draft] Ignoring draft belonging to another test");
                return;
            }
            activeSectionDraft = draft;

            const allBulkIdEl = document.getElementById("input-bulk-explanation-id-all");
            const allBulkEnEl = document.getElementById("input-bulk-explanation-en-all");
            if (allBulkIdEl) allBulkIdEl.value = readingExplanations.getDraftBulkText(draft, "id");
            if (allBulkEnEl) allBulkEnEl.value = readingExplanations.getDraftBulkText(draft, "en");
            scopePracticeExplanationInputs(true);

            const maxPassages = Math.max(1, Math.min(TOTAL_PASSAGES, forcedReadingPartsCount || TOTAL_PASSAGES));
            for (let p = 1; p <= maxPassages; p++) {
                const row = draft.passages[p] || {};
                const titleEl = document.getElementById(`input-title-${p}`);
                const passageEl = document.getElementById(`input-passage-${p}`);
                const qEl = document.getElementById(`input-magic-questions-${p}`);
                const aEl = document.getElementById(`input-answer-key-${p}`);
                const eEl = document.getElementById(`input-explanation-${p}`);

                if (titleEl && typeof row.title === "string") titleEl.value = row.title;
                if (passageEl && typeof row.passage === "string") passageEl.value = row.passage;
                if (qEl && typeof row.questions === "string") qEl.value = row.questions;
                if (aEl && typeof row.answerKey === "string") aEl.value = row.answerKey;
                if (eEl && typeof row.explanation === "string") eEl.value = row.explanation;
                const bulkIdEl = document.getElementById(`input-bulk-explanation-id-${p}`);
                const bulkEnEl = document.getElementById(`input-bulk-explanation-en-${p}`);
                if (bulkIdEl && typeof row.bulkExplanationId === "string") bulkIdEl.value = row.bulkExplanationId;
                if (bulkEnEl && typeof row.bulkExplanationEn === "string") bulkEnEl.value = row.bulkExplanationEn;
            }
        }

        async function refreshFromStorageSync() {
            if (!sectionReady || isDeveloperMode()) return;
            try {
                await loadSectionMeta();

                updateUserView();
            } catch (error) {

        async function loadSectionMeta() {
            const dateInput = document.getElementById("set-date");
            const dateContainer = dateInput?.parentElement?.parentElement;
            const difficultyInput = document.getElementById("set-difficulty");
            const params = new URLSearchParams(window.location.search);
            const forceBlankNew = isExplicitNewPackageRequest();
            currentTestType = params.get("testType") || "mocktest";
            
            if (dateContainer) {
                dateContainer.style.display = currentTestType === "practicetest" ? "none" : "flex";
            }
            const requestedDate = params.get("setDate");
            currentSetId = params.get("setId") || "";
            let stored = {};
            if (!currentSetId && requestedDate && !forceBlankNew) {
                const byDate = await resolveSetRecordByDate(requestedDate);
                if (byDate?.setId) {
                    currentSetId = byDate.setId;
                    stored = byDate;
                }
            }
            if (!currentSetId && !requestedDate && !forceBlankNew) {
                const latest = await resolveLatestSetRecord();
                if (latest?.setId) {
                    currentSetId = latest.setId;
                    stored = latest;
                }
            }
            if (window.toeflStorage) {
                try {
                    if (currentSetId && typeof toeflStorage.getSetRecordById === "function") {
                        stored = await toeflStorage.getSetRecordByIdAndType(currentSetId, currentTestType) || {};
                    }
                } catch { /* fallback below */ }
            }
            if (!stored.setDate) {
                const local = getStoredSetMap();
                if (currentSetId && local[currentSetId]) {
                    stored = local[currentSetId];
                }
            }
            const today = new Date().toISOString().split("T")[0];
            dateInput.value = requestedDate || stored.setDate || (currentTestType === "practicetest" ? "" : today);
            // A new practice set must honour the category picked in the create modal.
            const requestedDifficulty = String(params.get("difficulty") || "").trim();
            difficultyInput.value = stored.difficulty || requestedDifficulty || "intermediate";
            lastValidSetDate = dateInput.value;
            updateHeaderPackageLabel(dateInput.value);
            updateReviewLink();
            const practicePreviewButton = document.querySelector(".practice-preview-btn");
            if (practicePreviewButton) {
                practicePreviewButton.style.display = currentTestType === "practicetest" ? "inline-flex" : "none";
            }
        }

        async function saveSectionMeta() {
            const dateInput = document.getElementById("set-date");
            const difficultyInput = document.getElementById("set-difficulty");
            const rawSetDate = String(dateInput.value || "").trim();
            const normalizedSetDate = /^\d{4}-\d{2}-\d{2}$/.test(rawSetDate) ? rawSetDate : "";
            const setDate = currentTestType === "practicetest"
                ? (normalizedSetDate || "")
                : (normalizedSetDate || new Date().toISOString().split("T")[0]);
            updateHeaderPackageLabel(setDate);
            const setId = await ensureCurrentSetId(setDate);
            const record = {
                setId,
                module: MODULE_ID,
                label: MODULE_LABEL,
                setDate,
                difficulty: difficultyInput.value || "intermediate",
                updatedAt: new Date().toISOString()
            };
            if (currentTestType === "practicetest" && getRequestedPracticePackage()) record.packageNumber = getRequestedPracticePackage();
            if (window.toeflStorage && typeof toeflStorage.upsertSetRecord === "function") {
                try {
                    await toeflStorage.upsertSetRecordWithType(record, currentTestType);
                } catch (error) {
                    if (error?.code === "DUPLICATE_SET_DATE") {
                        alert("A test in this category already exists for this date. Open the existing set instead.");
                        throw error;
                    }
                    console.warn("[ToeflSync] set save failed:", error);
                }
            }
            upsertLocalRecord(record);
            updateEditorUrl(setId, setDate);
        }

        function updateHeaderPackageLabel(dateString) {
            const label = document.getElementById("header-package-label");
            if (!label) return;
            if (!dateString) {
                label.textContent = "Package";
                return;
            }
            const date = new Date(dateString);
            if (Number.isNaN(date.getTime())) {
                label.textContent = "Package";
                return;
            }
            const day = String(date.getDate()).padStart(2, "0");
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            label.textContent = `Package ${day} ${months[date.getMonth()]}`;
        }

        // ===== Practice test: instant feedback engine =====
        // Full Test Mode reuses the mock-test layout untouched; only instant mode
        // swaps the stacked question list for a one-question-at-a-time card.
        let instantOrder = [];
        let instantIndex = 0;
        let instantAnswers = {};
        let instantChecked = {};
        let instantRevealed = false;
        let instantTab = "explaination";

        function getPracticeRunMode() {
            const params = new URLSearchParams(window.location.search);
            const testType = String(params.get("testType") || currentTestType || "").toLowerCase();
            if (!testType.includes("practice")) return "full";

            const raw = String(params.get("runMode") || params.get("practiceMode") || "").toLowerCase().trim();
            if (raw === "instant" || raw === "instantfeedback" || raw === "instant feedback") return "instant";
            return "full";
        }

        function isPracticeTestType() {
            return String(currentTestType || "").toLowerCase() === "practicetest";
        }

        function isInstantFeedbackMode() {
            return getPracticeRunMode() === "instant";
        }

        function getPartIdFromUid(uid) {
            return Number(String(uid || "").split("_")[0] || 0) || 0;
        }

        function getQuestionNumberFromUid(uid) {
            return Number(String(uid || "").split("_")[1] || 0) || 0;
        }

        function buildInstantOrder() {
            instantOrder = Object.keys(globalQuestions || {})
                .filter((uid) => getPartIdFromUid(uid) === 1)
                .sort((left, right) => getQuestionNumberFromUid(left) - getQuestionNumberFromUid(right));
            if (instantIndex >= instantOrder.length) instantIndex = 0;
        }

        function applyPracticeRunMode() {
            const instant = isInstantFeedbackMode();
            document.body.classList.toggle("instant-feedback-mode", instant);

            const navigatorPanel = document.getElementById("navigator-panel");
            const progressBlock = document.querySelector(".progressbar-final .progress-bar-question");
            const dots = document.getElementById("reading-part-header");
            const questionStack = document.getElementById("display-questions-1");
            const instantHost = document.getElementById("instant-question-host-1");

            if (navigatorPanel) navigatorPanel.style.display = instant ? "none" : "";
            if (progressBlock) progressBlock.style.display = instant ? "none" : "";
            if (dots) dots.style.display = instant ? "flex" : "none";
            if (questionStack) questionStack.style.display = instant ? "none" : "";
            if (instantHost) {
                instantHost.hidden = !instant;
                instantHost.style.display = instant ? "" : "none";
            }
            updateHeaderPackageLabel((document.getElementById("set-date") || {}).value || "");

            if (!instant) {
                if (instantHost) instantHost.innerHTML = "";
                updateHeaderProgress();
                return;
            }

            buildInstantOrder();
            if (instantIndex >= instantOrder.length) instantIndex = 0;
            instantRevealed = Boolean(instantChecked[instantOrder[instantIndex]]);
            renderInstantQuestion();
        }

        function getInstantCircleState(uid, index) {
            const isCurrent = (uid === instantOrder[instantIndex]);
            const currentClass = isCurrent ? "is-current" : "";

            // 1. If checked, determine if correct or incorrect (even if it's current)
            if (instantChecked[uid]) {
                const correctLetter = String(globalAnswerKey[uid] || "").trim().toUpperCase();
                const isCorrect = String(instantAnswers[uid] || "").toUpperCase() === correctLetter;
                const statusClass = isCorrect ? "is-correct" : "is-incorrect";
                return `${statusClass} ${currentClass}`.trim();
            }

            // 2. If answered but not checked yet
            if (instantAnswers[uid]) {
                return `is-answered ${currentClass}`.trim();
            }

            // 3. Default state (idle or current)
            return currentClass;
        }

        // Question circles only exist for practice tests run in instant-feedback mode.
        function renderInstantProgressDots() {
            const host = document.getElementById("reading-part-header");
            if (!host) return;
            if (!isPracticeTestType() || !isInstantFeedbackMode()) {
                updateHeaderProgress();
                return;
            }

            const partTitle = "PART 1";
            const circles = instantOrder.map((uid, index) => {

        function goToInstantQuestion(index) {
            if (index < 0 || index >= instantOrder.length) return;
            instantIndex = index;
            instantRevealed = Boolean(instantChecked[instantOrder[instantIndex]]);
            renderInstantQuestion();
        }

        function getInstantDraft() {
            return activeSectionDraft;
        }

        function escapeHtml(value) {
            return String(value == null ? "" : value).replace(/[&<>"']/g, function (character) {
                return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[character];
            });
        }

        function coerceText(value) {
            return String(value == null ? "" : value).replace(/\s+/g, " ").trim();
        }

        function normalizeLetter(value) {
            const match = String(value || "").toUpperCase().match(/[A-D]/);
            return match ? match[0] : "";
        }

        function escapeRegExp(value) {
            return String(value || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        }

        function findOptionText(options, letter) {
            return coerceText((options || {})[normalizeLetter(letter)]) || "-";
        }

        function renderReadingExplanationHtml(rawExplanation, question) {

                correctAnswer: globalAnswerKey[uid] || "",

        function applyInstantQuestionEvidence(uid, showEvidence = instantRevealed) {
            const partId = getPartIdFromUid(uid);
            const passageBox = document.getElementById(`display-passage-${partId}`);

                ? [globalExplanations[uid], globalEnglishExplanations[uid]].filter(Boolean)
                : [];
            const phrases = [];
            explanationSources.forEach((explanation) => {
                extractHighlightPhrases(Object.assign({}, question, { explanation })).forEach((phrase) => {
                    if (!phrases.some((existing) => existing.toLowerCase() === phrase.toLowerCase())) phrases.push(phrase);
                });
            });
            passageBox.innerHTML = applyPhraseHighlightsToHtml(passage.content, phrases);
            requestAnimationFrame(() => {
                renumberPassageLineMarkers(partId);
                refreshQuestionLineReferencesForPassage(partId);

        function applyPhraseHighlightsToHtml(html, phrases) {
            var nextHtml = String(html || '');
            if (!nextHtml || !Array.isArray(phrases) || !phrases.length) return nextHtml;

            for (var i = 0; i < phrases.length; i += 1) {
                var fragments = coerceText(phrases[i])
                    .split(/\s*(?:\[\s*\.\.\.\s*\]|\.\.\.)\s*/)
                    .map(function(fragment) {
                        return fragment.replace(/^\.{2,}\s*/, '').replace(/\s*\.{2,}$/, '').trim();
                    })
                    .filter(function(fragment) { return fragment.length >= 3; });
                fragments.forEach(function(phrase) {
                    var pattern = new RegExp('(' + escapeRegExp(phrase) + ')', 'gi');
                    nextHtml = nextHtml.replace(pattern, '<mark class="passage-highlight">$1</mark>');
                });
            }

            return nextHtml;
        }

        function extractHighlightPhrases(question) {
            var phrases = [];
            var rawList = question && question.highlightPhrases;
            if (Array.isArray(rawList)) {
                for (var i = 0; i < rawList.length; i += 1) {
                    var item = coerceText(rawList[i]);
                    if (item) phrases.push(item);
                }
            }

            var explanationText = String(question && question.explanation || '').replace(/\r/g, '').trim();
            var indicatorMatch = explanationText.match(/(?:^|\n)\s*(?:[-*]\s*)?\*\*(?:kalimat\s+indikator|indicator\s+sentence)\s*:\*\*\s*([\s\S]*?)(?=\n\s*(?:[-*]\s*)?\*\*[^*\n]+:\*\*|$)/i);
            var indicatorText = indicatorMatch ? indicatorMatch[1] : '';
            var quoted = indicatorText.match(/"([^"]+)"/g) || [];
            for (var q = 0; q < quoted.length; q += 1) {
                var phrase = quoted[q].replace(/^"|"$/g, '').trim();
                if (phrase && phrase.length >= 8 && phrase.length <= 1200) phrases.push(phrase);
            }

            var unique = [];
            var seen = {};
            for (var p = 0; p < phrases.length; p += 1) {
                var key = phrases[p].toLowerCase();
                if (!seen[key]) {
                    seen[key] = true;
                    unique.push(phrases[p]);
                }
            }
            unique.sort(function (a, b) { return a.length - b.length; });
            return unique;
        }

        function highlightInlinePhrase(text, phrase, className) {
            var safeText = escapeHtml(text || '');
            var rawPhrase = coerceText(phrase);
            if (!rawPhrase) return safeText;
            var pattern = new RegExp('(' + escapeRegExp(rawPhrase) + ')', 'i');
            return safeText.replace(pattern, '<span class="' + className + '">$1</span>');
        }

        function renderQuestionTextHtml(question) {
            var text = coerceText(question && question.questionText) || '(No question text)';
            var phrase = '';
            if (Array.isArray(question && question.questionHighlightPhrases) && question.questionHighlightPhrases.length) {
                phrase = coerceText(question.questionHighlightPhrases[0]);
            }
            if (!phrase && /main topic/i.test(text)) phrase = 'main topic';
            return highlightInlinePhrase(text, phrase, 'question-highlight');
        }

        function renderExplanationHtml(rawExplanation, question) {
            var text = String(rawExplanation || '').replace(/\r/g, '').trim();
            if (!text) return 'No explanation provided.';

            var normalized = text
                .replace(/\*\*\s*kalimat\s+indikator\s*:\s*\*\*/gi, '**Kalimat Indikator:**')
                .replace(/\*\*\s*kenapa\s+opsi\s+lain\s+salah\s*:\s*\*\*/gi, '**Kenapa opsi lain salah:**');
            var fields = {};
            var fieldMatches = Array.from(normalized.matchAll(/(?:^|\n)\s*(?:[-*]\s*)?\*\*([^*:\n]+):\*\*\s*/gim));
            for (var fieldIndex = 0; fieldIndex < fieldMatches.length; fieldIndex += 1) {
                var fieldName = fieldMatches[fieldIndex][1].replace(/\s+/g, ' ').trim().toLowerCase();
                var fieldStart = fieldMatches[fieldIndex].index + fieldMatches[fieldIndex][0].length;
                var fieldEnd = fieldIndex + 1 < fieldMatches.length ? fieldMatches[fieldIndex + 1].index : normalized.length;
                fields[fieldName] = normalized.slice(fieldStart, fieldEnd).trim();
            }
            if (fields['kalimat indikator'] || fields['alasan'] || fields['kenapa opsi lain salah']) {
                var answer = fields['jawaban'] || (normalizeLetter(question && question.correctAnswer) + ' - ' + findOptionText(question && question.options, normalizeLetter(question && question.correctAnswer)));
                var paragraph = fields['paragraf'] || 'Reading passage';
                var indicator = fields['kalimat indikator'] || '';
                var reason = fields['alasan'] || '';
                var incorrect = fields['kenapa opsi lain salah'] || '';
                var optionMatches = Array.from(incorrect.matchAll(/(?:^|\n)\s*(?:[-*o]\s*)?\(?(?:opsi\s*)?([A-D])\)?\s*[:.-]+\s*([^\n]+(?:\n(?!\s*(?:[-*o]\s*)?\(?(?:opsi\s*)?[A-D]\)?\s*[:.-]))*)/gim));
                var optionsHtml = optionMatches.map(function(match) {
                    var letter = match[1].toUpperCase();
                    return '<div class="section3-structured-option"><span class="section3-structured-option__letter">' + letter + '</span><div><div class="section3-structured-option__title">' + escapeHtml(findOptionText(question && question.options, letter)) + '</div><div class="section3-structured-option__rule"></div><div class="section3-structured-option__reason">' + escapeHtml(match[2].trim()) + '</div></div></div>';
                }).join('');
                return '<section class="section3-structured-explanation"><div class="section3-structured-answer"><span class="section3-structured-answer__icon">&#10003;</span><span>' + escapeHtml(answer) + '</span></div><div class="section3-structured-body">' + (indicator ? '<div class="section3-structured-evidence"><div class="section3-structured-evidence__head"><span>' + escapeHtml(paragraph) + '</span><span class="section3-structured-evidence__label">KALIMAT INDIKATOR</span></div><p>' + escapeHtml(indicator) + '</p></div>' : '') + (reason ? '<div class="section3-structured-heading">PENJELASAN</div><div class="section3-structured-reason">' + escapeHtml(reason) + '</div>' : '') + (optionsHtml ? '<div class="section3-structured-heading">KENAPA OPSI LAIN SALAH</div><div class="section3-structured-options">' + optionsHtml + '</div>' : '') + '</div></section>';
            }

            var lines = text.split(/\n+/).map(function (line) { return line.trim(); }).filter(Boolean);
            if (!lines.length) return 'No explanation provided.';

            return lines.map(function (line) {
                var safeLine = escapeHtml(line);
                var lineMatch = line.match(/^pada\s+line\s*([\d\-\u2013]+)/i);
                if (lineMatch) {
                    var body = safeLine.replace(/^pada\s+line\s*[\d\-\u2013]+\s*:\s*/i, '');
                    return '<div class="ex-line"><span class="line-badge">Line ' + escapeHtml(lineMatch[1].replace('�', '-')) + '</span>' + body + '</div>';
                }
                if (/^penjelasan\s*:/i.test(line)) {
                    var keyBody = safeLine.replace(/^penjelasan\s*:\s*/i, '');
                    return '<div class="ex-line"><span class="ex-key-title">Key Explanation</span>' + keyBody + '</div>';
                }
                return '<div class="ex-line">' + safeLine + '</div>';
            }).join('');
        }

        function getPassageVisualLineTops(box) {
            var tops = [];
            var walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT, {
                acceptNode: function(node) {
                    return String(node.nodeValue || '').trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
                }
            });
            var range = document.createRange();
            var node;

            while ((node = walker.nextNode())) {
                var text = String(node.nodeValue || '');
                for (var index = 0; index < text.length; index += 1) {
                    if (!text[index].trim()) continue;
                    range.setStart(node, index);
                    range.setEnd(node, index + 1);
                    var rect = Array.from(range.getClientRects()).find(function(item) { return item && item.height > 0; });
                    if (!rect) continue;
                    if (!tops.some(function(top) { return Math.abs(top - rect.top) < 2; })) tops.push(rect.top);
                }
            }

            range.detach();
            return tops.sort(function(left, right) { return left - right; });
        }

        function renumberPassageLineMarkers() {
            var box = document.getElementById('reviewPassageBox');
            if (!box) return;

            var lineColumn = box.closest('.passage-shell') && box.closest('.passage-shell').querySelector('.passage-line-column');
            var lineTextLabel = document.getElementById('reviewLineLabel');

            if (!lineColumn) return;

            lineColumn.querySelectorAll('.passage-line-marker-fixed').forEach(function(marker) { marker.remove(); });

            var lineHeight = parseFloat(getComputedStyle(box).lineHeight) || 24;
            var columnRect = lineColumn.getBoundingClientRect();
            var visualLineTops = getPassageVisualLineTops(box);
            var firstMarkerTop = null;

            for (var sourceLine = 5; sourceLine <= visualLineTops.length; sourceLine += 5) {
                var lineTop = visualLineTops[sourceLine - 1];
                if (!Number.isFinite(lineTop)) continue;
                var label = document.createElement('div');
                label.className = 'passage-line-marker-fixed';
                label.dataset.markerIndex = String(sourceLine - 1);
                label.textContent = '(' + sourceLine + ')';
                lineColumn.appendChild(label);
                var relativeTop = lineTop - columnRect.top + (lineHeight / 2);
                label.style.top = relativeTop + 'px';
                if (firstMarkerTop === null) firstMarkerTop = relativeTop;
            }

            if (lineTextLabel && Number.isFinite(firstMarkerTop)) {
                var lineTopPos = Math.max(0, firstMarkerTop - (lineHeight * 0.6));
                lineTextLabel.style.top = lineTopPos + 'px';
            }
        }

        function isReadingPassageScrollable(section) {
            return Boolean(section && section.scrollHeight > section.clientHeight + 1);
        }

        function updateReadingPassageScrollThumb(section) {
            var track = section && section.querySelector('.reading-passage-scrollbar-track');
            var thumb = section && section.querySelector('.reading-passage-scrollbar-thumb');
            if (!section || !track || !thumb) return;
            if (!isReadingPassageScrollable(section)) {
                track.classList.remove('is-visible');
                return;
            }
            var trackHeight = track.clientHeight;
            var thumbHeight = Math.max(24, (section.clientHeight / section.scrollHeight) * trackHeight);
            var maxThumbTop = Math.max(0, trackHeight - thumbHeight);
            var scrollRange = section.scrollHeight - section.clientHeight;
            var scrollRatio = scrollRange > 0 ? section.scrollTop / scrollRange : 0;
            thumb.style.height = thumbHeight + 'px';
            thumb.style.top = (maxThumbTop * scrollRatio) + 'px';
        }

        function showReadingPassageScrollbar(section) {
            var track = section && section.querySelector('.reading-passage-scrollbar-track');
            if (!section || !track) return;
            if (!isReadingPassageScrollable(section)) {
                track.classList.remove('is-visible');
                return;
            }
            updateReadingPassageScrollThumb(section);
            track.classList.add('is-visible');
            if (section._readingScrollHideTimer) clearTimeout(section._readingScrollHideTimer);
            section._readingScrollHideTimer = setTimeout(function() {
                track.classList.remove('is-visible');
            }, 1000);
        }

        function refreshReadingPassageScrollbars() {

        function initReadingPassageScrollbars() {

        function updatePackageLabel(result) {

            if (!labelEl) return;
            var params = new URLSearchParams(window.location.search || '');
            var dateValue = String(
                (result && (result.setDate || result.date)) ||

            ).trim();

        function findOptionText(options, letter) {
            if (!options || !letter) return '-';
            var keys = Object.keys(options);
            for (var i = 0; i < keys.length; i += 1) {
                if (normalizeLetter(keys[i]) === letter) return coerceText(options[keys[i]]) || '-';
            }
            return '-';
        }

        function parseReadingDraftQuestions(rawQuestions, passageId) {
            var questions = [];
            var current = null;
            String(rawQuestions || '').split('\n').forEach(function(line) {
                var text = String(line || '').trim();
                if (!text) return;
                var questionMatch = text.match(/^(?:<[^>]+>)*(\d+)[.)]?\s+(.+)/);
                var optionMatch = text.match(/^\(?([A-D])[.)]?\s+(.+)/i);
                if (questionMatch && !optionMatch) {
                    current = { number: Number(questionMatch[1]), passageId: Number(passageId), questionText: questionMatch[2], options: {} };
                    questions.push(current);
                } else if (optionMatch && current) {
                    current.options[optionMatch[1].toUpperCase()] = optionMatch[2];
                }
            });
            return questions;
        }

        function parseReadingAnswerKey(rawAnswerKey) {
            var answers = {};
            String(rawAnswerKey || '').split('\n').forEach(function(line) {
                var match = String(line || '').trim().match(/^(\d+)[.)]?\s+([A-D])\b/i);
                if (match) answers[Number(match[1])] = match[2].toLowerCase();
            });
            return answers;
        }

        function parseReadingBulkExplanations(rawText, passageId) {
            var text = String(rawText || '').replace(/\r/g, '');
            var blocks = {};
            var matches = Array.from(text.matchAll(/^\s*(?:\*\*\s*)?question\s+(\d+)\s*(?:\*\*)?\s*$/gim));
            matches.forEach(function(match, index) {
                var start = match.index + match[0].length;
                var end = index + 1 < matches.length ? matches[index + 1].index : text.length;
                blocks[Number(match[1])] = text.slice(start, end).trim();
            });
            return blocks;
        }

        function parseAllReadingBulkExplanations(rawText) {
            return readingExplanations.parseAll(rawText);
        }

        async function hydrateReviewFromFirebase(result) {
            var params = new URLSearchParams(window.location.search);
            var setId = String(params.get('setId') || '').trim();
            var testType = String(params.get('testType') || 'mocktest').toLowerCase();
            if (setId && (result?.setId !== setId || result?.testType !== testType)) result = null;
            if (!setId || !window.toeflStorage || typeof window.toeflStorage.getDraftBySetIdAndType !== 'function') return result;

            var draft = await window.toeflStorage.getDraftBySetIdAndType(setId, testType).catch(function(error) { console.error("[Reading Review] Draft load failed:", error); return null; });
            if (!draft || !draft.passages) return null;

            var previousAnswers = {};
            ((result && result.questions) || []).forEach(function(question) {
                previousAnswers[String(question.passageId) + '_' + String(question.number)] = question.userAnswer || '';
            });

            var questions = [];
            var passages = {};
            var allBahasa = parseAllReadingBulkExplanations(readingExplanations.getDraftBulkText(draft, "id"));
            var allEnglish = parseAllReadingBulkExplanations(readingExplanations.getDraftBulkText(draft, "en"));
            Object.keys(draft.passages).forEach(function(passageKey) {
                var passageId = Number(passageKey);
                var passage = draft.passages[passageKey] || {};
                var answers = parseReadingAnswerKey(passage.answerKey);
                var bahasa = parseReadingBulkExplanations(passage.bulkExplanationId, passageId);
                var english = parseReadingBulkExplanations(passage.bulkExplanationEn, passageId);
                passages[passageId] = { title: passage.title || ('Passage ' + passageId), content: passage.passage || '' };
                parseReadingDraftQuestions(passage.questions, passageId).forEach(function(question) {
                    var key = String(passageId) + '_' + String(question.number);
                    question.uid = key;
                    question.correctAnswer = answers[question.number] || '';
                    question.userAnswer = previousAnswers[key] || '';
                    question.isCorrect = question.userAnswer === question.correctAnswer;
                    question.explanation = allBahasa[key] || bahasa[question.number] || '';
                    question.explanationEnglish = allEnglish[key] || english[question.number] || '';
                    questions.push(question);
                });
            });

            if (!questions.length) return null;
            return Object.assign({}, result || {}, { setId: setId, testType: testType, totalQuestions: questions.length, questions: questions, passages: passages });
        }

        function normalizeDateKey(value) {
            var raw = String(value || '').trim();
            if (!raw) return '';
            if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
            if (/^\d{4}-\d{2}-\d{2}T/.test(raw)) return raw.slice(0, 10);
            var parsed = new Date(raw);
            if (isNaN(parsed.getTime())) return '';
            return parsed.toISOString().slice(0, 10);
        }

        function applyOctoberFirstSample(result) {
            if (!result || !Array.isArray(result.questions)) return;
            var dateKey = normalizeDateKey(result.submittedAt);
            if (!dateKey.endsWith('-10-01')) return;

            var firstQuestion = null;
            for (var i = 0; i < result.questions.length; i += 1) {
                if (Number(result.questions[i] && result.questions[i].number) === 1) {
                    firstQuestion = result.questions[i];
                    break;
                }
            }
            if (!firstQuestion) return;

            firstQuestion.questionText = OCT_FIRST_SAMPLE.questionText;
            firstQuestion.options = Object.assign({}, OCT_FIRST_SAMPLE.options);
            firstQuestion.correctAnswer = OCT_FIRST_SAMPLE.correctAnswer;
            firstQuestion.explanation = OCT_FIRST_SAMPLE.explanation;
            firstQuestion.passageId = Number(firstQuestion.passageId) || 1;

            result.passages = result.passages || {};
            if (!String(result.passages['1'] || '').trim()) {
                result.passages['1'] = OCT_FIRST_SAMPLE.passage;
            }
        }

        function ensureQuestionOneFallback(result) {
            if (!result || !Array.isArray(result.questions)) return;
            var firstQuestion = null;
            for (var i = 0; i < result.questions.length; i += 1) {
                if (Number(result.questions[i] && result.questions[i].number) === 1) {
                    firstQuestion = result.questions[i];
                    break;
                }
            }
            if (!firstQuestion) return;

            var questionText = coerceText(firstQuestion.questionText);
            if (!questionText) firstQuestion.questionText = OCT_FIRST_SAMPLE.questionText;

            var optionLetters = ['A', 'B', 'C', 'D'];
            var hasAnyOptionText = false;
            firstQuestion.options = firstQuestion.options && typeof firstQuestion.options === 'object' ? firstQuestion.options : {};
            for (var j = 0; j < optionLetters.length; j += 1) {
                if (findOptionText(firstQuestion.options, optionLetters[j]) !== '-') {
                    hasAnyOptionText = true;
                    break;
                }
            }
            if (!hasAnyOptionText) firstQuestion.options = Object.assign({}, OCT_FIRST_SAMPLE.options);

            var explanationText = coerceText(firstQuestion.explanation);
            if (!explanationText) firstQuestion.explanation = OCT_FIRST_SAMPLE.explanation;

            firstQuestion.passageId = Number(firstQuestion.passageId) || 1;
            result.passages = result.passages || {};
            var passageCandidate = result.passages[String(firstQuestion.passageId)] || result.passages['1'];
            if (!coerceText(passageCandidate)) {
                result.passages[String(firstQuestion.passageId)] = OCT_FIRST_SAMPLE.passage;
            }
        }

        function renderOptionRows(question) {
            var optionList = document.getElementById('reviewOptionList');
            if (!optionList) return;

            var options = question && question.options ? question.options : {};
            var userLetter = normalizeLetter(question && question.userAnswer);
            var correctLetter = normalizeLetter(question && question.correctAnswer);
            var letters = ['A', 'B', 'C', 'D'];
            var html = '';

            for (var i = 0; i < letters.length; i += 1) {
                var letter = letters[i];
                var text = findOptionText(options, letter);
                var classes = ['section3-option-row'];
                if (letter === userLetter) classes.push('is-user');
                if (letter === correctLetter) classes.push('is-correct');
                if (letter === userLetter && userLetter && correctLetter && userLetter !== correctLetter) classes.push('is-wrong-user');

                var statusHtml = '';
                if (letter === userLetter && letter === correctLetter) {
                    statusHtml = '<span class="section3-option-status">Your Answer <i class="ph ph-check" aria-hidden="true"></i></span>';
                } else if (letter === userLetter) {
                    statusHtml = '<span class="section3-option-status">Your Answer <i class="ph ph-x" aria-hidden="true"></i></span>';
                } else if (letter === correctLetter) {
                    statusHtml = '<span class="section3-option-status">Correct Answer <i class="ph ph-check" aria-hidden="true"></i></span>';
                }

                html += '<div class="' + classes.join(' ') + '">'
                    + '<span class="section3-option-letter">' + letter + '</span>'
                    + '<span class="section3-option-text">' + escapeHtml(text) + '</span>'
                    + statusHtml
                    + '</div>';
            }

            optionList.innerHTML = html;
        }

        function renderQuestion(question, indexHint) {
            if (!question) return;
            var status = questionStatus(question);

            var statusText = document.getElementById('reviewStatusText');
            var questionNumberText = document.getElementById('reviewQuestionNumber');
            var questionText = document.getElementById('reviewQuestionText');
            var explanationEl = document.getElementById('reviewExplanationText');
            var questionBadge = document.querySelector('.section3-review-right .wrapper');

            if (questionNumberText) questionNumberText.textContent = String(question.number || '-');
            if (questionText) questionText.innerHTML = renderQuestionTextHtml(question);
            if (statusText) {
                if (status === 'correct') {
                    statusText.textContent = 'CORRECT';
                    statusText.style.color = '#0d9488';
                    if (questionBadge) questionBadge.style.setProperty('--q-accent', '#0d9488');
                } else if (status === 'wrong') {
                    statusText.textContent = 'INCORRECT';
                    statusText.style.color = '#dc2626';
                    if (questionBadge) questionBadge.style.setProperty('--q-accent', '#dc2626');
                } else {
                    statusText.textContent = 'UNANSWERED';
                    statusText.style.color = '#7a8fa6';
                    if (questionBadge) questionBadge.style.setProperty('--q-accent', '#dc2626');
                }
            }

            renderOptionRows(question);
            if (explanationEl) explanationEl.innerHTML = renderExplanationHtml(question.explanation || question.explanationEnglish, question);

            if (reviewResultData && Array.isArray(reviewResultData.questions)) {
                reviewQuestionIndex = typeof indexHint === 'number' ? indexHint : reviewQuestionIndex;
                renderHeaderNavigator(reviewResultData, Number(question.number || 0));
                updateHeaderNavButtons();
            }

            renderPassageForQuestion(question);
        }

        function renderPassageForQuestion(question) {
            var passageBox = document.getElementById('reviewPassageBox');
            var heading = document.getElementById('reviewPassageHeading');
            var partTitle = document.getElementById('reviewPartTitle');
            if (!passageBox || !heading) return;

            var passageId = Number(question && question.passageId);
            var passages = (reviewResultData && reviewResultData.passages) || {};
            var passageRaw = passages[String(passageId)] || passages[passageId] || '';
            var highlightPhrases = extractHighlightPhrases(question);

            if (partTitle) {
                partTitle.textContent = passageId > 0 ? ('PART ' + passageId) : 'PART 1';
            }

            var range = reviewPassageRanges[passageId];
            if (range && isFinite(range.min) && isFinite(range.max)) {
                heading.textContent = 'Questions ' + range.min + '-' + range.max;
            } else if (passageId > 0) {
                heading.textContent = 'Questions ' + (Number(question && question.number) || 1) + '-' + (Number(question && question.number) || 1);
            } else {
                heading.textContent = 'Reading Passage';
            }

            var passageHtml = renderPassageHtml(passageRaw);
            passageBox.innerHTML = applyPhraseHighlightsToHtml(passageHtml, highlightPhrases);
            requestAnimationFrame(function () {
                renumberPassageLineMarkers();
                refreshReadingPassageScrollbars();
            });
        }

        function selectReviewQuestion(questionNumber) {
            if (!reviewResultData || !Array.isArray(reviewResultData.questions)) return;
            for (var i = 0; i < reviewResultData.questions.length; i += 1) {
                if (Number(reviewResultData.questions[i].number || 0) === Number(questionNumber)) {
                    renderQuestion(reviewResultData.questions[i], i);
                    return;
                }
            }
        }

        function goToNextReviewQuestion() {
            if (!reviewResultData || !Array.isArray(reviewResultData.questions)) return;
            var nextIndex = reviewQuestionIndex + 1;
            if (nextIndex >= reviewResultData.questions.length) return;
            renderQuestion(reviewResultData.questions[nextIndex], nextIndex);
        }

        function goToPreviousReviewQuestion() {
            if (!reviewResultData || !Array.isArray(reviewResultData.questions)) return;
            var prevIndex = reviewQuestionIndex - 1;
            if (prevIndex < 0) return;
            renderQuestion(reviewResultData.questions[prevIndex], prevIndex);
        }

        async function refreshReviewFromFirebase() {
            if (!reviewResultData) return;
            var refreshed = await hydrateReviewFromFirebase(reviewResultData);
            if (!refreshed || !Array.isArray(refreshed.questions)) return;

            var currentSignature = JSON.stringify(reviewResultData.questions);
            var refreshedSignature = JSON.stringify(refreshed.questions);
            if (currentSignature === refreshedSignature) return;

            var activeQuestionNumber = Number(reviewResultData.questions[reviewQuestionIndex] && reviewResultData.questions[reviewQuestionIndex].number);
            reviewResultData = refreshed;
            buildPassageQuestionRanges(reviewResultData);
            renderListeningScaledScore(reviewResultData);
            var nextIndex = reviewResultData.questions.findIndex(function(question) {
                return Number(question.number) === activeQuestionNumber;
            });
            renderQuestion(reviewResultData.questions[nextIndex >= 0 ? nextIndex : 0], nextIndex >= 0 ? nextIndex : 0);
        }

        async function init() {
            var result = null;
            try {
                var raw = localStorage.getItem('toefl_section3_result');
                if (raw) result = JSON.parse(raw);
            } catch (_) {
                result = null;
            }

            result = await hydrateReviewFromFirebase(result);

            if (!result || !Array.isArray(result.questions) || !result.questions.length) {
                document.getElementById('reviewQuestionText').textContent = 'No review data found. Complete Section 3 first.';
                document.getElementById('reviewExplanationText').textContent = 'No explanation available.';
                renderHeaderNavigator({ questions: [] }, 1);
                document.getElementById('headerPrevQuestionBtn').disabled = true;
                document.getElementById('headerNextQuestionBtn').disabled = true;
                return;
            }


            result.questions = result.questions.slice().sort(function (a, b) {
                return Number(a.number || 0) - Number(b.number || 0);
            });

            reviewResultData = result;
            buildPassageQuestionRanges(reviewResultData);
            renderListeningScaledScore(reviewResultData);
            updatePackageLabel(reviewResultData);

            var firstQuestion = reviewResultData.questions[0];
            var firstIndex = 0;
            for (var i = 0; i < reviewResultData.questions.length; i += 1) {
                if (!questionIsCorrect(reviewResultData.questions[i])) {
                    firstQuestion = reviewResultData.questions[i];
                    firstIndex = i;
                    break;
                }
            }
            renderQuestion(firstQuestion, firstIndex);
            initReadingPassageScrollbars();
            if (new URLSearchParams(window.location.search).get('setId')) {
                window.setInterval(refreshReviewFromFirebase, 3000);
            }

            var featuresOverlay = document.getElementById('features-overlay');
            if (featuresOverlay) {
                featuresOverlay.addEventListener('click', function (event) {
                    if (event.target === featuresOverlay) setFeaturesMenuOpen(false);
                });
            }

            window.addEventListener('resize', function () {
                renumberPassageLineMarkers();
                refreshReadingPassageScrollbars();
            });
        }

        if (document.getElementById('reviewQuestionText')) {
            window.addEventListener('DOMContentLoaded', init);
        }

        function renderInstantQuestion() {
            const host = document.getElementById("instant-question-host-1");
            if (!host) return;
            const uid = instantOrder[instantIndex];
            if (!uid) {
                host.innerHTML = '<div class="instant-card"><div class="instant-card__body"><p class="instant-empty-state">No questions available for this practice set.</p></div></div>';
                renderInstantProgressDots();
                return;
            }

            const question = globalQuestions[uid] || { questionText: "", options: {} };
            applyInstantQuestionEvidence(uid, instantRevealed);
            const questionNumber = getQuestionNumberFromUid(uid);
            const selected = normalizeLetter(instantAnswers[uid]);
            const correct = normalizeLetter(globalAnswerKey[uid]);
            const isCorrect = instantRevealed && selected === correct;
            const badgeState = instantRevealed ? (isCorrect ? " is-correct" : " is-incorrect") : (selected ? " is-selected" : "");
            const optionsHtml = ["A", "B", "C", "D"].map((letter) => {
                const classes = [];
                if (!instantRevealed && selected === letter) classes.push("selected");
                if (instantRevealed && letter === correct) classes.push("is-correct");
                if (instantRevealed && letter === selected && selected !== correct) classes.push("is-incorrect");
                const isSelected = instantRevealed && letter === selected;
                const isCorrectChoice = instantRevealed && letter === correct;
                const tag = isSelected
                    ? `<span class="instant-option-tag${isCorrect ? "" : " is-wrong"}">Your Answer <i class="ph ph-${isCorrect ? "check" : "x"}" aria-hidden="true"></i></span>`
                    : (isCorrectChoice ? '<span class="instant-option-tag">Correct Answer <i class="ph ph-check" aria-hidden="true"></i></span>' : "");
                return `<label class="${classes.join(" ")}"${instantRevealed ? "" : ` onclick="selectInstantChoice('${letter}', '${uid}')"`}>
                    <span class="instant-option-letter">${letter}</span>
                    <span class="instant-option-text">${escapeHtml((question.options || {})[letter] || "")}</span>${tag}
                </label>`;
            }).join("");
            const stemHtml = escapeHtml(question.questionText || `Question ${questionNumber}`);
            const actionsHtml = instantRevealed
                ? `<button class="btn-action primary" type="button" onclick="nextInstantQuestion()">${instantIndex === instantOrder.length - 1 ? "Finish Practice" : "Next Question"} <i class="ph ph-caret-right" aria-hidden="true"></i></button>`
                : `<button class="btn-action secondary" type="button" onclick="skipInstantQuestion()">Skip Question</button>
                   <button class="btn-action primary" type="button" onclick="checkInstantAnswer()">Check Answer <i class="ph ph-caret-right" aria-hidden="true"></i></button>`;

            host.innerHTML = `<section class="instant-card" data-uid="${uid}">
                <div class="instant-card__body">
                    <article class="instant-question">
                        <div class="instant-question-head">
                            <div class="question-number-badge${badgeState}">${questionNumber}</div>
                            <p class="instant-question-title">${stemHtml}</p>
                            ${instantRevealed ? `<span class="instant-verdict ${isCorrect ? "is-correct" : "is-incorrect"}">${isCorrect ? "CORRECT" : "INCORRECT"}</span>` : ""}
                        </div>
                        <div class="instant-options">${optionsHtml}</div>
                    </article>
                    ${instantRevealed ? buildInstantExplanationHtml(uid) : ""}
                    <div class="instant-actions">${actionsHtml}</div>
                </div>
            </section>`;
            renderInstantProgressDots();
        }

        function selectInstantChoice(letter, uid) {
            if (instantRevealed || !uid) return;
            instantAnswers[uid] = normalizeLetter(letter);
            renderInstantQuestion();
        }

        function checkInstantAnswer() {
            const uid = instantOrder[instantIndex];
            if (!uid) return;
            if (!instantAnswers[uid]) {
                alert("Please select an answer before checking.");
                return;
            }
            instantChecked[uid] = true;
            instantRevealed = true;
            setInstantRadioAnswer(uid, instantAnswers[uid]);
            renderInstantQuestion();
        }

        function setInstantRadioAnswer(uid, letter) {
            document.querySelectorAll(`input[name="q_${uid}"]`).forEach((radio) => {
                radio.checked = String(radio.value || "").toUpperCase() === normalizeLetter(letter);
            });
        }

        function skipInstantQuestion() {
            advanceInstantQuestion();
        }

        function nextInstantQuestion() {
            advanceInstantQuestion();
        }

        function advanceInstantQuestion() {
            if (instantIndex >= instantOrder.length - 1) {
                finishInstantPractice();
                return;
            }
            instantIndex += 1;
            instantRevealed = Boolean(instantChecked[instantOrder[instantIndex]]);
            renderInstantQuestion();
        }

            instantOrder.forEach((uid) => setInstantRadioAnswer(uid, instantAnswers[uid] || ""));
