        #instant-question-host .section2-materi-lesson .lesson-document h2 { font-size: 17px; margin-top: 24px; }

        #instant-question-host .section2-materi-lesson .lesson-document td { border: 1px solid #b8d2e7; padding: 8px; text-align: left; vertical-align: top; }
        #instant-question-host .section2-materi-lesson .lesson-document strong { font-weight: 700; }

        #instant-question-host .section2-materi-empty { padding: 20px 0; color: #63738a; }

        .progress-q-circle {
        width: 20px;
        height: 20px;
        border-radius: 999px;
        border: 1px solid #d1dce8;
        background: #e8eef5;
        color: #fff;
        font: 400 10px/1 "Plus Jakarta Sans", Arial, sans-serif;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 1px;
        transition: all 0.2s ease;
        box-sizing: border-box;
    }

    /* Default unanswered/idle circle */
    .progress-q-circle:not(.is-answered):not(.is-current):not(.is-correct):not(.is-incorrect) {
        background: #7a8fa6;
        border-color: #d1dce8;
        color: #fff;
    }

    /* Current active question -> Blue */
    .progress-q-circle.is-current {
        background: #005FAA;
        border-color: #fff;
        color: #fff;
        box-shadow: 0 0 0 2px #005FAA;
    }

    /* Answered prior to check */
    .progress-q-circle.is-answered {
        background: #005FAA;
        color: #fff;
        border-color: #fff;
        box-shadow: 0 0 2px #005FAA;
    }

    /* Correct post-instant check -> Green */
    .progress-q-circle.is-correct {
        background: #0d9488;
        color: #fff;
        border-color: #fff;
        box-shadow: 0 0 2px #0d9488;
    }

    /* Incorrect post-instant check -> Red */
    .progress-q-circle.is-incorrect {
        background: #dc2626;
        color: #fff;
        border-color: #fff;
        box-shadow: 0 0 2px #dc2626;
    }

    .progress-q-circle:hover {
        border-color: #fff;
    }

    /* Part Chip Layout */
    .progress-part-chip {
        border: none;
        border-radius: 0;
        background: transparent;
        width: auto;
        min-width: 33px;
        height: 28px;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .progress-part-chip.active {
        width: max-content;
        min-width: max-content;
        height: auto;
        align-items: center;
        cursor: default;
        padding: 0;
        box-shadow: none;
    }

    .reading-part-circles {
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        gap: 4px;
        padding-top: 4px;
    }

    .progress-part-chip.active .progress-part-title {
        height: 21px;
        width: 100%;
        border-bottom: 1px solid #d1dce8;
        font: 700 14px/18px "Plus Jakarta Sans", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
    }

    /* ===== Practice: instant feedback layout ===== */
    .instant-progress { display: flex; align-items: center; gap: 10px; }
    .instant-progress.is-full-practice {
        max-width: min(44vw, 560px);
        overflow-x: auto;
    }
    .instant-progress.is-full-practice .progress-part-chip { flex-shrink: 0; }

    #instant-question-host { 
        padding: 24px 16px 40px;
        display: flex;
        flex-direction: column;
        justify-content: center; /* Centers content vertically */
        align-items: center;     /* Centers content horizontally */
        box-sizing: border-box;
    }

    .instant-card {
        width: min(922px, 100%);
        margin: 0 auto;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
        overflow: hidden;
    }

    .instant-card__tabs {
        display: flex;
        align-items: stretch;
        border-bottom: 1px solid #e2e8f0;
    }

    .instant-card__tab {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px 10px;
        border: 0;
        background: #fff;
        color: #7a8fa6;
        cursor: pointer;
        font: 600 13px/1 "Plus Jakarta Sans", Arial, sans-serif;
        border-bottom: 3px solid transparent;
    }

    .instant-card__tab img { width: 18px; height: 18px; object-fit: contain; }
    .instant-card__tab.is-active { color: #005faa; border-bottom-color: #005faa; }

    .instant-card__body { padding: 20px 24px 22px; display: grid; gap: 18px; }
    .instant-panel[hidden] { display: none; }

    .instant-question { display: grid; gap: 14px; }

    .instant-question-head { display: flex; align-items: top-left; gap: 24px; }
    .instant-question-head .question-number-badge { flex: 0 0 auto; }

    .instant-question-title {
        flex: 1;
        margin: 0;
        color: #0f172a;
        font: 400 18px/1.45 "Times New Roman", Times, serif;
    }

    .instant-verdict {
        font: 600 15px/1 "Plus Jakarta Sans", Arial, sans-serif;
        letter-spacing: 0.04em;
        white-space: nowrap;
    }

    .instant-verdict.is-correct { color: #0d9488; }
    .instant-verdict.is-incorrect { color: #dc2626; }

    .question-number-badge.is-selected { background: #005FAA; border-color: #fff; color: #fff; box-shadow: 0 0 4px #0EA5E9; }
    .question-number-badge.is-correct { background: #0d9488; border-color: #fff; color: #fff; box-shadow: 0 0 4px #0d9488; }
    .question-number-badge.is-incorrect { background: #DC2626; border-color: #fff; color: #fff; box-shadow: 0 0 4px #DC2626; }

    .instant-options { display: grid; gap: 10px; }

    .instant-options label {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        min-height: 44px;
        padding: 9px 16px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        background: #fff;
        cursor: pointer;
        font: 400 15px/1.4 "Times New Roman", Times, serif;
        transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .instant-options label.selected { border-color: #005faa; background: rgba(14, 165, 233, 0.16); box-shadow: 0 4px 4px rgba(14, 165, 233, 0.22); }
    .instant-options label.is-correct { border-color: #0d9488; background: #d7f5ee; }
    .instant-options label.is-incorrect { border-color: #fca5a5; background: #fef2f2; }
    .instant-options label.is-locked { cursor: default; }

    .instant-option-letter {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        border-radius: 999px;
        border: 1px solid #e2e8f0;
        background: #fff;
        color: #64748b;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font: 400 12px/1 "Times New Roman", Times, serif;
    }

    .instant-options label.selected .instant-option-letter { background: #005FAA; border-color: #005faa; color: #fff; }
    .instant-options label.is-correct .instant-option-letter,
    .qc-core__item.is-correct .instant-option-letter { 
        background: #0d9488 !important; 
        border-color: #0d9488 !important; 
        color: #ffffff !important; 
    }
    .instant-options label.is-incorrect .instant-option-letter,
    .qc-core__item.is-incorrect .instant-option-letter { 
        background: #dc2626 !important; 
        border-color: #dc2626 !important; 
        color: #ffffff !important; 
    }

    .instant-option-letter-observe {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        margin-left: 4px;
        border: 1px solid #e2e8f0;
        border-radius: 50%;
        background: #fde047;
        color: #64748b;
        font: 600 11px/1 "Plus Jakarta Sans", Arial, sans-serif;
        vertical-align: middle;
    }

    .instant-option-text { flex: 1; min-width: 0; font: 400 18px/1 "Times New Roman", Times, serif; }

    .instant-option-tag {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #0d9488;
        font: 500 13px/1 "Plus Jakarta Sans", Arial, sans-serif;
    }

    .instant-option-tag.is-wrong { color: #dc2626; }

    /* Part B renders the sentence inline with the four underlined choices. */
    .instant-partb-sentence {
        margin: 0;
        color: #0f172a;
        font: 400 16px/2.1 "Times New Roman", Times, serif;
    }

    #instant-question-host .instant-partb-sentence .inline-error-wrapper.is-correct .word-text {
        background: #0d9488;
        border-color: #0d9488;
        color: #fff;
    }

    #instant-question-host .instant-partb-sentence .inline-error-wrapper.is-correct .letter-badge {
        border-color: #0d9488;
        background: #d7f5ee;
        color: #0f172a;
    }

    #instant-question-host .instant-partb-sentence .inline-error-wrapper.is-incorrect .word-text {
        background: #dc2626;
        border-color: #dc2626;
        color: #fff;
    }

    #instant-question-host .instant-partb-sentence .inline-error-wrapper.is-incorrect .letter-badge {
        border-color: #dc2626;
        background: #fef2f2;
        color: #0f172a;
    }

    .instant-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        padding-top: 16px;
        border-top: 1px solid #e2e8f0;
    }

    .btn-action {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 10px 18px;
        cursor: pointer;
        font: 600 14px/1 "Plus Jakarta Sans", Arial, sans-serif;
    }

    .btn-action.primary { background: #0d9488; color: #fff; }
    .btn-action.secondary { background: #94a3b8; color: #fff; }
    .btn-action:hover { filter: brightness(1.06); }

    /* QC C.O.R.E analysis panel */
    .qc-core { border: 1px solid #dbe4f0; border-radius: 12px; overflow: hidden; }

    .qc-core__head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        background: #4f46e5;
        color: #fff;
        font: 750 14px/1 "Plus Jakarta Sans", Arial, sans-serif;
        letter-spacing: 0.06em;
    }

    .qc-core__body { padding: 16px 18px; display: grid; gap: 16px; background: #fff; }
    .qc-core__block { display: grid; gap: 6px; }

    .qc-core__label {
        color: #6366f1;
        font: 600 14px/1.3 "Plus Jakarta Sans", Arial, sans-serif;
        letter-spacing: 0.02em;
    }

    .qc-core__text {
        color: #0f172a;
        font: 400 14px/1.6 "Plus Jakarta Sans", Arial, sans-serif;
        text-align: justify;
    }

    .qc-core__observe {
        display: flex;
            align-items: flex-start;
            flex-wrap: wrap;
            row-gap: 12px;
            column-gap: 8px;
            padding: clamp(14px, 2.2vw, 22px);
            color: #0f172a;
            font: 500 15px/1.4 "Plus Jakarta Sans", Arial, sans-serif;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: linear-gradient(180deg, #fbfdff, #f7faff);
        border: 1px solid #dce8f8;
        border-radius: 8px;

    }

    .qc-core__observe-token {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        vertical-align: middle;
        gap: 4px;
        margin: 0 2px;
        line-height: 1.2;
    }

    .qc-core__observe-word {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 6px;
        background: #e0f2fe;
        color: #075985;
        text-decoration: underline;
        text-underline-offset: 2px;
    }

    .qc-core__observe-role {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        background: #0d9488;
        color: #fff;
        font: 600 11px/1.2 "Plus Jakarta Sans", Arial, sans-serif;
        white-space: nowrap;
    }

    /* Base underlined word container */
    .qc-core__observe-word.is-underlined {
        text-decoration: underline;
        text-underline-offset: 3px;
    }

    .qc-core__observe mark {
        background: #fde047;
        color: #0f172a;
        border-radius: 4px;
        font-weight: 600;
        padding: 0 1px;
    }

    .qc-core__observe mark.instant-option-letter-observe {
        border-radius: 50%;
        padding: 0;
    }

    .qc-core__concept mark { background: #fde047; padding: 1px 5px; border-radius: 3px; font-weight: 600; }

    .qc-core__rows {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .qc-core__row {
        display: grid;
        /* Column 1: Bullet dot | Column 2: Label (Subject, Verb, etc.) | Column 3: Value text */
        grid-template-columns: 14px 120px auto 1fr;
        align-items: center;
        gap: 8px;
        font: 400 13px/1.6 "Plus Jakarta Sans", Arial, sans-serif;
        color: #0f172a;
    }

    .section2-qc-bullet {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: #000000;
        /* Center dot visually with line-height */
        align-self: center;
    }

    .qc-core__row strong {
        font-weight: 600;
        white-space: nowrap;
    }

    .qc-core__row-value {
        word-break: break-word;
    }

    .qc-core__list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
    }

    .qc-core__item {
        display: grid;
        /* Col 1: Badge + Text | Col 2: Mark Icon | Col 3: Colon | Col 4: Reason */
        grid-template-columns: 100px 20px 10px minmax(0, 1fr);
        gap: 8px;
        align-items: center; /* Vertically aligns all 4 columns */
        font: 400 14px/1.55 "Plus Jakarta Sans", Arial, sans-serif;
        color: #0f172a;
        padding: 10px 12px;
        border-radius: 8px;
    }

        /* Zebra striping for alternating rows */
    .qc-core__item:nth-child(odd) {
        background-color: #FBFCFF;
    }

    .qc-core__item:nth-child(even) {
        background-color: #F5F7FF;
    }

    /* Container for letter badge + option text with 8px gap */
    .qc-core__label-wrap {
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .section2-qc-bullet {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: #000000;
    }

    .qc-colon {
        font-weight: 400;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
    }

    .qc-core__item-mark { 
        font-weight: 700; 
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
    }

    .qc-core__item.is-correct .qc-core__item-mark { color: #0d9488; }
    .qc-core__item.is-incorrect .qc-core__item-mark { color: #dc2626; }

    .instant-empty-state,
    .instant-empty {
        margin: 0;
        padding: 20px;
        color: #94a3b8;
        text-align: center;
        font: 400 13px/1.5 "Plus Jakarta Sans", Arial, sans-serif;
    }

    .instant-video-frame {
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 0;
        border-radius: 12px;
        background: #0f172a;
    }

    .instant-panel .section2-complete-sentence-box {
        width: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 8px;
        padding: 16px 20px;
        border: 1px solid #d1dce8;
        border-radius: 8px;
        background: linear-gradient(135deg, #f4fffb, #fff);
        letter-spacing: 0.04em;
    }

    .instant-panel .section2-complete-sentence-box h3 {
        margin: 0;

        font: 700 14px "Plus Jakarta Sans", Arial, sans-serif;
    }

    .instant-panel .section2-complete-sentence {
        margin: 0;
        color: #526176;
        font: 400 18px/1.45 "Times New Roman", Times, serif;
        text-align: center;
        overflow-wrap: anywhere;
    }

    .instant-panel .section2-complete-sentence strong {
        background: #ffde00;
        color: #000000;
        font-weight: 550;
    }

    .instant-panel .section2-complete-rationale {
        margin: 0;
        color: #111827;
        font: 400 14px/1.55 "Plus Jakarta Sans", Arial, sans-serif;
        overflow-wrap: anywhere;
    }

    .section2-review-page #partbPanelExplaination .section2-qc-observe-token,
        .section2-qc-observe-token {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: top;
            gap: 4px;
        }

        .section2-review-page #partbPanelExplaination .section2-qc-observe-word,
        .section2-qc-observe-word {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            background: #e0f2fe;
            color: #075985;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            text-align: center;
            white-space: nowrap;
        }

        .section2-review-page #partbPanelExplaination .section2-qc-observe-word.is-underlined,
        .section2-qc-observe-word.is-underlined {
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 1.5px;
        }

        .section2-review-page #partbPanelExplaination .section2-qc-elimination-row {
            display: grid;
            grid-template-columns: 10px 160px 20px 14px minmax(0, 1fr);
            align-items: start;
            column-gap: 6px;
            margin: 7px 0;
            color: #111827;
            font: 500 14px/1.5 "Plus Jakarta Sans", Arial, sans-serif;
        }

        .section2-review-page #partbPanelExplaination .section2-qc-elimination-row.section2-qc-keyvalue-row {
            grid-template-columns: 10px 100px 14px minmax(0, 1fr);
        }

        .section2-review-page #partbPanelExplaination .section2-qc-bullet {
            width: 5px;
            height: 5px;
            margin-top: 8px;
            border-radius: 999px;

    <script>
        const PARTS = [
            { id: 1, name: "Part A: Structure", range: "Questions 1-15", instr: "<strong>Directions</strong>: These questions are incomplete sentences. Beneath each sentence you will see four words or phrases, marked (A), (B), (C), and (D). Choose the one word or phrase that best completes the sentence." },
            { id: 2, name: "Part B: Written Expression", range: "Questions 16-40", instr: "<strong>Directions:</strong> In these questions, each sentence has four underlined words or phrases. Identify the one underlined word or phrase that must be changed in order for the sentence to be correct." }
        ];
        const SETS_KEY = "toefl_developer_sets_v1";
        const SETS_KEY_V2 = "toefl_developer_sets_v2";
        const MODULE_ID = "structure";
        const MODULE_LABEL = "Structure";
        const EDITOR_APPLY_SYNC_KEY = "toefl_section2_editor_apply_sync";
        const DRAFT_KEY = "toefl_section2_dev_draft_v1";
        const ONBOARDING_KEY_BASE = "toefl_section2_onboarding_seen_v1";
        const DARK_MODE_KEY = "toefl_section2_dark_mode_v1";
        const TEXT_SIZE_KEY = "toefl_section2_text_size_v1";
        let currentSetId = "";
        let currentTestType = "mocktest";
        let currentPackageDate = "";
        let lastValidSetDate = "";
        let forcedPracticeFocusPart = null;
        let section2MaterialTopics = [];
        let section2MaterialRecords = safeParse(localStorage.getItem('toefl_structure_materials_v1'), {}) || {};

        const SECTION2_DEFAULT_MATERIAL_TOPICS = [
            ['Module 1', [['1.1', 'Missing Subjects & Verbs'], ['1.2', 'Appositives (Noun Phrase Distractors)'], ['1.3', 'Present Participles (-ing) vs. Past Participles (-ed)'], ['1.4', 'Subject-Verb Agreement'], ['1.5', 'Tricky Singular Subjects']]],
            ['Module 2', [['2.1', 'Coordinate Connectors'], ['2.2', 'Adverb Clauses'], ['2.3', 'Noun Clauses'], ['2.4', 'Adjective/Relative Clauses'], ['2.5', 'Reduced Clauses']]],
            ['Module 3', [['3.1', 'Causative Verbs'], ['3.2', 'Active vs. Passive Voice'], ['3.3', 'Modals + Base Verbs'], ['3.4', 'Infinitives vs. Gerunds'], ['3.5', 'Time Markers & Tenses']]],
            ['Module 4', [['4.1', 'Inversion with Negatives'], ['4.2', 'Inversion with Place Expressions'], ['4.3', 'Inversion in Conditionals']]],
            ['Module 5', [['5.1', 'Parallel Structure'], ['5.2', 'Paired Conjunctions'], ['5.3', 'Comparatives & Superlatives'], ['5.4', 'Illogical Comparisons']]],
            ['Module 6', [['6.1', 'Adjectives vs. Adverbs'], ['6.2', 'Noun Endings'], ['6.3', 'Singular/Plural Countability'], ['6.4', 'Pronoun Agreement']]],
            ['Module 7', [['7.1', 'Dependent Prepositions'], ['7.2', 'Make vs. Do'], ['7.3', 'Like, Alike, and Unlike'], ['7.4', 'Another, Other, Others']]]
        ];

        function normalizeSection2MaterialTopics(topics) {
            return (Array.isArray(topics) ? topics : []).map((topic) => ({
                module: String(topic?.module || '').trim(),
                code: String(topic?.code || '').trim(),
                title: String(topic?.title || '').trim()
            })).filter((topic) => topic.module && topic.code && topic.title);
        }

        function getSection2MaterialTopicsFromDefaults() {
            return SECTION2_DEFAULT_MATERIAL_TOPICS.flatMap(([module, topics]) => topics.map(([code, title]) => ({ module, code, title })));
        }

        async function loadSection2MaterialTopics() {
            const localCustom = safeParse(localStorage.getItem('toefl_structure_material_topics_v1'), []);
            let remoteCustom = [];
            try {
                const remote = window.toeflStorage && typeof toeflStorage.getMaterialsLibrary === 'function'
                    ? await toeflStorage.getMaterialsLibrary()
                    : null;
                remoteCustom = remote && Array.isArray(remote.customTopics) ? remote.customTopics : [];
                if (remote && remote.records && typeof remote.records === 'object') {
                    const decoded = {};
                    Object.keys(remote.records).forEach((key) => {
                        let decodedKey = key;
                        try { decodedKey = decodeURIComponent(key); } catch (_) {}
                        decoded[decodedKey] = remote.records[key];
                    });
                    section2MaterialRecords = decoded;
                }
            } catch (_) {}
            const topics = getSection2MaterialTopicsFromDefaults().concat(normalizeSection2MaterialTopics(localCustom), normalizeSection2MaterialTopics(remoteCustom));
            const seen = {};
            section2MaterialTopics = topics.filter((topic) => {
                const key = topic.module + '-' + topic.code;
                if (seen[key]) return false;
                seen[key] = true;
                return true;
            });
            if (instantTab === 'materi' && instantRevealed) renderInstantQuestion();
        }

        function resolveInstantMaterialTopic(uid) {
            const questionNumber = getQuestionNumberFromUid(uid);
            const question = globalQuestions[uid] || {};
            const draft = safeParse(localStorage.getItem(DRAFT_KEY), {}) || {};
            const explicit = getSelectedSection2Material(questionNumber)
                || question.materialTopic
                || draft.parts?.[getPartIdFromUid(uid)]?.explanationTexts?.[questionNumber]?.materialTopic;
            if (explicit && explicit.module && explicit.code) return explicit;

            const normalize = (value) => String(value || '').replace(/<[^>]*>|\*+/g, '').toLowerCase().replace(/[&/,.:;()\-]+/g, ' ').replace(/\s+/g, ' ').trim();
            const concept = normalize(parseQcCoreExplanation(getSection2ExplanationSource(getPartIdFromUid(uid), questionNumber, uid)).concept);
            if (!concept) return null;
            for (const [key, record] of Object.entries(section2MaterialRecords)) {
                const title = String(record?.title || record?.name || '').trim();
                const normalizedTitle = normalize(title);
                if (!normalizedTitle || (normalizedTitle !== concept && !normalizedTitle.includes(concept) && !concept.includes(normalizedTitle))) continue;
                const separator = key.lastIndexOf('-');
                if (separator < 0) continue;
                return { module: record.module || key.slice(0, separator), code: record.code || key.slice(separator + 1), title };
            }
            return null;
        }

        function sanitizeMaterialHtml(value) {
            const template = document.createElement('template');
            template.innerHTML = String(value || '');
            template.content.querySelectorAll('script, style, iframe, object, embed').forEach((node) => node.remove());
            template.content.querySelectorAll('*').forEach((node) => {
                Array.from(node.attributes).forEach((attribute) => {
                    if (/^on/i.test(attribute.name) || /javascript:/i.test(attribute.value)) node.removeAttribute(attribute.name);
                });
            });
            return template.innerHTML;
        }

        function renderSection2MaterialOptions() {
            document.querySelectorAll('.section2-material-topic-select').forEach((select) => {
                const current = select.value;
                select.innerHTML = '<option value="">Select material topic</option>' + section2MaterialTopics.map((topic) => {
                    const value = encodeURIComponent(JSON.stringify(topic));
                    return '<option value="' + value + '">' + escapeHtml(topic.module + ' · ' + topic.code + ' · ' + topic.title) + '</option>';
                }).join('');
                if (current) select.value = current;
            });
        }

        function getSelectedSection2Material(questionNumber) {
            const select = document.getElementById('section2-material-topic-' + questionNumber);
            if (!select || !select.value) return null;
            try { return JSON.parse(decodeURIComponent(select.value)); } catch (_) { return null; }
        }

        function updateSection2ConceptForCard(questionNumber) {
            const input = document.getElementById(`input-explanation-en-${questionNumber}`);
            const topic = getSelectedSection2Material(questionNumber);
            if (!input || !topic || !String(input.value || '').trim()) return;
            input.value = String(input.value).replace(/^\*\*C\s*-\s*Concept:\*\*.*$/m, `**C - Concept:** ${topic.title}`);
        }

        function getStructurePracticeFocusPart() {
            const params = new URLSearchParams(window.location.search);
            const testType = String(params.get("testType") || "mocktest").toLowerCase();
            if (testType !== "practicetest") return null;

            const focus = String(params.get("focus") || "").toLowerCase();
            if (focus === "parta") return 1;
            if (focus === "partb") return 2;
            return null;
        }

        // Practice sets are per category, so focus+difficulty is what makes them distinct.
        function getPracticeVariant() {
            const params = new URLSearchParams(window.location.search);
            const slug = (value) => String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
            const focus = slug(params.get("focus")) || (forcedPracticeFocusPart ? `part${forcedPracticeFocusPart === 2 ? "b" : "a"}` : "");
            const difficulty = slug(params.get("difficulty")) || slug((document.getElementById("set-difficulty") || {}).value);
            return { focus, difficulty, slug: [focus, difficulty].filter(Boolean).join("-") };
        }

        function setRecordMatchesPracticeVariant(record, variant) {
            if (currentTestType !== "practicetest" || !variant || !variant.slug) return true;
            const slug = (value) => String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
            const recordFocus = slug(record?.focus);
            const recordDifficulty = slug(record?.difficulty);
            // Sets saved before the category was persisted fall back to the id segment.
            if (!recordFocus && !recordDifficulty) {
                return String(record?.setId || "").toLowerCase().includes(`_${variant.slug}_`);
            }
            if (variant.focus && recordFocus && recordFocus !== variant.focus) return false;
            if (variant.difficulty && recordDifficulty && recordDifficulty !== variant.difficulty) return false;
            return true;
        }

        // Mock Test owns day 1, 5, 9, 13... (every 4th day); Practice Test owns the days in between (e.g. 2-4, 6-8).
        function isMockTestDayNumber(day) {
            return ((day - 1) % 4) === 0;
        }
        function isDateAllowedForTestType(dateString, testType) {
            const parsed = new Date(`${dateString}T00:00:00`);
            if (Number.isNaN(parsed.getTime())) return true;
            const isMockSlot = isMockTestDayNumber(parsed.getDate());
            return testType === "practicetest" ? !isMockSlot : isMockSlot;
        }

        function safeParse(raw, fallback) {
            try {
                return JSON.parse(raw) || fallback;
            } catch {
                return fallback;
            }
        }

        function getStoredSetMap() {
            const parsedV2 = safeParse(localStorage.getItem(SETS_KEY_V2), {});
            const hasV2 = parsedV2 && typeof parsedV2 === "object" && Object.keys(parsedV2).length > 0;
            const parsed = hasV2 ? parsedV2 : safeParse(localStorage.getItem(SETS_KEY), {});
            if (Array.isArray(parsed)) {
                return parsed.reduce((accumulator, item) => {
                    const key = item?.setId || item?.module;
                    if (item && key) accumulator[key] = item;
                    return accumulator;
                }, {});
            }
            return parsed && typeof parsed === "object" ? parsed : {};
        }

        function persistStoredSetMap(map) {
            localStorage.setItem(SETS_KEY_V2, JSON.stringify(map));
        }

        function upsertLocalRecord(record) {
            const map = getStoredSetMap();
            map[record.setId] = record;
            persistStoredSetMap(map);
        }

        function updateEditorUrl(setId, setDate) {
            const params = new URLSearchParams(window.location.search);
            params.set("setId", setId);
            if (setDate) params.set("setDate", setDate);
            const query = params.toString();
            const hash = window.location.hash || "#dev-view";
            window.history.replaceState({}, "", `${window.location.pathname}?${query}${hash}`);
        }

        async function ensureCurrentSetId(setDate) {
            if (currentSetId) return currentSetId;
            
            // CRITICAL FIX: Check if a set ALREADY EXISTS for this date/testType/module
            // Only create a new one if none exists (idempotency constraint per day per testType)
            const existingSet = await resolveSetRecordByDate(setDate);
            if (existingSet && existingSet.setId) {
                console.log(`[SetIdempotency] Reusing existing set for date ${setDate}:`, existingSet.setId);
                currentSetId = existingSet.setId;
                return currentSetId;
            }
            
            // Only create new ID if no existing set found for this date/testType
            const variant = getPracticeVariant();
            if (window.toeflStorage && typeof toeflStorage.createSetId === "function") {
                currentSetId = toeflStorage.createSetId(MODULE_ID, setDate, currentTestType, variant);
            } else {
                const suffix = currentTestType === "practicetest" && variant.slug ? `${variant.slug}_` : "";
                currentSetId = `${currentTestType}_${MODULE_ID}_${suffix}${Date.now()}`;
            }
            console.log(`[SetIdempotency] Created new set for date ${setDate}:`, currentSetId);
            return currentSetId;
        }

        async function resolveSetRecordByDate(setDate, filterTestType = null) {
            const testTypeToCheck = filterTestType || currentTestType;
            const variant = getPracticeVariant();
            try {
                if (window.toeflStorage && typeof toeflStorage.getSetRecordsByTestType === "function") {
                    const records = await toeflStorage.getSetRecordsByTestType(testTypeToCheck);
                    const match = (records || [])
                        .filter((item) => item && item.module === MODULE_ID && item.setDate === setDate)
                        .filter((item) => setRecordMatchesPracticeVariant(item, variant))
                        .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime())[0];
                    if (match) return match;
                }
            } catch (error) {
                console.warn("[ToeflSync] date-based lookup failed:", error);
            }

            const local = getStoredSetMap();
            return Object.values(local)
                .filter((item) => item && item.module === MODULE_ID && item.setDate === setDate)
                .filter((item) => setRecordMatchesPracticeVariant(item, variant))
                .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime())[0] || null;
        }

        async function resolveLatestSetRecord() {
            const variant = getPracticeVariant();
            try {
                if (window.toeflStorage && typeof toeflStorage.getSetRecords === "function") {
                    const records = await toeflStorage.getSetRecords();
                    const latest = (records || [])
                        .filter((item) => item && item.module === MODULE_ID)
                        .filter((item) => setRecordMatchesPracticeVariant(item, variant))
                        .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime())[0];
                    if (latest) return latest;
                }
            } catch (error) {
                console.warn("[ToeflSync] latest-set lookup failed:", error);
            }

            const local = getStoredSetMap();
            return Object.values(local)
                .filter((item) => item && item.module === MODULE_ID)
                .sort((left, right) => new Date(right.updatedAt || 0).getTime() - new Date(left.updatedAt || 0).getTime())[0] || null;
        }

        function parseIndexedLineMap(rawText) {
            const output = {};
            String(rawText || "").split('\n').forEach((line) => {
                const match = line.match(/^\s*(\d+)[\.\)]?\s+(.+)$/);
                if (!match) return;
                const number = Number(match[1]);
                const value = String(match[2] || "").trim();
                if (!Number.isFinite(number) || !value) return;
                output[number] = value;
            });
            return output;
        }

        function parseAnswerOptionLine(rawLine) {
            const match = String(rawLine || "")
                .replace(/\u00a0/g, " ")
                .match(/^\s*\(?\s*([A-D])\s*\)?\s*[.)]?\s+(.+?)\s*$/i);
            if (!match) return null;
            return { letter: match[1].toUpperCase(), text: match[2] };
        }

        // Splits a bulk-pasted document into { questionNumber: explanationText }. The question
        // number alone routes each block to Part A (1-15) or Part B (16-40), so "Part A"/"Part B"
        // headings are optional; headings like "Question 16", "Question: 16", "**Question 16**", or "<strong>Question 16</strong>"
        // are all accepted since developers paste each part's questions separately.
        function parseAllSection2BulkExplanations(rawText) {
            const text = String(rawText || "");
            const blocks = {};
            const questionRegex = /(?:<[^>]+>|[*#>\s])*Question\s*:?\s*(\d+)(?:<\/[^>]+>|\*{1,2})?\s*/gi;
            const markers = [];
            let qMatch;
            while ((qMatch = questionRegex.exec(text)) !== null) {
                markers.push({ number: Number(qMatch[1]), start: qMatch.index, after: questionRegex.lastIndex });
            }
            markers.forEach((marker, idx) => {
                const blockEnd = idx < markers.length - 1 ? markers[idx + 1].start : text.length;
                const content = text.slice(marker.after, blockEnd).trim();
                if (content) blocks[marker.number] = content;
            });
            return blocks;
        }

        async function handleSetDateChange() {
            const dateInput = document.getElementById("set-date");
            const selectedDate = dateInput?.value;
            if (!selectedDate) return;

            if (!isDateAllowedForTestType(selectedDate, currentTestType)) {
                const ownerLabel = currentTestType === "practicetest" ? "Mock Test" : "Practice Test";
                alert(`This date is reserved for ${ownerLabel} only. Please pick a different date.`);
                dateInput.value = lastValidSetDate || selectedDate;
                return;
            }
            lastValidSetDate = selectedDate;

            const existing = await resolveSetRecordByDate(selectedDate).catch(() => null);
            if (existing?.setId) {
                currentSetId = existing.setId;
                upsertLocalRecord(existing);
                updateEditorUrl(currentSetId, selectedDate);
                updateHeaderPackageLabel(selectedDate);
                await loadSectionDraft();
                updateUserView();
                return;
            }

            if (isDeveloperMode()) {
                currentSetId = "";
                clearSectionDraftInputs();
                await saveSectionMeta();
                updateUserView();
                return;
            }

            // User mode: do not create empty package metadata for dates with no real content.
            currentSetId = "";
            clearSectionDraftInputs();
            updateHeaderPackageLabel(selectedDate);
            updateUserView();
        }

        async function saveSectionDraft() {
            syncPartBRichEditorToTextarea();
            syncBulkExplanationRichEditorsToTextareas();
            const bulkExplanationIdValue = (document.getElementById("input-bulk-explanation-id-all") || {}).value || "";
            const bulkExplanationEnValue = (document.getElementById("input-bulk-explanation-en-all") || {}).value || "";
            const bulkBahasaByNumber = parseAllSection2BulkExplanations(bulkExplanationIdValue);
            const bulkEnglishByNumber = parseAllSection2BulkExplanations(bulkExplanationEnValue);
            const draft = {
                parts: {},
                bulkExplanationId: bulkExplanationIdValue,
                bulkExplanationEn: bulkExplanationEnValue
            };
            PARTS.forEach((part) => {
                const p = part.id;
                const explanationTexts = {};
                for (let questionNumber = part.start || (p === 1 ? 1 : 16); questionNumber <= (part.end || (p === 1 ? 15 : 40)); questionNumber += 1) {
                    const englishInput = document.getElementById(`input-explanation-en-${questionNumber}`);
                    const bahasaInput = document.getElementById(`input-explanation-id-${questionNumber}`);
                    const materialTopic = getSelectedSection2Material(questionNumber);
                    const english = String(bulkEnglishByNumber[questionNumber] || "").trim() || String(englishInput?.value || "").trim();
                    const bahasa = String(bulkBahasaByNumber[questionNumber] || "").trim() || String(bahasaInput?.value || "").trim();
                    if (englishInput || bahasaInput || english || bahasa) {
                        explanationTexts[questionNumber] = {
                            explanation: english,
                            explanationId: bahasa,
                            materialTopic: materialTopic
                        };
                    }
                }
                draft.parts[p] = {
                    questions: (document.getElementById(`input-magic-questions-${p}`) || {}).value || "",
                    answerKey: (document.getElementById(`input-answer-key-${p}`) || {}).value || "",
                    explanation: (document.getElementById(`input-explanation-${p}`) || {}).value || "",
                    videoStep: (document.getElementById(`input-video-step-${p}`) || {}).value || "",
                    explanationTexts
                };
            });
            localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
            if (window.toeflStorage) {
                const setDate = (document.getElementById("set-date") || {}).value || new Date().toISOString().split("T")[0];
                const setId = await ensureCurrentSetId(setDate);
                try {
                    const savedRemotely = await toeflStorage.saveDraftBySetIdAndType(setId, MODULE_ID, draft, currentTestType);
                    if (savedRemotely === false) {
                        throw new Error("Firebase draft save failed; data was kept in localStorage.");
                    }
                } catch (error) {
                    console.warn("[ToeflSync] draft save failed:", error);
                    throw error;
                }
            }
        }

        async function loadSectionDraft() {
            const forceBlankNew = isExplicitNewPackageRequest();
            if (forceBlankNew && !currentSetId) {
                clearSectionDraftInputs();
                return;
            }

            const params = new URLSearchParams(window.location.search);
            const requestedDate = params.get("setDate");
            const requestedSetId = params.get("setId");
            
            // Use setId from URL if provided
            let setIdToUse = requestedSetId || currentSetId;
            
            // If no setId but we have a date, try to resolve it
            if (!setIdToUse && requestedDate) {
                try {
                    const byDate = await resolveSetRecordByDate(requestedDate);
                    if (byDate?.setId) {
                        setIdToUse = byDate.setId;
                        currentSetId = setIdToUse;
                    }
                } catch (error) {
                    console.warn("[Draft] Failed to resolve set by date:", error);
                }
            }

            if (requestedDate && !setIdToUse && !requestedSetId) {
                clearSectionDraftInputs();
                return;
            }
            
            let draft = {};
            
            // Step 1: Try to load draft via toeflStorage if we have a setId
            if (setIdToUse && window.toeflStorage) {
                try {
                    draft = await toeflStorage.getDraftBySetIdAndType(setIdToUse, currentTestType);
                    if (draft && typeof draft === "object" && draft.parts) {
                        console.log("[Draft] Loaded from toeflStorage with setId:", setIdToUse);
                    }
                } catch (error) {
                    console.warn("[Draft] toeflStorage load failed:", error);
                }
            }
            
            // Step 2: Fallback to toeflStorage's localStorage if available
            if ((!draft || typeof draft !== "object" || !draft.parts) && setIdToUse) {
                try {
                    // Check the localStorage key that toeflStorage uses
                    const draftsLocalKey = currentTestType === "practicetest" 
                        ? "toefl_developer_practicetest_drafts_v2"
                        : "toefl_developer_mocktest_drafts_v2";
                    const local = safeParse(localStorage.getItem(draftsLocalKey), {});
                    if (local[setIdToUse]) {
                        draft = local[setIdToUse];
                        console.log("[Draft] Loaded from localStorage with key:", draftsLocalKey);
                    }
                } catch (error) {
                    console.warn("[Draft] localStorage key fallback failed:", error);
                }
            }
            
            // Step 3: Final fallback to legacy DRAFT_KEY (for old single-draft storage)
            if (!draft || typeof draft !== "object" || !draft.parts) {
                try {
                    const localDraft = safeParse(localStorage.getItem(DRAFT_KEY), {});
                    if (localDraft && localDraft.parts) {
                        draft = localDraft;
                        console.log("[Draft] Loaded from legacy DRAFT_KEY (fallback)");
                    }
                } catch (error) {
                    console.warn("[Draft] Legacy DRAFT_KEY fallback failed:", error);
                }
            }
            
            // Final check: if still no draft, return blank
            if (!draft || typeof draft !== "object" || !draft.parts) {
                console.warn("[Draft] No draft found - starting with blank questions");
                return;
            }

            // Populate textareas with draft data
            const bulkIdInput = document.getElementById("input-bulk-explanation-id-all");
            const bulkEnInput = document.getElementById("input-bulk-explanation-en-all");
            if (bulkIdInput && typeof draft.bulkExplanationId === "string") bulkIdInput.value = draft.bulkExplanationId;
            if (bulkEnInput && typeof draft.bulkExplanationEn === "string") bulkEnInput.value = draft.bulkExplanationEn;

            PARTS.forEach((part) => {
                const p = part.id;
                const row = draft.parts[p] || {};
                const qEl = document.getElementById(`input-magic-questions-${p}`);
                const aEl = document.getElementById(`input-answer-key-${p}`);
                const eEl = document.getElementById(`input-explanation-${p}`);
                const vEl = document.getElementById(`input-video-step-${p}`);
                if (qEl && typeof row.questions === "string") qEl.value = row.questions;
                if (aEl && typeof row.answerKey === "string") aEl.value = row.answerKey;
                if (eEl && typeof row.explanation === "string") eEl.value = row.explanation;
                if (vEl && typeof row.videoStep === "string") vEl.value = row.videoStep;
                const explanationTexts = row.explanationTexts || {};
                Object.keys(explanationTexts).forEach((questionNumber) => {
                    const saved = explanationTexts[questionNumber] || {};
                    const englishInput = document.getElementById(`input-explanation-en-${questionNumber}`);
                    const bahasaInput = document.getElementById(`input-explanation-id-${questionNumber}`);
                    const topicSelect = document.getElementById(`section2-material-topic-${questionNumber}`);
                    if (englishInput && saved.explanation) englishInput.value = saved.explanation;
                    if (bahasaInput && saved.explanationId) bahasaInput.value = saved.explanationId;
                    if (topicSelect && saved.materialTopic) topicSelect.value = encodeURIComponent(JSON.stringify(saved.materialTopic));
                });
            });

            hydrateGeneratedQcExplanations();
            renderSection2MaterialOptions();

            syncPartBRichEditorFromTextarea();
            syncBulkExplanationRichEditorsFromTextareas();
        }

        async function loadSectionMeta() {
            const dateInput = document.getElementById("set-date");
            const dateContainer = dateInput?.parentElement?.parentElement;
            const difficultyInput = document.getElementById("set-difficulty");
            const params = new URLSearchParams(window.location.search);
            const forceBlankNew = isExplicitNewPackageRequest();
            currentTestType = params.get("testType") || "mocktest";
            
            if (dateContainer) {
                dateContainer.style.display = currentTestType === "practicetest" ? "none" : "flex";
            }
            const requestedDate = params.get("setDate");
            currentSetId = params.get("setId") || "";
            let stored = {};
            if (!currentSetId && requestedDate) {
                const byDate = await resolveSetRecordByDate(requestedDate);
                if (byDate?.setId) {
                    currentSetId = byDate.setId;
                    stored = byDate;
                }
            }
            if (!currentSetId && !requestedDate && !forceBlankNew) {
                const latest = await resolveLatestSetRecord();
                if (latest?.setId) {
                    currentSetId = latest.setId;
                    stored = latest;
                }
            }
            if (window.toeflStorage) {
                try {
                    if (currentSetId && typeof toeflStorage.getSetRecordById === "function") {
                        stored = await toeflStorage.getSetRecordByIdAndType(currentSetId, currentTestType) || {};
                    }
                } catch { /* fallback below */ }
            }
            if (!stored.setDate) {
                const local = getStoredSetMap();
                if (currentSetId && local[currentSetId]) {
                    stored = local[currentSetId];
                }
            }
            const today = new Date().toISOString().split("T")[0];
            const effectiveDate = requestedDate || stored.setDate || (currentTestType === "practicetest" ? "" : today);
            currentPackageDate = effectiveDate;
            if (dateInput) dateInput.value = effectiveDate;
            const requestedDifficulty = params.get("difficulty");
            if (difficultyInput) difficultyInput.value = (forceBlankNew && requestedDifficulty) || stored.difficulty || "intermediate";
            lastValidSetDate = effectiveDate;
            updateHeaderPackageLabel(effectiveDate);
            updateExplanationLink();
            syncPracticePreviewButtons();
            const requestedFocus = params.get("focus");
            if (forceBlankNew && (requestedFocus === "partA" || requestedFocus === "partB")) {
                const targetPartId = requestedFocus === "partB" ? 2 : 1;
                const targetButton = document.querySelector(`.dev-sub-btn[data-part-id="${targetPartId}"]`);
                if (targetButton) targetButton.click();
            }
        }

            const dateInput = document.getElementById("set-date");
            const difficultyInput = document.getElementById("set-difficulty");
            const rawSetDate = String(dateInput.value || "").trim();
            const normalizedSetDate = /^\d{4}-\d{2}-\d{2}$/.test(rawSetDate) ? rawSetDate : "";
            const setDate = currentTestType === "practicetest"
                ? (normalizedSetDate || "")
                : (normalizedSetDate || new Date().toISOString().split("T")[0]);

            const setId = await ensureCurrentSetId(setDate);
            const record = {
                setId,
                module: MODULE_ID,
                label: MODULE_LABEL,
                setDate,
                difficulty: difficultyInput.value || "intermediate",
                focus: getPracticeVariant().focus,
                updatedAt: new Date().toISOString()
            };
            if (window.toeflStorage && typeof toeflStorage.upsertSetRecord === "function") {
                try {

                    }

        function buildQcCoreMarkdown(questionNumber, question, correctLetter) {
            const bulkEnglish = parseAllSection2BulkExplanations(
                (document.getElementById("input-bulk-explanation-en-all") || {}).value || ""
            );
            const bulkBahasa = parseAllSection2BulkExplanations(
                (document.getElementById("input-bulk-explanation-id-all") || {}).value || ""
            );
            const suppliedExplanation = String(bulkEnglish[questionNumber] || bulkBahasa[questionNumber] || "").trim();
            if (suppliedExplanation) return suppliedExplanation;

            const stem = String(question?.questionText || `Question ${questionNumber}`).replace(/^\s*\d+[.)]?\s*/, '').trim();
            const options = question?.options || {};
            const correct = String(correctLetter || '').toUpperCase();
            const correctText = String(options[correct] || '').trim();
            const sentence = stem.replace(/_{3,}/, correctText || '_____');
            const materialTopic = getSelectedSection2Material(questionNumber);
            const partId = Number(question?.partId) || (question?.isPartB || questionNumber > 15 ? 2 : 1);
            const concept = materialTopic ? materialTopic.title : (partId === 2 ? 'Written Expression & Subject-Verb Agreement' : 'Subject & Appositive');
            const requirement = 'Gunakan konteks kalimat dan role yang ditandai pada penjelasan untuk menilai setiap bagian.';
            const elimination = Object.keys(options).sort().map((letter) => {
                const text = String(options[letter] || '').trim();
                if (letter === correct) return `* **(${letter}) ${text}** (BENAR): Ini adalah pilihan yang paling sesuai dengan kebutuhan struktur kalimat.`;
                const reason = /\b(is|are|was|were|be|been|being)\b/i.test(text)
                    ? 'Terdapat tambahan verb yang dapat menyebabkan Double Verb.'
                    : /^(that|when|because|although|if|since|while)\b/i.test(text)
                        ? 'Connector ini dapat mengubah slot menjadi anak kalimat (Dependent Clause).'
                        : 'Pilihan ini tidak memenuhi fungsi gramatikal yang dibutuhkan pada slot tersebut.';
                return `* **(${letter}) ${text}** (SALAH): ${reason}`;
            }).join('\n');

            return `Question:${questionNumber}\n**C - Concept:** ${concept}\n**O - Observe S-V-C:**\n${sentence}\n\n**R - Requirement:**\n${requirement}\n\n**E - Eliminate:**\n${elimination}`;
        }

        function populateQcCoreExplanationCards() {
            const generated = {};
            Object.keys(globalQuestions || {}).forEach((uid) => {
                const parts = uid.split('_');
                const partId = Number(parts[0]);
                const questionNumber = Number(parts[1]);
                const question = globalQuestions[uid];
                const correctLetter = globalAnswerKey[uid];
                if (!questionNumber || !question) return;
                const input = document.getElementById(`input-explanation-en-${questionNumber}`);
                if (!input || String(input.value || '').trim()) return;
                const markdown = buildQcCoreMarkdown(questionNumber, question, correctLetter);
                input.value = markdown;
                generated[String(questionNumber)] = markdown;
                markExplanationCardUnsaved(questionNumber);
            });
            try {
                const existing = JSON.parse(localStorage.getItem('toefl_section2_qc_core_explanations') || '{}') || {};
                localStorage.setItem('toefl_section2_qc_core_explanations', JSON.stringify(Object.assign(existing, generated)));
            } catch (_) {}
        }
