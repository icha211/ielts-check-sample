            } finally {
                if (button) button.disabled = false;
            }
        }

        function persistPreviewSection2Result() {
            const dateValue = ((document.getElementById("set-date") || {}).value || new Date().toISOString().split("T")[0]);
            const questionUids = Object.keys(globalQuestions || {});
            const answeredQs = questionUids.map((uid) => {
                const pId = parseInt(uid.split("_")[0], 10);
                const qNum = parseInt(uid.split("_")[1], 10);
                const q = globalQuestions[uid] || {};
                const part = PARTS.find((pt) => pt.id === pId) || {};

                const normalizedOptions = {};
                const optionMap = (q && q.options) || {};
                const optionLetters = Object.keys(optionMap);
                for (let i = 0; i < optionLetters.length; i += 1) {
                    const upper = String(optionLetters[i] || "").toUpperCase();
                    if (!upper) continue;
                    normalizedOptions[upper] = String(optionMap[optionLetters[i]] || "").trim();
                }

                const correct = String(globalAnswerKey[uid] || "").trim().toUpperCase();
                const radio = document.querySelector(`input[name="q_${uid}"]:checked`);
                const userAnswer = (radio ? String(radio.value || "") : "").trim().toUpperCase();
                const finalUserAnswer = userAnswer || correct;
                const isCorrect = !!(finalUserAnswer && correct && finalUserAnswer === correct);

                return {
                    uid,
                    number: Number.isFinite(qNum) ? qNum : 0,
                    partId: Number.isFinite(pId) ? pId : 0,
                    partName: part.name || "",
                    questionText: String(q.questionText || `Question ${qNum}`),
                    options: normalizedOptions,
                    correctAnswer: correct,
                    userAnswer: finalUserAnswer,
                    isCorrect,
                    isPartB: !!q.isPartB,
                    materialTopic: getSelectedSection2Material(qNum),
                    explanation: getSection2ExplanationSource(pId, qNum, uid),
                    setDate: dateValue
                };
            }).sort((a, b) => Number(a.number || 0) - Number(b.number || 0));

            let rawScore = 0;
            for (let i = 0; i < answeredQs.length; i += 1) {
                if (answeredQs[i].isCorrect) rawScore += 1;
            }

            const total = Math.max(1, answeredQs.length);
            const scaledScore = Math.round(31 + ((rawScore / total) * (68 - 31)));
            const result = {
                sectionTitle: "Section 2: Structure and Written Expression",
                sectionKey: "structure",
                setId: currentSetId,
                testType: currentTestType,
                runMode: getSection2PracticeRunMode(),
                focus: getPracticeVariant().focus,
                totalQuestions: answeredQs.length,
                rawScore,
                scaledScore,
                submittedAt: dateValue,
                setDate: dateValue,
                questions: answeredQs
            };

            try {
                localStorage.setItem("toefl_section2_result", JSON.stringify(result));
            } catch (_) {
                // Ignore localStorage write failures and keep editor usable.
            }
        }

        // Practice sets run either as an instant-feedback drill or as a full mock-style test.
        function getSection2PracticeRunMode() {
            const params = new URLSearchParams(window.location.search);
            const raw = String(params.get("runMode") || params.get("practiceMode") || "").toLowerCase().trim();
            if (raw === "instant" || raw === "instantfeedback" || raw === "instant feedback") return "instant";
            if (raw === "full" || raw === "fulltest" || raw === "full test" || raw === "full test mode") return "full";
            return "";
        }

        function updateHeaderPackageLabel(dateString) {
            const label = document.getElementById("header-package-label");
            if (!label) return;
            updateHeaderTitle();

            const params = new URLSearchParams(window.location.search);
            const type = String(params.get("testType") || currentTestType || "").toLowerCase().trim();
            const mode = getSection2PracticeRunMode();

            let formattedDate = "";
            if (dateString) {
                const date = new Date(dateString);
                if (!Number.isNaN(date.getTime())) {
                    const day = String(date.getDate()).padStart(2, "0");
                    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                    formattedDate = `${day} ${months[date.getMonth()]}`;
                }
            }

            if (type === "full_mock" || type === "full mock test") {
                label.textContent = `Full Mock Test Package ${formattedDate}`.trim();
            } else if (type === "mock" || type === "mocktest") {
                label.textContent = `Mock Test ${formattedDate}`.trim();
            } else if (type === "practice" || type === "practice test" || type === "practicetest") {
                if (mode === "instant") {
                    label.textContent = `Practice Test ${formattedDate} (Instant Feedback)`.replace(/\s{2,}/g, " ").trim();
                } else if (mode === "full") {
                    label.textContent = `Practice Test ${formattedDate} (Full Test Mode)`.replace(/\s{2,}/g, " ").trim();
                } else {
                    label.textContent = `Practice Test ${formattedDate}`.trim();
                }
            } else {
                label.textContent = `Package ${formattedDate}`.trim();
            }
        }

        function updateHeaderTitle() {
            const titleElement = document.getElementById("title-test");
            if (!titleElement) return;

            const params = new URLSearchParams(window.location.search);
            const type = String(params.get("testType") || currentTestType || "").toLowerCase().trim();
            const focus = String(params.get("focus") || "").toLowerCase();
            const sectionKey = String(params.get("sectionKey") || "").toLowerCase();
            const isPractice = ["practice", "practice test", "practicetest"].includes(type);

            titleElement.textContent = isPractice
                ? (sectionKey === "writing" || focus === "partb" ? "Writing" : "Structure")
                : "Structure & Writing";
        }

        // ===== Practice test: instant feedback engine =====
        // Full Test Mode reuses the mock-test layout untouched; only instant mode
        // swaps the stacked question list for a one-question-at-a-time card.
        let instantOrder = [];
        let instantIndex = 0;
        let instantAnswers = {};
        let instantChecked = {};
        let instantRevealed = false;
        let instantTab = "explaination";

        function getPracticeRunMode() {
            const params = new URLSearchParams(window.location.search);
            const testType = String(params.get("testType") || currentTestType || "").toLowerCase();
            if (!testType.includes("practice")) return "full";

            const raw = String(params.get("runMode") || params.get("practiceMode") || "").toLowerCase().trim();
            if (raw === "instant" || raw === "instantfeedback" || raw === "instant feedback") return "instant";
            return "full";
        }

        function isInstantFeedbackMode() {
            return isPracticeTestType() && getPracticeRunMode() === "instant";
        }

        function isPracticeTestType() {
            return String(new URLSearchParams(window.location.search).get("testType") || currentTestType || "").toLowerCase().includes("practice");
        }

        function isPracticeFullTestMode() {
            return isPracticeTestType() && getPracticeRunMode() === "full";
        }

        function getPartIdFromUid(uid) {
            return Number(String(uid || "").split("_")[0] || 0) || 0;
        }

        function getQuestionNumberFromUid(uid) {
            return Number(String(uid || "").split("_")[1] || 0) || 0;
        }

        function buildInstantOrder() {
            instantOrder = Object.keys(globalQuestions || {})
                .filter((uid) => !forcedPracticeFocusPart || getPartIdFromUid(uid) === forcedPracticeFocusPart)
                .sort((left, right) => getQuestionNumberFromUid(left) - getQuestionNumberFromUid(right));
            if (instantIndex >= instantOrder.length) instantIndex = 0;
        }

        function applyPracticeRunMode() {
            const instant = isInstantFeedbackMode();
            const fullPractice = isPracticeFullTestMode();
            const useQuestionDots = instant || fullPractice;
            document.body.classList.toggle("instant-feedback-mode", instant);

            const progressBlock = document.querySelector(".progressbar-final .progress-bar-question");
            const dots = document.getElementById("instant-progress-dots");
            const subNav = document.getElementById("user-sub-nav-container");
            const container = document.getElementById("user-passages-container");
            const host = document.getElementById("instant-question-host");

            setNavigatorPanelHidden(useQuestionDots);
            if (progressBlock) progressBlock.style.display = useQuestionDots ? "none" : "";
            if (dots) {
                dots.style.display = useQuestionDots ? "flex" : "none";
                dots.classList.toggle("is-full-practice", fullPractice);
            }
            if (instant && subNav) subNav.style.display = "none";
            if (host) host.style.display = instant ? "" : "none";

            // Directions stay visible in instant mode; only the stacked question list is hidden.
            PARTS.forEach((part) => {
                const list = document.getElementById(`display-questions-${part.id}`);
                if (list) list.style.display = instant ? "none" : "";
            });

            if (!instant) {
                if (host) host.innerHTML = "";
                renderInstantProgressDots();
                return;
            }

            // The card must sit under the directions block, not above it.
            if (container && host) container.appendChild(host);

            buildInstantOrder();
            instantRevealed = Boolean(instantChecked[instantOrder[instantIndex]]);
            renderInstantQuestion();
        }

        // Only the part being drilled keeps its directions on screen.
        function syncInstantPartVisibility() {
            const activePartId = forcedPracticeFocusPart || getPartIdFromUid(instantOrder[instantIndex]) || PARTS[0].id;
            PARTS.forEach((part) => {
                const panel = document.getElementById(`user-part-${part.id}`);
                if (!panel) return;
                const isActive = part.id === activePartId;
                panel.style.display = isActive ? "block" : "none";
                panel.classList.toggle("active", isActive);
            });
        }

        function getInstantCircleState(uid, index) {
            const currentClass = index === instantIndex ? "is-current" : "";

            if (instantChecked[uid]) {
                const correct = String(globalAnswerKey[uid] || "").trim().toUpperCase();
                const isCorrect = String(instantAnswers[uid] || "").toUpperCase() === correct;
                return `${isCorrect ? "is-correct" : "is-incorrect"} ${currentClass}`.trim();
            }

            if (instantAnswers[uid]) return `is-answered ${currentClass}`.trim();
            return currentClass;
        }

        // Practice modes share the header dots, but full tests follow the exam radios.
        function renderInstantProgressDots() {
            const host = document.getElementById("instant-progress-dots");
            if (!host) return;
            const instant = isInstantFeedbackMode();
            const fullPractice = isPracticeFullTestMode();
            if (!instant && !fullPractice) {
                host.innerHTML = "";
                return;
            }

            const partId = forcedPracticeFocusPart || (instant
                ? getPartIdFromUid(instantOrder[instantIndex])
                : getPartIdFromUid(currentQuestionUid) || Number(document.querySelector("#user-view .sub-content.active")?.id.replace("user-part-", ""))) || 1;
            const visibleParts = fullPractice && !forcedPracticeFocusPart ? PARTS : PARTS.filter((part) => part.id === partId);
            host.innerHTML = visibleParts.map((partObj) => {
                const partTitle = partObj.name.split(":")[0].toUpperCase();
                const order = instant ? instantOrder : getPartQuestionNumbers(partObj.id).map((entry) => entry.uid);
                if (!order.length) return "";
                const circles = order.map((uid, index) => {
                    const questionNumber = getQuestionNumberFromUid(uid) || index + 1;
                    const state = instant ? getInstantCircleState(uid, index)
                        : `${document.querySelector(`input[name="q_${uid}"]:checked`) ? "is-answered" : ""} ${uid === currentQuestionUid ? "is-current" : ""}`.trim();
                    const action = instant ? `goToInstantQuestion(${index})` : `scrollToQuestion('${uid}')`;
                    return `<button type="button" class="progress-q-circle ${state}" onclick="${action}" aria-label="Question ${questionNumber}">${questionNumber}</button>`;
                }).join("");
                return `
                <div class="progress-part-chip active">
                    <span class="progress-part-title">${escapeHtml(partTitle)}</span>
                    <div class="reading-part-circles">${circles}</div>
                </div>`;
            }).join("");
        }

        function goToInstantQuestion(index) {
            if (index < 0 || index >= instantOrder.length) return;
            instantIndex = index;
            instantRevealed = Boolean(instantChecked[instantOrder[index]]);
            instantTab = "explaination";
            renderInstantQuestion();
        }

        function setInstantTab(tabName) {
            instantTab = ["explaination", "step", "materi"].includes(tabName) ? tabName : "explaination";
            renderInstantQuestion();
        }

        function selectInstantChoice(letter, uid) {
            if (instantRevealed) return;
            const targetUid = uid || instantOrder[instantIndex];
            if (!targetUid) return;
            instantAnswers[targetUid] = String(letter || "").toLowerCase();
            renderInstantQuestion();
        }

        function checkInstantAnswer() {
            const uid = instantOrder[instantIndex];
            if (!uid) return;

            if (!instantAnswers[uid]) {
                // If the user clicks Cancel, exit early.
                // If the user clicks OK, execution continues past this block.
                if (!confirm("Are you sure you want to check the answer without selecting one?")) {
                    return;
                }
            }

            instantChecked[uid] = true;
            instantRevealed = true;
            instantTab = "explaination"; // Note: fix typo to "explanation" if required in your project
            renderInstantQuestion();
        }

        function skipInstantQuestion() {
            instantRevealed = false;
            nextInstantQuestion(true);
        }

        function nextInstantQuestion(skipping = false) {
            if (!instantOrder.length) return;
            if (instantIndex >= instantOrder.length - 1) {
                if (!skipping) finishInstantPractice();
                return;
            }
            instantIndex += 1;
            instantTab = "explaination";
            instantRevealed = Boolean(instantChecked[instantOrder[instantIndex]]) && !skipping;
            renderInstantQuestion();
            const container = document.getElementById("user-passages-container");
            if (container) container.scrollTo({ top: 0, behavior: "smooth" });
        }

        function finishInstantPractice() {
            // Mirror the picked answers onto the hidden mock-test radios so the shared
            // result builder scores the attempt exactly like a full test.
            instantOrder.forEach((uid) => {
                const value = String(instantAnswers[uid] || "").toLowerCase();
                document.querySelectorAll(`input[name="q_${uid}"]`).forEach((radio) => {
                    radio.checked = Boolean(value) && String(radio.value || "").toLowerCase() === value;
                });
            });

            clearInterval(timerInterval);
            persistPreviewSection2Result();

            const params = new URLSearchParams(window.location.search);
            const dateValue = (document.getElementById("set-date") || {}).value || currentPackageDate;
            if (currentSetId) params.set("setId", currentSetId);
            if (dateValue) params.set("setDate", dateValue);
            const query = params.toString();
            window.location.href = `section 2-answered.html${query ? `?${query}` : ""}`;
        }

        function renderInstantQuestion() {
            const host = document.getElementById("instant-question-host");
            if (!host) return;

            syncInstantPartVisibility();

            const uid = instantOrder[instantIndex];
            if (!uid) {
                host.innerHTML = `<div class="instant-card"><div class="instant-card__body"><p class="instant-empty-state">No questions available for this practice set.</p></div></div>`;
                renderInstantProgressDots();
                return;
            }

            const question = globalQuestions[uid] || { questionText: "", options: {} };
            const questionNumber = getQuestionNumberFromUid(uid);
            const selected = String(instantAnswers[uid] || "").toUpperCase();
            const correct = String(globalAnswerKey[uid] || "").trim().toUpperCase();
            const isCorrect = instantRevealed && selected === correct;
            const badgeState = instantRevealed
                ? (isCorrect ? " is-correct" : " is-incorrect")
                : (selected ? " is-selected" : "");

            const optionsHtml = ["A", "B", "C", "D"].map((letter) => {
                const classes = [];
                if (!instantRevealed && selected === letter) classes.push("selected");
                if (instantRevealed) classes.push("is-locked");
                if (instantRevealed && letter === correct) classes.push("is-correct");
                if (instantRevealed && letter === selected && letter !== correct) classes.push("is-incorrect");
                const tag = instantRevealed && letter === selected
                    ? `<span class="instant-option-tag${letter === correct ? "" : " is-wrong"}">Your Answer <i class="ph ph-${letter === correct ? "check" : "x"}" aria-hidden="true"></i></span>`
                    : "";
                const onClick = instantRevealed ? "" : ` onclick="selectInstantChoice('${letter}', '${uid}')"`;
                return `
                    <label class="${classes.join(" ")}"${onClick}>
                        <span class="instant-option-letter">${letter}</span>
                        <span class="instant-option-text">${escapeHtml(String((question.options || {})[letter] || ""))}</span>
                        ${tag}
                    </label>`;
            }).join("");

            const stem = String(question.questionText || `Question ${questionNumber}`).replace(/^\s*\d+[.)]?\s*/, "");
            const partBSentence = question.isPartB
                ? document.querySelector(`#q-container-${uid} .inline-question-text`)?.cloneNode(true)
                : null;
            if (partBSentence) {
                partBSentence.classList.add("instant-partb-sentence");
                partBSentence.querySelectorAll('.inline-error-wrapper input[type="radio"]').forEach((input) => {
                    const letter = input.value.toUpperCase();
                    const wrapper = input.closest(".inline-error-wrapper");
                    if (instantRevealed && letter === correct) wrapper.classList.add("is-correct");
                    else if (instantRevealed && letter === selected) wrapper.classList.add("is-incorrect");
                    input.name = `instant_q_${uid}`;
                    input.id = `instant_q_${uid}_${letter.toLowerCase()}`;
                    input.toggleAttribute("checked", selected === letter);
                    input.disabled = instantRevealed;
                    const label = input.nextElementSibling;
                    label.setAttribute("for", input.id);
                    if (!instantRevealed) label.setAttribute("onclick", `event.preventDefault(); selectInstantChoice('${letter}', '${uid}')`);
                });
            }
            const stemHtml = question.isPartB
                ? (partBSentence?.outerHTML || `<p class="instant-partb-sentence">${escapeHtml(stem)}</p>`)
                : `<p class="instant-question-title">${escapeHtml(stem).replace(/_{3,}/, '<span class="question-blank">_____</span>')}</p>`;

            const isLast = instantIndex >= instantOrder.length - 1;
            const actionsHtml = instantRevealed
                ? `<button class="btn-action primary" type="button" onclick="nextInstantQuestion()">${isLast ? "Finish Practice" : "Next Question"} <i class="ph ph-caret-right" aria-hidden="true"></i></button>`
                : `<button class="btn-action secondary" type="button" onclick="skipInstantQuestion()">Skip Question</button>
                   <button class="btn-action primary" type="button" onclick="checkInstantAnswer()">Check Answer <i class="ph ph-caret-right" aria-hidden="true"></i></button>`;

            const questionBlock = `
                <article class="instant-question" id="q-instant-${uid}">
                    <div class="instant-question-head">
                        <div class="question-number-badge${badgeState}">${questionNumber}</div>
                        ${stemHtml}
                        ${instantRevealed ? `<span class="instant-verdict ${isCorrect ? "is-correct" : "is-incorrect"}">${isCorrect ? "CORRECT" : "INCORRECT"}</span>` : ""}
                    </div>
                    ${question.isPartB ? "" : `<div class="instant-options">${optionsHtml}</div>`}
                </article>`;

            host.innerHTML = `
                <section class="instant-card">
                    ${instantRevealed ? buildInstantTabsHtml() : ""}
                    <div class="instant-card__body">
                        ${instantTab === "explaination" ? questionBlock : ""}
                        ${instantRevealed ? buildInstantExplanationHtml(uid) : ""}
                        <div class="instant-actions">${actionsHtml}</div>
                    </div>
                </section>`;

            renderInstantProgressDots();
        }

        function buildInstantTabsHtml() {
            const tabs = [
                { key: "explaination", label: "Explanation", icon: "../asst/icon/explaination tab.png" },
                { key: "step", label: "Video Step-by-Step", icon: "../asst/icon/stepbystep tab.png" },
                { key: "materi", label: "Materi", icon: "../asst/icon/materials tab.png" }
            ];
            return `<div class="instant-card__tabs" role="tablist">${tabs.map((tab) => `
                <button type="button" class="instant-card__tab${instantTab === tab.key ? " is-active" : ""}" role="tab" aria-selected="${instantTab === tab.key}" onclick="setInstantTab('${tab.key}')">
                    <img src="${tab.icon}" alt="">
                    <span>${tab.label}</span>
                </button>`).join("")}</div>`;
        }

        // Explanation content comes from the same bulk-explanation input the mock test uses.
        function getSection2ExplanationSource(partId, questionNumber, uid) {
            const bulkEnglish = parseAllSection2BulkExplanations((document.getElementById("input-bulk-explanation-en-all") || {}).value || "");
            if (String(bulkEnglish[questionNumber] || "").trim()) return bulkEnglish[questionNumber];

            const bulkBahasa = parseAllSection2BulkExplanations((document.getElementById("input-bulk-explanation-id-all") || {}).value || "");
            if (String(bulkBahasa[questionNumber] || "").trim()) return bulkBahasa[questionNumber];

            const direct = String((document.getElementById(`input-explanation-en-${questionNumber}`) || {}).value || "").trim();
            if (direct) return direct;

            const draft = safeParse(localStorage.getItem(DRAFT_KEY), {}) || {};
            const saved = draft?.parts?.[partId]?.explanationTexts?.[questionNumber] || {};
            if (String(saved.explanation || "").trim()) return saved.explanation;
            if (String(saved.explanationId || "").trim()) return saved.explanationId;

            return String(globalExplanations[uid] || "").trim();
        }

        function markdownInlineToHtml(value) {
            return escapeHtml(String(value || "").trim())
                .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
                .replace(/&lt;(\/?)(strong|b|u|em|i)&gt;/gi, (_, closing, tag) => `<${closing}${tag === "b" ? "strong" : tag === "i" ? "em" : tag}>`)
                .replace(/\n/g, "<br>");
        }

        function renderQcObserveText(value, options) {
            let html = escapeHtml(String(value || ""));
            const optionPatterns = (options || [])
                .map((option) => ({
                    letter: option.letter,
                    text: escapeHtml(option.text),
                    pattern: escapeHtml(option.text).replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+")
                }))
                .filter((option) => option.pattern)
                .sort((left, right) => right.pattern.length - left.pattern.length);
            if (optionPatterns.length) {
                const optionPattern = new RegExp(
                    `(^|[^\\p{L}\\p{N}_])(${optionPatterns.map((option) => `(?:${option.pattern})`).join("|")})(?=$|[^\\p{L}\\p{N}_])`,
                    "giu"
                );
                html = html.replace(optionPattern, (fullMatch, before, matchedText) => {
                    const matchedOption = optionPatterns.find((option) => {
                        return option.text.toLocaleLowerCase() === matchedText.toLocaleLowerCase();
                    });
                    const letter = matchedOption ? matchedOption.letter : "";
                    const badge = letter
                        ? `<mark class="instant-option-letter-observe" aria-label="Option ${letter}">${escapeHtml(letter)}</mark>`
                        : "";
                    return `${before}<mark>${matchedText}</mark>${badge}`;
                });
            }
            return html
                .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
                .replace(/\n/g, "<br>");
        }

        function renderQcObserveHtml(value, questionUid) {
            const source = String(value || "");
            const roleToken = /\[([^\]\n]+?)\s+\(([^)\n]+)\)\]/g;
            const question = typeof questionUid === "string" ? globalQuestions[questionUid] || {} : {};
            const options = Object.entries(question.options || {})
                .map(([letter, text]) => ({ letter: letter.toUpperCase(), text: String(text || "").trim() }))
                .filter((option) => /^[A-D]$/.test(option.letter) && option.text);

            let html = "";
            let cursor = 0;
            let match;

            while ((match = roleToken.exec(source)) !== null) {
                html += renderQcObserveText(source.slice(cursor, match.index), options);

                const wordText = match[1].trim();
                const roleLabel = match[2].trim();
                html += '<span class="qc-core__observe-token">'
                    + `<span class="qc-core__observe-word is-underlined">${renderQcObserveText(wordText, options)}</span>`
                    + `<span class="qc-core__observe-role">${escapeHtml(roleLabel)}</span>`
                    + '</span>';

                cursor = roleToken.lastIndex;
            }

            html += renderQcObserveText(source.slice(cursor), options);

            return '<div class="qc-core__observe">' + html + '</div>';
        }

        // Splits a QC C.O.R.E block into its Concept / Observe / Requirement / Eliminate parts.
        function parseQcCoreExplanation(rawText) {
            const text = String(rawText || "").replace(/\r/g, "");
            const markers = [
                { key: "concept", re: /(?:<\/?(?:strong|b|span)\b[^>]*>\s*|\*{1,2}\s*)*C\s*[-–—]\s*Concept\s*:?\s*(?:<\/(?:strong|b|span)>|\*{1,2})*/i },
                { key: "observe", re: /(?:<\/?(?:strong|b|span)\b[^>]*>\s*|\*{1,2}\s*)*O\s*[-–—]\s*Observe[^:\n]*:?\s*(?:<\/(?:strong|b|span)>|\*{1,2})*/i },
                { key: "requirement", re: /(?:<\/?(?:strong|b|span)\b[^>]*>\s*|\*{1,2}\s*)*R\s*[-–—]\s*Requirement\s*:?\s*(?:<\/(?:strong|b|span)>|\*{1,2})*/i },
                { key: "eliminate", re: /(?:<\/?(?:strong|b|span)\b[^>]*>\s*|\*{1,2}\s*)*E\s*[-–—]\s*Eliminate\s*:?\s*(?:<\/(?:strong|b|span)>|\*{1,2})*/i }
            ];

            const found = [];
            markers.forEach((marker) => {
                const match = text.match(marker.re);
                if (match) found.push({ key: marker.key, start: match.index, after: match.index + match[0].length });
            });
            found.sort((left, right) => left.start - right.start);

            const sections = {};
            found.forEach((entry, index) => {
                const end = index + 1 < found.length ? found[index + 1].start : text.length;
                sections[entry.key] = text.slice(entry.after, end).trim();
            });

            const rows = [];
            const observeBody = String(sections.observe || "").split("\n").filter((line) => {
                const rowText = String(line || "").trim().replace(/^(?:[-*•]\s+)+/, "");
                const separator = rowText.indexOf(":");
                if (separator <= 0) return true;
                const label = rowText.slice(0, separator).replace(/<\/?[^>]+>/g, "").replace(/\*+/g, "").trim();
                if (!label) return true;
                const value = rowText.slice(separator + 1).trim();
                rows.push({ label, value, isBullet: /^[-–—]$/.test(value) });
                return false;
            }).join("\n").trim();

            const options = [];
            String(sections.eliminate || "").split("\n").forEach((line) => {
                const raw = line.trim();
                const body = raw.replace(/^(?:[*\-]\s*)?/, "");
                const letterMatch = body.match(/^\s*\*{0,2}\s*\(?([A-D])\)?(?:\s|[.)])/i);
                if (!letterMatch) return;
                const splitIndex = body.indexOf(":");
                const head = splitIndex >= 0 ? body.slice(0, splitIndex) : body;
                const reason = splitIndex >= 0 ? body.slice(splitIndex + 1).trim() : "";
                if (!reason) return;
                const verdict = /\((BENAR|TRUE|CORRECT)\)/i.test(head) ? "correct" : (/\((SALAH|FALSE|INCORRECT|WRONG)\)/i.test(head) ? "incorrect" : "");
                options.push({
                    letter: letterMatch[1].toUpperCase(),
                    label: head.replace(/\*/g, "").replace(/\((BENAR|SALAH|CORRECT|INCORRECT|WRONG)\)/i, "").trim(),
                    reason,
                    verdict
                });
            });

            return {
                concept: String(sections.concept || "").replace(/\*/g, "").trim(),
                observe: observeBody,
                rows,
                requirement: String(sections.requirement || "").trim(),
                options,
                isEmpty: !found.length
            };
        }

        function buildInstantCompleteSentenceHtml(uid) {
            const question = globalQuestions[uid] || {};
            const correct = String(globalAnswerKey[uid] || "").trim().toUpperCase();
            const correctText = String((question.options || {})[correct] || "").trim();
            const explanationSource = getSection2ExplanationSource(getPartIdFromUid(uid), getQuestionNumberFromUid(uid), uid).replace(/\r/g, "");
            const sentenceBlock = explanationSource.match(/(?:^|\n)\s*(?:#{1,6}\s*)?(?:\*{0,2}\s*)Maka\s+(?:perbaikan\s+)?kalimat\s+lengkapnya\s*:?(?:\*{0,2})\s*\n+\s*["\u201c]([\s\S]*?)["\u201d]\s*\n+([\s\S]*?)(?=\n\s*(?:\*{0,2}\s*(?:C\s*[-\u2013\u2014]\s*Concept|O\s*[-\u2013\u2014]\s*Observe|R\s*[-\u2013\u2014]\s*Requirement|E\s*[-\u2013\u2014]\s*Eliminate)|#{1,6}\s*(?:Question|Part)\b)|$)/i);
            let sentence = sentenceBlock ? String(sentenceBlock[1] || "").trim() : "";
            let rationale = sentenceBlock ? String(sentenceBlock[2] || "").trim() : "";

            if (!sentence) sentence = String(question.questionText || "").replace(/^\s*\d+[.)]?\s*/, "").trim();
            if (!sentence) return "";
            if (correctText && /_{2,}|\.{3,}/.test(sentence)) {
                sentence = sentence.replace(/_{2,}|\.{3,}/, correctText);
            }
            const cleanSentence = sentence
                .replace(/&lt;[^&>]+&gt;/gi, "")
                .replace(/<\/?(?:strong|b|u|i|em|span|mark|p|div)\b[^>]*>/gi, "")
                .replace(/^\s*["\u201c]|["\u201d]\s*$/g, "")
                .trim();
            let sentenceHtml = escapeHtml(cleanSentence)
                .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
            const correctPattern = correctText.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const answerAlreadyEmphasized = correctPattern && new RegExp(`\\*\\*\\s*${correctPattern}\\s*\\*\\*`, "i").test(cleanSentence);
            if (correctPattern && !answerAlreadyEmphasized) {
                sentenceHtml = sentenceHtml.replace(new RegExp(`(^|\\s|["'])(${correctPattern})(?=[\\s.,;:!?']|$)`, "i"), "$1<strong>$2</strong>");
            }
            if (!rationale) rationale = "Karena pilihan ini melengkapi struktur kalimat dengan tepat.";

            return '<section class="section2-complete-sentence-box">'
                + '<div style="display: flex; align-items: center; gap: 8px;">'
                +   '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#28786f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
                +   '<h3 style="margin: 0;">Maka kalimat lengkapnya</h3>'
                + '</div>'
                + '<p class="section2-complete-sentence">&ldquo;' + sentenceHtml + '&rdquo;</p>'
                + '<p class="section2-complete-rationale">' + markdownInlineToHtml(rationale) + '</p>'
                + '</section>';
        }

        function buildInstantExplanationHtml(uid) {
            const partId = getPartIdFromUid(uid);
            const questionNumber = getQuestionNumberFromUid(uid);
            const correct = String(globalAnswerKey[uid] || "").trim().toUpperCase();

            if (instantTab === "step") {
                const videoUrl = String((parseIndexedLineMap((document.getElementById(`input-video-step-${partId}`) || {}).value || ""))[questionNumber] || "").trim();
                return `<section class="instant-panel">${videoUrl
                    ? `<iframe class="instant-video-frame" src="${escapeHtml(toEmbeddableVideoUrl(videoUrl))}" allowfullscreen title="Step-by-step video"></iframe>`
                    : `<p class="instant-empty">No step-by-step video saved for this question yet.</p>`}</section>`;
            }

            if (instantTab === "materi") {
                const materialTopic = resolveInstantMaterialTopic(uid);
                if (!materialTopic || !materialTopic.title) {
                    return '<section class="instant-panel"><div class="section2-materi-empty">No material topic has been linked to this question yet.</div></section>';
                }
                const record = section2MaterialRecords[materialTopic.module + '-' + materialTopic.code];
                const trail = '<div class="lesson-trail"><span class="topic-chip primary">' + escapeHtml(materialTopic.code) + '</span><span class="topic-chip">' + escapeHtml(materialTopic.title) + '</span></div>';
                const lesson = record && record.html
                    ? '<div class="lesson-heading"><h1>' + escapeHtml(record.title || materialTopic.title) + '</h1></div><article class="lesson-document">' + sanitizeMaterialHtml(record.html) + '</article>'
                    : '<div class="section2-materi-empty">Upload a DOCX lesson for this topic from the Developer Materials Library, then reopen this page.</div>';
                return '<section class="instant-panel"><div class="section2-materi-lesson">' + trail + lesson + '</div></section>';
            }

            const source = getSection2ExplanationSource(partId, questionNumber, uid);
            const question = globalQuestions[uid] || {};
            const explanationSource = source || buildQcCoreMarkdown(questionNumber, question, correct);

            const parsed = parseQcCoreExplanation(explanationSource);
            if (parsed.isEmpty) {
                return `<section class="instant-panel"><div class="qc-core">
                    <div class="qc-core__head"><i class="ph ph-lightbulb" aria-hidden="true"></i> EXPLANATION</div>
                    <div class="qc-core__body"><div class="qc-core__text">${markdownInlineToHtml(explanationSource)}</div>${buildInstantCompleteSentenceHtml(uid)}</div>
                </div></section>`;
            }
        
            const rowsHtml = parsed.rows.map((row) => `
                <div class="qc-core__row">
                    <span class="section2-qc-bullet" aria-hidden="true"></span>
                    <strong>${escapeHtml(row.label)}</strong>
                    <span class="qc-colon">:</span>
                    <span class="qc-core__row-value">${markdownInlineToHtml(row.value || "")}</span>
                </div>
            `).join("");

            const optionsHtml = parsed.options.map((option) => {
                // The answer key determines the correct choice, not the explanation verdict.
                const isCorrect = correct
                    ? String(option.letter || "").trim().toUpperCase() === correct
                    : option.verdict === true || option.verdict === "correct";

                const state = isCorrect ? "correct" : "incorrect";

                return `
                <li class="qc-core__item is-${state}">
                    <span class="qc-core__label-wrap">
                        <span class="instant-option-letter">${option.letter}</span>
                        <strong>${escapeHtml(option.label.replace(/^\([A-D]\)\s*/i, ""))}</strong>
                    </span>
                    <span class="qc-core__item-mark">${
                        state === "correct" 
                            ? `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>` 
                            : '<span style="color: #dc2626; font-weight: bold; line-height: 1;">✕</span>'
                    }</span>
                    <span class="qc-colon">:</span>
                    <span>${markdownInlineToHtml(option.reason)}</span>
                </li>`;
            }).join("");

            return `
                <section class="instant-panel">
                    <div class="qc-core">
                        <div class="qc-core__head"><i class="ph ph-lightbulb" aria-hidden="true"></i> QC C.O.R.E ANALYSIS</div>
                        <div class="qc-core__body">
                            ${parsed.concept ? `<div class="qc-core__block qc-core__concept">
                                <div class="qc-core__label">C – Concept :</div>
                                <div class="qc-core__text"><mark>${escapeHtml(parsed.concept)}</mark></div>
                            </div>` : ""}
                            ${(parsed.observe || rowsHtml) ? `<div class="qc-core__block">
                                <div class="qc-core__label">O – Observe S-V-C :</div>
                                ${parsed.observe ? renderQcObserveHtml(parsed.observe, uid) : ""}
                                ${rowsHtml ? `<div class="qc-core__rows">${rowsHtml}</div>` : ""}
                            </div>` : ""}
                            ${parsed.requirement ? `<div class="qc-core__block">
                                <div class="qc-core__label">R – Requirement :</div>
                                <div class="qc-core__text">${markdownInlineToHtml(parsed.requirement)}</div>
                            </div>` : ""}
                            ${optionsHtml ? `<div class="qc-core__block">
                                <div class="qc-core__label">E – Eliminate :</div>
                                <ul class="qc-core__list">${optionsHtml}</ul>
                            </div>` : ""}
                            ${buildInstantCompleteSentenceHtml(uid)}
                        </div>
                    </div>
                </section>`;
        }

        function toEmbeddableVideoUrl(url) {
            const raw = String(url || "").trim();
            const youtube = raw.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
            if (youtube) return `https://www.youtube.com/embed/${youtube[1]}`;

        function updateHeaderProgress() {
            const uids = Object.keys(globalQuestions || {});

            const partATotal = uids.filter((uid) => uid.startsWith("1_")).length;
            const partBTotal = uids.filter((uid) => uid.startsWith("2_")).length;

            let answered = 0;
            let partAAnswered = 0;
            let partBAnswered = 0;
            uids.forEach((uid) => {
                const checked = document.querySelector(`input[name="q_${uid}"]:checked`);
                if (!checked) return;
                answered += 1;
                if (uid.startsWith("1_")) partAAnswered += 1;
                if (uid.startsWith("2_")) partBAnswered += 1;
            });

            const label = document.getElementById("answered-count-label");
            if (label) {
                const activePart = document.querySelector("#user-view .sub-content.active")?.id;
                if (activePart === "user-part-1") {
                    label.textContent = `Answered ${partAAnswered}/${partATotal}`;
                } else if (activePart === "user-part-2") {
                    label.textContent = `Answered ${partATotal + partBAnswered}/${total}`;
                } else {
                    label.textContent = `Answered ${answered}/${total}`;
                }
            }

            const setBar = (id, done, all) => {
                const el = document.getElementById(id);
                if (!el) return;
                if (!all) {
                    el.style.width = "8px";
                    return;
                }
                const width = Math.max(8, Math.round((done / all) * 146));
                el.style.width = `${width}px`;
            };

            setBar("progress-part-a", partAAnswered, partATotal);
            setBar("progress-part-b", partBAnswered, partBTotal);
        }

        function positionListeningHeaderTimer() {
            const header = document.querySelector(".figma-header--listening");
            const timer = header ? header.querySelector(".timer") : null;
            const packageFrame = header ? header.querySelector(".test-package-frame") : null;
            const progressBlock = header ? header.querySelector(".progressbar-final") : null;
            if (!header || !timer || !packageFrame || !progressBlock) return;

            const packageRight = packageFrame.offsetLeft + packageFrame.offsetWidth;
            const progressLeft = progressBlock.offsetLeft;
            const timerWidth = timer.offsetWidth || 0;
            const sidePadding = 16;

            const targetCenterX = (packageRight + progressLeft) / 2;
            const minCenterX = packageRight + (timerWidth / 2) + sidePadding;
            const maxCenterX = progressLeft - (timerWidth / 2) - sidePadding;
            const defaultCenterX = header.offsetWidth / 2;
            const clampedCenterX = maxCenterX < minCenterX
                ? defaultCenterX
                : Math.min(Math.max(targetCenterX, minCenterX), maxCenterX);

            timer.style.left = `${clampedCenterX}px`;
        }

        function formatText(areaId, openTag, closeTag) {
            const el = document.getElementById(areaId);
            if (!el) return;

            if (el.isContentEditable) {
                el.focus();
                if (openTag.toLowerCase() === '<strong>') {
                    document.execCommand('bold', false, null);
                } else if (openTag.toLowerCase() === '<u>') {
                    document.execCommand('underline', false, null);
                }
                syncPartBRichEditorToTextarea();
                return;
            }

            const start = el.selectionStart;
            const end = el.selectionEnd;
            const text = el.value;
            el.value = text.substring(0, start) + openTag + text.substring(start, end) + closeTag + text.substring(end);
            el.focus();
        }

        function insertTextAtCursor(textArea, insertText) {
            if (!textArea) return;
            const start = textArea.selectionStart || 0;
            const end = textArea.selectionEnd || start;
            const original = textArea.value || "";
            textArea.value = original.slice(0, start) + insertText + original.slice(end);
            const nextPos = start + insertText.length;
            textArea.selectionStart = nextPos;
            textArea.selectionEnd = nextPos;
            textArea.focus();
        }

        function normalizeClipboardQuestionText(text) {
            return (text || "")
                .replace(/\r\n?/g, "\n")
                .replace(/\u00a0/g, " ")
                .replace(/[ \t]+\n/g, "\n")
                .replace(/\n{3,}/g, "\n\n")
                .trim();
        }

        function escapeHtml(value) {
            return String(value || "").replace(/[&<>\"]/g, (ch) => {
                if (ch === '&') return '&amp;';
                if (ch === '<') return '&lt;';
                if (ch === '>') return '&gt;';
                return '&quot;';
            });
        }

        function normalizePartBRichHtml(html) {
            return String(html || "")
                .replace(/<\/?span[^>]*>/gi, "")
                .replace(/<\/?font[^>]*>/gi, "")
                .replace(/<b\b[^>]*>/gi, "<strong>")
                .replace(/<\/b>/gi, "</strong>")
                .replace(/<div><br><\/div>/gi, "<div></div>");
        }

        function markupToRichEditorHtml(markupText) {
            const safe = escapeHtml(String(markupText || ""));
            const withFormatting = safe
                .replace(/&lt;strong&gt;/gi, "<strong>")
                .replace(/&lt;\/strong&gt;/gi, "</strong>")
                .replace(/&lt;b&gt;/gi, "<strong>")
                .replace(/&lt;\/b&gt;/gi, "</strong>")
                .replace(/&lt;u&gt;/gi, "<u>")
                .replace(/&lt;\/u&gt;/gi, "</u>");

            const lines = withFormatting.split(/\n/);
            return lines.map((line) => `<div>${line || "<br>"}</div>`).join("");
        }

        function stripLiteralTagTextToHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/&lt;\/?\s*strong\s*&gt;/gi, (m) => m.toLowerCase().includes('/strong') ? '</strong>' : '<strong>')
                .replace(/&lt;\/?\s*b\s*&gt;/gi, (m) => m.toLowerCase().includes('/b') ? '</strong>' : '<strong>')
                .replace(/&lt;\/?\s*u\s*&gt;/gi, (m) => m.toLowerCase().includes('/u') ? '</u>' : '<u>')
                .replace(/\n/g, "<br>");
        }

        function bindBulkExplanationRichPasteSupport() {
            ['input-bulk-explanation-id', 'input-bulk-explanation-en'].forEach((prefix) => {
                const editor = document.getElementById(`${prefix}-rich`);
                const textArea = document.getElementById(`${prefix}-all`);
                if (!editor || !textArea || editor.dataset.richPasteBound === '1') return;

                editor.addEventListener('input', () => {
                    syncBulkExplanationRichEditorsToTextareas();
                });

                editor.addEventListener('keydown', (event) => {
                    if ((event.ctrlKey || event.metaKey) && (event.key === 'b' || event.key === 'B')) {
                        event.preventDefault();
                        document.execCommand('bold', false, null);
                        syncBulkExplanationRichEditorsToTextareas();
                    }
                });

                editor.addEventListener('paste', (event) => {
                    const clipboard = event.clipboardData;
                    if (!clipboard) return;

                    event.preventDefault();
                    const html = clipboard.getData('text/html') || '';
                    const text = clipboard.getData('text/plain') || '';

                    let insertHtml = '';
                    if (html && /<(b|strong|u|span|div|p|li|br)\b/i.test(html)) {
                        const converted = convertClipboardHtmlToQuestionMarkup(html, text);
                        insertHtml = markupToRichEditorHtml(converted);
                    } else {
                        insertHtml = stripLiteralTagTextToHtml(text);
                    }

                    document.execCommand('insertHTML', false, normalizePartBRichHtml(insertHtml));
                    syncBulkExplanationRichEditorsToTextareas();
                });

                editor.dataset.richPasteBound = '1';
            });
        }

        function getPartBRichOptionMap() {
            const textArea = document.getElementById('input-magic-questions-2');
            if (!textArea) return {};

            const map = {};
            const lines = String(textArea.value || '').split('\n');

            lines.forEach((rawLine) => {
                const line = String(rawLine || '').trim();
                if (!line) return;

                const qMatch = line.match(/^(\d+)[\.\)]?\s+(.*)$/);
                if (!qMatch) return;

                const qNum = qMatch[1];
                const questionText = qMatch[2] || '';
                const markerRegex = /\(([A-D])\)\s*/gi;
                const markers = [];
                let match;
                while ((match = markerRegex.exec(questionText)) !== null) {
                    markers.push({ letter: match[1].toUpperCase(), start: match.index, after: markerRegex.lastIndex });
                }
                if (markers.length !== 4) return;

                map[qNum] = map[qNum] || {};
                markers.forEach((marker, idx) => {
                    const nextStart = idx < markers.length - 1 ? markers[idx + 1].start : questionText.length;
                    const chunk = questionText.slice(marker.after, nextStart);
                    const strongTexts = [];
                    const strongRegex = /<(?:strong|b)>([\s\S]*?)<\/(?:strong|b)>/gi;
                    let sm;
                    while ((sm = strongRegex.exec(chunk)) !== null) {
                        const val = normalizeClipboardQuestionText(String(sm[1] || '').replace(/<[^>]+>/g, ''));
                        if (val) strongTexts.push(val);
                    }

                    if (strongTexts.length) {
                        map[qNum][marker.letter] = strongTexts.join(' ').replace(/\s{2,}/g, ' ').trim();
                    }
                });
            });

            return map;
        }

        function elementStyleHasWeightBold(element) {
            const style = (element.getAttribute("style") || "").toLowerCase();
            return /font-weight\s*:\s*(bold|[6-9]00)/.test(style);
        }

        function elementStyleHasUnderline(element) {
            const style = (element.getAttribute("style") || "").toLowerCase();
            return /text-decoration[^;]*underline|text-decoration-line\s*:\s*underline/.test(style);
        }

        function htmlNodeToQuestionMarkup(node) {
            if (!node) return "";
            if (node.nodeType === Node.TEXT_NODE) return node.nodeValue || "";
            if (node.nodeType !== Node.ELEMENT_NODE) return "";

            const tag = node.tagName.toLowerCase();
            if (tag === "br") return "\n";

            let inner = "";
            node.childNodes.forEach((child) => {
                inner += htmlNodeToQuestionMarkup(child);
            });

            const isBold = tag === "b" || tag === "strong" || elementStyleHasWeightBold(node);
            const isUnderline = tag === "u" || elementStyleHasUnderline(node);

            if (isUnderline) inner = `<u>${inner}</u>`;
            if (isBold) inner = `<strong>${inner}</strong>`;

            const blockLike = ["p", "div", "li", "tr", "h1", "h2", "h3", "h4", "h5", "h6"];
            if (blockLike.includes(tag)) return `${inner}\n`;
            return inner;
        }

        function convertClipboardHtmlToQuestionMarkup(html, textFallback) {
            const plainText = normalizeClipboardQuestionText(textFallback || "");
            if (!html) {
                return plainText.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
            }

            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");
                const body = doc.body;
                if (!body) return plainText;

                body.querySelectorAll("script,style").forEach((el) => el.remove());
                let markup = "";
                body.childNodes.forEach((child) => {
                    markup += htmlNodeToQuestionMarkup(child);
                });

                const normalized = normalizeClipboardQuestionText(markup);
                return normalized || plainText;
            } catch (_) {
                return plainText;
            }
        }

        function bindPartBRichPasteSupport() {
            const editor = document.getElementById('input-magic-questions-rich-2');
            const textArea = document.getElementById('input-magic-questions-2');
            if (!editor || !textArea || editor.dataset.richPasteBound === '1') return;

            editor.addEventListener('input', () => {
                syncPartBRichEditorToTextarea();
            });

            editor.addEventListener('keydown', (event) => {
                if ((event.ctrlKey || event.metaKey) && (event.key === 'u' || event.key === 'U')) {
                    event.preventDefault();
                    document.execCommand('underline', false, null);
                    syncPartBRichEditorToTextarea();
                }
            });

            editor.addEventListener('paste', (event) => {
                const clipboard = event.clipboardData;
                if (!clipboard) return;

                event.preventDefault();
                const html = clipboard.getData('text/html') || '';
                const text = clipboard.getData('text/plain') || '';

                let insertHtml = '';
                if (html && /<(b|strong|u|span|div|p|li|br)\b/i.test(html)) {
                    const converted = convertClipboardHtmlToQuestionMarkup(html, text);
                    insertHtml = markupToRichEditorHtml(converted);
                } else {
                    insertHtml = stripLiteralTagTextToHtml(text);
                }

                document.execCommand('insertHTML', false, normalizePartBRichHtml(insertHtml));
                syncPartBRichEditorToTextarea();
            });

            editor.dataset.richPasteBound = '1';
        }

        function refreshStructurePartAState() {
            const partAContainer = document.getElementById("user-part-1");
            if (!partAContainer) return;

            partAContainer.querySelectorAll(".question-item").forEach((card) => {
                const checked = card.querySelector('.radio-group input[type="radio"]:checked');
                const badge = card.querySelector(".question-number-badge");
                if (badge) badge.classList.toggle("is-answered", Boolean(checked));

                card.querySelectorAll(".radio-group label").forEach((label) => {
                    const radio = label.querySelector('input[type="radio"]');

                    label.classList.toggle("selected", selected);
                    label.classList.toggle("d-parent", selected);

        function getPartQuestionNumbers(partId) {
            return Object.keys(globalQuestions)
                .map((uid) => {
                    const [part, number] = uid.split("_").map((token) => parseInt(token, 10));
                    return { uid, part, number };
                })
                .filter((entry) => entry.part === partId && Number.isFinite(entry.number))
                .sort((left, right) => left.number - right.number);
        }

        function scrollToQuestion(uid) {
            if (!uid) return;
            const card = document.getElementById(`q-container-${uid}`);
            if (!card) return;
            const tabName = uid.startsWith("1_") ? "user-part-1" : "user-part-2";
            const navButton = uid.startsWith("1_") ? document.getElementById("btn-nav-1") : document.getElementById("btn-nav-2");
            if (navButton) openSubTab({ currentTarget: navButton }, tabName, "user-sub-btn");
            card.scrollIntoView({ behavior: "smooth", block: "start" });
            currentQuestionUid = uid;
            updateQuestionNavigatorState();
            if (isPracticeFullTestMode()) renderInstantProgressDots();
        }

        function buildQuestionNavigator() {
            const partAGrid = document.getElementById("question-grid-part-a");
            const partBGrid = document.getElementById("question-grid-part-b");
            if (!partAGrid || !partBGrid) return;

            partAGrid.innerHTML = "";
            partBGrid.innerHTML = "";

            getPartQuestionNumbers(1).forEach((entry, index) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "question-nav-btn";
                btn.dataset.uid = entry.uid;
                btn.textContent = String(index + 1);
                btn.addEventListener("click", () => scrollToQuestion(entry.uid));
                partAGrid.appendChild(btn);
            });

            getPartQuestionNumbers(2).forEach((entry) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "question-nav-btn";
                btn.dataset.uid = entry.uid;
                btn.textContent = String(entry.number);
                btn.addEventListener("click", () => scrollToQuestion(entry.uid));
                partBGrid.appendChild(btn);
            });

            const firstA = getPartQuestionNumbers(1)[0];
            if (!currentQuestionUid && firstA) currentQuestionUid = firstA.uid;
            updateQuestionNavigatorState();
        }

        function updateQuestionNavigatorState() {
            document.querySelectorAll(".question-nav-btn").forEach((btn) => {
                const uid = btn.dataset.uid;
                if (!uid) return;
                const checked = document.querySelector(`input[name="q_${uid}"]:checked`);
                btn.classList.toggle("is-answered", Boolean(checked));
                btn.classList.toggle("is-current", uid === currentQuestionUid);
            });
        }

            if (event) event.stopPropagation();
            const nav = document.getElementById("question-navigator");
            const layout = document.querySelector(".section2-layout");
            if (!nav) return;
            const collapsed = !nav.classList.contains("is-collapsed");
            nav.classList.toggle("is-collapsed", collapsed);
            if (layout) layout.classList.toggle("is-nav-collapsed", collapsed);

        function goToNextQuestion() {
            const all = [
                ...getPartQuestionNumbers(1).map((entry) => entry.uid),
                ...getPartQuestionNumbers(2).map((entry) => entry.uid)
            ];
            if (!all.length) return;
            const currentIndex = all.indexOf(currentQuestionUid);
            const nextUid = currentIndex === -1 ? all[0] : all[Math.min(currentIndex + 1, all.length - 1)];
            scrollToQuestion(nextUid);
        }

        function bindUserToolbarActions() {
            const submitBtn = document.getElementById("submit-header-btn");
            const nextQBtn = document.getElementById("navigator-next-question");
            const nextSectionBtn = document.getElementById("navigator-next-section");
            const userContainer = document.getElementById("user-passages-container");

            if (submitBtn) submitBtn.addEventListener("click", submitAnswers);
            if (nextQBtn) nextQBtn.addEventListener("click", goToNextQuestion);
            if (nextSectionBtn) nextSectionBtn.addEventListener("click", () => {
                const btn = document.getElementById("btn-nav-2");

                if (firstB) scrollToQuestion(firstB.uid);
            });
            if (userContainer) {
                userContainer.addEventListener("change", (event) => {
                    const target = event.target;
                    if (target && target.matches('input[type="radio"]')) {
                        refreshStructurePartAState();
                    }
                });

                userContainer.addEventListener("dblclick", (event) => {
                    const clickableLabel = event.target.closest("label");
                    if (!clickableLabel) return;

                    let radio = null;
                    if (clickableLabel.hasAttribute("for")) {
                        radio = document.getElementById(clickableLabel.getAttribute("for"));
                    } else {
                        radio = clickableLabel.querySelector('input[type="radio"]');
                    }

                    if (!radio || radio.type !== "radio" || !radio.checked) return;

                    event.preventDefault();
                    event.stopPropagation();

                    // Let native click/dblclick behavior finish first, then force clear.
                    setTimeout(() => {
                        radio.checked = false;
                        refreshStructurePartAState();
                    }, 0);
                });
            }
