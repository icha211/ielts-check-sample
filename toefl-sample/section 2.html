        // ENGINE PARSER BARU UNTUK INLINE CLICKABLE & HURUF DI BAWAH
        function updateUserView(shouldSaveMeta = false) {
            if (shouldSaveMeta) {
                saveSectionMeta();
                saveSectionDraft();
                persistPreviewSection2Result();
                updateExplanationLink();
                emitSection2EditorApplySync();
            }
            document.getElementById('global-score-board').style.display = 'none';
            globalAnswerKey = {};
            globalExplanations = {};
            globalQuestions = {};

            PARTS.forEach((part) => {
                let p = part.id;

                const answerKeyEl = document.getElementById(`input-answer-key-${p}`);
                const explanationEl = document.getElementById(`input-explanation-${p}`);
                const questionsEl = document.getElementById(`input-magic-questions-${p}`);
                const displayEl = document.getElementById(`display-questions-${p}`);
                if (!answerKeyEl || !explanationEl || !questionsEl || !displayEl) return;

                if (p === 2) syncPartBRichEditorToTextarea();
                const partBRichOptionMap = p === 2 ? getPartBRichOptionMap() : {};

                answerKeyEl.value.split('\n').forEach(l => {
                    let m = l.match(/^(\d+)[\.\)]?\s+(.*)/);
                    if(m) globalAnswerKey[`${p}_${m[1]}`] = m[2].trim().toLowerCase();
                });

                let currentExpNum = null;
                explanationEl.value.split('\n').forEach(l => {
                    let m = l.match(/^(\d+)[\.\)]?\s+(.*)/);
                    if(m) { currentExpNum = `${p}_${m[1]}`; globalExplanations[currentExpNum] = m[2].trim(); }
                    else if(currentExpNum && l.trim()) globalExplanations[currentExpNum] += "<br>" + l.trim();
                });

                const lines = questionsEl.value.split('\n');
                let cleanHtml = '';
                let openDiv = false;
                let currentUID = '';
                let currentQuestionIsPartB = false;

                for (let line of lines) {
                    let rawLine = line.trim();
                    if (!rawLine) continue;
                    
                    let qMatch = rawLine.match(/^(?:<[^>]+>)*(\d+)[\.\)]?\s+(.*)/);
                    let isOption = parseAnswerOptionLine(rawLine);

                    if (qMatch && !isOption) {
                        if (openDiv) cleanHtml += `</div><div class="feedback" id="feedback-${currentUID}"></div></div></div>`;
                        let currentQuestionNum = qMatch[1];
                        currentUID = `${p}_${currentQuestionNum}`;
                        let questionText = qMatch[2];
                        const hasUnderlinedMarkup = /<u>/i.test(questionText);
                        const hasInlinePartBMarkers = /\(A\).*\(B\).*\(C\).*\(D\)/i.test(questionText);
                        currentQuestionIsPartB = (p === 2) && (hasUnderlinedMarkup || hasInlinePartBMarkers);

                        cleanHtml += `<div class="question-item frame-parent" id="q-container-${currentUID}">`;

                        // CEK APAKAH INI SOAL PART B (Memiliki garis bawah <u>)
                        if (currentQuestionIsPartB) {
                            
                            let parsedText = '';
                            const partBOpts = {};

                            if (hasUnderlinedMarkup) {
                                // 1. Bersihkan pengetikan manual developer (A), (B), (C), (D) yang menempel sebelum/sesudah tag <u>
                                // Contoh: <u>word</u> (A) atau (B) <u>word</u> akan dibersihkan A dan B nya.
                                questionText = questionText.replace(/\s*\([A-D]\)\s*<u>/gi, ' <u>').replace(/<\/u>\s*\([A-D]\)\s*/gi, '</u> ');
                                questionText = questionText.replace(/\s*[A-D]\.\s*<u>/gi, ' <u>').replace(/<\/u>\s*[A-D]\.\s*/gi, '</u> ');

                                let optIndex = 0;
                                const letters = ['A', 'B', 'C', 'D'];

                                // 2. Ganti tag <u> menjadi kotak struktur berisikan huruf di bawahnya
                                parsedText = questionText.replace(/<u>(.*?)<\/u>/gi, (match, word) => {
                                    if (optIndex > 3) return match; // Maksimal D

                                    // Bersihkan lagi jika (A) masuk di DALAM tag <u>
                                    const cleanWord = word.replace(/^\([A-D]\)\s*/i, '').replace(/\s*\([A-D]\)$/i, '').trim();
                                    const letter = letters[optIndex];
                                    const val = letter.toLowerCase();
                                    partBOpts[letter] = cleanWord;

                                    const html = `<span class="inline-error-wrapper">
                                                <input type="radio" name="q_${currentUID}" id="q_${currentUID}_${val}" value="${val}">
                                                <label for="q_${currentUID}_${val}" class="error-label">
                                                    <span class="word-text">${cleanWord}</span>
                                                    <span class="letter-badge">${letter}</span>
                                                </label>
                                            </span>`;
                                    optIndex++;
                                    return html;
                                });
                            } else {
                                // Support format: The (A) word ... (B) phrase ... (C) ... (D) ...
                                const markerRegex = /\(([A-D])\)\s*/gi;
                                const markers = [];
                                let mm;
                                while ((mm = markerRegex.exec(questionText)) !== null) {
                                    markers.push({ letter: mm[1].toUpperCase(), start: mm.index, after: markerRegex.lastIndex });
                                }

                                if (markers.length === 4) {
                                    let cursor = 0;
                                    let htmlOut = '';
                                    markers.forEach((marker, idx) => {
                                        const nextStart = idx < markers.length - 1 ? markers[idx + 1].start : questionText.length;
                                        const before = questionText.slice(cursor, marker.start);
                                        const rawChunk = questionText.slice(marker.after, nextStart);
                                        const cleanWord = rawChunk.trim().replace(/\s+/g, ' ');
                                        const val = marker.letter.toLowerCase();
                                        const domBoldText = (partBRichOptionMap[currentQuestionNum] && partBRichOptionMap[currentQuestionNum][marker.letter]) || '';
                                        const boldSegments = [];
                                        const boldRegex = /<(?:strong|b)>[\s\S]*?<\/(?:strong|b)>/gi;
                                        let boldExec;
                                        while ((boldExec = boldRegex.exec(rawChunk)) !== null) {
                                            boldSegments.push({
                                                start: boldExec.index,
                                                end: boldRegex.lastIndex,
                                                html: boldExec[0]
                                            });
                                        }

                                        htmlOut += before;
                                        if (domBoldText || boldSegments.length) {
                                            let chunkPrefix = '';
                                            let chunkBoldText = '';
                                            let chunkSuffix = '';

                                            if (domBoldText) {
                                                chunkBoldText = domBoldText;
                                                if (boldSegments.length) {
                                                    const firstBold = boldSegments[0];
                                                    const lastBold = boldSegments[boldSegments.length - 1];
                                                    chunkPrefix = rawChunk.slice(0, firstBold.start);
                                                    chunkSuffix = rawChunk.slice(lastBold.end);
                                                } else {
                                                    chunkSuffix = rawChunk;
                                                }
                                            } else {
                                                const firstBold = boldSegments[0];
                                                chunkPrefix = rawChunk.slice(0, firstBold.start);
                                                chunkBoldText = firstBold.html
                                                    .replace(/^<(?:strong|b)>/i, '')
                                                    .replace(/<\/(?:strong|b)>$/i, '')
                                                    .replace(/<[^>]+>/g, '')
                                                    .trim();
                                                chunkSuffix = rawChunk.slice(firstBold.end);
                                            }

                                            chunkPrefix = chunkPrefix.replace(/<\/?(?:strong|b)>/gi, '');
                                            chunkSuffix = chunkSuffix.replace(/<\/?(?:strong|b)>/gi, '');
                                            const safeBoldText = chunkBoldText || cleanWord.replace(/[\s.,;:!?]+$/g, '');
                                            partBOpts[marker.letter] = safeBoldText;

                                            htmlOut += chunkPrefix;
                                            htmlOut += `<span class="inline-error-wrapper">
                                                <input type="radio" name="q_${currentUID}" id="q_${currentUID}_${val}" value="${val}">
                                                <label for="q_${currentUID}_${val}" class="error-label">
                                                    <span class="word-text">${safeBoldText}</span>
                                                    <span class="letter-badge">${marker.letter}</span>
                                                </label>
                                            </span>`;
                                            htmlOut += chunkSuffix;
                                        } else {
                                            partBOpts[marker.letter] = cleanWord.replace(/[\s.,;:!?]+$/g, '');
                                            htmlOut += `<span class="inline-error-wrapper">
                                                <input type="radio" name="q_${currentUID}" id="q_${currentUID}_${val}" value="${val}">
                                                <label for="q_${currentUID}_${val}" class="error-label">
                                                    <span class="word-text">${cleanWord}</span>
                                                    <span class="letter-badge">${marker.letter}</span>
                                                </label>
                                            </span>`;
                                        }
                                        cursor = nextStart;
                                    });
                                    htmlOut += questionText.slice(cursor);
                                    parsedText = htmlOut.replace(/\s{2,}/g, ' ');
                                } else {
                                    // Fallback: render plain text jika format marker tidak lengkap
                                    parsedText = questionText;
                                }
                            }

                            const plainSentence = questionText
                                .replace(/<u>/gi, '')
                                .replace(/<\/u>/gi, '')
                                .replace(/\([A-D]\)\s*/gi, '')
                                .replace(/<[^>]+>/g, '')
                                .replace(/\s{2,}/g, ' ')
                                .trim();
                            globalQuestions[currentUID] = { questionText: `${currentQuestionNum}. ${plainSentence}`, options: partBOpts, isPartB: true };

                            cleanHtml += `<div class="question-number-badge">${currentQuestionNum}</div>`;
                            cleanHtml += `<div class="question-content question-content--partb">`;
                            cleanHtml += `<p class="inline-question-text">${parsedText}</p>`;
                            cleanHtml += `</div>`;
                            openDiv = true;
                        } else {
                            // SOAL PART A BIASA
                            globalQuestions[currentUID] = { questionText: `${currentQuestionNum}. ${questionText}`, options: {}, isPartB: false };
                            const displayQuestion = questionText.replace(/_{3,}/, '<span class="question-blank">_____</span>');
                            cleanHtml += `<div class="question-number-badge">${currentQuestionNum}</div>`;
                            cleanHtml += `<div class="question-content">`;
                            cleanHtml += `<p class="question-stem">${displayQuestion}</p>`;
                            cleanHtml += `<div class="radio-group">`;
                            openDiv = true;
                        }
                    } else if (isOption && openDiv) {
                        let letter = isOption.letter;
                        if (globalQuestions[currentUID] && !globalQuestions[currentUID].isPartB) {
                            globalQuestions[currentUID].options[letter] = isOption.text;
                        }
                        cleanHtml += `<label class="a-parent">
                            <input type="radio" name="q_${currentUID}" value="${letter.toLowerCase()}" onchange="refreshStructurePartAState()"> 
                            <span class="option-letter">(${letter})</span> 
                            <span class="option-text">${isOption.text}</span>
                        </label>`;
                    }
                }
                if (openDiv) cleanHtml += `</div><div class="feedback" id="feedback-${currentUID}"></div></div></div>`;

                document.getElementById(`display-questions-${p}`).innerHTML = cleanHtml;
            });
            refreshStructurePartAState();
            buildQuestionNavigator();
            updateHeaderProgress();
            applyPracticeRunMode();
            startTimer();
        }

        async function getNextSectionSetId(currentSetId, targetModule) {
            const urlParams = new URLSearchParams(window.location.search);
            let targetDate = urlParams.get("setDate");
            const testType = urlParams.get("testType") || "mocktest";

            if (!targetDate && currentSetId) {
                const dateMatch = currentSetId.match(/\d{4}-\d{2}-\d{2}/);
                if (dateMatch) targetDate = dateMatch[0];
            }

            if (!targetDate) return null;

            try {
                const records = await window.toeflStorage.getSetRecordsByTestType(testType);
                const matchingRecord = records.find(item => 
                    String(item.module).toLowerCase() === targetModule.toLowerCase() && 
                    String(item.setDate) === targetDate
                );
                return matchingRecord ? matchingRecord.setId : null;
            } catch (e) {
                console.warn("[ToeflSync] Failed to dynamically fetch next setId:", e);
                return null;
            }
}

        async function submitAnswers() {
            if (isInstantFeedbackMode()) {
                finishInstantPractice();
                return;
            }

            let score = 0;
            let total = Object.keys(globalAnswerKey).length;
            const videoMapByPart = {
                1: parseIndexedLineMap((document.getElementById('input-video-step-1') || {}).value || ''),
                2: parseIndexedLineMap((document.getElementById('input-video-step-2') || {}).value || '')
            };

            if (total === 0) { alert("Data Kunci Jawaban masih kosong. Sistem tidak dapat melakukan penilaian."); return; }

            const urlParams = new URLSearchParams(window.location.search);
            const isFullTest = urlParams.get("fullTest") === "true";

            const confirmMessage = isFullTest 
                ? "Finish Section 2, are you sure you want to continue to Section 3?" 
                : "Yakin ingin mengakhiri Section 2 dan melihat skor?";

            if (!confirm(confirmMessage)) return;

            clearInterval(timerInterval);

            for (let uid in globalAnswerKey) {
                const radio = document.querySelector(`input[name="q_${uid}"]:checked`);
                const userAnswer = radio ? radio.value.trim().toLowerCase() : '';
                if (userAnswer === globalAnswerKey[uid]) score++;
            }

            const scaledScore = Math.round(31 + ((score / total) * (68 - 31)));

            const answeredQs = Object.keys(globalAnswerKey).map(uid => {
                const pId = parseInt(uid.split('_')[0]);
                const qNum = parseInt(uid.split('_')[1]);
                const radio = document.querySelector(`input[name="q_${uid}"]:checked`);
                const userAnswer = radio ? radio.value.trim().toLowerCase() : '';
                const correct = globalAnswerKey[uid];
                const q = globalQuestions[uid] || {};
                const part = PARTS.find(pt => pt.id === pId) || {};
                const videoStepUrl = (videoMapByPart[pId] && videoMapByPart[pId][qNum]) || '';
                return { uid, number: qNum, partId: pId, partName: part.name || '', questionText: q.questionText || `Question ${qNum}`, options: q.options || {}, correctAnswer: correct, userAnswer, isCorrect: userAnswer === correct, isPartB: q.isPartB || false, explanation: getSection2ExplanationSource(pId, qNum, uid), videoStepUrl };
            }).sort((a, b) => a.number - b.number);

            const setDate = (document.getElementById("set-date") || {}).value || currentPackageDate || urlParams.get("setDate") || "";
            const result = { sectionTitle: "Section 2: Structure and Written Expression", sectionKey: "structure", setId: currentSetId, testType: currentTestType, runMode: getSection2PracticeRunMode(), focus: getPracticeVariant().focus, totalQuestions: total, rawScore: score, scaledScore, submittedAt: new Date().toISOString().slice(0, 10), setDate, questions: answeredQs };
            
            // Save results to storage
            localStorage.setItem('toefl_section2_result', JSON.stringify(result));
            if (window.toeflTestHistory) window.toeflTestHistory.record(result);

            if (isFullTest) {
                // Dynamically find the corresponding Reading set ID for this date
                const nextSetId = await getNextSectionSetId(currentSetId, "reading");
                
                if (nextSetId) {
                    urlParams.set("setId", nextSetId);
                }
                
                window.location.href = `section 3.html?${urlParams.toString()}`;
            } else {
                if (currentSetId) urlParams.set("setId", currentSetId);
                if (setDate) urlParams.set("setDate", setDate);
                window.location.href = `section 2-answered.html?${urlParams.toString()}`;
            }
        }

        function startTimer() {
            let t = 1500; 
            clearInterval(timerInterval);
            const timerElement = document.getElementById('time');
            const isDark = document.getElementById("user-view")?.classList.contains("is-dark");
            timerElement.style.color = isDark ? "#E0F2FE" : "#005faa";
            timerInterval = setInterval(() => {
                let m = Math.floor(t/60), s = t%60;
                document.getElementById('time').innerText = `${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
                if(t <= 180) {
                    document.getElementById('time').style.animation = "blink 1s infinite";
                    document.getElementById('time').style.color = "#d32f2f";
                }
                if(--t < 0) { 
                    clearInterval(timerInterval); 
                    alert("Waktu Habis! Jawaban Anda disubmit otomatis.");
                    submitAnswers(); 
                }
            }, 1000);
        }

                'input-video-step-2',
                'input-bulk-explanation-id-all',
                'input-bulk-explanation-en-all'
            ];

            fields.forEach(fieldId => {
                const el = document.getElementById(fieldId);
                if (el) {
                    el.addEventListener('input', triggerAutoSave);
                    el.addEventListener('change', triggerAutoSave);
                    if (el.isContentEditable) {
                        el.addEventListener('blur', triggerAutoSave);
                    }
                }
            });

            // Also listen to the rich editor for Part B and Bulk Explanations
            const richEditor = document.getElementById('input-magic-questions-rich-2');
            if (richEditor) {
                richEditor.addEventListener('input', triggerAutoSave);
                richEditor.addEventListener('blur', triggerAutoSave);
            }

            const bulkIdRich = document.getElementById('input-bulk-explanation-id-rich');
            if (bulkIdRich) {
                bulkIdRich.addEventListener('input', triggerAutoSave);
                bulkIdRich.addEventListener('blur', triggerAutoSave);
            }

            const bulkEnRich = document.getElementById('input-bulk-explanation-en-rich');
            if (bulkEnRich) {
                bulkEnRich.addEventListener('input', triggerAutoSave);
                bulkEnRich.addEventListener('blur', triggerAutoSave);
            }

            showAutoSaveStatus("Ready", true);
        }
        // ===== END AUTO-SAVE FUNCTIONALITY =====

        function updateExplanationLink() {
            const btn = document.getElementById('view-explanation-btn');
            if (!btn) return;
            
            const dateInput = document.getElementById('set-date');
            const dateValue = dateInput?.value || currentPackageDate;
            
            if (dateValue) {
                // If there's a date, pass it to the answered page
                const params = new URLSearchParams(window.location.search);
                params.set('date', dateValue);
                btn.href = 'section 2-answered.html?' + params.toString();
            } else {
                // Otherwise, just use the URL params from current page
                const params = new URLSearchParams(window.location.search);
                if (params.toString()) {
                    btn.href = 'section 2-answered.html?' + params.toString();
                } else {
                    btn.href = 'section 2-answered.html';
                }
            }
        }

        

        window.onload = async () => {
            initAutoSave();
            loadSection2MaterialTopics().then(() => renderSection2MaterialOptions()).catch(() => {});
            initStructure();
            renderSection2MaterialOptions();
            hydrateGeneratedQcExplanations();
            syncPartBRichEditorFromTextarea();
            bindPartBRichPasteSupport();
            syncBulkExplanationRichEditorsFromTextareas();
            bindBulkExplanationRichPasteSupport();
            applyViewMode();
            activateInitialTab();
            bindUserToolbarActions();
            initDarkMode();
            initTextSize();
            updateFullScreenButton();
            document.addEventListener("fullscreenchange", handleFullScreenStateChange);
            try {
                await loadSectionMeta();
                await loadSectionDraft();
                updateExplanationLink();
                // Ensure user view renders even if coming from study-plan
                // Call updateUserView with forced rendering to display questions
                updateUserView();
                activateInitialTab();
                // If in user mode and coming from study-plan, ensure user-view is shown
                if (!isDeveloperMode()) {
                    const userViewTab = document.getElementById("user-view");
                    const userButton = Array.from(document.querySelectorAll(".tab-button")).find(
                        (button) => (button.getAttribute("onclick") || "").includes("'user-view'")
                    );
                    if (userViewTab && userButton) {
                        userViewTab.classList.add("active");
                        userButton.classList.add("active");
                        document.querySelectorAll(".tab-content").forEach(t => {
                            if (t.id !== "user-view") t.classList.remove("active");
                        });
                        document.querySelectorAll(".tab-button").forEach(b => {
                            if (!b.getAttribute("onclick").includes("'user-view'")) b.classList.remove("active");
                        });
                    }
                }
            } catch (error) {
                console.warn("[Init] Failed to fully restore section data:", error);
            }
            positionListeningHeaderTimer();
            setTimeout(positionListeningHeaderTimer, 60);
            updateOnboardingVisibility();
            updateOnboardingScale();
            window.addEventListener("resize", () => {
                updateOnboardingScale();
                positionListeningHeaderTimer();
            });
            const featuresOverlay = document.getElementById("features-overlay");
            if (featuresOverlay) {
                featuresOverlay.addEventListener("click", handleFeaturesOverlayClick);
            }
            document.addEventListener("keydown", handleFeaturesMenuKeydown);
            const setDateEl = document.getElementById("set-date");
            const setDifficultyEl = document.getElementById("set-difficulty");
            if (setDateEl) setDateEl.addEventListener("change", () => {
                handleSetDateChange();
                updateExplanationLink();
            });
            if (setDifficultyEl) setDifficultyEl.addEventListener("change", saveSectionMeta);
        };
    </script>
</body>
</html>
