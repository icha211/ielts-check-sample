<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test Part A Layout - Question 1</title>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            border-left: 4px solid #2196F3;
        }
        .question-display {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fafafa;
        }
        #explainationTabContent {
            margin-top: 20px;
        }
        /* Essential Part A styles from the main file */
        .explaination-figma {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .section2-figma-shell {
            padding: 20px;
        }
        .section2-figma-top {
            margin-bottom: 20px;
        }
        .section2-figma-question-row {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }
        .explaination-figma-qnum {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #4CAF50;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
        }
        .explaination-figma-qnum.is-wrong {
            background: #f44336;
        }
        .section2-figma-question-text {
            flex: 1;
            padding: 8px;
            font-size: 16px;
            line-height: 1.6;
        }
        .section2-question-blank {
            border-bottom: 2px solid #333;
            font-weight: bold;
            display: inline-block;
            min-width: 40px;
            text-align: center;
        }
        .explaination-figma-status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
        }
        .explaination-figma-status.is-correct {
            background: #4CAF50;
            color: white;
        }
        .explaination-figma-status.is-wrong {
            background: #f44336;
            color: white;
        }
        .explaination-figma-options {
            margin: 20px 0;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        .qc-core-section {
            margin-top: 30px;
        }
        .qc-core-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #8b5cf6;
        }
        .qc-core-icon {
            font-size: 24px;
        }
        .qc-core-title {
            font-size: 16px;
            font-weight: 600;
            color: #8b5cf6;
        }
        .qc-core-content {
            margin-left: 20px;
        }
        .concept-block,
        .observe-block,
        .requirement-block,
        .eliminate-block {
            margin-bottom: 25px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 4px;
            border-left: 4px solid #8b5cf6;
        }
        .block-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        .block-content {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
        }
        /* S-V-C color coding */
        .span-subject {
            background-color: #0EA5E9;
            color: #FFFFFF;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .span-verb {
            background-color: #30B0C7;
            color: #FFFFFF;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .span-complement {
            background-color: #E675C9;
            color: #FFFFFF;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .tag-box {
            display: inline-block;
            padding: 2px 8px;
            border: 1px solid #D1DCE8;
            border-radius: 4px;
            font-size: 12px;
            color: #FFFFFF;
            margin-right: 4px;
            vertical-align: middle;
        }
        .tag-box-subject {
            background-color: #0EA5E9;
        }
        .tag-box-verb {
            background-color: #30B0C7;
        }
        .tag-box-complement {
            background-color: #E675C9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="test-info">
            <h2>✅ Part A Layout Test - Question 1</h2>
            <p>This page tests if Question 1 renders with the correct Part A (QC C.O.R.E) layout instead of Part B.</p>
        </div>
        
        <div class="question-display">
            <h3>Test Question Data:</h3>
            <pre id="questionData" style="background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto;"></pre>
        </div>
        
        <div id="explainationTabContent">
            <!-- Explanation will be rendered here -->
        </div>
    </div>

    <script>
        // Mock question data for Part A question 1
        var testQuestion = {
            number: 1,
            partId: 1,
            partName: 'Part A',
            questionText: 'Cholesterol, a primary component of many biological membranes, is essential for cell function.',
            options: {
                A: 'It is cholesterol',
                B: 'Cholesterol',
                C: 'Cholesterol is',
                D: 'That cholesterol'
            },
            correctAnswer: 'B',
            userAnswer: 'B',
            isCorrect: true
        };

        // Display the test question
        document.getElementById('questionData').textContent = JSON.stringify(testQuestion, null, 2);

        // Test: Check routing function
        console.log('Testing Part A routing:');
        console.log('Question number:', testQuestion.number);
        console.log('Should be Part A (1-15): ' + (testQuestion.number >= 1 && testQuestion.number <= 15));
        console.log('Should NOT be Part B (16-40): ' + (testQuestion.number >= 16 && testQuestion.number <= 40));

        // Expected layout message
        document.addEventListener('DOMContentLoaded', function() {
            var testMsg = document.createElement('div');
            testMsg.style.cssText = 'background: #c8e6c9; padding: 10px; border-radius: 4px; margin-top: 20px; border: 1px solid #4CAF50;';
            testMsg.innerHTML = '<strong>Expected Output:</strong><br>' +
                '✓ Question number "1" in green circle<br>' +
                '✓ "CORRECT" status badge<br>' +
                '✓ Options (A), (B), (C), (D)<br>' +
                '✓ "Why (B)?" heading<br>' +
                '✓ Bold subject text<br>' +
                '✓ Purple "QC C.O.R.E ANALYSIS" section<br>' +
                '✓ C - Concept section<br>' +
                '✓ O - Observe S-V-C with color-coded breaks<br>' +
                '✓ R - Requirement section<br>' +
                '✓ E - Eliminate section with all options';
            document.querySelector('.container').appendChild(testMsg);
        });
    </script>
</body>
</html>
